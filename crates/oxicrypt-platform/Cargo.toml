[package]
name = "oxicrypt-platform"
description = "The module's own platform calls: the operating-system random generator, the process id, and a process-aware spin cell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish.workspace = true

[dependencies]
oxicrypt-zeroize = { workspace = true }

[features]
default = []
# Test seams in `oxicrypt_platform::testing`: simulated generator results,
# process-id and errno overrides, a forking helper and a reduced spin bound.
fault-injection = []

[lints]
workspace = true

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.27.0/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
