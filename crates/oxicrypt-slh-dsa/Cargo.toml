[package]
name = "oxicrypt-slh-dsa"
description = "SLH-DSA (FIPS 205) — stateless hash-based digital signature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Data-parallel evaluation of the embarrassingly-parallel inner loops,
# default OFF. The WOTS+ chain sweep (`wots_pkgen` / `wots_sign`) and the
# per-FORS-tree sweep (`fors_sign`) become indexed disjoint-slice `rayon`
# `par_chunks_mut().enumerate()` loops; each closure writes one chunk it
# exclusively owns and reads no other chunk, so output is byte-identical
# to the sequential build (R77). Pulls in `rayon`, which requires `std`,
# so the crate becomes `std` only under this feature — the default build
# stays provably `no_std` with no rayon in its graph. Performance build
# only: the CMVP validation-target configuration is the default single-threaded
# build.
parallel = ["dep:rayon"]

[dependencies]
oxicrypt-module = { workspace = true }
oxicrypt-sha = { workspace = true }
oxicrypt-xof = { workspace = true }
rayon = { version = "1", optional = true }

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.22.0/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
