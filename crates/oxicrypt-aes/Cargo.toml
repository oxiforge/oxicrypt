[package]
name = "oxicrypt-aes"
description = "AES block cipher and modes (ECB, CBC, CTR, GCM, CCM, KW, KWP) per FIPS 197 / SP 800-38{A,B,C,D,F}"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish.workspace = true

[lints]
workspace = true

[dependencies]
oxicrypt-module = { workspace = true }
oxicrypt-zeroize = { workspace = true }
oxicrypt-aes-accel = { workspace = true, optional = true }

[features]
# CPU-intrinsic AES block acceleration (x86_64 AES-NI), default OFF.
# Runtime-detected: with the feature on, the single-block boundary
# dispatches to `oxicrypt-aes-accel` only when CPUID confirms AESNI,
# else the portable path runs. Default builds carry no accel dependency
# and are byte-for-byte the portable baseline.
accel-aes = ["dep:oxicrypt-aes-accel"]

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.23.2/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
