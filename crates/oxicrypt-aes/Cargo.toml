[package]
name = "oxicrypt-aes"
description = "AES block cipher and modes (ECB, CBC, CTR, GCM, CCM, KW, KWP) per FIPS 197 / SP 800-38{A,B,C,D,F}"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
oxicrypt-module = { path = "../oxicrypt-module" }
oxicrypt-zeroize = { path = "../oxicrypt-zeroize" }
oxicrypt-aes-accel = { path = "../oxicrypt-aes-accel", optional = true }

[features]
# CPU-intrinsic AES block acceleration (x86_64 AES-NI), default OFF.
# Runtime-detected: with the feature on, the single-block boundary
# dispatches to `oxicrypt-aes-accel` only when CPUID confirms AESNI,
# else the portable path runs. Default builds carry no accel dependency
# and are byte-for-byte the validated portable baseline.
accel-aes = ["dep:oxicrypt-aes-accel"]
