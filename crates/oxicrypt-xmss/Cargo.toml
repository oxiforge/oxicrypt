[package]
name = "oxicrypt-xmss"
description = "XMSS hash-based signatures (SP 800-208) for CNSA 2.0 firmware signing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Data-parallel evaluation of the recursive Merkle tree build, default
# OFF. `compute_node` splits its two child sub-trees across a `rayon`
# fork-join (`rayon::join`); each child closure computes one sub-tree as
# a pure function of its `(height, index)` plus the immutable seeds, and
# the parent recombines the two results by position (left, right) — never
# by completion order — so output is byte-identical to the sequential
# build. Pulls in `rayon`, which requires `std`, so the crate becomes
# `std` only under this feature — the default build stays provably
# `no_std` with no rayon in its graph. Performance build only: the
# CMVP validation-target configuration is the default single-threaded build.
parallel = ["dep:rayon"]

[dependencies]
oxicrypt-module = { workspace = true }
oxicrypt-sha = { workspace = true }
oxicrypt-zeroize = { workspace = true }
rayon = { version = "1", optional = true }

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.21.0/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
