[package]
name = "oxicrypt-rsa"
description = "RSA key generation and signature/encryption schemes per FIPS 186-5 / SP 800-56Br2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# The test seam `oxicrypt_rsa::seam`, which corrupts the next generated
# modulus before its pairwise consistency test. Default OFF, and enabled by
# no shipped build.
fault-injection = []

[dependencies]
oxicrypt-drbg = { workspace = true }
oxicrypt-module = { workspace = true }
oxicrypt-sha = { workspace = true }
oxicrypt-zeroize = { workspace = true }

# Dev-only: one pinned key-generation test seeds its generator from fixed
# entropy, which needs the caller-entropy DRBG forms. A dev-dependency
# compiles no shipped code.
[dev-dependencies]
oxicrypt-drbg = { path = "../oxicrypt-drbg", features = ["testing-interfaces"] }

[[test]]
name = "pct_fault_rsa"
path = "tests/pct_fault_rsa.rs"
required-features = ["fault-injection"]

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.27.0/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
