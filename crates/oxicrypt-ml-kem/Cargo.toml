[package]
name = "oxicrypt-ml-kem"
description = "ML-KEM-1024 (FIPS 203) — lattice-based key encapsulation mechanism."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ml-kem", "kyber", "post-quantum", "fips-203", "cryptography"]
categories.workspace = true
readme = "README.md"
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Builds the public matrix Â with its rows forked across `rayon`, default
# OFF. Output is byte-identical to the sequential build. Pulls in `rayon` and
# so `std`. A performance build: the CMVP validation-target configuration is
# the default single-threaded build.
parallel = ["dep:rayon"]
# The derandomized `keygen_internal`, `encaps_internal` and `decaps_internal`
# of every parameter set, which FIPS 203 §3.3 restricts to CAVP testing.
# Default OFF, and enabled by no shipped build.
testing-interfaces = []
# The test seam `oxicrypt_ml_kem::seam`, which corrupts the next generated
# decapsulation key before its pairwise consistency test. Default OFF, and
# enabled by no shipped build.
fault-injection = []

[dependencies]
oxicrypt-module = { workspace = true }
oxicrypt-sha = { workspace = true }
oxicrypt-xof = { workspace = true }
oxicrypt-zeroize = { workspace = true }
rayon = { version = "1", optional = true }

# The DRBG types whose strength and instantiation the key-generation and
# encapsulation tests check.
[dev-dependencies]
oxicrypt-drbg = { path = "../oxicrypt-drbg" }

[[test]]
name = "pct_fault_ml_kem_512"
path = "tests/pct_fault_ml_kem_512.rs"
required-features = ["fault-injection"]

[[test]]
name = "pct_fault_ml_kem_768"
path = "tests/pct_fault_ml_kem_768.rs"
required-features = ["fault-injection"]

[[test]]
name = "pct_fault_ml_kem_1024"
path = "tests/pct_fault_ml_kem_1024.rs"
required-features = ["fault-injection"]

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.27.0/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
