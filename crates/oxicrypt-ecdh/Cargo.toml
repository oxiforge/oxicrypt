[package]
name = "oxicrypt-ecdh"
description = "ECDH per SP 800-56Ar3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# The test seam `oxicrypt_ecdh::seam`, which corrupts the next generated
# public key before its pairwise consistency test. Default OFF, and enabled
# by no shipped build.
fault-injection = []

[dependencies]
oxicrypt-drbg = { workspace = true }
oxicrypt-ecdsa = { workspace = true }
oxicrypt-module = { workspace = true }
oxicrypt-zeroize = { workspace = true }

[[test]]
name = "pct_fault_p256"
path = "tests/pct_fault_p256.rs"
required-features = ["fault-injection"]

[[test]]
name = "pct_fault_p384"
path = "tests/pct_fault_p384.rs"
required-features = ["fault-injection"]

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.26.1/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
