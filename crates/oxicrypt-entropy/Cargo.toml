[package]
name = "oxicrypt-entropy"
description = "SP 800-90B entropy source for the oxicrypt module: jitter noise source, health tests, vetted conditioner, and the seed pipeline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# OS monotonic nanosecond clock timer (std-gated surface; core stays no_std).
std = []
# Serialized raw CPU counter via the oxicrypt-timer crate.
raw-counter = ["dep:oxicrypt-timer"]
# Off-boundary raw-data collection tooling: the `collect` binary, the
# streaming dataset writer, the versioned dataset layout + sha256 manifest,
# and the resumable collection-session checkpoint. This feature is OUTSIDE
# the cryptographic boundary, and `RawCollector` stays crate-private.
collection = [
    "std",
    "raw-counter",
    "dep:oxicrypt-hmac",
    "dep:oxicrypt-integrity",
    "dep:oxicrypt-xof",
]
# rand_core 0.9 compatibility: expose the pipeline's vetted conditioned output
# as a standard fallible `rand_core::TryRngCore` generator.
rand-core = ["dep:rand_core"]

[dependencies]
oxicrypt-module = { workspace = true }
oxicrypt-sha = { workspace = true }
# The `collect` binary starts the module before collecting (see its docs).
oxicrypt-hmac = { workspace = true, optional = true }
oxicrypt-integrity = { workspace = true, optional = true }
oxicrypt-xof = { workspace = true, optional = true }
oxicrypt-timer = { workspace = true, optional = true }
oxicrypt-zeroize = { workspace = true }
rand_core = { version = "0.9", optional = true, default-features = false }

# Dev-only: prove the conditioned pipeline output can seed the module-gated
# DRBG. The normal dependency runs from oxicrypt-drbg to this crate, so this
# dev-dependency closes a cycle; cargo permits it because a dev-dependency
# compiles no shipped code.
[dev-dependencies]
oxicrypt-drbg = { path = "../oxicrypt-drbg", features = ["testing-interfaces"] }

[[bin]]
name = "collect"
path = "src/bin/collect.rs"
required-features = ["collection"]

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.27.0/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
