[package]
name = "oxicrypt-entropy"
description = "SP 800-90B entropy-source scaffolding: noise-source abstraction, claimed-H pipeline, cited spec constants."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# OS monotonic nanosecond clock timer (std-gated surface; core stays no_std).
std = []
# Serialized raw CPU counter via the audited oxicrypt-timer crate.
raw-counter = ["dep:oxicrypt-timer"]
# Off-boundary raw-data collection tooling: the `collect` binary, the
# streaming dataset writer, the versioned dataset layout + sha256 manifest,
# and the resumable collection-session checkpoint. Pulls in std (fs +
# serialization) and raw-counter (a real CPU-counter jitter source). This
# feature is OUTSIDE the validated module boundary — the default and library
# build graphs carry none of it, and `RawCollector` stays crate-private.
collection = ["std", "raw-counter"]
# rand_core 0.9 compatibility: expose the pipeline's vetted conditioned output
# as a standard fallible `rand_core::TryRngCore` generator. Default-off and
# `no_std`-clean — `rand_core` is pulled with `default-features = false`, so
# this feature adds NO std dependency (unlike `std`/`collection`), keeping the
# `--no-default-features --features rand-core` build a pure `no_std` graph.
rand-core = ["dep:rand_core"]

[dependencies]
oxicrypt-sha = { workspace = true }
oxicrypt-timer = { workspace = true, optional = true }
oxicrypt-zeroize = { workspace = true }
# no_std rand_core compat (default-off; see the `rand-core` feature above).
rand_core = { version = "0.9", optional = true, default-features = false }

# Dev-only: prove the conditioned pipeline output can seed the module-gated
# DRBG (ISC-34). Test-graph-only deps with no dependency cycle — neither
# oxicrypt-drbg nor oxicrypt-module depends on oxicrypt-entropy.
[dev-dependencies]
oxicrypt-drbg = { path = "../oxicrypt-drbg" }
oxicrypt-module = { path = "../oxicrypt-module" }

# The off-boundary collection binary. Builds ONLY with `--features collection`
# (or `--all-features`); absent from the default and library build graphs.
[[bin]]
name = "collect"
path = "src/bin/collect.rs"
required-features = ["collection"]

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.20.0/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
