[package]
name = "oxicrypt-lms"
description = "LMS hash-based signatures (SP 800-208) for CNSA 2.0 firmware signing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["lms", "hash-signatures", "post-quantum", "sp800-208", "cryptography"]
categories.workspace = true
readme = "README.md"
publish.workspace = true

[lints]
workspace = true

[features]
default = ["alloc"]
# Enables the per-pair `LmsSigningKey` cached signing wrapper, whose
# Merkle node table lives on the heap. The core keygen/sign/verify
# surface stays heap-free; disable for allocator-less no_std targets.
alloc = []
# Data-parallel Merkle leaf computation in the `LmsSigningKey` tree
# cache, default OFF. The leaf sweep becomes an indexed disjoint-slice
# `par_iter_mut` over `rayon`; output is byte-identical to the
# sequential build (R75). Pulls in `rayon`, which requires `std`, so the
# crate becomes `std` only under this feature — the default build stays
# provably `no_std` with no rayon in its graph. Performance build only:
# the CMVP validation-target configuration is the default single-threaded build.
parallel = ["alloc", "dep:rayon"]

[dependencies]
oxicrypt-module = { workspace = true }
oxicrypt-sha = { workspace = true }
oxicrypt-xof = { workspace = true }
oxicrypt-zeroize = { workspace = true }
rayon = { version = "1", optional = true }

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.24.0/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
