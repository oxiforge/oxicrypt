[package]
name = "oxicrypt-ml-dsa"
description = "ML-DSA-87 (FIPS 204) — lattice-based digital signatures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ml-dsa", "dilithium", "post-quantum", "fips-204", "cryptography"]
categories.workspace = true
readme = "README.md"
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Builds the public matrix Â with its rows forked across `rayon`, default
# OFF. Output is byte-identical to the sequential build. Pulls in `rayon` and
# so `std`. A performance build: the CMVP validation-target configuration is
# the default single-threaded build.
parallel = ["dep:rayon"]
# Samples Â four SHAKE-128 cell streams at a time with the AVX2 batched Keccak
# of `oxicrypt-sha`, default OFF. Output is byte-identical to the scalar build,
# which remains the CMVP validation-target configuration. Composes with
# `parallel`.
accel-keccak = ["oxicrypt-sha/accel-keccak"]
# The derandomized `keygen_internal` and `sign_internal` of every parameter
# set, which FIPS 204 §6 restricts to CAVP testing. Default OFF, and enabled
# by no shipped build.
testing-interfaces = []
# The test seam `oxicrypt_ml_dsa::seam`, which corrupts the next generated
# public key before its pairwise consistency test. Default OFF, and enabled
# by no shipped build.
fault-injection = []

[dependencies]
oxicrypt-module = { workspace = true }
oxicrypt-sha = { workspace = true }
oxicrypt-xof = { workspace = true }
oxicrypt-zeroize = { workspace = true }
rayon = { version = "1", optional = true }

# The DRBG types whose strength and instantiation the key-generation tests
# check.
[dev-dependencies]
oxicrypt-drbg = { path = "../oxicrypt-drbg" }

[[test]]
name = "pct_fault_ml_dsa_44"
path = "tests/pct_fault_ml_dsa_44.rs"
required-features = ["fault-injection"]

[[test]]
name = "pct_fault_ml_dsa_65"
path = "tests/pct_fault_ml_dsa_65.rs"
required-features = ["fault-injection"]

[[test]]
name = "pct_fault_ml_dsa_87"
path = "tests/pct_fault_ml_dsa_87.rs"
required-features = ["fault-injection"]

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.26.1/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
