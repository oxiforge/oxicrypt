[package]
name = "oxicrypt-ml-dsa"
description = "ML-DSA-87 (FIPS 204) — lattice-based digital signatures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ml-dsa", "dilithium", "post-quantum", "fips-204", "cryptography"]
categories.workspace = true
readme = "README.md"
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Data-parallel expansion of the public matrix Â, default OFF.
# `expand_a` builds the k × ℓ matrix where each cell A[i][j] is a pure
# function of ρ plus the cell's (i, j) indices, sampled from a fresh
# local SHAKE-128 XOF with no shared mutable state. Under this feature
# the *outer* row loop is forked across a `rayon` parallel iterator:
# each closure owns exactly its row `i` and writes only `row[j]`, and
# the rows are recombined by position (never by completion order) — so
# output is byte-identical to the sequential build regardless of thread
# count. Pulls in `rayon`, which requires `std`, so the crate becomes
# `std` only under this feature — the default build stays provably
# `no_std` with no rayon in its graph. Performance build only: the
# CMVP validation-target configuration is the default single-threaded build.
parallel = ["dep:rayon"]
# AVX2 4-way batched Keccak for ExpandA, default OFF. Turns on the
# batched `Sponge4` dispatch feature on `oxicrypt-sha`; `expand_a` then
# samples the public matrix Â four independent SHAKE-128 cell streams at
# a time. Output is byte-identical to the scalar build (each lane's
# stream is consumed under the same `t < Q` rejection rule), so the
# default single-threaded build remains the CMVP validation-target configuration.
# Composes with `parallel`: the rayon row loop batches each row's cells.
accel-keccak = ["oxicrypt-sha/accel-keccak"]

[dependencies]
oxicrypt-module = { workspace = true }
oxicrypt-sha = { workspace = true }
oxicrypt-xof = { workspace = true }
oxicrypt-zeroize = { workspace = true }
rayon = { version = "1", optional = true }

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.23.1/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
