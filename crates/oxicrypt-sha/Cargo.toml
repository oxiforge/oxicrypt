[package]
name = "oxicrypt-sha"
description = "SHA-1, SHA-2, SHA-3 hash functions per FIPS 180-4 / FIPS 202"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
oxicrypt-module = { workspace = true }
oxicrypt-test-vectors = { workspace = true }
oxicrypt-zeroize = { workspace = true }
oxicrypt-sha-accel = { workspace = true, optional = true }
oxicrypt-keccak-accel = { workspace = true, optional = true }

[features]
# CPU-intrinsic SHA-256 acceleration (x86_64 SHA-NI), default OFF.
# Runtime-detected: with the feature on, the compression boundary
# dispatches to `oxicrypt-sha-accel` only when CPUID confirms SHA-NI,
# else the portable path runs. Default builds carry no accel dependency
# and are byte-for-byte the validated portable baseline.
accel-sha = ["dep:oxicrypt-sha-accel"]
# CPU-intrinsic AVX2 4-way batched Keccak-f[1600] acceleration, default OFF.
# Runtime-detected: with the feature on, the batched `Sponge4` permutation
# dispatches to `oxicrypt-keccak-accel` only when CPUID confirms AVX2, else
# the portable 4× path runs. Default builds carry no accel dependency and
# are byte-for-byte the validated portable baseline.
accel-keccak = ["dep:oxicrypt-keccak-accel"]

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.20.0/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
