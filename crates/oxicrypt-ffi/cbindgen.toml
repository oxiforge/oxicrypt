language = "C"
header = """/* SPDX-License-Identifier: Apache-2.0 OR MIT */
/*
 * oxicrypt — pure-Rust cryptographic module targeting FIPS 140-3 Level 1
 *
 * This header is GENERATED from the Rust source by cbindgen.
 * Do not edit by hand — edit the Rust signatures and rerun the build.
 *
 * The C ABI shim resides OUTSIDE the FIPS 140-3 module boundary.
 * See docs/security-policy/ for the formal CMVP Security Policy.
 *
 * Generated headers are committed under version control and verified
 * by CI to match cbindgen's deterministic output.
 */
"""
include_guard = "OXICRYPT_H"
cpp_compat = true
documentation = true
documentation_style = "c"
style = "type"
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true

[export]
item_types = ["enums", "structs", "opaque", "typedefs", "functions"]
# The status codes returned by every function with an `int` status, which
# no signature names. Four functions return a value of their own instead:
# oxi_abi_version, oxi_active_profile, oxi_is_operational and
# oxi_integrity_status.
include = ["OxiResult"]
# The fault-injection test symbols, declared in include/oxicrypt-test.h.
exclude = [
    "oxi_test_set_seed_stream",
    "oxi_test_hold_busy",
    "oxi_test_corrupt_next_key",
    "oxi_test_poison_entropy",
    "oxi_test_fail_next_on_demand",
    "oxi_test_last_freed_bytes_zero",
    "oxi_test_fail_next_alloc",
    "oxi_test_park_before_output",
    "oxi_test_release_parked",
    "oxi_test_is_parked",
]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
