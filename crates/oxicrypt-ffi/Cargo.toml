[package]
name = "oxicrypt-ffi"
description = "C ABI wrappers for oxicrypt approved services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[lints]
workspace = true

[build-dependencies]
cbindgen = "0.29"

[dependencies]
oxicrypt-module = { path = "../oxicrypt-module" }
oxicrypt-integrity = { path = "../oxicrypt-integrity" }
oxicrypt-sha = { path = "../oxicrypt-sha" }
oxicrypt-hmac = { path = "../oxicrypt-hmac" }
oxicrypt-aes = { path = "../oxicrypt-aes" }
oxicrypt-cmac = { path = "../oxicrypt-cmac" }
oxicrypt-drbg = { path = "../oxicrypt-drbg" }
oxicrypt-ecdsa = { path = "../oxicrypt-ecdsa" }
oxicrypt-eddsa = { path = "../oxicrypt-eddsa" }
oxicrypt-ecdh = { path = "../oxicrypt-ecdh" }
oxicrypt-dh = { path = "../oxicrypt-dh" }
oxicrypt-rsa = { path = "../oxicrypt-rsa" }
oxicrypt-ml-dsa = { path = "../oxicrypt-ml-dsa" }
oxicrypt-ml-kem = { path = "../oxicrypt-ml-kem" }
oxicrypt-slh-dsa = { path = "../oxicrypt-slh-dsa" }
oxicrypt-lms = { path = "../oxicrypt-lms" }
oxicrypt-xmss = { path = "../oxicrypt-xmss" }
oxicrypt-kdf = { path = "../oxicrypt-kdf" }
oxicrypt-tls-kdf = { path = "../oxicrypt-tls-kdf" }

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.20.0/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
