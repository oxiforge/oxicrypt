[package]
name = "oxicrypt-maxwell"
description = "Out-of-boundary SP 800-90B min-entropy estimator suite (MCV) with NIST EA-tool parity harness and determinism self-test."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# Out-of-boundary tooling (SP 800-90B EA-parity harness), not a product — kept off
# crates.io. Licensed under the workspace Apache-2.0 OR MIT like every other crate.
publish = false

[[bin]]
name = "maxwell"
path = "src/main.rs"

[dependencies]
# Used only to verify dataset provenance (SHA-256 of each EA dataset) during
# the parity harness. This is an out-of-boundary tooling dependency on an
# in-boundary crate (like acvp-harness depends on the crypto crates); it does
# not place oxicrypt-maxwell inside the cryptographic boundary.
oxicrypt-sha = { workspace = true }
# The SHA-256 service is gated by the module state machine; this tool powers the
# module up with the real SHA-256 KAT set (oxicrypt_sha::KATS) before hashing,
# rather than rolling its own digest. Out-of-boundary, same as acvp-harness.
oxicrypt-module = { workspace = true }
# §5.1 statistic-18 (compression): pure-Rust bzip2. bzip2 0.6's default backend
# is libbz2-rs-sys (pure Rust); the `bzip2-sys` C backend is an opt-in feature we
# deliberately do NOT enable. maxwell is out-of-boundary tooling, so this — the
# workspace's first third-party dep — never touches the validated module. See
# docs/security-policy/security-policy.md.
bzip2 = "0.6"

[lints]
workspace = true
