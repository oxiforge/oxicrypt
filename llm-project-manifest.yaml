# llm-project-manifest.yaml — oxicrypt
#
# What actually exists right now, in manifest form.
# No priorities, no plans, no roadmap — just what IS.
#
# Status values:
#   complete  — finished, tested, integrated
#   partial   — exists and works but has known gaps
#   stub      — scaffolded, compiles, not yet functional
#
# Updated: 2026-04-15

project:
  name: oxicrypt
  description: >-
    Pure-Rust FIPS 140-3 Level 1 cryptographic module targeting CMVP validation.
    Zero foreign dependencies in the cryptographic boundary.
  compliance_target: "FIPS 140-3 IG D.G (March 2026)"
  rust_minimum: "1.82"

# ---------------------------------------------------------------------------
# Repos and where they live
# ---------------------------------------------------------------------------
repos:
  oxicrypt:
    path: /home/rick/repos/oxicrypt
    remote: https://github.com/oxilabs/oxicrypt.git
    visibility: private
    status: complete          # builds, tests pass, CI green

  lama-spec:
    path: /home/rick/repos/lama-spec
    remote: https://github.com/lamaspec/lama-spec.git
    visibility: public
    status: complete

  lamaspec-site:
    path: /home/rick/repos/lamaspec-site
    remote: https://github.com/lamaspec/lamaspec-site.git
    visibility: private       # goes public after ACVP demo dry-run
    status: complete          # single-page Bootstrap 5, llama mascot SVG

  oxicrypt-site:
    path: /home/rick/repos/oxicrypt-site
    remote: https://github.com/oxilabs/oxicrypt-site.git
    visibility: private       # goes public after ACVP demo dry-run
    status: complete          # single-page Bootstrap 5, placeholder ACVP count

# ---------------------------------------------------------------------------
# Project folder (outside any repo — not committed)
# ---------------------------------------------------------------------------
project_folder:
  path: ~/carakastan/Projects/PQClib/
  files:
    - rust-fips-project-plan.md       # living project plan (always in flux)
    - cnsa2-implementation-plan.md
    - lama-hn-talking-points.md
    - launch-roadmap.md
    - License.md
    - "mobile integrity test.md"

# ---------------------------------------------------------------------------
# Workspace crates  (cargo metadata --no-deps)
# ---------------------------------------------------------------------------
crates:
  # ---- module boundary & orchestration ----
  oxicrypt-module:
    description: "FIPS 140-3 module boundary: state machine, self-test runner, approved-mode indicator"
    status: complete

  oxi:
    description: "Façade crate — re-exports the public API"
    status: complete

  # ---- symmetric ----
  oxicrypt-aes:
    description: "AES-128/192/256, ECB/CBC/CTR/GCM/CCM/KW/KWP/XTS"
    status: complete

  oxicrypt-cmac:
    description: "CMAC (AES-based)"
    status: complete

  oxicrypt-hmac:
    description: "HMAC-SHA-1/224/256/384/512"
    status: complete

  # ---- hashing ----
  oxicrypt-sha:
    description: "SHA-1, SHA-2 (224/256/384/512/512-224/512-256), SHA-3 (224/256/384/512), SHAKE128/256"
    status: complete

  oxicrypt-xof:
    description: "Extendable-output functions: SHAKE, cSHAKE, KMAC, TupleHash, ParallelHash"
    status: complete

  # ---- asymmetric (classical) ----
  oxicrypt-rsa:
    description: "RSA PKCS#1 v1.5 / PSS sign-verify, OAEP encrypt-decrypt, key generation"
    status: complete

  oxicrypt-ecdsa:
    description: "ECDSA P-256, P-384 sign/verify/keygen"
    status: complete

  oxicrypt-eddsa:
    description: "Ed25519 sign/verify/keygen"
    status: complete

  oxicrypt-ecdh:
    description: "ECDH P-256, P-384 key agreement"
    status: complete

  oxicrypt-dh:
    description: "Finite-field DH (RFC 3526 / RFC 7919 groups)"
    status: complete

  # ---- post-quantum ----
  oxicrypt-ml-kem:
    description: "ML-KEM-512/768/1024 (FIPS 203)"
    status: complete

  oxicrypt-ml-dsa:
    description: "ML-DSA-44/65/87 (FIPS 204)"
    status: complete

  oxicrypt-slh-dsa:
    description: "SLH-DSA-SHA2/SHAKE 128s/128f/192s/192f/256s/256f (FIPS 205)"
    status: complete

  oxicrypt-lms:
    description: "LMS / HSS (SP 800-208)"
    status: complete

  oxicrypt-xmss:
    description: "XMSS / XMSS-MT (SP 800-208)"
    status: complete

  # ---- KDF / key derivation ----
  oxicrypt-kdf:
    description: "SP 800-108 KDF (counter, feedback, pipeline), SP 800-56C two-step"
    status: complete

  oxicrypt-tls-kdf:
    description: "TLS 1.2 PRF, TLS 1.3 HKDF-based derivation"
    status: complete

  # ---- DRBG ----
  oxicrypt-drbg:
    description: "SP 800-90A CTR_DRBG, HMAC_DRBG, Hash_DRBG"
    status: complete

  # ---- support / infrastructure ----
  oxicrypt-zeroize:
    description: "Secure memory zeroization"
    status: complete

  oxicrypt-integrity:
    description: "Module integrity check (HMAC-SHA-256 of the binary)"
    status: complete

  oxicrypt-ffi:
    description: "C API surface (extern \"C\" functions)"
    status: partial           # compiles, not all algorithms exposed yet

  oxicrypt-test-vectors:
    description: "Shared NIST/CAVP test vector data for integration tests"
    status: complete

  oxicrypt-bench:
    description: "Criterion benchmarks"
    status: partial           # covers core algorithms, not post-quantum yet

  ct-validation:
    description: "Constant-time validation tooling"
    status: partial

# ---------------------------------------------------------------------------
# ACVP harness
# ---------------------------------------------------------------------------
acvp:
  harness_crate: acvp-harness
  status: complete

  handlers:
    count: 78
    files: 35                 # in acvp-harness/src/handlers/
    capabilities: complete    # all 78 have acvp_capabilities() for registration

  transport:
    file: acvp-harness/src/transport.rs
    lines: 763
    status: complete
    features:
      - "TOTP (RFC 6238) using module HMAC-SHA-256"
      - "JWT (RFC 7519) signing"
      - "mTLS via curl subprocess (zero-dependency boundary preserved)"
      - "Login, registration, vector fetch/process/submit, verdict polling"

  demo_run:
    subcommand: "acvp-harness demo-run"
    flags: ["--cert", "--key", "--totp-secret", "--algorithm", "--server", "--log"]
    status: complete          # built, not yet tested against live server

  nist_demo_account:
    status: pending           # email sent to acvts-demo@nist.gov 2026-04-14, awaiting reply
    server: demo.acvts.nist.gov

