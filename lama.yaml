# oxicrypt — LAMA discovery summary. Spec: https://github.com/lamaspec/lama

lama: "0.1"

library:
  name: oxicrypt
  version: "0.19.0"
  description: "Pure-Rust FIPS 140-3 Level 1 cryptographic module with NIST-approved classical and post-quantum algorithms."
  repository: "https://github.com/oxiforge/oxicrypt"
  homepage: "https://oxicrypt.dev"
  license: "Apache-2.0 OR MIT"
  languages:
    - rust
    - c
  minimum_toolchain: "rust 1.95"
  no_std: true

capabilities:
  - category: "Hashing"
    algorithms: ["SHA-1", "SHA-224", "SHA-256", "SHA-384", "SHA-512", "SHA-512/224", "SHA-512/256", "SHA3-224", "SHA3-256", "SHA3-384", "SHA3-512", "SHAKE128", "SHAKE256"]
    standards: ["FIPS 180-4", "FIPS 202"]

  - category: "Extendable-output functions (XOF)"
    algorithms: ["cSHAKE128", "cSHAKE256", "KMAC128", "KMAC256", "KMACXOF128", "KMACXOF256", "TupleHash128", "TupleHash256", "TupleHashXOF128", "TupleHashXOF256", "ParallelHash128", "ParallelHash256", "ParallelHashXOF128", "ParallelHashXOF256"]
    standards: ["SP 800-185"]

  - category: "Message authentication"
    algorithms: ["HMAC (all approved hashes)", "AES-CMAC (128/192/256)"]
    standards: ["FIPS 198-1", "SP 800-38B"]

  - category: "Symmetric encryption"
    algorithms: ["AES-128/192/256 in ECB, CBC, CTR, GCM, CCM, KW, KWP"]
    standards: ["FIPS 197", "SP 800-38A", "SP 800-38C", "SP 800-38D", "SP 800-38F"]

  - category: "Random number generation"
    algorithms: ["CTR_DRBG (AES-128/192/256)", "Hash_DRBG (SHA-256/384/512)", "HMAC_DRBG (SHA-256/384/512)"]
    standards: ["SP 800-90A Rev. 1"]

  - category: "Key derivation"
    algorithms: ["SP 800-108r1 KBKDF (counter/feedback/double-pipeline)", "KDA-HKDF (SP 800-56Cr2)", "TLS 1.2 KDF", "TLS 1.3 KDF", "PBKDF2"]
    standards: ["SP 800-108", "SP 800-56Cr2", "SP 800-132", "SP 800-135r1", "RFC 8446"]

  - category: "Digital signatures"
    algorithms: ["ECDSA P-256/P-384", "Ed25519", "RSA-2048/3072/4096 (PKCS#1 v1.5, PSS)", "ML-DSA-44/65/87", "SLH-DSA (SHA2 + SHAKE, all 12 FIPS 205 parameter sets)"]
    standards: ["FIPS 186-5", "FIPS 204", "FIPS 205", "RFC 8032"]

  - category: "Key agreement"
    algorithms: ["ECDH P-256/P-384", "DH-3072 (RFC 3526 Group 15)"]
    standards: ["SP 800-56Ar3", "RFC 3526"]

  - category: "Key encapsulation"
    algorithms: ["ML-KEM-512/768/1024"]
    standards: ["FIPS 203"]

  - category: "Post-quantum signatures (stateful hash-based)"
    algorithms: ["LMS (SP 800-208 §A.3 grid, stateful)", "XMSS-SHA2_10_256 (stateful)"]
    standards: ["SP 800-208", "RFC 8554", "RFC 8391"]

  - category: "Asymmetric encryption"
    algorithms: ["RSA-2048/3072/4096 OAEP"]
    standards: ["SP 800-56Br2"]

  - category: "Module integrity"
    algorithms: ["HMAC-SHA-256 software integrity check"]
    standards: ["FIPS 140-3 IG 10.3.A"]

  - category: "Entropy source (pre-validation scaffolding)"
    algorithms: ["jitter NoiseSource", "RCT/APT continuous health tests", "SHA-256 vetted conditioning"]
    standards: ["SP 800-90B", "SP 800-90C"]

  - category: "Tooling"
    algorithms: ["acvp-harness (offline ACVP vector processing + demo-server sessions; --lama)", "esv-harness (offline ESVP/SP 800-90B entropy-source registration, login/single+bulk refresh, offline payload+data-file preflight, exact fixed-point hminEstimate serialization, data-file multipart upload + bounded status-poll, supporting-doc upload, certify request builders, and a resumable per-submission session store, over acvp-harness transport)", "oxicrypt-ffi (oxi_-prefixed extern \"C\" cdylib + staticlib; include/oxicrypt.h)"]
    standards: ["FIPS 140-3 IG 10.3.A", "SP 800-90B"]

security:
  certification: "FIPS 140-3 Level 1 (targeting)"
  side_channel_posture: "disclosed"
  zeroization: "volatile-on-drop for all CSP-holding types (via oxicrypt-zeroize)"
  algorithm_profiles:
    - name: "Unrestricted"
      description: "All FIPS-approved algorithms available (default)"
    - name: "CNSA 2.0"
      description: "Quantum-resistant: AES-256, SHA-384/512, ML-KEM-1024, ML-DSA-87, LMS, XMSS"
    - name: "CNSA 1.0"
      description: "Classical transition: AES-256, SHA-384, ECDSA/ECDH P-384, RSA >= 3072, DH >= 3072"

manifest: "docs/llm-api-manifest/llm-api.yaml"
