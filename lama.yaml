# oxicrypt — LAMA discovery summary. Spec: https://github.com/lamaspec/lama

lama: "0.1"

library:
  name: oxicrypt
  version: "0.22.0"
  description: "Pure-Rust FIPS 140-3 Level 1 cryptographic module implementing NIST-approved algorithms with a formal module boundary and power-up self-tests."
  repository: "https://github.com/oxiforge/oxicrypt"
  homepage: "https://oxicrypt.dev"
  license: "Apache-2.0 OR MIT"
  languages:
    - rust
    - c
  minimum_toolchain: "rust 1.95"
  security:
    certification: "FIPS 140-3 Level 1 (targeting, pre-validation)"
    side_channel_posture: "disclosed; no side-channel resistance claimed at Level 1, timing behavior validated via dudect"
    zeroization: "volatile-on-drop for all CSP-holding types (via oxicrypt-zeroize)"
    algorithm_profiles:
      - name: "Unrestricted"
        description: "All FIPS-approved algorithms available (default)"
      - name: "CNSA 2.0"
        description: "Quantum-resistant: AES-256, SHA-384/512, ML-KEM-1024, ML-DSA-87, LMS, XMSS"
      - name: "CNSA 1.0"
        description: "Classical transition: AES-256, SHA-384, ECDSA/ECDH P-384, RSA >= 3072, DH >= 3072"

capabilities:
  - category: "Hashing"
    algorithms:
      - SHA-1
      - SHA-224
      - SHA-256
      - SHA-384
      - SHA-512
      - SHA-512/224
      - SHA-512/256
      - SHA3-224
      - SHA3-256
      - SHA3-384
      - SHA3-512
      - SHAKE128
      - SHAKE256
    standards:
      - FIPS 180-4
      - FIPS 202
    quickstart:
      language: "rust"
      code: |
        //! Quickstart: Hashing. Carried in lama.yaml; this file is the canonical copy.
        use oxicrypt_module::initialize_with_tests;
        use oxicrypt_sha::sha256;

        fn main() {
            initialize_with_tests(oxicrypt_sha::KATS).unwrap();
            let digest = sha256(b"hello world").unwrap();
            assert_eq!(digest.len(), 32);
        }

  - category: "Extendable-output functions (XOF)"
    algorithms:
      - cSHAKE128
      - cSHAKE256
      - KMAC128
      - KMAC256
      - KMACXOF128
      - KMACXOF256
      - TupleHash128
      - TupleHash256
      - TupleHashXOF128
      - TupleHashXOF256
      - ParallelHash128
      - ParallelHash256
      - ParallelHashXOF128
      - ParallelHashXOF256
    standards: ["SP 800-185"]
    quickstart:
      language: "rust"
      code: |
        //! Quickstart: Extendable-output functions (XOF). Carried in lama.yaml; this file is the canonical copy.
        use oxicrypt_module::initialize_with_tests;
        use oxicrypt_xof::{kmac256, shake256};

        fn main() {
            initialize_with_tests(oxicrypt_xof::KATS).unwrap();
            let squeezed: [u8; 32] = shake256(b"input data").unwrap();
            let tag: [u8; 32] = kmac256(b"my-key", b"input", b"").unwrap();
            assert_eq!(squeezed.len(), 32);
            assert_eq!(tag.len(), 32);
        }

  - category: "Message authentication"
    algorithms:
      - HMAC (all approved hashes)
      - AES-CMAC (128/192/256)
    standards:
      - FIPS 198-1
      - SP 800-38B
    quickstart:
      language: "rust"
      code: |
        //! Quickstart: Message authentication. Carried in lama.yaml; this file is the canonical copy.
        use oxicrypt_hmac::HmacSha256;
        use oxicrypt_module::initialize_with_tests;

        fn main() {
            initialize_with_tests(oxicrypt_hmac::KATS).unwrap();
            let mut mac = HmacSha256::new(b"secret-key-at-least-32-bytes-long!!").unwrap();
            mac.update(b"message to authenticate");
            let tag = mac.finalize();
            assert_eq!(tag.len(), 32);
        }

  - category: "Symmetric encryption"
    algorithms: ["AES-128/192/256 in ECB, CBC, CTR, GCM, CCM, KW, KWP"]
    standards:
      - FIPS 197
      - SP 800-38A
      - SP 800-38C
      - SP 800-38D
      - SP 800-38F
    quickstart:
      language: "rust"
      code: |
        //! Quickstart: Symmetric encryption. Carried in lama.yaml; this file is the canonical copy.
        use oxicrypt_aes::{Aes256Key, gcm_encrypt};
        use oxicrypt_module::initialize_with_tests;

        fn main() {
            initialize_with_tests(oxicrypt_aes::KATS).unwrap();
            let key = Aes256Key::new(&[0u8; 32]).unwrap(); // use a real key
            let iv = [0u8; 12]; // a nonce must never repeat under one key
            let plaintext = b"hello, world!   ";
            let mut ciphertext = [0u8; 16];
            let mut tag = [0u8; 16];
            gcm_encrypt(&key, &iv, b"", plaintext, &mut ciphertext, &mut tag).unwrap();
            assert_ne!(ciphertext, *plaintext);
        }

  - category: "Random number generation"
    algorithms:
      - CTR_DRBG (AES-128/192/256)
      - Hash_DRBG (SHA-256/384/512)
      - HMAC_DRBG (SHA-256/384/512)
    standards: ["SP 800-90A Rev. 1"]
    quickstart:
      language: "rust"
      code: |
        //! Quickstart: Random number generation. Carried in lama.yaml; this file is the canonical copy.
        use oxicrypt_drbg::HmacDrbgSha256;
        use oxicrypt_module::initialize_with_tests;

        fn main() {
            initialize_with_tests(oxicrypt_drbg::KATS).unwrap();
            let mut rng = HmacDrbgSha256::new();
            // Both values must come from a real entropy source in production.
            rng.instantiate(&[0xABu8; 32], &[0xCDu8; 16], b"").unwrap();
            let mut output = [0u8; 32];
            rng.generate(None, &mut output).unwrap();
            assert_ne!(output, [0u8; 32]);
        }

  - category: "Key derivation"
    algorithms:
      - SP 800-108r1 KBKDF (counter/feedback/double-pipeline)
      - KDA-HKDF (SP 800-56Cr2)
      - TLS 1.2 KDF
      - TLS 1.3 KDF
      - PBKDF2
    standards:
      - SP 800-108
      - SP 800-56Cr2
      - SP 800-132
      - SP 800-135r1
      - RFC 8446
    quickstart:
      language: "rust"
      code: |
        //! Quickstart: Key derivation. Carried in lama.yaml; this file is the canonical copy.
        use oxicrypt_kdf::HkdfSha256;
        use oxicrypt_module::initialize_with_tests;

        fn main() {
            initialize_with_tests(oxicrypt_kdf::KATS).unwrap();
            // Extract concentrates the input keying material into a pseudorandom key,
            // then expand derives as many bytes as the caller asks for.
            let hkdf = HkdfSha256::extract(Some(b"optional-salt"), b"input-keying-material").unwrap();
            let mut okm = [0u8; 42];
            hkdf.expand(b"application context", &mut okm).unwrap();
            assert_ne!(okm, [0u8; 42]);
        }

  - category: "Digital signatures"
    algorithms:
      - ECDSA P-256/P-384
      - Ed25519
      - RSA-2048/3072/4096 (PKCS#1 v1.5, PSS)
      - ML-DSA-44/65/87
      - SLH-DSA (SHA2 + SHAKE, all 12 FIPS 205 parameter sets)
    standards:
      - FIPS 186-5
      - FIPS 204
      - FIPS 205
      - RFC 8032
    quickstart:
      language: "rust"
      code: |
        //! Quickstart: Digital signatures. Carried in lama.yaml; this file is the canonical copy.
        use oxicrypt_drbg::HmacDrbgSha256;
        use oxicrypt_eddsa::ed25519::{Ed25519PrivateKey, verify};
        use oxicrypt_module::initialize_with_tests;

        fn main() {
            initialize_with_tests(oxicrypt_eddsa::KATS).unwrap();
            let mut rng = HmacDrbgSha256::new();
            rng.instantiate(&[0xABu8; 32], &[0xCDu8; 16], b"").unwrap();
            let signing_key = Ed25519PrivateKey::generate(&mut rng).unwrap();
            let signature = signing_key.sign(b"message to sign").unwrap();
            assert!(verify(&signing_key.public_key(), b"message to sign", &signature).unwrap());
        }

  - category: "Key agreement"
    algorithms:
      - ECDH P-256/P-384
      - DH-3072 (RFC 3526 Group 15)
    standards:
      - SP 800-56Ar3
      - RFC 3526
    quickstart:
      language: "rust"
      code: |
        //! Quickstart: Key agreement. Carried in lama.yaml; this file is the canonical copy.
        use oxicrypt_drbg::HmacDrbgSha256;
        use oxicrypt_ecdh::{compute_shared_secret_p256, generate_keypair_p256};
        use oxicrypt_module::initialize_with_tests;

        fn main() {
            initialize_with_tests(oxicrypt_ecdh::KATS).unwrap();
            let mut rng = HmacDrbgSha256::new();
            rng.instantiate(&[0xABu8; 32], &[0xCDu8; 16], b"").unwrap();
            // Each party keeps d and publishes Q.
            let (alice_d, alice_q) = generate_keypair_p256(&mut rng).unwrap();
            let (bob_d, bob_q) = generate_keypair_p256(&mut rng).unwrap();
            let alice_shared = compute_shared_secret_p256(&alice_d, &bob_q).unwrap();
            let bob_shared = compute_shared_secret_p256(&bob_d, &alice_q).unwrap();
            assert_eq!(alice_shared, bob_shared);
        }

  - category: "Key encapsulation"
    algorithms: ["ML-KEM-512/768/1024"]
    standards: ["FIPS 203"]

  - category: "Post-quantum signatures (stateful hash-based)"
    algorithms:
      - LMS (SP 800-208 §A.3 grid, stateful)
      - XMSS-SHA2_10_256 (stateful)
    standards:
      - SP 800-208
      - RFC 8554
      - RFC 8391

  - category: "Asymmetric encryption"
    algorithms: ["RSA-2048/3072/4096 OAEP"]
    standards: ["SP 800-56Br2"]

  - category: "Module integrity"
    algorithms: ["HMAC-SHA-256 software integrity check"]
    standards: ["FIPS 140-3 IG 10.3.A"]

  - category: "Entropy source (pre-validation scaffolding)"
    algorithms:
      - jitter NoiseSource
      - RCT/APT continuous health tests
      - SHA-256 vetted conditioning
    standards:
      - SP 800-90B
      - SP 800-90C

  - category: "Tooling"
    algorithms:
      - acvp-harness (offline ACVP vector processing + demo-server sessions; --lama)
      - esv-harness (offline ESVP/SP 800-90B entropy-source registration, login/single+bulk refresh, offline payload+data-file preflight, exact fixed-point hminEstimate serialization, data-file multipart upload + bounded status-poll, supporting-doc upload, certify request builders, and a resumable per-submission session store, over acvp-harness transport)
      - oxicrypt-ffi (oxi_-prefixed extern "C" cdylib + staticlib; include/oxicrypt.h)
    standards:
      - FIPS 140-3 IG 10.3.A
      - SP 800-90B

manifest: "docs/llm-api-manifest/llm-api.yaml"
