[package]
name = "oxicrypt-integrity-sign"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "README.md"
description = "Signs an oxicrypt build so its pre-operational integrity self-test can verify itself at startup. A build tool: not part of the cryptographic module."
# Deliberately not inheriting `keywords`/`categories` from the workspace. Every
# other member is a `no-std` cryptographic library and inherits both; this is a
# `std` build tool that produces no cryptographic service, so the inherited
# `no-std` keyword and `cryptography` category would each be false of it.
keywords = ["integrity", "self-test", "elf", "build-tool", "oxicrypt"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[lints]
workspace = true

[dependencies]
oxicrypt-integrity = { workspace = true }

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.23.2/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
