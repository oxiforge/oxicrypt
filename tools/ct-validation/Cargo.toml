[package]
name = "ct-validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "dudect-style constant-time validation harness for oxicrypt"

[dependencies]
oxicrypt-rsa = { path = "../../crates/oxicrypt-rsa" }
oxicrypt-ecdsa = { path = "../../crates/oxicrypt-ecdsa" }
oxicrypt-ecdh = { path = "../../crates/oxicrypt-ecdh" }
oxicrypt-eddsa = { path = "../../crates/oxicrypt-eddsa" }
oxicrypt-drbg = { path = "../../crates/oxicrypt-drbg" }
oxicrypt-module = { path = "../../crates/oxicrypt-module" }

[lib]
name = "ct_validation"
path = "src/lib.rs"

[[bin]]
name = "ct-validation"
path = "src/bin/ct_validation.rs"

[lints]
workspace = true
