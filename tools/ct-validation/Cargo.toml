[package]
name = "ct-validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "dudect-style constant-time validation harness for oxicrypt"

[dependencies]
oxicrypt-rsa = { workspace = true }
oxicrypt-ecdsa = { workspace = true }
oxicrypt-ecdh = { workspace = true }
oxicrypt-eddsa = { workspace = true }
oxicrypt-drbg = { workspace = true }
oxicrypt-module = { workspace = true }
oxicrypt-aes = { workspace = true }
oxicrypt-cmac = { workspace = true }

[features]
# Builds the control targets: `cmac_verify_leaky`, whose comparison stops
# at the first differing byte, so that the harness can be shown to fail
# on a data-dependent exit, and `aa`, whose classes are identical, so
# that a leak the harness or host makes can be told from one in a target.
fixture = []

[lib]
name = "ct_validation"
path = "src/lib.rs"

[[bin]]
name = "ct-validation"
path = "src/bin/ct_validation.rs"

[lints]
workspace = true
