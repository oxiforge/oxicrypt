# NOTE — manual-dispatch mode since 2026-06-10 (was fully paused
# 2026-05-07 by rename to `ci.yml.disabled` after the Free-tier
# minutes cap; minutes renewed June, but they burn fast — one full
# cycle costs 1.5-2h+ of 2-core runner time, mostly the debug
# single-threaded test stage).
#
# Trigger policy: `workflow_dispatch` ONLY — zero default burn.
# Each merge picks its gate: the local pre-push hook (default,
# free, runs the same fmt/clippy/test/build cycle on every push)
# or cloud CI via `gh workflow run ci`. Spend minutes when the
# VM is busy (e.g. ACVTS campaigns) or when the feature-matrix
# coverage below is wanted — the `features` job runs the
# non-default feature configs (oxicrypt-lms `parallel`,
# oxicrypt-sha `accel-sha`) that the local hook structurally
# skips (it tests default features only).
#
# Local CI parity for the four core jobs is preserved by
# `scripts/git-hooks/pre-push`, activated via the existing
# `git config core.hooksPath scripts/git-hooks` setting that the
# pre-commit hook already relies on. The hook stays as the
# default gate; this workflow is the on-demand cloud mirror.

name: ci

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `--all-targets` silently skips targets whose `required-features` are
      # unsatisfied, so the `entropy-bench` bench and example targets are not
      # linted by the line above. That feature must stay off workspace-wide —
      # it enables `raw-counter` for every `--workspace` command — so the only
      # way to lint those targets is a separate invocation that opts in.
      - run: cargo clippy -p oxicrypt-bench --features entropy-bench --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      # nextest gate (2026-06-12): per-test process isolation makes
      # oxicrypt-module's global-state mutation a non-issue — full
      # parallelism workspace-wide. nextest skips doctests, so the
      # --doc step keeps doctest coverage identical. The same pair
      # lives in scripts/git-hooks/pre-push.
      - uses: taiki-e/install-action@nextest
      # CI does NOT validate SP 800-90B estimator parity. The EA v1.1.8
      # reference datasets are not provisioned on the runner, and every
      # EA-anchored test in oxicrypt-maxwell skips when its dataset is absent —
      # so this job has always run the parity story against nothing and reported
      # success. Setting the flag makes that pre-existing fact explicit here
      # rather than hidden in silent skips; it does not change what CI covers.
      # The full-strength gate is local, where the bundle lives (#137, #153).
      # The Security Policy is likewise absent here: it is withheld from this
      # repository entirely (docs/security-policy/README.md), so the runner has
      # no route to it and never will. The five doc-guard tests asserting its
      # numerals against the workspace therefore skip.
      #
      # The flag is not strictly required — the provisioning gate fires only on a
      # checkout that CLAIMS the document, and the runner claims nothing, so a
      # bare job would pass anyway. It is set for the same reason as the line
      # above it: to state the coverage gap in the workflow rather than leave it
      # resting on the incidental absence of a directory.
      - run: cargo nextest run --workspace
        env:
          OXICRYPT_EA_DATA_OPTIONAL: "1"
          OXICRYPT_SECURITY_POLICY_OPTIONAL: "1"
      # The gate's own warning goes to stderr, which nextest discards on a
      # passing test — so without this the caveat above would be invisible in
      # every green run, which is the failure mode #137 exists to kill.
      - name: Record the parity coverage caveat
        if: always()
        run: |
          echo "### SP 800-90B estimator parity: NOT validated by CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The EA v1.1.8 reference datasets are not provisioned on this runner, so the" >> "$GITHUB_STEP_SUMMARY"
          echo "parity table, every per-estimator anchor and the assessed-assembly parity ran" >> "$GITHUB_STEP_SUMMARY"
          echo "against no data. A green test job is not evidence of estimator parity." >> "$GITHUB_STEP_SUMMARY"
          echo "The full-strength gate is local; see #137 and #153." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Security Policy assertions: NOT run by CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The FIPS 140-3 Security Policy is withheld from this repository, so the five" >> "$GITHUB_STEP_SUMMARY"
          echo "doc-guard tests that assert its stated numerals against the workspace as built" >> "$GITHUB_STEP_SUMMARY"
          echo "skipped. Boundary-accounting drift is still caught here by the equivalent" >> "$GITHUB_STEP_SUMMARY"
          echo "AGENTS.md and README.md assertions, which need no policy and did run." >> "$GITHUB_STEP_SUMMARY"
          echo "See docs/security-policy/README.md." >> "$GITHUB_STEP_SUMMARY"
      - run: cargo test --workspace --doc

  build:
    name: cargo build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release

  # LAMA manifest conformance (#175). The cloud mirror of the check the
  # pre-push hook runs locally. Like every job here it is
  # workflow_dispatch-only, so the LOCAL HOOK is the gate that actually
  # runs on every push — this job is the on-demand mirror, not a second
  # line of defence.
  #
  # Not a cargo step: it runs a vendored TypeScript linter, so it needs a
  # bun runtime rather than a toolchain. Deliberately NOT a doc-guard
  # test, which would have matched how other doc claims are asserted
  # here: that test would shell out to bun and make `cargo test` fail for
  # anyone without a JavaScript runtime, which is an unreasonable thing
  # to ask of someone building a Rust cryptographic library.
  #
  # bun is pinned. The linter is checksum-pinned against its upstream
  # provenance, and running a pinned tool on a floating runtime leaves
  # the result unpinned where it counts.
  lama:
    name: LAMA manifest conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: ./scripts/check-lama-manifests.sh

  # Non-default feature configs — the local pre-push hook tests
  # default features only, so this job is cloud CI's unique
  # coverage: the rayon `parallel` path (incl. the golden-pin
  # byte-anchor of the parallel-built node table) and the SHA-NI
  # `accel-sha` dispatch/equivalence suites. Runner hardware may
  # lack SHA-NI; the detection contract makes those tests
  # fail-portable, so the suite is meaningful either way.
  features:
    name: cargo test (feature matrix)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - crate: oxicrypt-lms
            flags: --features parallel
          - crate: oxicrypt-sha
            flags: --features accel-sha
          - crate: oxicrypt-sha-accel
            flags: --all-features
          # oxicrypt-entropy's std/collection-gated surface (raw collection,
          # streaming dataset writer, sha256 manifest, resumable session) is
          # invisible to the default workspace gates, which build entropy with
          # default (no_std) features. --all-features = std + raw-counter +
          # collection, covering the whole std-gated surface.
          - crate: oxicrypt-entropy
            flags: --all-features
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ${{ matrix.crate }} --release ${{ matrix.flags }}
