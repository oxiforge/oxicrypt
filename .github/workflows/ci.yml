# GitHub Actions is free for a public repository on standard
# GitHub-hosted runners, with no minute cap, and a public repository's
# standard runners have 4 cores and 16 GB.
#
# Do NOT move any job to a larger runner: larger runners are billed
# even for public repositories.
#
# Runs on every pull request and on main. `workflow_dispatch` stays
# alongside them: a full run on demand, against any ref, is worth
# keeping, and it is also the only mode with no base ref — so
# `scripts/gate-scope.sh` narrows nothing and a dispatch always runs
# everything.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # The `oxicrypt` crate links a signed shared library and refuses to link one
  # without a fingerprint pin. Workspace jobs build it unlinked; its unit tests,
  # which pin it against the C header and status codes, still run. The
  # `bindings` job below runs its linked tests against a signed library.
  OXICRYPT_LIB_OPTIONAL: "1"

jobs:
  # Which optional gates does this change need? Decided by
  # `scripts/gate-scope.sh`, which the pre-push hook calls for the same
  # decision — one fail-closed rule, two callers, rather than two copies that
  # drift silently in the dangerous direction.
  #
  # Consumers force-pass inside a STEP rather than carrying a job-level `if`.
  # A required check skipped by GitHub never reports at all: it sits at Pending
  # and blocks the pull request indefinitely. A job that always runs and exits 0
  # early is the supported shape.
  #
  # A `workflow_dispatch` run has no base ref, so this emits `true` for
  # everything and the run is full: the intended reading of a manual dispatch.
  scope:
    name: gate scope
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      maxwell: ${{ steps.scope.outputs.maxwell }}
      bindings: ${{ steps.scope.outputs.bindings }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: |
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          fi
          ./scripts/gate-scope.sh "$base" "${{ github.sha }}" | tee -a "$GITHUB_OUTPUT"

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `--all-targets` silently skips targets whose `required-features` are
      # unsatisfied, so the `entropy-bench` bench and example targets are not
      # linted by the line above. That feature must stay off workspace-wide —
      # it enables `raw-counter` for every `--workspace` command — so the only
      # way to lint those targets is a separate invocation that opts in.
      - run: cargo clippy -p oxicrypt-bench --features entropy-bench --all-targets -- -D warnings

  # Sharded across four runners. The suite's cost is spread over many slow
  # tests rather than concentrated in one, which is what makes sharding the
  # right lever, and oxicrypt-slh-dsa's slow tests cost about as much as
  # oxicrypt-maxwell's. The pre-push hook's Tier B assumes that excluding
  # maxwell removes the expensive tail, which holds on a many-core developer
  # machine and not on these runners.
  #
  # `slice` rather than `hash`, and NOT `count` — which nextest deprecates as
  # "neither the even nature of sliced partitioning nor the stability of hashed
  # sharding". Slicing round-robins the test list, which distributes the ten
  # tests above about as evenly as anything can without being load-aware; hashed
  # sharding is stable when tests are added but balances worse, and balance is
  # what is being bought here. A shard is floored by the single longest test in
  # it, so raising the shard count past four buys progressively less.
  test:
    name: cargo test (slice ${{ matrix.slice }}/4)
    runs-on: ubuntu-latest
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      # nextest: per-test process isolation makes
      # oxicrypt-module's global-state mutation a non-issue — full
      # parallelism workspace-wide. nextest skips doctests, so the
      # separate doctests job below keeps doctest coverage identical.
      - uses: taiki-e/install-action@nextest
      # SP 800-90B estimator parity IS validated here (#153). The EA v1.1.8
      # reference datasets are the 11 `.bin` files tracked in the public NIST
      # repository, so provisioning them is a checkout rather than a secret or a
      # build: no C++ toolchain is involved, because the reference VALUES are
      # baked into `parity.rs` with a per-file SHA-256 that the harness verifies.
      #
      # OXICRYPT_EA_DATA_OPTIONAL is deliberately NOT set: with it, every
      # EA-anchored test in oxicrypt-maxwell would skip and the job would report
      # success having compared nothing. Without it,
      # `parity::tests::ea_dataset_suite_is_provisioned` fails the job if the
      # checkout stops landing, so a provisioning failure cannot degrade
      # silently into a green run.
      - name: Provision the SP 800-90B reference datasets
        uses: actions/checkout@v4
        with:
          repository: usnistgov/SP800-90B_EntropyAssessment
          path: ea-reference
      # The Security Policy is a different case and stays absent: it is withheld
      # from this repository entirely (docs/security-policy/README.md), so the
      # runner has no route to it and never will. The five doc-guard tests
      # asserting its numerals against the workspace therefore skip. The flag is
      # not strictly required — the provisioning gate fires only on a checkout
      # that CLAIMS the document, and the runner claims nothing — but it states
      # the gap in the workflow rather than resting it on a missing directory.
      # Fail closed on a slice that selected nothing. A `--partition` expression
      # matching no tests exits 0, which reads exactly like a pass — so a
      # mis-specified slice would silently retire a quarter of the suite.
      #
      # The assertion is made against `list`, not against the run's output.
      # `CARGO_TERM_COLOR: always` is set workflow-wide, so nextest emits
      # `457<ESC>[0m tests run`, and no pattern anchoring digits to
      # " tests run" can match coloured output. Asking `list` how many tests the
      # slice selects answers the actual question — is this slice non-empty —
      # without parsing anything the terminal has decorated.
      - name: Assert the slice is non-empty
        run: |
          if [ "${{ needs.scope.outputs.rust }}" != "true" ]; then
            echo "no Rust-relevant paths in this change — skipping (scripts/gate-scope.sh)"
            exit 0
          fi
          n="$(cargo nextest list --workspace -E 'not package(oxicrypt-maxwell)' --partition slice:${{ matrix.slice }}/4 | grep -c '::')"
          echo "slice ${{ matrix.slice }}/4 selects $n tests"
          [ "$n" -gt 0 ] || { echo "slice ${{ matrix.slice }}/4 selected no tests" >&2; exit 1; }
      # No output parsing here: nextest's own exit code is the verdict.
      #
      # oxicrypt-maxwell is excluded and runs in its own job. Its EA-anchored
      # tests are the long pole of the whole suite:
      # `iid_gate::assessed_assembly_matches_ea_on_multi_bit_datasets` alone
      # floors whichever shard draws it far above the others. Excluding the PACKAGE
      # rather than a list of test names is deliberate: a name list rots the
      # moment someone adds a slow test, and nothing would report that it had.
      # Some tests build a crate themselves: `integrity-probe`'s
      # build_time_key tests build the probe into CARGO_TARGET_TMPDIR with a
      # key of their own, and `integrity-probe-so`'s tests build the cdylib
      # and write a test key into a copy. They need only the toolchain
      # installed above. Both expect a build without
      # OXICRYPT_INTEGRITY_VERIFY_KEY, so this job must not set it.
      - name: cargo nextest run (slice ${{ matrix.slice }}/4, without maxwell)
        run: |
          if [ "${{ needs.scope.outputs.rust }}" != "true" ]; then
            echo "no Rust-relevant paths in this change — skipping (scripts/gate-scope.sh)"
            exit 0
          fi
          cargo nextest run --workspace -E 'not package(oxicrypt-maxwell)' --partition slice:${{ matrix.slice }}/4
        env:
          OXICRYPT_EA_DATA: ${{ github.workspace }}/ea-reference/bin
          OXICRYPT_SECURITY_POLICY_OPTIONAL: "1"

  # oxicrypt-maxwell, on its own runner and gated on its own dependency closure.
  #
  # This is the job the gating exists for. Maxwell carries the EA-anchored
  # entropy-assessment tests, which are ~22 minutes of the suite, and its closure
  # is small — itself plus module, sha, test-vectors and zeroize. A change that
  # touches none of them cannot alter a verdict here, so most pull requests skip
  # it and finish in the time the shards take.
  maxwell:
    name: cargo test (oxicrypt-maxwell)
    runs-on: ubuntu-latest
    needs: scope
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Provision the SP 800-90B reference datasets
        uses: actions/checkout@v4
        with:
          repository: usnistgov/SP800-90B_EntropyAssessment
          path: ea-reference
      - name: cargo nextest run -p oxicrypt-maxwell
        run: |
          if [ "${{ needs.scope.outputs.maxwell }}" != "true" ]; then
            echo "nothing oxicrypt-maxwell is built from changed — skipping (scripts/gate-scope.sh)"
            exit 0
          fi
          cargo nextest run -p oxicrypt-maxwell
        env:
          OXICRYPT_EA_DATA: ${{ github.workspace }}/ea-reference/bin
          OXICRYPT_SECURITY_POLICY_OPTIONAL: "1"

  # The `oxicrypt` crate against a library built and signed with a key this
  # job generates. Gated on scripts/gate-scope.sh's `bindings` key: the crate,
  # the C library and its header, the signer, the signing and fixture scripts,
  # the manifest the library embeds and the build configuration. The fixture
  # build has its own target directory, so its key-embedding release build of
  # oxicrypt-ffi does not share outputs with any other build.
  bindings:
    name: oxicrypt crate (signed library)
    runs-on: ubuntu-latest
    needs: scope
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build and sign the fixture, then lint and test the crate
        run: |
          # Skip only on an explicit `false`: a missing or unexpected value
          # runs the job.
          if [ "${{ needs.scope.outputs.bindings }}" = "false" ]; then
            echo "nothing the oxicrypt crate's linked tests depend on changed — skipping (scripts/gate-scope.sh)"
            exit 0
          fi
          set -euo pipefail
          # The provisioning test must be able to fail here.
          unset OXICRYPT_LIB_OPTIONAL
          export CARGO_TARGET_DIR="$RUNNER_TEMP/bindings-target"
          ./scripts/bindings-fixture.sh "$RUNNER_TEMP/bindings-fixture"
          . "$RUNNER_TEMP/bindings-fixture/env.sh"
          cargo clippy -p oxicrypt --all-targets -- -D warnings
          env -u OXICRYPT_LIB_FINGERPRINT OXICRYPT_LIB_UNPINNED=1 \
            cargo clippy -p oxicrypt --all-targets -- -D warnings
          cargo test -p oxicrypt
          # Unpinned, the second-key library is accepted rather than refused.
          env -u OXICRYPT_LIB_FINGERPRINT OXICRYPT_LIB_UNPINNED=1 cargo test -p oxicrypt

  # Doctests are not partitioned: nextest does not run them at all, so they need
  # their own job rather than a fifth copy inside each shard. They need neither
  # the EA datasets nor the policy flag — no doctest reads either.
  doctests:
    name: cargo test --doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --doc
      # The gate's own warning goes to stderr, which nextest discards on a
      # passing test — so without this the caveat would be invisible in every
      # green run, which is the failure mode #137 exists to kill. It lives here
      # rather than in the shards so it is recorded once per run, not four times.
      - name: Record the coverage caveat
        if: always()
        run: |
          {
            echo "### Security Policy assertions: NOT run by CI"
            echo ""
            echo "The FIPS 140-3 Security Policy is withheld from this repository, so the five"
            echo "doc-guard tests that assert its stated numerals against the workspace as built"
            echo "skipped. Boundary-accounting drift is still caught here by the equivalent"
            echo "AGENTS.md and README.md assertions, which need no policy and did run."
            echo "See docs/security-policy/README.md."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: cargo build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      # A throwaway key pair for this job alone, kept outside the checkout
      # and never committed. Every artifact the workspace build links embeds
      # its verifying key, and `xtask sign` signs with its signing key.
      - name: Integrity key pair (throwaway, CI only)
        run: |
          set -euo pipefail
          cargo build --release -p oxicrypt-integrity-sign
          target/release/oxicrypt-integrity-sign --keygen "$RUNNER_TEMP/integrity-key"
          echo "OXICRYPT_INTEGRITY_VERIFY_KEY=$RUNNER_TEMP/integrity-key/integrity-verify.pub" >> "$GITHUB_ENV"
          echo "INTEGRITY_SIGNING_KEY=$RUNNER_TEMP/integrity-key/integrity-signing.key" >> "$GITHUB_ENV"
      - run: cargo build --workspace --release

      # Building `oxi` is not the same as producing a runnable `oxi`. An
      # artifact that links the module must be signed after it is linked, and
      # nothing in cargo runs at that point — so a build that succeeds still
      # yields a binary that refuses to start. This exercises the one
      # implementation of build-then-sign, which a developer also calls locally,
      # so the two cannot drift. The release workflow signs with the same
      # signer through `scripts/release-sign.sh`, in each format's order (ELF
      # artifacts split and stripped first), then verifies and loads what it
      # ships.
      - name: Sign oxi, and prove it could not start unsigned
        run: |
          set -euo pipefail
          # The control first: without it, a signing step that silently did
          # nothing would look identical to one that worked, because the check
          # below would pass either way if the binary had been signed already.
          #
          # The existence test is part of the control, not throat-clearing. A
          # missing or non-executable binary also exits non-zero, so without it
          # the control reports "ok" for a binary it never ran — and `xtask sign`
          # would then build one, sign it, and the step would pass green having
          # tested nothing.
          test -x ./target/release/oxi
          if ./target/release/oxi --integrity; then
            echo "control FAILED: an unsigned oxi reported a passing integrity test" >&2
            exit 1
          fi
          echo "control ok: oxi exists, and unsigned it refuses to run"

          cargo xtask sign oxicrypt-cli --release --key "$INTEGRITY_SIGNING_KEY"
          ./target/release/oxi --integrity
          ./target/release/oxi hash sha256 /dev/null

  # The C ABI, exercised from C through the Makefile a contributor runs
  # locally. Every artifact that links the module must be signed after it is
  # linked: the signed copy of the cdylib, and each static-linked test
  # executable. The refusal test then runs against unsigned artifacts, so the
  # job also checks that an unsigned library refuses to initialise.
  #
  # Each make step runs whenever the build succeeded, so one run reports all
  # three rather than stopping at the first failure.
  c-integration:
    name: C integration tests (signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      # A throwaway key pair for this job alone, kept outside the checkout
      # and never committed. The library is built with its verifying key
      # embedded and the artifacts are signed with its signing key.
      - name: Integrity key pair (throwaway, CI only)
        run: |
          set -euo pipefail
          cargo build --release -p oxicrypt-integrity-sign
          target/release/oxicrypt-integrity-sign --keygen "$RUNNER_TEMP/integrity-key"
          echo "OXICRYPT_INTEGRITY_VERIFY_KEY=$RUNNER_TEMP/integrity-key/integrity-verify.pub" >> "$GITHUB_ENV"
          echo "INTEGRITY_SIGNING_KEY=$RUNNER_TEMP/integrity-key/integrity-signing.key" >> "$GITHUB_ENV"
      - id: build
        run: cargo build --release -p oxicrypt-ffi -p oxicrypt-integrity-sign
      - name: C tests against the signed cdylib
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make -C crates/oxicrypt-ffi/tests/c-integration SIGNING_KEY="$INTEGRITY_SIGNING_KEY" test-cdylib
      - name: C tests as signed static-linked executables
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make -C crates/oxicrypt-ffi/tests/c-integration SIGNING_KEY="$INTEGRITY_SIGNING_KEY" test-staticlib
      - name: Refusal test against unsigned artifacts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make -C crates/oxicrypt-ffi/tests/c-integration SIGNING_KEY="$INTEGRITY_SIGNING_KEY" test-unsigned

  # The release-build guard, on a second machine.
  #
  # `release_guard_delta_variance_persists` asserts that the jitter measurement
  # loop survives the optimizer: it builds in RELEASE, reads the live raw
  # counter, and requires the deltas not to have collapsed. nextest runs debug,
  # where the optimizer does nothing, so this cannot ride the test job.
  #
  # It is here rather than only in `pre-push` because it is a CODEGEN guard, and
  # codegen is precisely what differs between machines — a different CPU, a
  # different scheduler, different inlining. Run on exactly one host forever, it
  # tests one point of the space it is about.
  #
  # The bar is deliberately near the floor: `min_distinct_deltas` is 4, with a
  # hard floor of 4 that config cannot lower, so this fails on a COLLAPSE rather
  # than on a merely coarse clock. A virtualized counter clears it — that was
  # measured before this job was added.
  #
  # Known conflation, recorded rather than papered over: a host whose timer is
  # judged inadequate panics through the same arm as a genuine collapse, so an
  # environment verdict and a defect are indistinguishable in the output. If this
  # job ever goes red on a clean tree, that is the first thing to check, and the
  # fix is to split the arms rather than to weaken the assertion.
  release-guard:
    name: release-build jitter guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      # Fail closed on a zero-match filter: `cargo test <filter>` exits 0 with
      # "0 tests run" if the guard is renamed or feature-moved, which would
      # silently disable this job. Same guard as `pre-push [3/4c]`.
      - name: cargo test --release -p oxicrypt-entropy --features raw-counter release_guard
        run: |
          set -o pipefail
          guard_out="$(cargo test --release -p oxicrypt-entropy --features raw-counter release_guard 2>&1)"
          echo "$guard_out"
          echo "$guard_out" | grep -Eq "test result: ok\. [1-9][0-9]* passed" \
            || { echo "release_guard matched no passing tests" >&2; exit 1; }

  # LAMA manifest conformance (#175), with the guard sweep. The pre-push
  # hook runs the same script locally, but skips it when bun is absent and
  # no manifest changed, so this job, which runs on every pull request and
  # every push to main, is the gate of record for the guard sweep.
  #
  # Not a cargo step: it runs a vendored TypeScript linter, so it needs a
  # bun runtime rather than a toolchain. Deliberately NOT a doc-guard
  # test, which would have matched how other doc claims are asserted
  # here: that test would shell out to bun and make `cargo test` fail for
  # anyone without a JavaScript runtime, which is an unreasonable thing
  # to ask of someone building a Rust cryptographic library.
  #
  # bun is pinned. The linter is checksum-pinned against its upstream
  # provenance, and running a pinned tool on a floating runtime leaves
  # the result unpinned where it counts.
  lama:
    name: LAMA manifest conformance
    runs-on: ubuntu-latest
    steps:
      # Full history, so the baseline can be compared with its merge base
      # with origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: ./scripts/check-lama-manifests.sh
      # The script above also runs this control; repeating it as its own
      # step names the result in the job log. The sweep must fail on its
      # fixture, with exit 1, all twelve rejected functions named, and none of
      # the seven it must ignore (in comments and literals) counted.
      - name: guard sweep fails on its fixture
        run: |
          set +e
          out="$(bun scripts/check-lama-coverage.ts --guard-sweep scripts/fixtures/guard-sweep 12 2>&1)"
          status=$?
          set -e
          echo "$out"
          expected='guard sweep found 12 guarded function(s), expected 12; 12 without the guard first.'
          ok=true
          [[ $status -eq 1 && "$out" == *"$expected"* ]] || ok=false
          for name in derive_internal seal_internal expand_internal fixture_keygen_internal \
                      after_slash_internal paren_form_internal lifetime_internal abi_internal \
                      after_escaped_quote_internal spaced_bang_internal raw_ident_internal \
                      raw_gen_internal; do
            [[ "$out" == *" $name"* ]] || ok=false
          done
          for name in commented_keygen_internal nested_phantom_internal string_phantom_internal \
                      raw_phantom_internal commented_guarded_internal cstring_phantom_internal \
                      craw_phantom_internal; do
            [[ "$out" != *"$name"* ]] || ok=false
          done
          if [[ "$ok" != "true" ]]; then
            echo "the guard sweep did not fail on its fixture as expected (exit $status)" >&2
            exit 1
          fi

  acvp-evidence:
    name: ACVP evidence integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-acvp-evidence.py

  cast-vectors:
    name: CAST vector provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-cast-vectors.py
      - run: python3 tools/acvp-gen/test_merge_manifest.py

  # Non-default feature configs — the local pre-push hook tests
  # default features only, so this job is cloud CI's unique
  # coverage: the SHA-NI `accel-sha` dispatch/equivalence suites
  # among them. Runner hardware may
  # lack SHA-NI; the detection contract makes those tests
  # fail-portable, so the suite is meaningful either way.
  features:
    name: cargo test (feature matrix)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - crate: oxicrypt-sha
            flags: --features accel-sha
          - crate: oxicrypt-sha-accel
            flags: --all-features
          # oxicrypt-entropy's std/collection-gated surface (raw collection,
          # streaming dataset writer, sha256 manifest, resumable session) is
          # invisible to the default workspace gates, which build entropy with
          # default (no_std) features. --all-features = std + raw-counter +
          # collection, covering the whole std-gated surface.
          - crate: oxicrypt-entropy
            flags: --all-features
          # The `parallel` and `accel-keccak` builds of the post-quantum
          # crates are off by default, so no other job compiles or runs them.
          # Each crate's power-up self-test runs here on the parallel path,
          # whose workers carry the caller's self-test proof. The
          # `internal_state_guard` tests re-execute themselves one per
          # process, so plain `cargo test` isolates them as nextest does.
          - crate: oxicrypt-ml-kem
            flags: --features parallel
          - crate: oxicrypt-ml-dsa
            flags: --features parallel
          - crate: oxicrypt-ml-dsa
            flags: --features accel-keccak
          - crate: oxicrypt-ml-dsa
            flags: --features accel-keccak,parallel
          - crate: oxicrypt-slh-dsa
            flags: --features parallel
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ${{ matrix.crate }} --release ${{ matrix.flags }}
