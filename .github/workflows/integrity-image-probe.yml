# Design measurements for the pre-operational integrity test.
#
# NOT a gate. Measurements, kept in CI because the platforms they need are
# unavailable on the development machine: Mach-O and PE cannot be run there.
#
# Two jobs, answering two different questions. `probe` asks what the *loader*
# does to an image — which parts survive ASLR unchanged and still equal the file
# on disk. `codesign-extent` asks what the *signing tool* does to it, which
# matters because a Mach-O carries its header and load commands at the start of
# `__TEXT`, and `codesign` rewrites them. That question has been answered: it
# does, so the extent now begins at `__TEXT`'s first section and that job has
# become the regression gate proving a signed artifact still verifies.
# `authenticode-extent` asks the same of signtool on PE, and `android-extent`
# asks whether the technique holds on the platform the workstream exists for.
# Each job documents itself where it is defined.
#
# What it establishes per platform: which parts of the loaded module are
# identical across runs despite ASLR, and whether those parts equal the file
# bytes on disk. A region satisfying both can be hashed from the file at build
# time and re-hashed from memory at runtime — which is how the integrity test
# survives a platform that rewrites or encrypts the file after signing.
#
# The linux-x86_64 leg is the harness control: it must reproduce the figure
# already measured locally (99.03% stable, all of it matching the file). If it
# does not, the numbers from the same harness on other platforms are not to be
# trusted.
#
# Windows uses a separate Rust probe rather than the C one, for two reasons: the
# Rust toolchain is already installed on the runner while a C compiler needs the
# MSVC environment set up, and PE additionally needs its base relocation table
# parsed. ELF PIC and Mach-O chained fixups leave the code segment untouched,
# which is why hashing it works there; PE relocations can target `.text`
# directly, so the Windows probe reports which sections the fixups land in and
# answers that outright instead of inferring it from hash stability.
#
# Runner labels age out. `macos-13` was retired mid-life in this repo and a job
# using it queued for over two hours rather than failing, so every job here
# carries an explicit timeout — a retired label must surface as a timeout, not
# as apparent scarcity. Check https://github.com/actions/runner-images before
# assuming a queued macOS job is merely waiting.
name: integrity image probe

# A push runs the gate alone. The stability probe re-measures ground that is
# already settled, on runners billed at ten times the Linux rate, and it took
# every push to this branch with it — so it is now opt-in and the gate, which
# has to run on every change to the extent, is what a push triggers.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: which jobs to run
        default: gate
        type: choice
        options:
          - gate
          - probe
          - all
  push:
    branches:
      - 'measure/integrity-image-**'

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.name }}
    # Opt-in: this measured the loaded image once and the answer has not moved.
    if: github.event_name == 'workflow_dispatch' && (inputs.jobs == 'probe' || inputs.jobs == 'all')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # One platform failing must not suppress the others; a partial matrix
      # that names what is missing beats no measurement at all.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            cdylib: liboxicrypt_ffi.so
            ldflags: '-ldl'
            probe: c
          - name: macos-aarch64
            runner: macos-15
            cdylib: liboxicrypt_ffi.dylib
            ldflags: ''
            probe: c
          - name: macos-x86_64
            runner: macos-15-intel
            cdylib: liboxicrypt_ffi.dylib
            ldflags: ''
            probe: c
          - name: windows-x86_64
            runner: windows-latest
            cdylib: oxicrypt_ffi.dll
            ldflags: ''
            probe: rust

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install

      # No rust-cache here deliberately: `Swatinem/rust-cache` failed to download
      # with HTTP 429 on two separate runs of this workflow, taking otherwise
      # healthy legs with it. A one-off measurement does not need the cache, and a
      # non-load-bearing action must not be able to fail the job.

      - name: Build the cdylib
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p oxicrypt-ffi
          ls -l "target/release/${{ matrix.cdylib }}"

      - name: Compile the probe — C (ELF / Mach-O)
        if: matrix.probe == 'c'
        shell: bash
        run: |
          set -euo pipefail
          cc -O1 -Wall -Wextra -o probe \
            .github/probes/image-stability-probe.c ${{ matrix.ldflags }}

      - name: Compile the probe — Rust (PE)
        if: matrix.probe == 'rust'
        shell: bash
        run: |
          set -euo pipefail
          rustc -O -o probe.exe .github/probes/win-image-stability-probe.rs

      - name: Measure — 20 runs under ASLR
        shell: bash
        run: |
          set -euo pipefail
          LIB="$PWD/target/release/${{ matrix.cdylib }}"
          PROBE=./probe
          if [ -f ./probe.exe ]; then
            PROBE=./probe.exe
            # LoadLibraryA cannot take a Git Bash path; hand it a native one.
            LIB="$(cygpath -w "$LIB")"
          fi
          : > runs.txt
          for i in $(seq 1 20); do
            "$PROBE" "$LIB" | sed "s/^/run$i /" >> runs.txt
          done
          echo "recorded $(grep -c LOADBASE runs.txt) runs"

      - name: Analyse — fails if either positive control does not hold
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/probes/analyse.py < runs.txt | tee analysis.txt
          # analyse.py exits non-zero when a control fails; `set -o pipefail`
          # plus tee would report tee's status, so read the real one.
          exit "${PIPESTATUS[0]}"

      - name: Relocation findings (PE only)
        if: always() && matrix.probe == 'rust'
        shell: bash
        run: |
          set -euo pipefail
          # The structural question for PE, answered by parsing .reloc rather
          # than inferred from hash stability.
          grep -E '^run1 (RELOC|IMAGEBASE)' runs.txt | sed 's/^run1 //' | tee -a analysis.txt

      - name: Record the platform's own view of the image
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LIB="$PWD/target/release/${{ matrix.cdylib }}"
          echo "== file size ==" | tee -a analysis.txt
          wc -c < "$LIB" | tee -a analysis.txt
          echo "== segments/sections as the platform reports them ==" | tee -a analysis.txt
          if command -v otool >/dev/null 2>&1; then
            otool -l "$LIB" | grep -A5 -E 'LC_SEGMENT_64|LC_DYLD_CHAINED_FIXUPS|LC_ENCRYPTION' \
              | tee -a analysis.txt || true
          elif command -v readelf >/dev/null 2>&1; then
            readelf -lW "$LIB" | tee -a analysis.txt || true
          else
            echo "(no otool/readelf; the PE probe prints its own section table)" \
              | tee -a analysis.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrity-image-probe-${{ matrix.name }}
          path: |
            runs.txt
            analysis.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Does `codesign` disturb the extent the signer recorded?
  #
  # The stability probe above answers what the *loader* does to an image. This
  # answers what the *signing tool* does to it, which is a different question and
  # the one that decides whether Darwin can carry the design at all: the extent
  # is `__TEXT`, and a Mach-O's header and load commands live at the start of
  # `__TEXT`. If `codesign` adds an `LC_CODE_SIGNATURE` command it writes inside
  # the very region the MAC covers, and a signature applied after signing would
  # invalidate it.
  #
  # The measurement uses the real signer rather than a stand-in, so what is
  # measured is the mechanism that ships. It reports rather than fails on the
  # answer itself — an extent that moves is a finding, not a broken build — but
  # it does fail if either control does not hold, because a run whose controls
  # are dead says nothing in either direction.
  #
  # `codesign -s -` is ad-hoc signing: no certificate, no Apple account, no
  # enrolment. It is the same code path a real identity takes for everything this
  # measurement observes.
  codesign-extent:
    name: codesign-extent-${{ matrix.name }}
    # The regression gate on the Darwin extent, so a push must run it.
    if: github.event_name == 'push' || inputs.jobs == 'gate' || inputs.jobs == 'all'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            runner: macos-15
          - name: macos-x86_64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install

      - name: Build the cdylib and the signer
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p oxicrypt-ffi -p oxicrypt-integrity-sign
          cp target/release/liboxicrypt_ffi.dylib subject.dylib
          ls -l subject.dylib

      - name: Record the extent, then sign — CONTROL, must verify
        shell: bash
        run: |
          set -euo pipefail
          SIGN=target/release/oxicrypt-integrity-sign
          "$SIGN" --show subject.dylib | tee before-show.txt
          "$SIGN" --sign subject.dylib | tee sign.txt
          # If this does not pass, nothing below distinguishes "codesign broke
          # the extent" from "the extent was never right on this platform".
          "$SIGN" --verify subject.dylib
          echo "control ok: the artifact verifies before codesign runs"
          shasum -a 256 subject.dylib | tee before-sha.txt
          otool -l subject.dylib > before-otool.txt
          grep -c LC_CODE_SIGNATURE before-otool.txt || true

      - name: Ad-hoc sign — CONTROL, codesign must actually change the file
        shell: bash
        run: |
          set -euo pipefail
          # Kept so the answer step can say *which* bytes moved, not merely that
          # the verdict changed. "codesign broke it" and "codesign rewrote the
          # load commands and nothing else" call for different remedies.
          cp subject.dylib before.dylib
          codesign --force --sign - --timestamp=none subject.dylib
          codesign -dv subject.dylib 2>&1 | tee codesign-dv.txt
          shasum -a 256 subject.dylib | tee after-sha.txt
          # A codesign that no-opped would leave the artifact verifying and the
          # measurement would read as "codesign is harmless" without codesign
          # having done anything.
          if cmp -s <(cut -d' ' -f1 before-sha.txt) <(cut -d' ' -f1 after-sha.txt); then
            echo "control FAILED: codesign left the file byte-identical" >&2
            exit 1
          fi
          echo "control ok: codesign changed the file"

      - name: THE GATE — a signed artifact must still verify
        shell: bash
        run: |
          set -euo pipefail
          SIGN=target/release/oxicrypt-integrity-sign
          otool -l subject.dylib > after-otool.txt
          set +e
          "$SIGN" --verify subject.dylib > verify-after.txt 2>&1
          VERIFY_EXIT=$?
          "$SIGN" --show subject.dylib > after-show.txt 2>&1
          set -e
          echo "verify_after_codesign_exit=$VERIFY_EXIT" | tee answer.txt
          # Read from the file rather than from $? after the pipeline above:
          # `tee` succeeds regardless of what the signer decided.
          cat verify-after.txt

          echo "--- what codesign changed ---" | tee -a answer.txt
          echo "LC_CODE_SIGNATURE before: $(grep -c LC_CODE_SIGNATURE before-otool.txt || true)" | tee -a answer.txt
          echo "LC_CODE_SIGNATURE after:  $(grep -c LC_CODE_SIGNATURE after-otool.txt || true)" | tee -a answer.txt
          echo "--- __TEXT segment, before ---" | tee -a answer.txt
          grep -A 6 'segname __TEXT' before-otool.txt | head -12 | tee -a answer.txt
          echo "--- __TEXT segment, after ---" | tee -a answer.txt
          grep -A 6 'segname __TEXT' after-otool.txt | head -12 | tee -a answer.txt
          echo "--- extent, before vs after ---" | tee -a answer.txt
          diff before-show.txt after-show.txt || true

          echo "--- which bytes codesign rewrote ---" | tee -a answer.txt
          # The remedy depends on where the changes land. The Mach-O header and
          # load-command table sit at the start of __TEXT, ahead of the first
          # section, and they record __LINKEDIT's size — which every signature
          # changes. If every rewritten byte lies before the first section's
          # offset, an extent starting there instead of at the segment start
          # would survive codesign, and the design has a fix rather than a wall.
          FIRST_SECTION=$(awk '/segname __TEXT/{f=1} f&&/^ *offset /{print $2; exit}' after-otool.txt)
          TEXT_FILESIZE=$(awk '/segname __TEXT/{f=1} f&&/^ *filesize /{print $2; exit}' after-otool.txt)
          echo "first __TEXT section begins at file offset ${FIRST_SECTION}" | tee -a answer.txt
          echo "__TEXT spans file bytes 0..${TEXT_FILESIZE}" | tee -a answer.txt
          python3 - "$FIRST_SECTION" "$TEXT_FILESIZE" <<'PY' | tee -a answer.txt
          import sys
          first = int(sys.argv[1])
          text_end = int(sys.argv[2])
          a = open("before.dylib", "rb").read()
          b = open("subject.dylib", "rb").read()
          # Bounded to __TEXT deliberately. Comparing whole files answers a
          # different question: __LINKEDIT follows __TEXT and grows by the
          # signature, so every byte from its start onward differs for reasons
          # that have nothing to do with the extent. Only __TEXT is hashed, so
          # only __TEXT decides whether a narrower extent would survive.
          n = min(len(a), len(b), text_end)
          diffs = [i for i in range(n) if a[i] != b[i]]
          print(f"file length: {len(a)} -> {len(b)}; compared __TEXT bytes 0..{n}")
          if not diffs:
              print("no byte inside __TEXT changed")
          else:
              before_first = [i for i in diffs if i < first]
              after_first = [i for i in diffs if i >= first]
              print(f"changed bytes inside __TEXT: {len(diffs)}")
              print(f"  before the first section (header + load commands): {len(before_first)}")
              print(f"  at or after the first section:                     {len(after_first)}")
              print(f"  first changed offset: {diffs[0]}, last: {diffs[-1]}")
              if not after_first:
                  print("VERDICT: every rewritten byte is header or load-command data.")
                  print("An extent beginning at the first section would survive codesign.")
              else:
                  print("VERDICT: codesign rewrote bytes inside the sections themselves;")
                  print(f"  the first such offset is {after_first[0]}.")
          PY

          if [ "$VERIFY_EXIT" -eq 0 ]; then
            echo "RESULT: codesign does NOT disturb the recorded extent on ${{ matrix.name }}" | tee -a answer.txt
          else
            # This was a report while the question was open. It is a failure now:
            # the extent excludes the header and load commands precisely so that
            # this passes, and nothing else in the suite can see a regression —
            # neither macOS nor codesign exists on the machines that run the
            # gates, so this job is the only place the claim can be tested.
            echo "RESULT: codesign DISTURBS the recorded extent on ${{ matrix.name }}." | tee -a answer.txt
            echo "The Darwin extent begins at __TEXT's first section so that it does not." | tee -a answer.txt
            echo "Either the exclusion regressed, or codesign now rewrites bytes inside the" | tee -a answer.txt
            echo "sections themselves — the byte report above says which." | tee -a answer.txt
            exit 1
          fi

      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codesign-extent-${{ matrix.name }}
          path: |
            before-show.txt
            after-show.txt
            sign.txt
            verify-after.txt
            answer.txt
            codesign-dv.txt
            before-otool.txt
            after-otool.txt
          if-no-files-found: error

  authenticode-extent:
    name: authenticode-extent-windows-x86_64
    # The PE counterpart of codesign-extent, and open where that one is settled.
    # Structurally PE is not the Mach-O problem: its headers are not part of any
    # section, so `.text` — the only section in the extent — sits above them, and
    # Authenticode writes the certificate-table directory entry and the checksum
    # inside the optional header, both below where `.text` begins. That is an
    # argument from layout, not a measurement, and this class has already been
    # reasoned about wrongly twice. So it reports rather than gates until a run
    # says what actually happens.
    if: github.event_name == 'push' || inputs.jobs == 'gate' || inputs.jobs == 'all'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install

      - name: Build the cdylib and the signer
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p oxicrypt-ffi -p oxicrypt-integrity-sign
          cp target/release/oxicrypt_ffi.dll subject.dll
          ls -l subject.dll

      - name: Record the extent, then sign — CONTROL, must verify
        shell: bash
        run: |
          set -euo pipefail
          SIGN=target/release/oxicrypt-integrity-sign.exe
          "$SIGN" --show subject.dll | tee before-show.txt
          "$SIGN" --sign subject.dll | tee sign.txt
          # Without this, a later failure cannot be told apart from an extent
          # that was never right on this platform.
          "$SIGN" --verify subject.dll
          echo "control ok: the artifact verifies before signtool runs"
          cp subject.dll before.dll

      - name: Locate signtool — CONTROL, it must exist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'x64\signtool.exe') } |
            Sort-Object Name -Descending | Select-Object -First 1
          # A missing signtool must stop the run. Skipping the signing step and
          # reporting "the extent survived" would be a measurement of nothing.
          if (-not $sdk) { throw 'control FAILED: no signtool.exe under the Windows 10 SDK' }
          $signtool = Join-Path $sdk.FullName 'x64\signtool.exe'
          Write-Output "signtool: $signtool"
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Authenticode sign — CONTROL, signtool must change the file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject 'CN=oxicrypt extent measurement' `
            -CertStoreLocation Cert:\CurrentUser\My
          & $env:SIGNTOOL sign /fd SHA256 /sha1 $cert.Thumbprint subject.dll
          if ($LASTEXITCODE -ne 0) { throw "control FAILED: signtool exited $LASTEXITCODE" }
          $before = (Get-FileHash before.dll -Algorithm SHA256).Hash
          $after  = (Get-FileHash subject.dll -Algorithm SHA256).Hash
          Write-Output "before: $before"
          Write-Output "after:  $after"
          # A signtool that no-opped would leave the artifact verifying and the
          # measurement would read as "Authenticode is harmless" without
          # Authenticode having done anything.
          if ($before -eq $after) { throw 'control FAILED: signtool left the file byte-identical' }
          Write-Output 'control ok: signtool changed the file'

      - name: THE ANSWER — does the recorded extent still verify?
        shell: bash
        run: |
          set -euo pipefail
          SIGN=target/release/oxicrypt-integrity-sign.exe
          set +e
          "$SIGN" --verify subject.dll > verify-after.txt 2>&1
          VERIFY_EXIT=$?
          "$SIGN" --show subject.dll > after-show.txt 2>&1
          set -e
          echo "verify_after_signtool_exit=$VERIFY_EXIT" | tee answer.txt
          cat verify-after.txt

          echo "--- extent, before vs after ---" | tee -a answer.txt
          diff before-show.txt after-show.txt || true

          echo "--- which bytes signtool rewrote ---" | tee -a answer.txt
          # Bounded to `.text`, for the reason the Mach-O leg learned the hard
          # way: everything outside the hashed region differs for reasons that
          # say nothing about the extent, and counting those bytes produced a
          # false platform finding once already.
          # The runner image spells Python either way depending on the release;
          # resolving it here beats a step that fails on a name.
          PYBIN="$(command -v python3 || command -v python)"
          "$PYBIN" - <<'PY' | tee -a answer.txt
          import struct

          a = open("before.dll", "rb").read()
          b = open("subject.dll", "rb").read()

          def text_section(img):
              pe = struct.unpack_from("<I", img, 0x3c)[0]
              assert img[pe:pe + 4] == b"PE\0\0", "not a PE image"
              nsec = struct.unpack_from("<H", img, pe + 6)[0]
              optsize = struct.unpack_from("<H", img, pe + 20)[0]
              table = pe + 24 + optsize
              for i in range(nsec):
                  e = table + i * 40
                  name = img[e:e + 8].rstrip(b"\0").decode("ascii", "replace")
                  vsize, _rva, rawsize, rawptr = struct.unpack_from("<IIII", img, e + 8)
                  if name == ".text":
                      return rawptr, min(vsize, rawsize)
              raise AssertionError(".text not found")

          off, size = text_section(a)
          off_b, size_b = text_section(b)
          print(f"file length: {len(a)} -> {len(b)}")
          print(f".text file bytes {off}..{off + size} before, {off_b}..{off_b + size_b} after")
          if (off, size) != (off_b, size_b):
              print("VERDICT: signtool MOVED or RESIZED .text; the extent's file offsets are stale.")
          diffs = [i for i in range(off, off + size) if a[i] != b[i]]
          if not diffs:
              print("no byte inside .text changed")
              print("VERDICT: Authenticode leaves the hashed region untouched.")
          else:
              print(f"changed bytes inside .text: {len(diffs)}")
              print(f"  first changed offset: {diffs[0]}, last: {diffs[-1]}")
              print("VERDICT: Authenticode rewrote bytes inside the extent.")
          # Where the changes do land, for the record.
          n = min(len(a), len(b))
          outside = [i for i in range(n) if a[i] != b[i] and not (off <= i < off + size)]
          print(f"changed bytes elsewhere in the common prefix: {len(outside)}"
                + (f", first at {outside[0]}" if outside else ""))
          PY

          if [ "$VERIFY_EXIT" -eq 0 ]; then
            echo "RESULT: Authenticode does NOT disturb the recorded extent on windows-x86_64" | tee -a answer.txt
          else
            echo "RESULT: Authenticode DOES disturb the recorded extent on windows-x86_64." | tee -a answer.txt
            echo "This is a finding about the design, not a build failure. The byte report above" | tee -a answer.txt
            echo "says whether a narrower extent would survive, as it did on Darwin." | tee -a answer.txt
          fi

      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticode-extent-windows-x86_64
          path: |
            before-show.txt
            after-show.txt
            verify-after.txt
            answer.txt
          if-no-files-found: warn

  android-extent:
    name: android-extent-${{ matrix.abi }}
    # Android is the platform this whole workstream exists because of: a CMVP
    # resubmission elsewhere is gated on not being able to integrity-test there.
    # So it is measured rather than argued from ELF being ELF.
    #
    # What this leg establishes: an Android ELF classifies, signs and verifies
    # with the shipping signer, and the regions the extent covers are identical
    # across runs under ASLR and equal to the file on disk — the two properties
    # the whole technique rests on.
    #
    # What it does NOT establish, stated because the gap is easy to miss. This
    # runs a native executable in an emulator, so it says nothing about (a) an
    # app process, (b) a library mapped from inside an APK with
    # extractNativeLibs=false, where /proc/self/maps reports offsets relative to
    # the APK rather than to the ELF, or (c) arm64, where packed relative
    # relocations change how many pointers land in .data.rel.ro. Each needs its
    # own measurement and none of them is claimed here.
    if: github.event_name == 'push' || inputs.jobs == 'gate' || inputs.jobs == 'all'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # arm64 is the architecture Android actually ships on, and it packs
      # relative relocations differently, so its coverage figure is its own
      # measurement rather than the x86_64 one restated. One ABI failing must
      # not suppress the other.
      fail-fast: false
      matrix:
        include:
          - abi: x86_64
            runner: ubuntu-latest
            target: x86_64-linux-android
            clang: x86_64-linux-android24-clang
            elf: 'ELF 64-bit LSB shared object, x86-64'
            emulator: true
          - abi: arm64-v8a
            # Offline only, and the split is forced rather than chosen.
            # `ubuntu-24.04-arm` exists but its image ships no Android NDK, and
            # the NDK's host toolchain is published for x86_64 hosts — so the
            # arm64 artifact is cross-built here, where the NDK is, while an
            # arm64 emulator would need an arm64 host to reach KVM.
            #
            # What that costs is precise: the extent, its coverage and its range
            # layout are measured for arm64; whether the loaded image matches
            # the file is NOT, and no line below claims it does. Closing that
            # needs a physical arm64 device.
            runner: ubuntu-latest
            target: aarch64-linux-android
            clang: aarch64-linux-android24-clang
            elf: 'ELF 64-bit LSB shared object, ARM aarch64'
            emulator: false

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain and the Android target
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Locate the NDK — CONTROL, it must exist
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          # A missing NDK must stop the run. Falling through to a host build and
          # reporting "the extent is stable" would be a measurement of Linux.
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "control FAILED: no Android NDK on this runner" >&2
            exit 1
          fi
          # The prebuilt directory is named for the HOST, which is not the
          # target ABI and differs on an arm64 runner.
          BIN=""
          for host in linux-x86_64 linux-aarch64 linux-arm64; do
            if [ -d "$NDK/toolchains/llvm/prebuilt/$host/bin" ]; then
              BIN="$NDK/toolchains/llvm/prebuilt/$host/bin"
              break
            fi
          done
          if [ -z "$BIN" ]; then
            echo "control FAILED: no prebuilt toolchain directory under $NDK" >&2
            ls "$NDK/toolchains/llvm/prebuilt" >&2 || true
            exit 1
          fi
          CLANG="$BIN/${{ matrix.clang }}"
          if [ ! -x "$CLANG" ]; then
            echo "control FAILED: no ${{ matrix.clang }} at $CLANG" >&2
            ls "$BIN" | head -40 >&2
            exit 1
          fi
          echo "NDK_CLANG=$CLANG" >> "$GITHUB_ENV"
          echo "ndk: $NDK"

      - name: Build the cdylib for Android and the signer for the host
        shell: bash
        run: |
          set -euo pipefail
          TARGET='${{ matrix.target }}'
          UPPER="$(echo "$TARGET" | tr 'a-z-' 'A-Z_')"
          LOWER="$(echo "$TARGET" | tr '-' '_')"
          export "CC_${LOWER}=$NDK_CLANG"
          export "AR_${LOWER}=$(dirname "$NDK_CLANG")/llvm-ar"
          export "CARGO_TARGET_${UPPER}_LINKER=$NDK_CLANG"
          cargo build --release -p oxicrypt-ffi --target "$TARGET"
          cargo build --release -p oxicrypt-integrity-sign
          cp "target/$TARGET/release/liboxicrypt_ffi.so" subject.so
          file subject.so
          # The artifact must really be an Android build for THIS ABI, not a
          # host build that happened to land in that directory.
          if ! file subject.so | grep -q '${{ matrix.elf }}'; then
            echo "control FAILED: subject.so is not ${{ matrix.elf }}" >&2
            exit 1
          fi

      - name: Classify, sign and verify the Android artifact — CONTROL
        shell: bash
        run: |
          set -euo pipefail
          SIGN=target/release/oxicrypt-integrity-sign
          # The first question is whether the shipping classifier handles an
          # Android ELF at all. If it does not, nothing measured below matters.
          "$SIGN" --show subject.so | tee android-show.txt
          "$SIGN" --sign subject.so | tee android-sign.txt
          "$SIGN" --verify subject.so
          echo "control ok: an Android ELF classifies, signs and verifies offline"

      - name: Compile the stability probe with the NDK
        if: matrix.emulator
        shell: bash
        run: |
          set -euo pipefail
          "$NDK_CLANG" -O1 -Wall -Wextra -o probe .github/probes/image-stability-probe.c -ldl
          file probe

      - name: Enable KVM
        if: matrix.emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Measure on the emulator — 20 runs under ASLR
        if: matrix.emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: ${{ matrix.abi }}
          target: google_apis
          disable-animations: true
          # ONE command. The action runs this input a line at a time, each in
          # its own `/usr/bin/sh -c`, so a multi-line loop is split across
          # shells and dies with a syntax error; that shell is also dash, which
          # has no `pipefail`. The driver is a file for both reasons.
          script: bash .github/probes/android-measure.sh runs.txt 20

      - name: Analyse — fails if either positive control does not hold
        if: matrix.emulator
        shell: bash
        run: |
          set -euo pipefail
          # An emulator step that produced nothing reads exactly like a clean
          # run once the analyser is handed an empty file, so assert first.
          RUNS=$(grep -c LOADBASE runs.txt || true)
          echo "recorded ${RUNS} runs"
          if [ "$RUNS" -ne 20 ]; then
            echo "control FAILED: expected 20 runs, got ${RUNS}" >&2
            exit 1
          fi
          python3 .github/probes/analyse.py < runs.txt | tee android-analysis.txt
          exit "${PIPESTATUS[0]}"

      - name: Record the platform's own view of the image
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "== the extent the signer recorded ==" | tee -a android-analysis.txt
          cat android-show.txt | tee -a android-analysis.txt
          if [ "${{ matrix.emulator }}" != "true" ]; then
            echo "== NOT MEASURED on this ABI ==" | tee -a android-analysis.txt
            echo "loaded-image stability requires an arm64 host or a device." \
              | tee -a android-analysis.txt
          fi
          echo "== program headers ==" | tee -a android-analysis.txt
          readelf -lW subject.so | tee -a android-analysis.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-extent-${{ matrix.abi }}
          path: |
            runs.txt
            android-show.txt
            android-analysis.txt
          if-no-files-found: warn

