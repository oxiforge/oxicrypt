# Design measurements for the pre-operational integrity test.
#
# NOT a gate. Measurements, kept in CI because the platforms they need are
# unavailable on the development machine: Mach-O and PE cannot be run there.
#
# Two jobs, answering two different questions. `probe` asks what the *loader*
# does to an image — which parts survive ASLR unchanged and still equal the file
# on disk. `codesign-extent` asks what the *signing tool* does to it, which
# matters because the Darwin extent is `__TEXT` and a Mach-O carries its header
# and load commands at the start of `__TEXT`; a signature that adds a load
# command writes inside the region the MAC covers. Each job documents itself
# where it is defined.
#
# What it establishes per platform: which parts of the loaded module are
# identical across runs despite ASLR, and whether those parts equal the file
# bytes on disk. A region satisfying both can be hashed from the file at build
# time and re-hashed from memory at runtime — which is how the integrity test
# survives a platform that rewrites or encrypts the file after signing.
#
# The linux-x86_64 leg is the harness control: it must reproduce the figure
# already measured locally (99.03% stable, all of it matching the file). If it
# does not, the numbers from the same harness on other platforms are not to be
# trusted.
#
# Windows uses a separate Rust probe rather than the C one, for two reasons: the
# Rust toolchain is already installed on the runner while a C compiler needs the
# MSVC environment set up, and PE additionally needs its base relocation table
# parsed. ELF PIC and Mach-O chained fixups leave the code segment untouched,
# which is why hashing it works there; PE relocations can target `.text`
# directly, so the Windows probe reports which sections the fixups land in and
# answers that outright instead of inferring it from hash stability.
#
# Runner labels age out. `macos-13` was retired mid-life in this repo and a job
# using it queued for over two hours rather than failing, so every job here
# carries an explicit timeout — a retired label must surface as a timeout, not
# as apparent scarcity. Check https://github.com/actions/runner-images before
# assuming a queued macOS job is merely waiting.
name: integrity image probe

on:
  workflow_dispatch:
  push:
    branches:
      - 'measure/integrity-image-**'

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # One platform failing must not suppress the others; a partial matrix
      # that names what is missing beats no measurement at all.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            cdylib: liboxicrypt_ffi.so
            ldflags: '-ldl'
            probe: c
          - name: macos-aarch64
            runner: macos-15
            cdylib: liboxicrypt_ffi.dylib
            ldflags: ''
            probe: c
          - name: macos-x86_64
            runner: macos-15-intel
            cdylib: liboxicrypt_ffi.dylib
            ldflags: ''
            probe: c
          - name: windows-x86_64
            runner: windows-latest
            cdylib: oxicrypt_ffi.dll
            ldflags: ''
            probe: rust

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install

      # No rust-cache here deliberately: `Swatinem/rust-cache` failed to download
      # with HTTP 429 on two separate runs of this workflow, taking otherwise
      # healthy legs with it. A one-off measurement does not need the cache, and a
      # non-load-bearing action must not be able to fail the job.

      - name: Build the cdylib
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p oxicrypt-ffi
          ls -l "target/release/${{ matrix.cdylib }}"

      - name: Compile the probe — C (ELF / Mach-O)
        if: matrix.probe == 'c'
        shell: bash
        run: |
          set -euo pipefail
          cc -O1 -Wall -Wextra -o probe \
            .github/probes/image-stability-probe.c ${{ matrix.ldflags }}

      - name: Compile the probe — Rust (PE)
        if: matrix.probe == 'rust'
        shell: bash
        run: |
          set -euo pipefail
          rustc -O -o probe.exe .github/probes/win-image-stability-probe.rs

      - name: Measure — 20 runs under ASLR
        shell: bash
        run: |
          set -euo pipefail
          LIB="$PWD/target/release/${{ matrix.cdylib }}"
          PROBE=./probe
          if [ -f ./probe.exe ]; then
            PROBE=./probe.exe
            # LoadLibraryA cannot take a Git Bash path; hand it a native one.
            LIB="$(cygpath -w "$LIB")"
          fi
          : > runs.txt
          for i in $(seq 1 20); do
            "$PROBE" "$LIB" | sed "s/^/run$i /" >> runs.txt
          done
          echo "recorded $(grep -c LOADBASE runs.txt) runs"

      - name: Analyse — fails if either positive control does not hold
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/probes/analyse.py < runs.txt | tee analysis.txt
          # analyse.py exits non-zero when a control fails; `set -o pipefail`
          # plus tee would report tee's status, so read the real one.
          exit "${PIPESTATUS[0]}"

      - name: Relocation findings (PE only)
        if: always() && matrix.probe == 'rust'
        shell: bash
        run: |
          set -euo pipefail
          # The structural question for PE, answered by parsing .reloc rather
          # than inferred from hash stability.
          grep -E '^run1 (RELOC|IMAGEBASE)' runs.txt | sed 's/^run1 //' | tee -a analysis.txt

      - name: Record the platform's own view of the image
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LIB="$PWD/target/release/${{ matrix.cdylib }}"
          echo "== file size ==" | tee -a analysis.txt
          wc -c < "$LIB" | tee -a analysis.txt
          echo "== segments/sections as the platform reports them ==" | tee -a analysis.txt
          if command -v otool >/dev/null 2>&1; then
            otool -l "$LIB" | grep -A5 -E 'LC_SEGMENT_64|LC_DYLD_CHAINED_FIXUPS|LC_ENCRYPTION' \
              | tee -a analysis.txt || true
          elif command -v readelf >/dev/null 2>&1; then
            readelf -lW "$LIB" | tee -a analysis.txt || true
          else
            echo "(no otool/readelf; the PE probe prints its own section table)" \
              | tee -a analysis.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrity-image-probe-${{ matrix.name }}
          path: |
            runs.txt
            analysis.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Does `codesign` disturb the extent the signer recorded?
  #
  # The stability probe above answers what the *loader* does to an image. This
  # answers what the *signing tool* does to it, which is a different question and
  # the one that decides whether Darwin can carry the design at all: the extent
  # is `__TEXT`, and a Mach-O's header and load commands live at the start of
  # `__TEXT`. If `codesign` adds an `LC_CODE_SIGNATURE` command it writes inside
  # the very region the MAC covers, and a signature applied after signing would
  # invalidate it.
  #
  # The measurement uses the real signer rather than a stand-in, so what is
  # measured is the mechanism that ships. It reports rather than fails on the
  # answer itself — an extent that moves is a finding, not a broken build — but
  # it does fail if either control does not hold, because a run whose controls
  # are dead says nothing in either direction.
  #
  # `codesign -s -` is ad-hoc signing: no certificate, no Apple account, no
  # enrolment. It is the same code path a real identity takes for everything this
  # measurement observes.
  codesign-extent:
    name: codesign-extent-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            runner: macos-15
          - name: macos-x86_64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install

      - name: Build the cdylib and the signer
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p oxicrypt-ffi -p oxicrypt-integrity-sign
          cp target/release/liboxicrypt_ffi.dylib subject.dylib
          ls -l subject.dylib

      - name: Record the extent, then sign — CONTROL, must verify
        shell: bash
        run: |
          set -euo pipefail
          SIGN=target/release/oxicrypt-integrity-sign
          "$SIGN" --show subject.dylib | tee before-show.txt
          "$SIGN" --sign subject.dylib | tee sign.txt
          # If this does not pass, nothing below distinguishes "codesign broke
          # the extent" from "the extent was never right on this platform".
          "$SIGN" --verify subject.dylib
          echo "control ok: the artifact verifies before codesign runs"
          shasum -a 256 subject.dylib | tee before-sha.txt
          otool -l subject.dylib > before-otool.txt
          grep -c LC_CODE_SIGNATURE before-otool.txt || true

      - name: Ad-hoc sign — CONTROL, codesign must actually change the file
        shell: bash
        run: |
          set -euo pipefail
          # Kept so the answer step can say *which* bytes moved, not merely that
          # the verdict changed. "codesign broke it" and "codesign rewrote the
          # load commands and nothing else" call for different remedies.
          cp subject.dylib before.dylib
          codesign --force --sign - --timestamp=none subject.dylib
          codesign -dv subject.dylib 2>&1 | tee codesign-dv.txt
          shasum -a 256 subject.dylib | tee after-sha.txt
          # A codesign that no-opped would leave the artifact verifying and the
          # measurement would read as "codesign is harmless" without codesign
          # having done anything.
          if cmp -s <(cut -d' ' -f1 before-sha.txt) <(cut -d' ' -f1 after-sha.txt); then
            echo "control FAILED: codesign left the file byte-identical" >&2
            exit 1
          fi
          echo "control ok: codesign changed the file"

      - name: THE ANSWER — does the recorded extent still verify?
        shell: bash
        run: |
          set -euo pipefail
          SIGN=target/release/oxicrypt-integrity-sign
          otool -l subject.dylib > after-otool.txt
          set +e
          "$SIGN" --verify subject.dylib > verify-after.txt 2>&1
          VERIFY_EXIT=$?
          "$SIGN" --show subject.dylib > after-show.txt 2>&1
          set -e
          echo "verify_after_codesign_exit=$VERIFY_EXIT" | tee answer.txt
          cat verify-after.txt

          echo "--- what codesign changed ---" | tee -a answer.txt
          echo "LC_CODE_SIGNATURE before: $(grep -c LC_CODE_SIGNATURE before-otool.txt || true)" | tee -a answer.txt
          echo "LC_CODE_SIGNATURE after:  $(grep -c LC_CODE_SIGNATURE after-otool.txt || true)" | tee -a answer.txt
          echo "--- __TEXT segment, before ---" | tee -a answer.txt
          grep -A 6 'segname __TEXT' before-otool.txt | head -12 | tee -a answer.txt
          echo "--- __TEXT segment, after ---" | tee -a answer.txt
          grep -A 6 'segname __TEXT' after-otool.txt | head -12 | tee -a answer.txt
          echo "--- extent, before vs after ---" | tee -a answer.txt
          diff before-show.txt after-show.txt || true

          echo "--- which bytes codesign rewrote ---" | tee -a answer.txt
          # The remedy depends on where the changes land. The Mach-O header and
          # load-command table sit at the start of __TEXT, ahead of the first
          # section, and they record __LINKEDIT's size — which every signature
          # changes. If every rewritten byte lies before the first section's
          # offset, an extent starting there instead of at the segment start
          # would survive codesign, and the design has a fix rather than a wall.
          FIRST_SECTION=$(awk '/segname __TEXT/{f=1} f&&/^ *offset /{print $2; exit}' after-otool.txt)
          TEXT_FILESIZE=$(awk '/segname __TEXT/{f=1} f&&/^ *filesize /{print $2; exit}' after-otool.txt)
          echo "first __TEXT section begins at file offset ${FIRST_SECTION}" | tee -a answer.txt
          echo "__TEXT spans file bytes 0..${TEXT_FILESIZE}" | tee -a answer.txt
          python3 - "$FIRST_SECTION" "$TEXT_FILESIZE" <<'PY' | tee -a answer.txt
          import sys
          first = int(sys.argv[1])
          text_end = int(sys.argv[2])
          a = open("before.dylib", "rb").read()
          b = open("subject.dylib", "rb").read()
          # Bounded to __TEXT deliberately. Comparing whole files answers a
          # different question: __LINKEDIT follows __TEXT and grows by the
          # signature, so every byte from its start onward differs for reasons
          # that have nothing to do with the extent. Only __TEXT is hashed, so
          # only __TEXT decides whether a narrower extent would survive.
          n = min(len(a), len(b), text_end)
          diffs = [i for i in range(n) if a[i] != b[i]]
          print(f"file length: {len(a)} -> {len(b)}; compared __TEXT bytes 0..{n}")
          if not diffs:
              print("no byte inside __TEXT changed")
          else:
              before_first = [i for i in diffs if i < first]
              after_first = [i for i in diffs if i >= first]
              print(f"changed bytes inside __TEXT: {len(diffs)}")
              print(f"  before the first section (header + load commands): {len(before_first)}")
              print(f"  at or after the first section:                     {len(after_first)}")
              print(f"  first changed offset: {diffs[0]}, last: {diffs[-1]}")
              if not after_first:
                  print("VERDICT: every rewritten byte is header or load-command data.")
                  print("An extent beginning at the first section would survive codesign.")
              else:
                  print("VERDICT: codesign rewrote bytes inside the sections themselves;")
                  print(f"  the first such offset is {after_first[0]}.")
          PY

          if [ "$VERIFY_EXIT" -eq 0 ]; then
            echo "RESULT: codesign does NOT disturb the recorded extent on ${{ matrix.name }}" | tee -a answer.txt
          else
            echo "RESULT: codesign DOES disturb the recorded extent on ${{ matrix.name }}." | tee -a answer.txt
            echo "This is a finding about the design, not a build failure. The Darwin path needs" | tee -a answer.txt
            echo "rework — most likely signing after codesign rather than before it." | tee -a answer.txt
          fi

      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codesign-extent-${{ matrix.name }}
          path: |
            before-show.txt
            after-show.txt
            sign.txt
            verify-after.txt
            answer.txt
            codesign-dv.txt
            before-otool.txt
            after-otool.txt
          if-no-files-found: error
