# Release artifacts — prebuilt C libraries for consumers without a Rust toolchain.
#
# WHY THIS EXISTS
#   Two independent reasons, and the second is the load-bearing one.
#
#   1. Adoption. A C shop migrating off an existing cryptographic module links
#      a `.a` and includes a header. Requiring them to install a Rust toolchain
#      and build a 35-crate workspace first is a barrier unrelated to the work
#      they are doing.
#
#   2. CMVP validates a BUILD, not source. A user who compiles the module
#      themselves holds a binary whose integrity signature is their own — not
#      the one that was validated. For the validated artifact to mean anything
#      it has to be an artifact somebody can actually obtain. That is this
#      workflow's real output; the convenience is a side effect.
#
# TRIGGER POLICY — deliberately not `push`.
#   `ci.yml` documents why this repository burns no default CI minutes: a full
#   cycle costs 1.5-2h of Free-tier 2-core runner time. This workflow does not
#   change that policy. It fires on `release: published` — an event a human
#   causes by hand, at most once per release — so it costs minutes exactly when
#   the artifacts are wanted and never otherwise. `workflow_dispatch` is kept
#   for re-runs when a release already exists (a failed matrix leg, a runner
#   outage) and takes the tag as an input.
#
# WHAT IS NOT COVERED — stated here rather than discovered later.
#   * The Linux `.so` carries a glibc floor: a shared object built against
#     glibc N cannot load on a system with an older one. This is a live hazard
#     in this project's own history (a VM build against glibc 2.43 could not be
#     loaded by an older host). `cargo-zigbuild` is used for the Linux legs
#     precisely because it lets the floor be PINNED and stated
#     (`...-gnu.2.17`) rather than inherited from whatever the runner image
#     happens to ship. The `.a` has no such floor — it is linked into the
#     consumer's own binary against their libc.
#   * These builds are not bit-reproducible and are not claimed to be. Two runs
#     of this workflow on the same tag can produce different bytes and
#     therefore different integrity MACs. What is asserted is narrower and
#     checkable: each published artifact's MAC is recorded in the release body,
#     and `oxicrypt-integrity-sign --verify` confirms the artifact matches the MAC
#     it ships with.
#   * No macOS/Windows FIPS claim is implied by their presence here. They are
#     built because the C API is portable; the validated configuration is
#     whatever the Security Policy names, which is a narrower set.

name: release-artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach to (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  header:
    name: header (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pinned toolchain
        # rust-toolchain.toml pins the channel; `rustup show` materialises it.
        # The pin is part of the validated artifact for a FIPS module, so the
        # release build must not float to whatever `stable` is that week.
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # `include/oxicrypt.h` is committed AND generated by build.rs via
      # cbindgen. Shipping the committed copy is right — it is the one the
      # C integration tests compile against — but only while the two agree.
      # A drifted header is worse than none: it compiles, and then the ABI
      # disagrees at run time.
      - name: Regenerate the header and compare against the committed copy
        run: |
          set -euo pipefail
          cp crates/oxicrypt-ffi/include/oxicrypt.h /tmp/oxicrypt.h.committed
          cargo build -p oxicrypt-ffi --release
          if ! diff -u /tmp/oxicrypt.h.committed crates/oxicrypt-ffi/include/oxicrypt.h; then
            echo "::error::The committed oxicrypt.h differs from what cbindgen generates at this commit."
            echo "Regenerate it, commit it, and re-tag. Shipping a drifted header ships a wrong ABI."
            exit 1
          fi
          echo "header: committed copy matches cbindgen output"

      - uses: actions/upload-artifact@v4
        with:
          name: oxicrypt-header
          path: crates/oxicrypt-ffi/include/oxicrypt.h
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    needs: header
    runs-on: ${{ matrix.runner }}
    strategy:
      # One failing platform must not suppress the others: a partial release
      # that names what is missing beats no release at all, and the missing
      # leg can be re-run via workflow_dispatch.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.17
            cdylib: liboxicrypt_ffi.so
            staticlib: liboxicrypt_ffi.a
          - name: linux-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.17
            cdylib: liboxicrypt_ffi.so
            staticlib: liboxicrypt_ffi.a
          # macOS runner labels age out faster than the rest of this matrix.
          # `macos-13` was retired from GitHub's available images between this
          # workflow being written and its first run: the job sat queued for
          # over two hours and was never assigned a runner, while every other
          # leg finished in about two minutes. A retired label does not fail —
          # it queues forever, which reads like scarcity rather than removal.
          # Check https://github.com/actions/runner-images for the current set
          # before assuming a queued macOS job is merely waiting.
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            cdylib: liboxicrypt_ffi.dylib
            staticlib: liboxicrypt_ffi.a
          # macos-14 built successfully on 2026-08-07 but is marked deprecated
          # upstream, so it is moved ahead of retirement rather than after it.
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            cdylib: liboxicrypt_ffi.dylib
            staticlib: liboxicrypt_ffi.a
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            cdylib: oxicrypt_ffi.dll
            staticlib: oxicrypt_ffi.lib

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pinned toolchain and target
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.zig_target != ''
        run: |
          set -euo pipefail
          # PEP 668 marks the runner's Python as externally managed, so a bare
          # `pip install` fails on current Ubuntu images. Try the clean form
          # first so this reverts to normal behaviour if the image changes.
          pip3 install ziglang || pip3 install --break-system-packages ziglang
          cargo install cargo-zigbuild --locked
          zig version || python3 -m ziglang version

      # Two separate build invocations would be wrong: `crate-type =
      # ["cdylib", "staticlib"]` means one `cargo build` produces both, from
      # one compilation. Building twice risks shipping a .so and a .a that
      # were not made from the same object code.
      - name: Build (glibc floor pinned)
        if: matrix.zig_target != ''
        run: cargo zigbuild -p oxicrypt-ffi --release --target ${{ matrix.zig_target }}

      - name: Build
        if: matrix.zig_target == ''
        run: cargo build -p oxicrypt-ffi --release --target ${{ matrix.target }}

      - name: Build the signing tool
        # Built for the HOST, not the target: it has to run here. On the
        # cross-compiled Linux legs a target-built signer would not execute.
        run: cargo build -p oxicrypt-integrity-sign --release

      # ORDER IS LOAD-BEARING. Signing rewrites the MAC slot inside the binary,
      # so it mutates the file. A checksum taken before this step describes
      # bytes nobody will ever receive.
      # Only `--sign` prints the MAC ("signed <path> -> <hex>"); `--verify`
      # prints "verify ok: <path>" and no hex. So the MAC recorded in the
      # provenance file has to be captured HERE. Deriving it from `--verify`
      # output later would silently record nothing.
      - name: Sign the integrity slot
        shell: bash
        run: |
          set -euo pipefail
          OUT="target/${{ matrix.target }}/release"
          SIGNER="target/release/oxicrypt-integrity-sign"
          [ -x "$SIGNER" ] || SIGNER="target/release/oxicrypt-integrity-sign.exe"
          "$SIGNER" --sign \
            --cdylib-target  "$OUT/${{ matrix.cdylib }}" | tee /tmp/sign-output.txt
          # Positive control: one loadable image in, one MAC line out. A
          # silently skipped target would leave a signed-looking artifact whose
          # slot was never written, and it fails in the consumer's hands, not
          # here. The static archive is deliberately absent: an archive has no
          # loadable image, so the consumer signs the binary they link it into.
          n=$(grep -c '^signed ' /tmp/sign-output.txt)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected 1 signed line, got $n — the shared library was not signed"
            exit 1
          fi

      - name: Stage the artifact set
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          DIR="oxicrypt-${TAG}-${{ matrix.name }}"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.cdylib }}"    "$DIR/"
          cp "target/${{ matrix.target }}/release/${{ matrix.staticlib }}" "$DIR/"
          cp crates/oxicrypt-ffi/include/oxicrypt.h "$DIR/"
          cp LICENSE-APACHE LICENSE-MIT "$DIR/"

          # The provenance record travels WITH the artifact. A consumer holding
          # only the tarball can still answer "what produced this, and what
          # should its integrity MAC be?" without access to this run's logs,
          # which expire.
          {
            echo "oxicrypt ${TAG} — ${{ matrix.name }}"
            echo ""
            echo "target triple : ${{ matrix.target }}"
            echo "glibc floor   : ${{ matrix.zig_target && 'pinned 2.17 via cargo-zigbuild' || 'n/a' }}"
            echo "rustc         : $(rustc --version)"
            # `git rev-parse HEAD`, NOT `github.sha`. On a workflow_dispatch,
            # github.sha is the SHA of the ref the run was launched from --
            # normally the default branch -- while the checkout above uses
            # `inputs.tag`. The two coincide for a `release: published` run and
            # diverge for every manual re-dispatch, so provenance built by the
            # documented recovery path named a commit that was not the release.
            # Reading the working tree cannot disagree with what was compiled.
            echo "commit        : $(git rev-parse HEAD)"
            echo "built by      : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Integrity MACs (HMAC-SHA-256 over the binary, slot zeroed),"
            echo "as emitted by oxicrypt-integrity-sign at signing time:"
            sed 's|^signed target/[^ ]*/release/|  |' /tmp/sign-output.txt
            echo ""
            echo ""
            echo "The static archive ships unsigned. An archive has no loadable"
            echo "image, so sign the binary you link it into:"
            echo "  oxicrypt-integrity-sign --sign <your-binary>"
            echo ""
            echo "Verify locally with:"
            echo "  cargo install oxicrypt-integrity-sign"
            echo "  oxicrypt-integrity-sign --verify <file>"
          } > "$DIR/BUILD-PROVENANCE.txt"

          # Verify the STAGED copies, not the build-directory originals. The
          # copies are what ship, and this is the last point at which a
          # truncated or mangled `cp` is still catchable here rather than by
          # the consumer's power-up self-test.
          SIGNER="target/release/oxicrypt-integrity-sign"
          [ -x "$SIGNER" ] || SIGNER="target/release/oxicrypt-integrity-sign.exe"
          "$SIGNER" --verify \
            --cdylib-target  "$DIR/${{ matrix.cdylib }}" | tee /tmp/verify-output.txt
          v=$(grep -c '^verify ok: ' /tmp/verify-output.txt)
          if [ "$v" -ne 1 ]; then
            echo "::error::expected 1 verify-ok line on the staged copy, got $v"
            exit 1
          fi

          tar -czf "${DIR}.tar.gz" "$DIR"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256" 2>/dev/null \
            || shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          cat "${DIR}.tar.gz.sha256"

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          DIR="oxicrypt-${TAG}-${{ matrix.name }}"
          gh release upload "$TAG" "${DIR}.tar.gz" "${DIR}.tar.gz.sha256" --clobber
          echo "uploaded ${DIR}.tar.gz to $TAG"
