[package]
name = "oxicrypt-bench"
description = "Criterion benchmarks for oxicrypt hot paths"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Criterion benchmarks — nothing depends on this crate and it is not a product.
# Kept off crates.io, like the other in-repo tooling.
publish = false

[lints]
workspace = true

[features]
# Forward the `parallel` (rayon) feature to every PQ crate that has one, so
# the benchmark harness can compare the default single-threaded build against
# the parallel build (`cargo bench -p oxicrypt-bench --features parallel`).
# Off by default — the default bench build mirrors the CMVP validation-target config.
default = []
# The entropy/maxwell benches are OPT-IN, and that is load-bearing rather than
# tidiness. Cargo unifies features across a single invocation, so a
# non-optional `oxicrypt-entropy = { features = ["raw-counter"] }` here would
# enable raw-counter for EVERY `--workspace` command — re-arming the live
# jitter tests that `scripts/git-hooks/pre-push` deliberately excludes (their
# verdict on a virtualized counter is load-dependent), making
# `raw_counter_unavailable_without_feature` assert nothing, and overriding
# `esv-harness`'s explicit `default-features = false` so an audited-unsafe
# crate lands in its binary. Behind an optional dep + `required-features`, the
# default workspace graph is untouched.
#
#     cargo bench -p oxicrypt-bench --features entropy-bench
entropy-bench = [
    "dep:oxicrypt-entropy",
    "dep:oxicrypt-maxwell",
    "oxicrypt-entropy/raw-counter",
]
parallel = [
    "oxicrypt-lms/parallel",
    "oxicrypt-ml-kem/parallel",
    "oxicrypt-ml-dsa/parallel",
    "oxicrypt-slh-dsa/parallel",
    "oxicrypt-xmss/parallel",
]

[dependencies]
oxicrypt-module = { workspace = true }
oxicrypt-sha = { workspace = true }
oxicrypt-hmac = { workspace = true }
oxicrypt-aes = { workspace = true }
oxicrypt-drbg = { workspace = true }
oxicrypt-ecdsa = { workspace = true }
oxicrypt-eddsa = { workspace = true }
oxicrypt-ecdh = { workspace = true }
oxicrypt-rsa = { workspace = true }
oxicrypt-kdf = { workspace = true }
oxicrypt-lms = { workspace = true }
oxicrypt-ml-kem = { workspace = true }
oxicrypt-ml-dsa = { workspace = true }
oxicrypt-slh-dsa = { workspace = true }
oxicrypt-xmss = { workspace = true }
# Optional — see the `entropy-bench` feature above for why this must not be a
# plain dependency. `raw-counter` is required by the bench itself, not
# incidental: `NoiseSource` is sealed and the mock sources are
# `#[cfg(test)]`-only, so the real jitter source is the only one a bench can
# construct, and it is also the only one that measures what ISC-88 asks about.
oxicrypt-entropy = { workspace = true, optional = true }
oxicrypt-maxwell = { workspace = true, optional = true }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "hmac"
harness = false

[[bench]]
name = "aes"
harness = false

[[bench]]
name = "drbg"
harness = false

[[bench]]
name = "ecdsa"
harness = false

[[bench]]
name = "eddsa"
harness = false

[[bench]]
name = "ecdh"
harness = false

[[bench]]
name = "lms"
harness = false

[[bench]]
name = "ml_kem"
harness = false

[[bench]]
name = "ml_dsa"
harness = false

[[bench]]
name = "slh_dsa"
harness = false

[[bench]]
name = "xmss"
harness = false

[[bench]]
name = "conditioned_output"
harness = false
required-features = ["entropy-bench"]

[[bench]]
name = "maxwell"
harness = false
required-features = ["entropy-bench"]

[[example]]
name = "gen_noniid"
required-features = ["entropy-bench"]

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.20.0/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
