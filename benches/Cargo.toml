[package]
name = "oxicrypt-bench"
description = "Criterion benchmarks for oxicrypt hot paths"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Forward the `parallel` (rayon) feature to every PQ crate that has one, so
# the benchmark harness can compare the default single-threaded build against
# the parallel build (`cargo bench -p oxicrypt-bench --features parallel`).
# Off by default — the default bench build mirrors the CMVP validation-target config.
default = []
# The entropy/maxwell benches are OPT-IN, and that is load-bearing rather than
# tidiness. Cargo unifies features across a single invocation, so a
# non-optional `oxicrypt-entropy = { features = ["raw-counter"] }` here would
# enable raw-counter for EVERY `--workspace` command — re-arming the live
# jitter tests that `scripts/git-hooks/pre-push` deliberately excludes (their
# verdict on a virtualized counter is load-dependent), making
# `raw_counter_unavailable_without_feature` assert nothing, and overriding
# `esv-harness`'s explicit `default-features = false` so an audited-unsafe
# crate lands in its binary. Behind an optional dep + `required-features`, the
# default workspace graph is untouched.
#
#     cargo bench -p oxicrypt-bench --features entropy-bench
entropy-bench = [
    "dep:oxicrypt-entropy",
    "dep:oxicrypt-maxwell",
    "oxicrypt-entropy/raw-counter",
]
parallel = [
    "oxicrypt-lms/parallel",
    "oxicrypt-ml-kem/parallel",
    "oxicrypt-ml-dsa/parallel",
    "oxicrypt-slh-dsa/parallel",
    "oxicrypt-xmss/parallel",
]

[dependencies]
oxicrypt-module = { path = "../crates/oxicrypt-module" }
oxicrypt-sha = { path = "../crates/oxicrypt-sha" }
oxicrypt-hmac = { path = "../crates/oxicrypt-hmac" }
oxicrypt-aes = { path = "../crates/oxicrypt-aes" }
oxicrypt-drbg = { path = "../crates/oxicrypt-drbg" }
oxicrypt-ecdsa = { path = "../crates/oxicrypt-ecdsa" }
oxicrypt-eddsa = { path = "../crates/oxicrypt-eddsa" }
oxicrypt-ecdh = { path = "../crates/oxicrypt-ecdh" }
oxicrypt-rsa = { path = "../crates/oxicrypt-rsa" }
oxicrypt-kdf = { path = "../crates/oxicrypt-kdf" }
oxicrypt-lms = { path = "../crates/oxicrypt-lms" }
oxicrypt-ml-kem = { path = "../crates/oxicrypt-ml-kem" }
oxicrypt-ml-dsa = { path = "../crates/oxicrypt-ml-dsa" }
oxicrypt-slh-dsa = { path = "../crates/oxicrypt-slh-dsa" }
oxicrypt-xmss = { path = "../crates/oxicrypt-xmss" }
# Optional — see the `entropy-bench` feature above for why this must not be a
# plain dependency. `raw-counter` is required by the bench itself, not
# incidental: `NoiseSource` is sealed and the mock sources are
# `#[cfg(test)]`-only, so the real jitter source is the only one a bench can
# construct, and it is also the only one that measures what ISC-88 asks about.
oxicrypt-entropy = { path = "../crates/oxicrypt-entropy", optional = true }
oxicrypt-maxwell = { path = "../crates/oxicrypt-maxwell", optional = true }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "hmac"
harness = false

[[bench]]
name = "aes"
harness = false

[[bench]]
name = "drbg"
harness = false

[[bench]]
name = "ecdsa"
harness = false

[[bench]]
name = "eddsa"
harness = false

[[bench]]
name = "ecdh"
harness = false

[[bench]]
name = "lms"
harness = false

[[bench]]
name = "ml_kem"
harness = false

[[bench]]
name = "ml_dsa"
harness = false

[[bench]]
name = "slh_dsa"
harness = false

[[bench]]
name = "xmss"
harness = false

[[bench]]
name = "conditioned_output"
harness = false
required-features = ["entropy-bench"]

[[bench]]
name = "maxwell"
harness = false
required-features = ["entropy-bench"]

[[example]]
name = "gen_noniid"
required-features = ["entropy-bench"]
