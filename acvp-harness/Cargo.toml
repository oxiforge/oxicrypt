[package]
name = "acvp-harness"
description = "ACVP protocol client for automated CAVP test vector validation of the oxicrypt module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# ACVP protocol client: operational validation tooling, not a product. Kept off
# crates.io, so nothing published may depend on it.
publish = false

[lints]
workspace = true

[[bin]]
name = "acvp-harness"
path = "src/main.rs"

[dependencies]
oxicrypt-aes = { workspace = true }
oxicrypt-cmac = { workspace = true }
oxicrypt-dh = { workspace = true }
oxicrypt-drbg = { workspace = true }
oxicrypt-ecdh = { workspace = true }
oxicrypt-ecdsa = { workspace = true }
oxicrypt-eddsa = { workspace = true }
oxicrypt-module = { workspace = true }
oxicrypt-rsa = { workspace = true }
oxicrypt-sha = { workspace = true }
oxicrypt-xof = { workspace = true }
oxicrypt-hmac = { workspace = true }
oxicrypt-kdf = { workspace = true }
oxicrypt-tls-kdf = { workspace = true }
oxicrypt-integrity = { workspace = true }
oxicrypt-ml-kem = { workspace = true }
oxicrypt-ml-dsa = { workspace = true }
oxicrypt-slh-dsa = { workspace = true }
oxicrypt-lms = { workspace = true }
oxicrypt-xmss = { workspace = true }

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.22.0/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
