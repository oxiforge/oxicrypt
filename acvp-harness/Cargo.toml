[package]
name = "acvp-harness"
description = "ACVP protocol client for automated CAVP test vector validation of the pqclib module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "acvp-harness"
path = "src/main.rs"

[dependencies]
fips-aes = { path = "../crates/fips-aes" }
fips-cmac = { path = "../crates/fips-cmac" }
fips-drbg = { path = "../crates/fips-drbg" }
fips-ecdh = { path = "../crates/fips-ecdh" }
fips-ecdsa = { path = "../crates/fips-ecdsa" }
fips-eddsa = { path = "../crates/fips-eddsa" }
fips-module = { path = "../crates/fips-module" }
fips-rsa = { path = "../crates/fips-rsa" }
fips-sha = { path = "../crates/fips-sha" }
fips-xof = { path = "../crates/fips-xof" }
fips-hmac = { path = "../crates/fips-hmac" }
fips-kdf = { path = "../crates/fips-kdf" }
fips-tls-kdf = { path = "../crates/fips-tls-kdf" }
fips-integrity = { path = "../crates/fips-integrity" }
