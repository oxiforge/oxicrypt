[package]
name = "acvp-harness"
description = "ACVP protocol client for automated CAVP test vector validation of the oxicrypt module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "acvp-harness"
path = "src/main.rs"

[dependencies]
oxicrypt-aes = { path = "../crates/oxicrypt-aes" }
oxicrypt-cmac = { path = "../crates/oxicrypt-cmac" }
oxicrypt-dh = { path = "../crates/oxicrypt-dh" }
oxicrypt-drbg = { path = "../crates/oxicrypt-drbg" }
oxicrypt-ecdh = { path = "../crates/oxicrypt-ecdh" }
oxicrypt-ecdsa = { path = "../crates/oxicrypt-ecdsa" }
oxicrypt-eddsa = { path = "../crates/oxicrypt-eddsa" }
oxicrypt-module = { path = "../crates/oxicrypt-module" }
oxicrypt-rsa = { path = "../crates/oxicrypt-rsa" }
oxicrypt-sha = { path = "../crates/oxicrypt-sha" }
oxicrypt-xof = { path = "../crates/oxicrypt-xof" }
oxicrypt-hmac = { path = "../crates/oxicrypt-hmac" }
oxicrypt-kdf = { path = "../crates/oxicrypt-kdf" }
oxicrypt-tls-kdf = { path = "../crates/oxicrypt-tls-kdf" }
oxicrypt-integrity = { path = "../crates/oxicrypt-integrity" }
oxicrypt-ml-kem = { path = "../crates/oxicrypt-ml-kem" }
oxicrypt-ml-dsa = { path = "../crates/oxicrypt-ml-dsa" }
oxicrypt-slh-dsa = { path = "../crates/oxicrypt-slh-dsa" }
oxicrypt-lms = { path = "../crates/oxicrypt-lms" }
oxicrypt-xmss = { path = "../crates/oxicrypt-xmss" }

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.20.0/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"
