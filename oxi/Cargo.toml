[package]
name = "oxicrypt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish.workspace = true
description = "Command-line interface for oxicrypt — hash, HMAC, random byte generation, and the module's on-demand self-tests."

[package.metadata.lama]
# Registry discovery (LAMA SPEC.md, "Package registry discovery"). Must be a
# per-crate table: cargo strips [workspace] when it packages a member, so a
# workspace-level copy never reaches the registry. Version-pinned rather than
# branch-pinned so the manifest an agent fetches matches the crate it found.
manifest = "https://raw.githubusercontent.com/oxiforge/oxicrypt/v0.24.0/docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"

[[bin]]
name = "oxi"
path = "src/main.rs"

[dependencies]
oxicrypt-module = { workspace = true }
oxicrypt-integrity = { workspace = true }
oxicrypt-sha = { workspace = true }
oxicrypt-hmac = { workspace = true }
oxicrypt-aes = { workspace = true }
oxicrypt-drbg = { workspace = true }

[dev-dependencies]
# Tests need to PRODUCE a signed binary in order to exercise the signed path.
# A dev-dependency, deliberately: the format parsers stay out of the shipped
# `oxi`, and therefore out of the extent its own integrity test protects.
# Path-only, no version, per the internal dev-dependency convention.
oxicrypt-integrity-sign = { path = "../tools/oxicrypt-integrity-sign" }

[lints]
workspace = true
