[workspace]
resolver = "2"
members = [
    "crates/oxicrypt-module",
    "crates/oxicrypt-test-vectors",
    "crates/oxicrypt-aes",
    "crates/oxicrypt-aes-accel",
    "crates/oxicrypt-sha",
    "crates/oxicrypt-sha-accel",
    "crates/oxicrypt-keccak-accel",
    "crates/oxicrypt-hmac",
    "crates/oxicrypt-drbg",
    "crates/oxicrypt-rsa",
    "crates/oxicrypt-ecdsa",
    "crates/oxicrypt-ecdh",
    "crates/oxicrypt-eddsa",
    "crates/oxicrypt-kdf",
    "crates/oxicrypt-xof",
    "crates/oxicrypt-cmac",
    "crates/oxicrypt-tls-kdf",
    "crates/oxicrypt-integrity",
    "crates/oxicrypt-zeroize",
    "crates/oxicrypt-ffi",
    "crates/oxicrypt-ml-kem",
    "crates/oxicrypt-ml-dsa",
    "crates/oxicrypt-slh-dsa",
    "crates/oxicrypt-lms",
    "crates/oxicrypt-xmss",
    "crates/oxicrypt-dh",
    "crates/oxicrypt-entropy",
    "crates/oxicrypt-timer",
    "crates/oxicrypt-maxwell",
    "acvp-harness",
    "esv-harness",
    "oxi",
    "benches",
    "tools/ct-validation",
    "tools/doc-guard",
    "tools/quickstarts",
]
exclude = [
    "playground",
]

[workspace.package]
version = "0.21.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/oxiforge/oxicrypt"
homepage = "https://oxicrypt.dev"
keywords = ["cryptography", "fips", "fips-140-3", "no-std", "nist"]
categories = ["cryptography", "no-std"]
publish = false

# Phase 1 policy: zero third-party dependencies. All crypto is pure Rust,
# written in-tree. Dependencies will be re-evaluated per-crate in later phases
# and must be justified in the Security Policy before adoption.
[workspace.dependencies]
# Internal crates are declared once here with BOTH a path and a version.
# The path is what a workspace build resolves; the version is what
# `cargo package` records -- without it, packaging fails for every crate
# that depends on another (#196). One table means a release moves 29
# literals instead of 155, and `scripts/bump-version.sh` edits one file.

acvp-harness = { path = "acvp-harness", version = "0.21.0" }
oxicrypt-aes = { path = "crates/oxicrypt-aes", version = "0.21.0" }
oxicrypt-aes-accel = { path = "crates/oxicrypt-aes-accel", version = "0.21.0" }
oxicrypt-cmac = { path = "crates/oxicrypt-cmac", version = "0.21.0" }
oxicrypt-dh = { path = "crates/oxicrypt-dh", version = "0.21.0" }
oxicrypt-drbg = { path = "crates/oxicrypt-drbg", version = "0.21.0" }
oxicrypt-ecdh = { path = "crates/oxicrypt-ecdh", version = "0.21.0" }
oxicrypt-ecdsa = { path = "crates/oxicrypt-ecdsa", version = "0.21.0" }
oxicrypt-eddsa = { path = "crates/oxicrypt-eddsa", version = "0.21.0" }
oxicrypt-entropy = { path = "crates/oxicrypt-entropy", version = "0.21.0" }
oxicrypt-hmac = { path = "crates/oxicrypt-hmac", version = "0.21.0" }
oxicrypt-integrity = { path = "crates/oxicrypt-integrity", version = "0.21.0" }
oxicrypt-kdf = { path = "crates/oxicrypt-kdf", version = "0.21.0" }
oxicrypt-keccak-accel = { path = "crates/oxicrypt-keccak-accel", version = "0.21.0" }
oxicrypt-lms = { path = "crates/oxicrypt-lms", version = "0.21.0" }
oxicrypt-maxwell = { path = "crates/oxicrypt-maxwell", version = "0.21.0" }
oxicrypt-ml-dsa = { path = "crates/oxicrypt-ml-dsa", version = "0.21.0" }
oxicrypt-ml-kem = { path = "crates/oxicrypt-ml-kem", version = "0.21.0" }
oxicrypt-module = { path = "crates/oxicrypt-module", version = "0.21.0" }
oxicrypt-rsa = { path = "crates/oxicrypt-rsa", version = "0.21.0" }
oxicrypt-sha = { path = "crates/oxicrypt-sha", version = "0.21.0" }
oxicrypt-sha-accel = { path = "crates/oxicrypt-sha-accel", version = "0.21.0" }
oxicrypt-slh-dsa = { path = "crates/oxicrypt-slh-dsa", version = "0.21.0" }
oxicrypt-test-vectors = { path = "crates/oxicrypt-test-vectors", version = "0.21.0" }
oxicrypt-timer = { path = "crates/oxicrypt-timer", version = "0.21.0" }
oxicrypt-tls-kdf = { path = "crates/oxicrypt-tls-kdf", version = "0.21.0" }
oxicrypt-xmss = { path = "crates/oxicrypt-xmss", version = "0.21.0" }
oxicrypt-xof = { path = "crates/oxicrypt-xof", version = "0.21.0" }
oxicrypt-zeroize = { path = "crates/oxicrypt-zeroize", version = "0.21.0" }

# Workspace-wide lints. These apply to every member crate via `[lints]
# workspace = true` in each crate's Cargo.toml.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
# Treat clippy findings seriously in a crypto module.
pedantic = { level = "warn", priority = -1 }
# Carve-outs that would be noisy in crypto code and add little safety value:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# NIST documents are full of identifiers like CTR_DRBG, EdDSA, SHA-3,
# P-256 that doc_markdown wants wrapped in backticks. We prefer prose
# that reads like the spec, so this lint is off globally.
doc_markdown = "allow"
# Deny patterns that have historically caused real bugs in crypto code:
indexing_slicing = "deny"
integer_division = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Side-channel hygiene: forbid arithmetic that silently wraps on secret data.
# We will use explicit `wrapping_*` / `checked_*` when wrapping is intended.
arithmetic_side_effects = "warn"

# LAMA manifest pointer for agents that discover oxicrypt via crates.io.
# See https://github.com/lamaspec/lama/blob/main/SPEC.md §"Package registry discovery".
[workspace.metadata.lama]
manifest = "docs/llm-api-manifest/llm-api.yaml"
spec = "https://github.com/lamaspec/lama/blob/main/SPEC.md"

[profile.release]
# Reproducibility matters for the software integrity KAT. Keep optimization
# aggressive but disable LTO for now so builds are deterministic across
# toolchain patch versions; we'll revisit in Phase 4.
opt-level = 3
lto = false
codegen-units = 1
debug = false
strip = "none"
overflow-checks = false
panic = "abort"

[profile.dev]
opt-level = 0
overflow-checks = true
