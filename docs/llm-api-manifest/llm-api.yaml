  # ── RSA DRBG-driven C ABI handle surface (FIPS 186-5 / RFC 8017 §8) ──
  # 3 opaque PCT-at-construction private-key handles plus 24 entry points: keygen, PKCS#1 v1.5 sign, PSS sign, OAEP encrypt/decrypt, and modulus/exponent accessors.

  - name: MIN_DISTINCT_DELTAS_FLOOR
    module: oxicrypt-entropy
    type: u32
    value: "2"
    description: "Hard floor on AdequacyConfig.min_distinct_deltas applied by AdequacyReport::ensure_varied; no operator configuration may accept fewer."

  - name: MASTER_SECRET_LEN
    module: oxicrypt-tls-kdf
    type: usize
    value: '48'
    description: TLS 1.2 master-secret length in bytes per RFC 5246 §8.1.

  - name: FIPS_INTEGRITY_KEY
    module: oxicrypt-integrity
    type: '[u8; 32]'
    value: '*b"oxicrypt-fips140-3-integrity-key"'
    description: Fixed, publicly known 32-byte HMAC key used for the module-binary integrity check.

  - name: SLOT_HEADER_MAGIC
    module: oxicrypt-integrity
    type: '[u8; 16]'
    value: 0xfc followed by the ASCII bytes OXICRYPT_FIPS_H
    description: Header magic marking the start of the embedded integrity slot.

  - name: SLOT_FOOTER_MAGIC
    module: oxicrypt-integrity
    type: '[u8; 16]'
    value: 0xfd followed by the ASCII bytes OXICRYPT_FIPS_F
    description: Footer magic marking the end of the embedded integrity slot.

  - name: SLOT_SIZE
    module: oxicrypt-integrity
    type: usize
    value: '64'
    description: Total size in bytes of the embedded integrity slot.

  - name: MAC_OFFSET_IN_SLOT
    module: oxicrypt-integrity
    type: usize
    value: '16'
    description: Offset of the MAC field from the start of the slot.

  - name: MAC_SIZE
    module: oxicrypt-integrity
    type: usize
    value: '32'
    description: Length in bytes of the MAC field within the slot.

  - name: FOOTER_OFFSET_IN_SLOT
    module: oxicrypt-integrity
    type: usize
    value: '48'
    description: Offset of the footer magic from the start of the slot.

  - name: FIPS_INTEGRITY_SLOT
    module: oxicrypt-integrity
    type: IntegritySlot
    value: "hdr = SLOT_HEADER_MAGIC, mac = 32 zero bytes, ftr = SLOT_FOOTER_MAGIC"
    description: "The 64-byte #[used] static whose contiguous .rodata placement carries the module's HMAC-SHA-256 integrity tag; sign_exe and verify_exe locate it by scanning the on-disk file for the header/footer magic pair rather than by reading the symbol."

