    module: oxicrypt-ffi
    description: Generate an LMS key pair (LMS_SHA256_M32_H10 / LMOTS_SHA256_N32_W4, SP 800-208 / RFC 8554) from a 32-byte caller-supplied seed; deterministically derives the tree seed and 16-byte identifier I, computes the 1024-leaf Merkle root, and writes the 52-byte opaque private-key blob into sk_out and the 56-byte public key into pk_out.
    signature: >-
      int oxi_lms_keygen(const uint8_t *xi_ptr,
      uint8_t *sk_out, uint8_t *pk_out)
    parameters:
      - name: xi_ptr
        type: const uint8_t *
        direction: in
        description: 32-byte caller-supplied seed
      - name: sk_out
        type: uint8_t *
        direction: out
        description: 52-byte opaque LMS private-key blob
      - name: pk_out
        type: uint8_t *
        direction: out
        description: 56-byte LMS public key
    returns:
      type: int
      description: "OxiResult discriminant: Ok on success, otherwise one of the error variants below."
