      - name: label
        type: "&[u8]"
        direction: in
        description: Label.
      - name: context
        type: "&[u8]"
        direction: in
        description: Context.
      - name: out
        type: "&mut [u8]"
        direction: out
        description: Output buffer.
    returns:
      type: "Result<(), KdfError>"
      error_variants:
        - name: Module
          condition: Module not operational or service restricted.
        - name: OutputTooLong
          condition: Output too large for 32-bit counter encoding.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
