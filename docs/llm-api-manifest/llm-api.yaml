    - name: client_hello_random
      type: '&[u8]'
      direction: in
      description: Client hello random for the master-secret seed.
      constraints:
        valid_range: client_hello_random.len() + server_hello_random.len() must be <= 64
    - name: server_hello_random
      type: '&[u8]'
      direction: in
      description: Server hello random for the master-secret seed.
      constraints:
        valid_range: client_hello_random.len() + server_hello_random.len() must be <= 64
    - name: server_random
      type: '&[u8]'
      direction: in
      description: Server random for the key-expansion seed.
      constraints:
        valid_range: server_random.len() + client_random.len() must be <= 64
    - name: client_random
      type: '&[u8]'
      direction: in
      description: Client random for the key-expansion seed.
      constraints:
        valid_range: server_random.len() + client_random.len() must be <= 64
    - name: key_block_out
      type: '&mut [u8]'
      direction: out
      description: Output buffer filled with the expanded key block.
    returns:
      type: Result<[u8; 48], Error>
      description: The 48-byte master secret.
      error_variants:
      - name: NotOperational
        condition: Module not initialized, in SelfTest, or latched in Error state.
      - name: AlgorithmRestricted
        condition: Active AlgorithmProfile does not allow Service::Tls12Kdf.
    preconditions:
