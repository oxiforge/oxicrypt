      - { name: peer_public_key_ptr, type: "const uint8_t *", direction: in, description: "97-byte SEC1 uncompressed peer public key (0x04 || X || Y)" }
      - { name: shared_secret_out, type: "uint8_t *", direction: out, description: "Output buffer >= 48 bytes; receives the raw shared-secret x-coordinate" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on non-canonical d or peer-key validation failure, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."
    security:
