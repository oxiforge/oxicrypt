  - name: KATS
    module: oxicrypt-lms
    type: "&[KatEntry]"
    value: "4 entries"
    description: Power-up KAT slice for this crate, LMS signature verification on NIST ACVP vectors for the SHA-256 and SHAKE hash families at 32-byte and 24-byte output, passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

  - name: KATS
    module: oxicrypt-xmss
    type: "&[KatEntry]"
    value: "1 entry"
    description: Power-up KAT slice for this crate, one XMSS-SHA2_10_256 signature verification test, passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

