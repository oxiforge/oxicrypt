      description: "OxiResult discriminant (0 = Ok, 22 = TagMismatch, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: true

