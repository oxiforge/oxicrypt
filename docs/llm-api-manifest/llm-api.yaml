      - { name: private_out, type: "uint8_t *", direction: out, description: "48-byte big-endian private scalar d in [1, n-1]" }
      - { name: public_out, type: "uint8_t *", direction: out, description: "97-byte SEC1 uncompressed public key 0x04 || X(48) || Y(48) of d * G" }
