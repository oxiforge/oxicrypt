    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: "Sp800_108DoublePipelineHmacSha256::derive"
    module: oxicrypt-kdf
    family: kdf-sp800108-mode
    description: SP 800-108r1 §5.4 Double-Pipeline Mode KBKDF with HMAC-SHA-256; no IV required.
    signature: >-
      pub fn Sp800_108DoublePipelineHmacSha256::derive(key: &[u8], label: &[u8],
      context: &[u8], out: &mut [u8]) -> Result<(), KdfError>
    parameters:
      - name: key
