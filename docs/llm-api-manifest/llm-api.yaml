  - name: keygen
    module: oxicrypt-lms
    signature: "pub fn keygen(xi: &[u8; 32]) -> Result<(LmsPrivateKey, [u8; 56]), Error>"
    description: Generate an LMS key pair (LMS_SHA256_M32_H10 / LMOTS_SHA256_N32_W4); xi is a 32-byte secret DRBG seed, and the tree root takes ~0.5 s for 1024 leaves.
    parameters:
      - name: xi
        type: "&[u8; 32]"
        constraints:
          size: 32
        direction: in
        description: "32-byte secret seed for the Merkle tree."
    returns:
      type: "Result<(LmsPrivateKey, [u8; 56]), Error>"
      description: "(private_key, public_key)."
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: LMS blocked by active profile.
    preconditions:
      - description: Module must be Operational.
      - description: xi must be 32 bytes of fresh random data from an approved DRBG.
    postconditions:
      - description: Returns a fresh LMS key pair with leaf_index 0; the key can sign at most 1024 messages (MAX_SIGNATURES).
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles:
      - Unrestricted
      - Cnsa2

  - name: sign
    module: oxicrypt-lms
    signature: "pub fn sign(key: &mut LmsPrivateKey, message: &[u8]) -> Result<[u8; 2508], Error>"
    description: Sign a message with LMS; STATEFUL, advances the leaf index by 1, the caller MUST persist the private key afterwards.
    parameters:
      - name: key
        type: "&mut LmsPrivateKey"
        direction: in-out
        description: "Mutable private key handle. leaf_index is incremented."
      - name: message
        type: "&[u8]"
        direction: in
        description: "Message to sign (arbitrary length)."
    returns:
      type: "Result<[u8; 2508], Error>"
      description: "2508-byte LMS signature: q (4) || LMOTS sig (2404) || LMS type (4) || auth path (10 × 32 = 320) minus padding overlaps."
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: LMS blocked by active profile.
        - name: InvalidInput
          condition: Key exhausted (leaf_index >= 1024).
    preconditions:
      - description: Module must be Operational.
      - description: key.leaf_index < 1024 (key not exhausted).
    postconditions:
      - description: key.leaf_index has been incremented by 1. Caller MUST persist key state.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles:
      - Unrestricted
      - Cnsa2
    pitfalls:
      - description: "LMS is STATEFUL: each private key can sign only 1024 messages, the caller must persist key state after every sign, and reusing a leaf index voids the whole tree's security."
        wrong: |
          let (mut sk, pk) = oxicrypt_lms::keygen(&seed)?;
          let sig = oxicrypt_lms::sign(&mut sk, b"msg")?;
          // BUG: sk not persisted — if process crashes, leaf index is lost
        right: |
          let (mut sk, pk) = oxicrypt_lms::keygen(&seed)?;
          let sig = oxicrypt_lms::sign(&mut sk, b"msg")?;
          persist_to_disk(&sk.to_bytes());  // MUST persist after every sign

  - name: verify
    module: oxicrypt-lms
    signature: "pub fn verify(public_key: &[u8; 56], message: &[u8], signature: &[u8; 2508]) -> Result<(), Error>"
    description: Verify an LMS signature; Ok(()) if valid, Err(InvalidInput) if not.
