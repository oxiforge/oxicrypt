  # HKDF (RFC 5869, SP 800-56C Rev. 2 §4.1) — two-step extract / expand.
  # PRK is L bytes (32/48/64 for SHA-256/384/512) and is the entire HKDF
  # state; the C ABI passes it as raw bytes between calls instead of
  # wrapping it in an opaque handle. Profile gating routes through
  # P::KDF_SERVICE — same KDF mechanism, different PRF, distinct
  # approved service per SP 800-56C Rev. 2.

  - name: oxi_hkdf_sha256_extract
    module: oxicrypt-ffi
    description: >-
      Run HKDF-Extract per RFC 5869 §2.2 with HMAC-SHA-256.
      Computes PRK = HMAC-SHA-256(salt, IKM) and writes the 32-byte
      pseudorandom key into prk_out. A NULL or zero-length salt is
      interpreted as 32 zero bytes per RFC 5869 §2.2.
    signature: >-
      int oxi_hkdf_sha256_extract(const uint8_t *salt_ptr, size_t salt_len,
      const uint8_t *ikm_ptr, size_t ikm_len, uint8_t *prk_out)
    parameters:
      - name: salt_ptr
        type: "const uint8_t *"
        direction: in
        description: Optional salt; pass NULL with salt_len=0 for the zero-salt default.
      - name: salt_len
        type: size_t
        direction: in
      - name: ikm_ptr
        type: "const uint8_t *"
        direction: in
      - name: ikm_len
        type: size_t
        direction: in
      - name: prk_out
        type: "uint8_t *"
        direction: out
        description: Output buffer, must be >= 32 bytes; receives the 32-byte PRK.
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."

  - name: oxi_hkdf_sha256_expand
    module: oxicrypt-ffi
    description: >-
      Run HKDF-Expand per RFC 5869 §2.3 with HMAC-SHA-256.
      Reconstructs HKDF state from a 32-byte PRK and fills okm_out
      with okm_len bytes of derived key material. Returns
      OxiResult::OutputTooLong (12) when okm_len exceeds 255*32 = 8160.
    signature: >-
      int oxi_hkdf_sha256_expand(const uint8_t *prk_ptr,
      const uint8_t *info_ptr, size_t info_len,
      uint8_t *okm_out, size_t okm_len)
    parameters:
      - name: prk_ptr
        type: "const uint8_t *"
        direction: in
        description: Pseudorandom key; must point to exactly 32 bytes.
      - name: info_ptr
        type: "const uint8_t *"
        direction: in
        description: Optional context/info string; pass NULL with info_len=0 for empty info.
      - name: info_len
        type: size_t
        direction: in
      - name: okm_out
        type: "uint8_t *"
        direction: out
        description: Output buffer of okm_len bytes; receives the derived key material.
      - name: okm_len
        type: size_t
        direction: in
        description: Output length; capped at 255*32 = 8160 bytes by RFC 5869 §2.3.
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 12 = OutputTooLong, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."

  - name: oxi_hkdf_sha384_extract
    module: oxicrypt-ffi
    description: >-
      Run HKDF-Extract per RFC 5869 §2.2 with HMAC-SHA-384.
      Computes PRK = HMAC-SHA-384(salt, IKM) and writes the 48-byte
      pseudorandom key into prk_out. A NULL or zero-length salt is
