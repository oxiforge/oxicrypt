    signature: >-
      pub fn sign_pkcs1_v15_sha256(&self, msg: &[u8])
      -> Result<[u8; 256], Error>
    parameters:
      - name: self
        type: "&RsaPrivateKey2048"
        direction: in
        description: RSA private key (constructed via from_components or generate).
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to sign (hashed internally with SHA-256).
        constraints:
          valid_range: any length
    returns:
      type: "Result<[u8; 256], Error>"
      description: 256-byte RSA signature.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
      - description: Key must have been constructed (PCT passed).
    postconditions:
      - description: Returns a valid RSASSA-PKCS1-v1_5 signature; performs Bellcore verify-after-sign (IG D.G) internally.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: rsa_pkcs1_v15_verify_2048_sha256
    module: oxicrypt-rsa
    description: Verify an RSA-2048 PKCS#1 v1.5 SHA-256 signature.
    signature: >-
      pub fn rsa_pkcs1_v15_verify_2048_sha256(n: &[u8; 256], e: u64,
      msg: &[u8], sig: &[u8; 256]) -> bool
    parameters:
      - name: n
        type: "&[u8; 256]"
        direction: in
        description: RSA modulus (256 bytes, big-endian).
        constraints:
          size: 256
          encoding: big-endian
      - name: e
        type: u64
        direction: in
        description: Public exponent (typically 65537).
        constraints:
          valid_range: "odd, >= 65537"
      - name: msg
        type: "&[u8]"
        direction: in
        description: Original message that was signed.
      - name: sig
        type: "&[u8; 256]"
        direction: in
        description: Signature to verify.
        constraints:
          size: 256
          encoding: big-endian
    returns:
      type: bool
      description: true if signature is valid, false otherwise.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: false  # Verification is public-data only
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational

  # ── ECDSA ─────────────────────────────────────────────────────────

  - name: "EcdsaP256PrivateKey::generate"
    module: oxicrypt-ecdsa
    description: Generate an ECDSA P-256 key pair with DRBG-backed rejection sampling (FIPS 186-5 §A.2.2) and a pairwise consistency test.
    signature: >-
      pub fn generate(drbg: &mut HmacDrbgSha256)
      -> Result<Self, Error>
    parameters:
      - name: drbg
        type: "&mut HmacDrbgSha256"
        direction: in-out
        description: Instantiated HMAC-DRBG for keygen randomness; must already be instantiated with sufficient entropy.
    returns:
      type: "Result<EcdsaP256PrivateKey, Error>"
      description: New key handle with (d, Q) pair.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: ConditionalTestFailed
          condition: Pairwise consistency test (sign-then-verify) failed.
    preconditions:
      - description: Module must be Operational.
      - description: DRBG must be instantiated.
    postconditions:
      - description: Key handle contains a valid (d, Q) pair where Q = d * G, verified consistent by the PCT.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: "EcdsaP256PrivateKey::sign_sha256"
    module: oxicrypt-ecdsa
    description: Sign a message with ECDSA P-256 and SHA-256.
    signature: >-
      pub fn sign_sha256(&self, drbg: &mut HmacDrbgSha256, msg: &[u8])
      -> Result<[u8; 64], Error>
    parameters:
      - name: self
        type: "&EcdsaP256PrivateKey"
        direction: in
        description: Private key handle.
      - name: drbg
        type: "&mut HmacDrbgSha256"
        direction: in-out
        description: Instantiated DRBG for per-signature k sampling.
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to sign (hashed internally with SHA-256).
    returns:
      type: "Result<[u8; 64], Error>"
      description: "64-byte signature: r (32 bytes) || s (32 bytes), big-endian."
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
      - description: DRBG must be instantiated.
    postconditions:
      - description: Returns a valid ECDSA-P256-SHA256 signature; the per-signature nonce k is sampled via the FIPS 186-5 §A.2.2 rejection loop.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let key = EcdsaP256PrivateKey::generate(&mut drbg)?;
        let sig = key.sign_sha256(&mut drbg, b"hello")?;
        assert_eq!(sig.len(), 64);

  - name: verify
    module: oxicrypt-ecdsa
    description: Verify an ECDSA P-256 SHA-256 signature.
    signature: >-
      pub fn verify(pk: &[u8; 65], msg: &[u8], sig: &[u8; 64])
      -> Result<bool, Error>
    parameters:
      - name: pk
        type: "&[u8; 65]"
        direction: in
        description: Uncompressed SEC1 public key 0x04 || X(32) || Y(32); full SP 800-56Ar3 §5.6.2.3.3 point validation is performed.
        constraints:
          size: 65
          encoding: "SEC1 uncompressed (first byte must be 0x04)"
      - name: msg
        type: "&[u8]"
        direction: in
        description: Original message.
      - name: sig
        type: "&[u8; 64]"
        direction: in
        description: "Signature: r (32 bytes) || s (32 bytes), big-endian."
        constraints:
          size: 64
          encoding: big-endian
    returns:
      type: "Result<bool, Error>"
      description: Ok(true) if valid, Ok(false) if invalid.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: InvalidInput
          condition: Public key fails point validation.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: false  # Verification operates on public data only
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational

  # ── Ed25519 ───────────────────────────────────────────────────────

  - name: "Ed25519PrivateKey::sign"
    module: oxicrypt-eddsa
    description: Sign a message with Ed25519 (RFC 8032); deterministic, no per-signature DRBG draw.
    signature: "pub fn sign(&self, msg: &[u8]) -> Result<[u8; 64], Error>"
    parameters:
      - name: self
        type: "&Ed25519PrivateKey"
        direction: in
        description: Ed25519 private key handle.
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to sign.
    returns:
      type: "Result<[u8; 64], Error>"
      description: 64-byte Ed25519 signature.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
    postconditions:
      - description: Returns a valid RFC 8032 Ed25519 signature.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── ECDH ──────────────────────────────────────────────────────────

  - name: compute_shared_secret_p256
    module: oxicrypt-ecdh
    description: Compute ECDH P-256 shared secret (SP 800-56Ar3 CDH); returns the x-coordinate of d * Q.
    signature: >-
      pub fn compute_shared_secret_p256(d: &[u8; 32], peer_pk: &[u8; 65])
      -> Result<[u8; 32], Error>
    parameters:
      - name: d
        type: "&[u8; 32]"
        direction: in
        description: Our private scalar (big-endian).
        constraints:
          size: 32
          encoding: big-endian
      - name: peer_pk
        type: "&[u8; 65]"
        direction: in
        description: Peer's uncompressed SEC1 public key (0x04 || X || Y); point validation performed internally.
        constraints:
          size: 65
          encoding: "SEC1 uncompressed (first byte must be 0x04)"
    returns:
      type: "Result<[u8; 32], Error>"
      description: 32-byte shared secret (x-coordinate); feed to a KDF, do NOT use directly as a key.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: InvalidInput
          condition: Peer public key fails point validation.
    preconditions:
      - description: Module must be Operational.
      - description: Peer public key must be a valid P-256 point.
    postconditions:
      - description: Returns the x-coordinate of d * peer_pk; the caller MUST pass this through a KDF before use as keying material.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: The raw ECDH shared secret must not be used directly as a symmetric key; always derive through a KDF (HKDF, SP 800-56Cr2).
        wrong: |
          let key_bytes = compute_shared_secret_p256(&d, &pk)?;
          let aes_key = Aes256Key::new(&key_bytes)?;  // WRONG — no KDF
        right: |
          let z = compute_shared_secret_p256(&d, &pk)?;
          let mut okm = [0u8; 32];
          hkdf_sha256(&salt, &z, &info, &mut okm)?;
          let aes_key = Aes256Key::new(&okm)?;

  - name: compute_shared_secret_p384
    module: oxicrypt-ecdh
    description: Compute ECDH P-384 shared secret (SP 800-56Ar3 CDH); returns the x-coordinate of d * Q.
    signature: >-
      pub fn compute_shared_secret_p384(d: &[u8; 48], peer_pk: &[u8; 97])
      -> Result<[u8; 48], Error>
    parameters:
      - name: d
        type: "&[u8; 48]"
        direction: in
        description: Our private scalar (big-endian).
        constraints:
          size: 48
          encoding: big-endian
      - name: peer_pk
        type: "&[u8; 97]"
        direction: in
        description: Peer's uncompressed SEC1 public key (0x04 || X || Y); point validation performed internally.
        constraints:
          size: 97
          encoding: "SEC1 uncompressed (first byte must be 0x04)"
    returns:
      type: "Result<[u8; 48], Error>"
      description: 48-byte shared secret (x-coordinate); feed to a KDF, do NOT use directly as a key.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: InvalidInput
          condition: Peer public key fails point validation.
    preconditions:
      - description: Module must be Operational.
      - description: Peer public key must be a valid P-384 point.
    postconditions:
      - description: Returns the x-coordinate of d * peer_pk; the caller MUST pass this through a KDF before use as keying material.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: generate_keypair_p256
    module: oxicrypt-ecdh
    description: Generate a fresh ECDH P-256 key pair (d, Q) via the FIPS 186-5 §A.2.2 rejection sampler driven by the supplied DRBG, then run the IG 10.3.A pairwise consistency test before returning.
    signature: >-
      pub fn generate_keypair_p256(drbg: &mut HmacDrbgSha256)
      -> Result<([u8; 32], [u8; 65]), Error>
    parameters:
      - name: drbg
        type: "&mut HmacDrbgSha256"
        direction: inout
        description: Live, instantiated HMAC-DRBG-SHA-256 for scalar sampling; must be Operational and may be reused for subsequent calls.
    returns:
      type: "Result<([u8; 32], [u8; 65]), Error>"
      description: "On success returns (d, Q): d the 32-byte private scalar in [1, n-1], Q the 65-byte SEC1 uncompressed public key of d*G."
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: ECDH-P-256 blocked by active profile.
        - name: InvalidInput
          condition: >-
            DRBG fault, rejection-sampling exhaustion, or IG 10.3.A
            PCT mismatch. In practice only a broken DRBG.
    preconditions:
      - description: Module must be Operational.
      - description: DRBG handle must be live and instantiated.
    postconditions:
      - description: Returns a freshly sampled (d, Q) pair that has passed the IG 10.3.A pairwise consistency test, with Q = d*G.
    thread_safety: not-thread-safe-on-shared-drbg
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: generate_keypair_p384
    module: oxicrypt-ecdh
    description: Generate a fresh ECDH P-384 key pair via the FIPS 186-5 §A.2.2 rejection sampler, with the IG 10.3.A PCT against the RFC 5903 §8.2 responder keypair.
    signature: >-
      pub fn generate_keypair_p384(drbg: &mut HmacDrbgSha256)
      -> Result<([u8; 48], [u8; 97]), Error>
    parameters:
      - name: drbg
        type: "&mut HmacDrbgSha256"
        direction: inout
        description: Live, instantiated HMAC-DRBG-SHA-256.
    returns:
      type: "Result<([u8; 48], [u8; 97]), Error>"
      description: "On success returns (d, Q): d the 48-byte private scalar in [1, n-1], Q the 97-byte SEC1 uncompressed public key of d*G."
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: ECDH-P-384 blocked by active profile.
        - name: InvalidInput
          condition: DRBG fault, sampling exhaustion, or PCT mismatch.
    preconditions:
      - description: Module must be Operational.
      - description: DRBG handle must be live and instantiated.
    postconditions:
      - description: Returns a freshly sampled (d, Q) pair that has passed the IG 10.3.A PCT, with Q = d*G.
    thread_safety: not-thread-safe-on-shared-drbg
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── DH ──────────────────────────────────────────────────────────

  - name: compute_shared_secret_3072
    module: oxicrypt-dh
    description: Compute DH-3072 shared secret over RFC 3526 Group 15 (SP 800-56Ar3 §5.7.1.1 FFC DH), with partial public-key validation per §5.6.2.3.2.
    signature: >-
      pub fn compute_shared_secret_3072(x_bytes: &[u8; 384],
      y_bytes: &[u8; 384]) -> Result<[u8; 384], Error>
    parameters:
      - name: x_bytes
        type: "&[u8; 384]"
        direction: in
        description: Our private key (big-endian, 3072 bits).
        constraints:
          size: 384
          encoding: big-endian
          range: "1 ≤ x < q where q = (p−1)/2"
      - name: y_bytes
        type: "&[u8; 384]"
        direction: in
        description: Peer's public key (big-endian, 3072 bits); validated via partial validation 2 <= y <= p-2.
        constraints:
          size: 384
          encoding: big-endian
          range: "2 ≤ y ≤ p − 2"
    returns:
      type: "Result<[u8; 384], Error>"
      description: 384-byte raw shared secret Z = y^x mod p; feed to an SP 800-56Cr2 KDF, do NOT use directly as keying material.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: InvalidInput
          condition: Private key or peer public key out of range.
        - name: AlgorithmRestricted
          condition: DH-3072 blocked by active profile (e.g. CNSA 2.0).
    preconditions:
      - description: Module must be Operational.
      - description: Peer public key must pass partial validation (2 ≤ y ≤ p − 2).
    postconditions:
      - description: Returns Z = y^x mod p; the caller MUST pass through an SP 800-56Cr2 extractor before use as keying material.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: The raw DH shared secret must not be used directly as a symmetric key; always derive through a KDF (HKDF, SP 800-56Cr2).
        wrong: |
          let z = compute_shared_secret_3072(&x, &y)?;
          let aes_key = Aes256Key::new(&z[..32])?;  // WRONG — no KDF
        right: |
          let z = compute_shared_secret_3072(&x, &y)?;
          let mut okm = [0u8; 32];
          hkdf_sha256(&salt, &z, &info, &mut okm)?;
          let aes_key = Aes256Key::new(&okm)?;

  - name: generate_keypair_3072
    module: oxicrypt-dh
    description: Generate a DH-3072 key pair for RFC 3526 Group 15; private key x sampled from HMAC-DRBG-SHA-256 by rejection sampling (x in [1, q-1]), public key y = 2^x mod p.
    signature: >-
      pub fn generate_keypair_3072(drbg: &mut HmacDrbgSha256)
      -> Result<([u8; 384], [u8; 384]), Error>
    parameters:
      - name: drbg
        type: "&mut HmacDrbgSha256"
        direction: inout
        description: Instantiated HMAC-DRBG-SHA-256; must have been instantiated with sufficient entropy before calling.
    returns:
      type: "Result<([u8; 384], [u8; 384]), Error>"
      description: Tuple of (private_key, public_key), both 384-byte big-endian arrays.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: InvalidInput
          condition: Keygen failed (DRBG exhaustion or repeated failures).
        - name: AlgorithmRestricted
          condition: DH-3072 blocked by active profile.
    preconditions:
      - description: Module must be Operational.
      - description: DRBG must be instantiated with sufficient entropy.
    postconditions:
      - description: Private key x in [1, q-1], public key y = 2^x mod p; both valid for use with compute_shared_secret_3072.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── ML-KEM-1024 (FIPS 203) ────────────────────────────────────────

  - name: keygen
    module: oxicrypt-ml-kem
    family: ml-kem-keygen
    signature: "pub fn keygen(d: &[u8; 32], z: &[u8; 32]) -> Result<([u8; 1568], [u8; 3168]), Error>"
    description: Generate an ML-KEM-1024 key pair; d and z must each be 32 bytes of fresh randomness from an approved DRBG (SP 800-90A).
    parameters:
      - name: d
        type: "&[u8; 32]"
        constraints:
          size: 32
        direction: in
        description: "32-byte randomness for K-PKE key generation."
      - name: z
        type: "&[u8; 32]"
        constraints:
          size: 32
        direction: in
        description: "32-byte randomness for implicit-rejection seed."
    returns:
      type: "Result<([u8; 1568], [u8; 3168]), Error>"
      description: "(encapsulation_key, decapsulation_key)"
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: ML-KEM-1024 blocked by active profile.
        - name: InvalidInput
          condition: Invalid or insufficient randomness.
    preconditions:
      - description: Module must be Operational.
      - description: d and z must each be 32 bytes of fresh random data from an approved DRBG.
    postconditions:
      - description: Returns a valid ML-KEM-1024 key pair for use with encapsulate and decapsulate.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles:
      - Unrestricted
      - Cnsa2

  - name: encapsulate
    module: oxicrypt-ml-kem
    family: ml-kem-encapsulate
    signature: "pub fn encapsulate(ek: &[u8; 1568], m: &[u8; 32]) -> Result<([u8; 32], [u8; 1568]), Error>"
    description: Encapsulate a shared secret against an ML-KEM-1024 encapsulation key; m must be 32 bytes of fresh randomness from an approved DRBG.
    parameters:
      - name: ek
        type: "&[u8; 1568]"
        constraints:
          size: 1568
        direction: in
        description: "Encapsulation key (from keygen)."
      - name: m
        type: "&[u8; 32]"
        constraints:
          size: 32
        direction: in
        description: "32-byte randomness for encapsulation."
    returns:
      type: "Result<([u8; 32], [u8; 1568]), Error>"
      description: "(shared_secret, ciphertext)"
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: ML-KEM-1024 blocked by active profile.
        - name: InvalidInput
          condition: Invalid encapsulation key or randomness.
    preconditions:
      - description: Module must be Operational.
      - description: ek must be a valid 1568-byte encapsulation key from keygen.
      - description: m must be 32 bytes of fresh random data from an approved DRBG.
    postconditions:
      - description: Returns a 32-byte shared secret and 1568-byte ciphertext; the shared secret is reproducible only with the private decapsulation key.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles:
      - Unrestricted
      - Cnsa2

  - name: decapsulate
    module: oxicrypt-ml-kem
    family: ml-kem-decapsulate
    signature: "pub fn decapsulate(dk: &[u8; 3168], ct: &[u8; 1568]) -> Result<[u8; 32], Error>"
    description: Decapsulate a shared secret from an ML-KEM-1024 ciphertext using implicit rejection; an invalid ciphertext yields a constant-time pseudorandom key.
    parameters:
      - name: dk
        type: "&[u8; 3168]"
        constraints:
          size: 3168
        direction: in
        description: "Decapsulation key (from keygen)."
      - name: ct
        type: "&[u8; 1568]"
        constraints:
          size: 1568
        direction: in
        description: "Ciphertext (from encapsulate)."
    returns:
      type: "Result<[u8; 32], Error>"
      description: "32-byte shared secret."
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: ML-KEM-1024 blocked by active profile.
    preconditions:
      - description: Module must be Operational.
      - description: dk must be a valid 3168-byte decapsulation key from keygen.
      - description: ct must be a 1568-byte ciphertext from encapsulate.
    postconditions:
      - description: Returns the 32-byte shared secret; by construction (implicit rejection) constant-time, returning a pseudorandom value even if ct is invalid.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles:
      - Unrestricted
      - Cnsa2

  # ── ML-KEM-512 (FIPS 203, k=2) ────────────────────────────────────

  - name: "ml_kem_512::keygen"
    module: oxicrypt-ml-kem
    family: ml-kem-keygen
    signature: "pub fn keygen(d: &[u8; 32], z: &[u8; 32]) -> Result<([u8; 800], [u8; 1632]), Error>"
    description: Generate an ML-KEM-512 key pair (FIPS 203 §6.1, k=2); d and z are 32-byte caller-supplied randomness, NOT interchangeable.
    parameters:
      - name: d
        type: "&[u8; 32]"
        constraints:
          size: 32
        direction: in
        description: "32-byte randomness for K-PKE key generation."
      - name: z
        type: "&[u8; 32]"
        constraints:
          size: 32
        direction: in
        description: "32-byte randomness for implicit-rejection seed."
    returns:
      type: "Result<([u8; 800], [u8; 1632]), Error>"
      description: "(encapsulation_key, decapsulation_key)"
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: ML-KEM-512 blocked by active profile (not in CNSA 1.0 or CNSA 2.0).
        - name: InvalidInput
          condition: Invalid or insufficient randomness.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles: [Unrestricted]

  - name: "ml_kem_512::encapsulate"
    module: oxicrypt-ml-kem
    family: ml-kem-encapsulate
    signature: "pub fn encapsulate(ek: &[u8; 800], m: &[u8; 32]) -> Result<([u8; 32], [u8; 768]), Error>"
    description: Encapsulate a shared secret against an ML-KEM-512 encapsulation key (FIPS 203 §6.2, k=2); m is 32-byte caller-supplied randomness from an approved DRBG.
    parameters:
      - name: ek
        type: "&[u8; 800]"
        constraints:
          size: 800
        direction: in
        description: "Encapsulation key (from ml_kem_512::keygen)."
      - name: m
        type: "&[u8; 32]"
        constraints:
          size: 32
        direction: in
        description: "32-byte randomness for encapsulation."
    returns:
      type: "Result<([u8; 32], [u8; 768]), Error>"
      description: "(shared_secret, ciphertext)"
