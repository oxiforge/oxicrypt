  # ── RSA DRBG-driven C ABI handle surface (FIPS 186-5 / RFC 8017 §8) ──
  #
  # Completes the RSA family C ABI. Verify-only stateless surface
  # already exposed via `oxi_rsa_{pkcs1_v15,pss}_verify_{2048,3072,4096}_sha256`.
  # This block adds: 3 opaque private-key handles (one per modulus
  # size) plus 24 entry points covering DRBG-driven keygen,
  # deterministic PKCS#1 v1.5 sign, DRBG-driven PSS sign, public-key
  # OAEP encrypt, handle-mediated OAEP decrypt, and modulus + public-
  # exponent accessors. PCT-at-construction handle invariant carries
  # over from the ECDSA DRBG-driven surface.

  - name: OxiRsaPrivateKey2048
    kind: opaque_type
    module: oxicrypt-ffi
    description: >-
      Opaque RSA-2048 private-key handle that has passed an
      IG 10.3.A pairwise consistency test on the CRT path at
      construction time. Internal layout
      (`OxiHandle<oxicrypt_rsa::RsaPrivateKey2048>`) is
      implementation detail and not part of the C ABI; cbindgen
      renders this as an opaque struct. Carries the public modulus
      `n` (256 bytes), public exponent `e`, private exponent `d`
      (256 bytes), and the CRT components `p`, `q`, `dP`, `dQ`,
      `qInv` (128 bytes each). Drop chain zeroises `d` plus all
      five CRT half-values. Allocate via
      `oxi_rsa_2048_private_key_new_generate`; release via
      `oxi_rsa_2048_private_key_free`. The CRT components remain
      encapsulated — there is no FFI accessor to extract them — so
      a C caller cannot exfiltrate the secret half-moduli.

  - name: OxiRsaPrivateKey3072
    kind: opaque_type
    module: oxicrypt-ffi
    description: >-
      Opaque RSA-3072 private-key handle. Mirrors
      `OxiRsaPrivateKey2048` for the 3072-bit modulus; modulus is
      384 bytes, CRT halves are 192 bytes each. Drop chain
      zeroises `d` plus the five CRT half-values via the
      `define_rsa_wide!`-generated `Drop` impls. Allocate via
      `oxi_rsa_3072_private_key_new_generate`; release via
      `oxi_rsa_3072_private_key_free`.

  - name: OxiRsaPrivateKey4096
    kind: opaque_type
    module: oxicrypt-ffi
    description: >-
      Opaque RSA-4096 private-key handle. Mirrors
      `OxiRsaPrivateKey2048` for the 4096-bit modulus; modulus is
      512 bytes, CRT halves are 256 bytes each. Drop chain
      zeroises `d` plus the five CRT half-values. Allocate via
      `oxi_rsa_4096_private_key_new_generate`; release via
      `oxi_rsa_4096_private_key_free`.

  - name: oxi_rsa_2048_private_key_new_generate
    module: oxicrypt-ffi
    description: >-
      Allocate a new RSA-2048 private-key handle. Generates a
      fresh keypair via FIPS 186-5 §A.1.1 / §B.3.1 prime sampling
      on the caller-supplied DRBG, then runs the IG 10.3.A
      pairwise consistency test on the CRT path (sign a fixed
      probe with `_crt_internal`, verify with the public exponent)
      before the handle is returned. `e` must be an odd prime in
      `[65537, 2^64)` — in practice, pass `65537` (F4). On
      success, writes a heap-allocated handle pointer through
      `out_key`. PCT failure, structural `e` rejection, prime-
      candidate retry exhaustion, and DRBG faults all collapse to
      `OxiResult::InvalidInput = 5`; no half-initialised pointer
      ever reaches the caller. Forwards to
      `oxicrypt_rsa::RsaPrivateKey2048::generate`. Caller MUST
      instantiate the DRBG before this call and MUST serialise
      concurrent calls on the same DRBG pointer.
    signature: >-
      int oxi_rsa_2048_private_key_new_generate(OxiHmacDrbgSha256 *drbg,
      uint64_t e, OxiRsaPrivateKey2048 **out_key)
    parameters:
      - { name: drbg, type: "OxiHmacDrbgSha256 *", direction: in, description: "Live, instantiated HMAC_DRBG-SHA-256 handle" }
      - { name: e, type: "uint64_t", direction: in, description: "Public exponent; pass 65537 for F4" }
      - { name: out_key, type: "OxiRsaPrivateKey2048 **", direction: out, description: "Receives handle on success; caller MUST free with oxi_rsa_2048_private_key_free" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on DRBG fault / PCT fail / prime retry exhaustion, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_rsa_2048_private_key_free
    module: oxicrypt-ffi
    description: >-
      Free an RSA-2048 private-key handle. NULL-safe. Drop on the
      upstream `RsaPrivateKey2048` zeroises `d` and the five CRT
      half-values via the workspace-wide `oxicrypt-zeroize`
      volatile-write convention. Double-free is undefined
      behaviour (matches malloc/free semantics).
    signature: >-
      void oxi_rsa_2048_private_key_free(OxiRsaPrivateKey2048 *key)
    parameters:
      - { name: key, type: "OxiRsaPrivateKey2048 *", direction: in, description: "Handle to free, or NULL" }
    returns:
      type: void
      description: "No return value."
    security:
      constant_time: false
      handles_secrets: true
