  - name: Okm
    module: oxicrypt
    kind: struct
    description: "HKDF-SHA384 output key material of a chosen length, on the heap, zeroed on drop, whose Debug prints only the type name and which implements no Clone, Copy, PartialEq or Hash."
    security:
