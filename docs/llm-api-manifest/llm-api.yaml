      handles_secrets: false
      fips_approved: true

  - name: oxi_rsa_2048_sign_pkcs1_v15_sha256
    module: oxicrypt-ffi
    description: >-
      Sign `msg` with RSASSA-PKCS#1-v1.5 SHA-256 under the
      RSA-2048 private-key handle (FIPS 186-5 §5.4 / RFC 8017
      §8.2). Deterministic — signing the same `(key, msg)` twice
      produces byte-identical 256-byte signatures. When the handle
      was built via `_new_generate` (the only construction path
      exposed via FFI), signing routes through the CRT path with
      Bellcore verify-after-sign per FIPS 140-3 IG D.G — a single
      fault on either CRT half is caught and collapsed to
      `OxiResult::InvalidInput = 5` so a corrupted signature never
      reaches the caller and never leaks `p` or `q`.
    signature: >-
      int oxi_rsa_2048_sign_pkcs1_v15_sha256(const OxiRsaPrivateKey2048 *key,
      const uint8_t *msg_ptr, size_t msg_len, uint8_t *sig_out)
    parameters:
      - { name: key, type: "const OxiRsaPrivateKey2048 *", direction: in, description: "Live handle" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in, description: "Message bytes" }
      - { name: msg_len, type: "size_t", direction: in, description: "Message length" }
      - { name: sig_out, type: "uint8_t *", direction: out, description: "256-byte signature buffer" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on Bellcore fault / internal corruption, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_rsa_2048_sign_pss_sha256
    module: oxicrypt-ffi
    description: >-
      Sign `msg` with RSASSA-PSS SHA-256 under the RSA-2048
      private-key handle, sampling a fresh 32-byte salt from the
      caller-supplied DRBG per call (FIPS 186-5 §5.4 / RFC 8017
      §8.1). Signing the same `(key, msg)` twice produces two
      distinct 256-byte signatures, defeating multi-target attacks
      per FIPS 186-5 §5.4. Salt length is fixed at 32 bytes
      (`hLen`); MGF1 hash is SHA-256. Bellcore protection on the
      CRT path applies as in `_sign_pkcs1_v15_sha256`. The DRBG
      handle's `(K, V, reseed_counter)` state advances by one
      `generate` call (32 bytes) per invocation; long signing
      campaigns should reseed per the caller's SP 800-90A reseed
      policy.
    signature: >-
      int oxi_rsa_2048_sign_pss_sha256(const OxiRsaPrivateKey2048 *key,
      OxiHmacDrbgSha256 *drbg, const uint8_t *msg_ptr,
      size_t msg_len, uint8_t *sig_out)
    parameters:
      - { name: key, type: "const OxiRsaPrivateKey2048 *", direction: in, description: "Live handle" }
      - { name: drbg, type: "OxiHmacDrbgSha256 *", direction: in, description: "Live, instantiated DRBG handle (caller serialises concurrent access)" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in, description: "Message bytes" }
      - { name: msg_len, type: "size_t", direction: in, description: "Message length" }
      - { name: sig_out, type: "uint8_t *", direction: out, description: "256-byte signature buffer" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on DRBG fault / Bellcore fault / internal corruption, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_rsa_2048_oaep_encrypt_sha256
    module: oxicrypt-ffi
    description: >-
      Encrypt `msg` with RSAES-OAEP SHA-256 against the RSA-2048
      public key `(n, e)`, sampling a fresh 32-byte seed from the
      caller-supplied DRBG (RFC 8017 §7.1). Stateless on the
      RSA-side — no private-key handle required, since OAEP encrypt
      is a public-key operation. SHA-256 is used for both the
      label hash and the MGF1 hash. Maximum plaintext length is
      190 bytes (`k − 2·hLen − 2` with `k = 256`, `hLen = 32`);
      ciphertext is fixed at 256 bytes regardless of message
      length. Empty label is the conventional default for
      KEM-style use; pass `NULL`/`0` for the label arguments.
    signature: >-
      int oxi_rsa_2048_oaep_encrypt_sha256(OxiHmacDrbgSha256 *drbg,
      const uint8_t *n_ptr, uint64_t e, const uint8_t *label_ptr,
      size_t label_len, const uint8_t *msg_ptr, size_t msg_len,
      uint8_t *ct_out)
    parameters:
      - { name: drbg, type: "OxiHmacDrbgSha256 *", direction: in, description: "Live, instantiated DRBG handle" }
      - { name: n_ptr, type: "const uint8_t *", direction: in, description: "256-byte big-endian modulus" }
      - { name: e, type: "uint64_t", direction: in, description: "Public exponent (typically 65537)" }
      - { name: label_ptr, type: "const uint8_t *", direction: in, description: "OAEP label bytes (may be NULL if label_len = 0)" }
      - { name: label_len, type: "size_t", direction: in, description: "Label length" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in, description: "Plaintext message" }
      - { name: msg_len, type: "size_t", direction: in, description: "Message length; must be ≤ 190" }
      - { name: ct_out, type: "uint8_t *", direction: out, description: "256-byte ciphertext buffer" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on DRBG fault / oversized message / malformed modulus, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: true

  - name: oxi_rsa_2048_oaep_decrypt_sha256
    module: oxicrypt-ffi
    description: >-
      Decrypt an RSAES-OAEP SHA-256 ciphertext under the RSA-2048
      private-key handle (RFC 8017 §7.1). Ciphertext is fixed at
      256 bytes; recovered plaintext length is variable in
      `[0, 190]` and reported through `out_actual_len`. All OAEP
      decode failures (bad `Y` byte, `lHash'` mismatch, malformed
      `PS`, missing `0x01` delimiter, wrong label) collapse to
      `OxiResult::InvalidInput = 5` without revealing which check
      failed (Manger-resistance contract — the decode routine runs
      MGF1 unmask to completion regardless of where the first
      failure occurred). When the handle was built via
      `_new_generate`, decryption uses the CRT path with Bellcore
      verify-after-decrypt — a single CRT-half fault is caught and
      collapsed to `InvalidInput`. `out_max_len` must be ≥ 190.
    signature: >-
      int oxi_rsa_2048_oaep_decrypt_sha256(const OxiRsaPrivateKey2048 *key,
      const uint8_t *label_ptr, size_t label_len,
      const uint8_t *ct_ptr, uint8_t *out_ptr,
      size_t out_max_len, size_t *out_actual_len)
    parameters:
      - { name: key, type: "const OxiRsaPrivateKey2048 *", direction: in, description: "Live handle" }
      - { name: label_ptr, type: "const uint8_t *", direction: in, description: "OAEP label bytes (must match encryption-time label)" }
      - { name: label_len, type: "size_t", direction: in, description: "Label length" }
      - { name: ct_ptr, type: "const uint8_t *", direction: in, description: "256-byte ciphertext" }
      - { name: out_ptr, type: "uint8_t *", direction: out, description: "Plaintext output buffer (≥ out_max_len bytes)" }
      - { name: out_max_len, type: "size_t", direction: in, description: "Output buffer capacity; must be ≥ 190" }
      - { name: out_actual_len, type: "size_t *", direction: out, description: "Receives recovered plaintext length on success" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on Manger-collapsed decode failure / Bellcore fault / out_max_len < 190, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

