      fips_gate: Operational

  - name: "Kmac128::finalize_into"
    module: oxicrypt-xof
    family: xof-hasher-finalize-into
    description: Bind the output length L = tag.len()*8 into the computation, then finalize and write exactly tag.len() bytes into tag; canonical for the xof-fixed-hasher finalize_into shape.
    signature: "pub fn finalize_into(&mut self, tag: &mut [u8]) -> Result<(), Error>"
    parameters:
      - name: self
        type: "&mut Kmac128"
        direction: in-out
        description: The KMAC instance.
      - name: tag
        type: "&mut [u8]"
        direction: out
        description: Output buffer; exactly tag.len() bytes are written.
        constraints:
          nullability: required
          valid_range: "any length; tag.len()*8 is bound in as L"
    returns:
      type: "Result<(), Error>"
      description: The tag is written to `tag`.
      error_variants:
        - name: NotOperational
          condition: The module is not in SelfTest or Operational, including after it entered the Error state since the object was built.
    preconditions:
      - description: Instance created via new(); finalize_into not already called.
    postconditions:
      - description: tag holds the KMAC tag for the chosen output length.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: KMAC binds the output length into the result, so a 32-byte tag is NOT a prefix of a 64-byte tag; for length-independent output use KmacXof128/256.
        wrong: |
          // Expecting tag32 == &tag64[..32] — it does NOT hold for KMAC.
          let mut tag32 = [0u8; 32];
          m.finalize_into(&mut tag32)?;
        right: |
          // Either commit to one fixed length, or use the XOF variant:
          let mut out = [0u8; 64];
          let mut x = KmacXof128::new(b"key", b"")?;
          x.update(b"msg"); x.finalize(); x.squeeze(&mut out)?;

