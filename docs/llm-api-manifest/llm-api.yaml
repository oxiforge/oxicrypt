  # ── C ABI (oxicrypt-ffi) ──────────────────────────────────────────
  # All symbols use the `oxi_` prefix; status codes are OxiResult discriminants.

  - name: oxi_init
    module: oxicrypt-ffi
    description: "Initialise the FIPS module with the given algorithm profile, running all power-up KATs."
    signature: "int oxi_init(int profile)"
    parameters:
      - name: profile
        type: int
        direction: in
        description: "0 = Unrestricted, 1 = CNSA 2.0, 2 = CNSA 1.0, 3 = Migration."
    returns:
      type: int
      description: "OxiResult discriminant: Ok on success, otherwise one of the error variants below."
      error_variants:
        - name: InvalidInput
          condition: An argument was not a valid domain element, such as a scalar out of range or a point not on the curve.
        - name: SelfTestFailed
          condition: A power-up known-answer test returned incorrect output during oxi_init.
    preconditions: []
    postconditions:
      - description: Module is in Operational state with the selected profile (on Ok).
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: oxi_abi_version
    module: oxicrypt-ffi
    description: "The ABI number of the C interface, independent of the release version, which changes only when the interface breaks compatibility and never when functions are added, and which the library's SONAME and macOS install name carry."
    signature: "int oxi_abi_version(void)"
    parameters: []
    returns:
      type: int
      description: "The ABI number, 1 for this interface."
    preconditions: []
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: oxi_active_profile
    module: oxicrypt-ffi
    description: "Query the currently active algorithm profile."
    signature: "int oxi_active_profile(void)"
    parameters: []
    returns:
      type: int
      description: "0 = Unrestricted, 1 = CNSA 2.0, 2 = CNSA 1.0, 3 = Migration."
    preconditions:
      - description: Module must be initialized.
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: oxi_integrity_status
    module: oxicrypt-ffi
    description: Query the pre-operational integrity test's status indicator, returning NotRun (0), Passed (1), SignatureInvalid (2), SlotInvalid (3, the unsigned template), Unreadable (4), CastNotRun (5), Unknown (6), Refused (7, the module refused a primitive so the test was not performed), NoVerifyKey (8), KeyMismatch (9) or SlotDamaged (10, a signed slot is damaged) for the first run in this process.
    signature: "int oxi_integrity_status(void)"
    returns:
      type: int
      description: The status-indicator discriminant for the first run, or 0 when the test has not run in this process.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: oxi_integrity_key_fingerprint
    module: oxicrypt-ffi
    description: Write the 32-byte SHA-256 fingerprint of the verifying key this library embeds, recorded when oxi_init's integrity test read the key, so it is available whether or not the test passed.
    signature: "int oxi_integrity_key_fingerprint(uint8_t *out, size_t out_len)"
    parameters:
    - name: out
      type: '*mut u8'
      direction: out
      description: Buffer receiving the fingerprint.
    - name: out_len
      type: usize
      constraints:
        min: 32
      direction: in
      description: Capacity of out in bytes.
    returns:
      type: int
      description: Ok (0) when written; NullPointer (10) for a null out; BufferTooSmall (11) when out_len is under 32; NotOperational (1) when the test has not read a key, which oxi_integrity_status distinguishes.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: oxi_integrity_status_detail
    module: oxicrypt-ffi
    description: Write the integrity test's failure in words as NUL-terminated UTF-8, naming the cause the status value cannot carry; *written receives the bytes needed including the NUL, so out_len 0 sizes the buffer.
    signature: "int oxi_integrity_status_detail(uint8_t *out, size_t out_len, size_t *written)"
    parameters:
    - name: out
      type: '*mut u8'
      direction: out
      description: Buffer receiving the text; may be null when out_len is 0.
    - name: out_len
      type: usize
      direction: in
      description: Capacity of out in bytes.
    - name: written
      type: '*mut usize'
      direction: out
      description: Receives the bytes the text needs including its NUL, or 0 when there is none.
    returns:
      type: int
      description: Ok (0) when written; NullPointer (10) for a null written or a null out with non-zero out_len; BufferTooSmall (11) when out_len is under *written; NotOperational (1) when the boot sequence's integrity test has not failed.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: oxi_is_operational
