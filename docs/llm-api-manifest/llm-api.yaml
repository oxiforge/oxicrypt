  - name: oxi_ctr_drbg_aes128_instantiate_no_df
    module: oxicrypt-ffi
    description: >-
      CTR_DRBG-AES-128 Instantiate, **no-df** variant (SP 800-90A
      §10.2.1.3.1). `seed_material` MUST be exactly 32 bytes (=
      AES-128 key + AES block); mismatch returns `InvalidInput = 5`.
      Caller is responsible for sourcing the seed as a full-entropy
