  # ── HMAC ──────────────────────────────────────────────────────────

  - name: "HmacSha256::new"
    module: oxicrypt-hmac
    family: hmac-new
    description: Create an HMAC-SHA-256 instance with the given key.
    signature: "pub fn HmacSha256::new(key: &[u8]) -> Result<Self, Error>"
    parameters:
      - name: key
        type: "&[u8]"
        direction: in
        description: HMAC key of any length; keys shorter than the 64-byte hash block size are zero-padded, longer keys are hashed first (FIPS 198-1 §4).
        constraints:
          nullability: required
          valid_range: "1+ bytes recommended; empty is technically valid"
    returns:
      type: "Result<HmacSha256, Error>"
      description: HMAC instance ready for update() calls.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: HMAC with this hash is blocked by the active profile.
    preconditions:
      - description: Module must be Operational.
    postconditions:
      - description: HMAC instance initialized with the key.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let mut mac = oxicrypt_hmac::HmacSha256::new(b"secret-key")?;
        mac.update(b"message");
        let tag = mac.finalize()?;  // [u8; 32]

  - name: "HmacSha256::update"
    module: oxicrypt-hmac
    description: Feed data into the HMAC computation; applies to all HMAC variants.
    signature: "pub fn update(&mut self, data: &[u8])"
    parameters:
      - name: self
        type: "&mut HmacSha256"
        direction: in-out
        description: The HMAC instance to update.
      - name: data
        type: "&[u8]"
        direction: in
        description: Data to absorb.
    returns:
      type: "()"
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: "HmacSha256::finalize"
    module: oxicrypt-hmac
    description: Compute and return the HMAC tag; takes &mut self (not consumed) and resets to the initial keyed state, so update may be called again.
    signature: "pub fn finalize(&mut self) -> Result<[u8; 32], Error>"
    parameters:
      - name: self
        type: "&mut HmacSha256"
        direction: in-out
        description: The HMAC instance.
    returns:
      type: "Result<[u8; 32], Error>"
      description: 32-byte HMAC-SHA-256 tag.
      error_variants:
        - name: NotOperational
          condition: The module is not in SelfTest or Operational, including after it entered the Error state since the object was built.
    postconditions:
      - description: Tag is returned. Instance resets to the initial key-padded state.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: HMAC finalize takes &mut self and is NOT consumed; it resets to the initial keyed state so update() may be called again.
        wrong: |
          let mac = HmacSha256::new(b"key")?;  // immutable — cannot call update
          let tag = mac.finalize()?;             // compile error: immutable binding
        right: |
          let mut mac = HmacSha256::new(b"key")?;
          mac.update(b"message");
          let tag = mac.finalize()?;  // mac still valid; can re-use for next message

