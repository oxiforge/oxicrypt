    parameters:
      - name: salt_ptr
        type: "const uint8_t *"
        direction: in
        description: Optional salt; pass NULL with salt_len=0 for the zero-salt default.
      - name: salt_len
        type: size_t
        direction: in
      - name: ikm_ptr
        type: "const uint8_t *"
        direction: in
      - name: ikm_len
        type: size_t
        direction: in
      - name: prk_out
        type: "uint8_t *"
        direction: out
        description: Output buffer, must be >= 32 bytes; receives the 32-byte PRK.
    returns:
