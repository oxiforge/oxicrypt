# ─────────────────────────────────────────────────────────────────────
# Functions
# ─────────────────────────────────────────────────────────────────────

functions:

  # ── Module lifecycle ──────────────────────────────────────────────

  - name: initialize_with_tests
    module: oxicrypt-module
    description: Initialize the module by running the integrity group and then every power-up KAT; transitions PowerOff -> SelfTest -> Operational, or to a terminal state on failure.
    signature: "pub fn initialize_with_tests(integrity: &[KatEntry], tests: &[KatEntry]) -> Result<(), Error>"
    parameters:
      - name: integrity
        type: "&[KatEntry]"
        direction: in
        description: The pre-operational integrity group, oxicrypt_integrity::KATS; an empty slice is refused.
        constraints:
          nullability: required
          valid_range: non-empty
      - name: tests
        type: "&[KatEntry]"
        direction: in
        description: The concatenated KATS slices of every approved algorithm crate the binary links.
        constraints:
          nullability: required
          valid_range: non-empty
    returns:
      type: "Result<(), Error>"
      description: Ok(()) if every entry passes, Err on the first failure.
      error_variants:
        - name: AlreadyInitialized
          condition: Another call already brought the module to Operational, or brought it there while this call waited.
        - name: AlreadyFailed
          condition: Another call's initialisation already failed, or failed while this call waited; the module stays in Error or IntegrityUnverified.
        - name: NotOperational
          condition: A conditional self-test latched Error while the power-up tests ran, or the call came from inside a self-test on the initialising thread (current SelfTest; nothing changes).
        - name: IntegrityNotAttested
          condition: The integrity slice was empty.
        - name: SelfTestFailed
          condition: Any KatEntry::run() returned Err, or the platform gave the calling thread no id the module can record (test is THREAD_ID_CHECK; the module latches Error).
    preconditions:
      - description: Module must be in PowerOff state.
        check: "oxicrypt_module::state() == State::PowerOff"
      - description: A binary passes the KATS of every approved algorithm crate it links, directly or through another dependency; the module refuses to become operational if any entry fails, and the C library's oxi_init, the ACVP harness and the oxi CLI each have a test that reads the binary's resolved dependency graph and fails when a linked algorithm crate's KATS are missing from their power-up set.
    postconditions:
      - description: Module is in Operational state (on success).
      - description: Module is in Error state after a failed KAT, or IntegrityUnverified after an empty integrity slice (terminal).
    thread_safety: thread-safe
    side_effects:
      - description: Sets global module state. Exactly once per process; concurrent callers resolve to one winner, whose thread alone runs the tests and alone passes require_self_test_started while they run. A test that unwinds leaves the module in Error.
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false
      fips_gate: PowerOff
    pitfalls:
      - description: Must be called exactly once before any crypto operation.
        wrong: |
          let digest = oxicrypt_sha::sha256(b"data")?;
          // Error: NotOperational
        right: |
          oxicrypt_module::initialize_with_tests(oxicrypt_integrity::KATS, &all_kats)?;
          let digest = oxicrypt_sha::sha256(b"data")?;

  - name: initialize_with_profile
    module: oxicrypt-module
    description: Initialize the module with a specific algorithm restriction profile and run the integrity group and all power-up KATs; KATs run all algorithms regardless of profile.
    signature: "pub fn initialize_with_profile(integrity: &[KatEntry], tests: &[KatEntry], profile: AlgorithmProfile) -> Result<(), Error>"
    parameters:
      - name: integrity
        type: "&[KatEntry]"
        direction: in
        description: The pre-operational integrity group, oxicrypt_integrity::KATS; an empty slice is refused.
      - name: tests
        type: "&[KatEntry]"
        direction: in
        description: The concatenated KATS slices of every approved algorithm crate the binary links.
      - name: profile
        type: AlgorithmProfile
        direction: in
        description: "Algorithm restriction policy: Unrestricted, Cnsa2, Cnsa1, or Migration."
    returns:
      type: "Result<(), Error>"
      description: Ok(()) if every entry passes.
      error_variants:
        - name: AlreadyInitialized
          condition: Another call already brought the module to Operational, or brought it there while this call waited.
        - name: AlreadyFailed
          condition: Another call's initialisation already failed, or failed while this call waited; the module stays in Error or IntegrityUnverified.
        - name: NotOperational
          condition: A conditional self-test latched Error while the power-up tests ran, or the call came from inside a self-test on the initialising thread (current SelfTest; nothing changes).
        - name: IntegrityNotAttested
          condition: The integrity slice was empty.
        - name: SelfTestFailed
          condition: Any KatEntry::run() returned Err, or the platform gave the calling thread no id the module can record (test is THREAD_ID_CHECK; the module latches Error).
    preconditions:
      - description: A binary passes the KATS of every approved algorithm crate it links, directly or through another dependency; the module refuses to become operational if any entry fails, and the C library's oxi_init, the ACVP harness and the oxi CLI each have a test that reads the binary's resolved dependency graph and fails when a linked algorithm crate's KATS are missing from their power-up set.
    thread_safety: thread-safe
    side_effects:
      - description: Sets global module state and algorithm profile. Once per process, under the same single-winner rule as initialize_with_tests.

  - name: require_allowed
    module: oxicrypt-module
    description: "Guard for algorithm-profile enforcement: Ok(()) if the service is permitted under the active profile, Err(AlgorithmRestricted) otherwise."
    signature: "pub fn require_allowed(service: Service) -> Result<(), Error>"
    parameters:
      - name: service
        type: Service
        direction: in
        description: The specific service variant to check.
    returns:
      type: "Result<(), Error>"
      description: Ok if allowed, Err(AlgorithmRestricted) if blocked.
      error_variants:
        - name: AlgorithmRestricted
          condition: The service is not permitted under the active profile.

  - name: active_profile
    module: oxicrypt-module
    description: Returns the active algorithm restriction profile.
    signature: "pub fn active_profile() -> AlgorithmProfile"
    returns:
      type: AlgorithmProfile
      description: "The profile set by initialize_with_profile, or Unrestricted when the module was initialized without one."

  - name: require_operational
    module: oxicrypt-module
    description: Guard returning Ok(()) if the module is Operational, Err otherwise; called internally by every approved-service function.
    signature: "pub fn require_operational() -> Result<(), Error>"
    parameters: []
    returns:
      type: "Result<(), Error>"
      description: Ok if Operational, Err otherwise.
      error_variants:
        - name: NotOperational
          condition: Module state is not Operational.
    preconditions: []
    postconditions: []
    thread_safety: thread-safe
    side_effects: []
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false
      fips_gate: null

  - name: require_self_test_started
    module: oxicrypt-module
    description: Guard returning Ok(()) if the module is Operational, or in SelfTest and called on the thread running the power-up self-tests, Err otherwise; called first by every public *_internal function.
    signature: "pub fn require_self_test_started() -> Result<(), Error>"
    parameters: []
    returns:
      type: "Result<(), Error>"
      description: Ok if Operational, or SelfTest on the initialising thread; Err otherwise.
      error_variants:
        - name: NotOperational
          condition: Module state is PowerOff, Error or IntegrityUnverified, or SelfTest and the caller is not the initialising thread.
    preconditions: []
    postconditions: []
    thread_safety: thread-safe
    side_effects: []
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false
      fips_gate: null

  - name: require_self_test_started_token
    module: oxicrypt-module
    description: The require_self_test_started check, returning a SelfTestStarted proof for a constructor that must not repeat the check inside a timed region.
    signature: "pub fn require_self_test_started_token() -> Result<SelfTestStarted, Error>"
    parameters: []
    returns:
      type: "Result<SelfTestStarted, Error>"
      description: The proof if Operational, or SelfTest on the initialising thread; Err otherwise.
      error_variants:
        - name: NotOperational
          condition: Module state is PowerOff, Error or IntegrityUnverified, or SelfTest and the caller is not the initialising thread.
    preconditions: []
    postconditions: []
    thread_safety: thread-safe
    side_effects: []
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false
      fips_gate: null

  # ── Hashing ───────────────────────────────────────────────────────

  - name: sha256
    module: oxicrypt-sha
    family: sha-oneshot
    description: One-shot SHA-256 hash.
    signature: "pub fn sha256(data: &[u8]) -> Result<[u8; 32], Error>"
    parameters:
      - name: data
        type: "&[u8]"
        direction: in
        description: Data to hash.
        constraints:
          nullability: required
          valid_range: "0..=2^64 - 1 bytes"
    returns:
      type: "Result<[u8; 32], Error>"
      description: 32-byte SHA-256 digest.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
        check: "oxicrypt_module::require_operational()"
    postconditions:
      - description: Returns the SHA-256 digest of the input.
    sequencing:
      must_call_before: [initialize_with_tests]
    thread_safety: thread-safe
    side_effects: []
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let digest = oxicrypt_sha::sha256(b"hello world")?;
        assert_eq!(digest.len(), 32);

  - name: "Sha256::new"
    module: oxicrypt-sha
    description: Create a streaming SHA-256 hasher.
    signature: "pub fn Sha256::new() -> Result<Self, Error>"
    parameters: []
    returns:
      type: "Result<Sha256, Error>"
      description: A new SHA-256 hasher ready to absorb data.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
        check: "oxicrypt_module::require_operational()"
    postconditions:
      - description: Hasher is ready for update() calls.
    sequencing:
      must_call_after:
        - update
        - finalize
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational

  - name: "Sha256::update"
    module: oxicrypt-sha
    description: Feed data into the streaming hasher.
    signature: "pub fn update(&mut self, data: &[u8])"
    parameters:
      - name: self
        type: "&mut Sha256"
        direction: in-out
        description: The hasher to update.
      - name: data
        type: "&[u8]"
        direction: in
        description: Data to absorb.
    returns:
      type: "()"
      description: No return value.
    preconditions:
      - description: Hasher was created via Sha256::new().
    postconditions:
      - description: Internal state updated with the provided data.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational

  - name: "Sha256::finalize"
    module: oxicrypt-sha
    description: Consume the hasher and return the digest.
    signature: "pub fn finalize(self) -> Result<[u8; 32], Error>"
    parameters:
      - name: self
        type: Sha256
        direction: in
        description: The hasher to finalize.
    returns:
      type: "Result<[u8; 32], Error>"
      description: 32-byte SHA-256 digest.
      error_variants:
        - name: NotOperational
          condition: The module is not in SelfTest or Operational, including after it entered the Error state since the object was built.
    preconditions:
      - description: Hasher was created and optionally updated.
    postconditions:
      - description: The hasher is consumed and cannot be used again.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: Finalize consumes the hasher. You cannot call update() after.
        wrong: |
          let mut h = Sha256::new()?;
          h.update(b"data");
          let d1 = h.finalize()?;
          h.update(b"more");  // compile error: h moved
        right: |
          let mut h = Sha256::new()?;
          h.update(b"data");
          h.update(b"more");
          let digest = h.finalize()?;

  - name: sha1
    module: oxicrypt-sha
    family: sha-oneshot
    description: One-shot SHA-1 hash.
    signature: "pub fn sha1(data: &[u8]) -> Result<[u8; 20], Error>"
    parameters:
      - name: data
        type: "&[u8]"
        direction: in
        description: Data to hash.
    returns:
      type: "Result<[u8; 20], Error>"
      description: 20-byte SHA-1 digest.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational

  - name: sha224
    module: oxicrypt-sha
    family: sha-oneshot
    description: One-shot SHA-224 hash.
