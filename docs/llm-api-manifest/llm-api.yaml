    kind: struct
    description: Cached LMS signing key wrapping LmsPrivateKey with a precomputed Merkle node table for O(H) signing (default-on alloc feature); STATEFUL, persist the wrapped key after every sign.
    fields:
      - name: key
        type: LmsPrivateKey
        description: "Wrapped stateful private key (secret; zeroized on Drop as usual)."
      - name: nodes
        type: "Vec<[u8; 32]>"
        description: Merkle node table in RFC 8554 numbering (root = 1, leaves at 2^H..2^(H+1), slot 0 unused).
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: true

