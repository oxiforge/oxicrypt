  - name: oxi_ecdh_p256_generate_keypair
    module: oxicrypt-ffi
    description: >-
      Generate a fresh ECDH P-256 key pair via the FIPS 186-5 §A.2.2
      rejection sampler driven by the supplied DRBG handle, run the
      IG 10.3.A pairwise consistency test as an ECDH-roundtrip
      against the RFC 5903 §8.1 responder keypair, and write the
      private/public bytes to the caller-provided buffers. Mirrors
      `oxi_dh3072_generate_keypair` shape and applies the same
      per-call-mutating-handle thread-safety contract: callers MUST
      serialise concurrent calls on the same DRBG pointer. Reuses
      `oxicrypt_ecdsa::p256_keygen::generate_p256_internal` so the
      same FIPS 186-5 §A.2.2 sampler serves both ECDH and ECDSA
      keygen on this curve (security-policy §4.8 ECDH-ECDSA-shared-
      keygen-primitive paragraph).
    signature: >-
      int oxi_ecdh_p256_generate_keypair(OxiHmacDrbgSha256 *drbg,
      uint8_t *private_out, uint8_t *public_out)
    parameters:
      - { name: drbg, type: "OxiHmacDrbgSha256 *", direction: in, description: "Live, instantiated HMAC-DRBG-SHA-256 handle" }
      - { name: private_out, type: "uint8_t *", direction: out, description: "32-byte big-endian private scalar d in [1, n-1]" }
      - { name: public_out, type: "uint8_t *", direction: out, description: "65-byte SEC1 uncompressed public key 0x04 || X(32) || Y(32) of d * G" }
    returns:
