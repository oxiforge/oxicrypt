  # ── KDF — PBKDF2 (SP 800-132) ────────────────────────────────────

  - name: "Pbkdf2HmacSha256::derive"
    module: oxicrypt-kdf
    description: PBKDF2 with HMAC-SHA-256 (SP 800-132, RFC 8018 §5.2), deriving out.len() bytes from password and salt over c iterations.
    signature: >-
      pub fn Pbkdf2HmacSha256::derive(password: &[u8], salt: &[u8],
      c: u32, out: &mut [u8]) -> Result<(), KdfError>
    parameters:
      - name: password
        type: "&[u8]"
        direction: in
        description: Password (secret).
      - name: salt
        type: "&[u8]"
        direction: in
        description: Salt (non-secret, unique per password); SP 800-132 recommends at least 16 bytes from an approved RBG.
      - name: c
        type: u32
        direction: in
        description: Iteration count; must be > 0 (panics if 0).
        constraints:
          valid_range: "1..=2^32-1"
      - name: out
        type: "&mut [u8]"
        direction: out
        description: Output buffer for derived key material.
        constraints:
          valid_range: "1..=(2^32-1)*32 bytes"
    returns:
      type: "Result<(), KdfError>"
      error_variants:
        - name: Module
          condition: Module not operational or service restricted.
        - name: OutputTooLong
          condition: "out.len() > (2^32-1) * 32"
    preconditions:
      - description: Module must be Operational.
      - description: c must be > 0.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: Low iteration counts make PBKDF2 vulnerable to offline dictionary attacks; SP 800-132 minimum is 1000, for password storage use >= 600000.
        wrong: |
          Pbkdf2HmacSha256::derive(password, salt, 1, &mut key)?;  // far too few
        right: |
          Pbkdf2HmacSha256::derive(password, salt, 600_000, &mut key)?;

  - name: pbkdf2_self_test_sha224
    module: oxicrypt-kdf
    description: The PBKDF2 power-up CAST, an SP 800-132 master key derived with PBKDF2-HMAC-SHA2-224 from a NIST ACVP-Server vector (iteration count 398, 224-bit salt, 240-bit key) and compared with the expected value; the PBKDF2 entry of KATS runs it.
    signature: "pub fn pbkdf2_self_test_sha224() -> Result<(), SelfTestFailure>"
    returns:
      type: "Result<(), SelfTestFailure>"
      error_variants:
        - name: SelfTestFailure
          condition: The derived master key differs from the expected value.
    preconditions:
      - description: None; it runs before the module is operational, and a binary normally runs it through KATS rather than directly.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: true
      fips_gate: null

  # ── TLS 1.3 KDF (RFC 8446 §7.1) ──────────────────────────────────

  - name: tls13_hkdf_expand_label
    module: oxicrypt-tls-kdf
    description: HKDF-Expand-Label (RFC 8446 §7.1), building the HkdfLabel wire structure and running HKDF-Expand to fill out; generic over the HMAC PRF.
    signature: >-
      pub fn tls13_hkdf_expand_label<P: PrfHmac<L>, const L: usize>(
      secret: &[u8], label: &[u8], context: &[u8], out: &mut [u8])
      -> Result<(), Error>
    parameters:
      - name: secret
        type: "&[u8]"
        direction: in
        description: "Pseudorandom key (PRK), L bytes (HMAC output size)."
      - name: label
        type: "&[u8]"
        direction: in
        description: "Short ASCII label (e.g. b\"c hs traffic\", b\"derived\")."
      - name: context
        type: "&[u8]"
        direction: in
        description: "Context bytes (typically transcript-hash digest)."
      - name: out
        type: "&mut [u8]"
        direction: out
        description: "Output buffer, at most 65535 bytes and at most 255 blocks of L bytes; zeroized on InvalidInput or a refusal during derivation, untouched when an entry check refuses."
    returns:
      type: "Result<(), Error>"
      error_variants:
        - name: NotOperational
          condition: Module not initialized, in SelfTest, or latched in Error state.
        - name: AlgorithmRestricted
          condition: Active AlgorithmProfile does not allow Service::Tls13Kdf.
        - name: InvalidInput
          condition: "out exceeds 65535 bytes or 255 blocks of L bytes, label is empty or longer than 249 bytes, or the context is longer than 255 bytes (RFC 8446 §7.1)."
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Tls13Kdf

  - name: tls13_derive_secret
    module: oxicrypt-tls-kdf
    description: Derive-Secret (RFC 8446 §7.1) = HKDF-Expand-Label(secret, label, transcript_hash, Hash.length); the caller computes the running transcript hash and passes it.
    signature: >-
      pub fn tls13_derive_secret<P: PrfHmac<L>, const L: usize>(
      secret: &[u8], label: &[u8], transcript_hash: &[u8],
      out: &mut [u8]) -> Result<(), Error>
    parameters:
      - name: secret
        type: "&[u8]"
        direction: in
        description: "Pseudorandom key (PRK), L bytes."
      - name: label
        type: "&[u8]"
        direction: in
        description: "Short ASCII label (e.g. b\"derived\", b\"c hs traffic\")."
      - name: transcript_hash
        type: "&[u8]"
        direction: in
        description: "Hash(messages) — pre-computed transcript-hash digest."
      - name: out
        type: "&mut [u8]"
        direction: out
        description: "Output buffer; typically Hash.length bytes for derived secrets."
    returns:
      type: "Result<(), Error>"
      error_variants:
        - name: NotOperational
          condition: Module not initialized, in SelfTest, or latched in Error state.
        - name: AlgorithmRestricted
          condition: Active AlgorithmProfile does not allow Service::Tls13Kdf.
        - name: InvalidInput
          condition: "out exceeds 65535 bytes or 255 blocks of L bytes, label is empty or longer than 249 bytes, or the context is longer than 255 bytes (RFC 8446 §7.1)."
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Tls13Kdf

  # ── TLS 1.2 KDF (RFC 5246, RFC 7627) ─────────────────────────────

  - name: tls12_prf
    module: oxicrypt-tls-kdf
    description: TLS 1.2 PRF (RFC 5246 §5), generic over HMAC (HmacSha256 or HmacSha384 in standard TLS 1.2); fills out with PRF-derived bytes.
    signature: 'pub fn tls12_prf<P: PrfHmac<L>, const L: usize>(secret: &[u8], label: &[u8], seed: &[u8], out: &mut [u8]) -> Result<(), Error>'
    parameters:
    - name: secret
      type: '&[u8]'
      direction: in
      description: TLS secret input, such as pre_master_secret or master_secret.
    - name: label
      type: '&[u8]'
      direction: in
      description: ASCII label string, such as b"master secret" or b"key expansion".
    - name: seed
      type: '&[u8]'
      direction: in
      description: Seed, typically client_random concatenated with server_random, or the session hash.
    - name: out
      type: '&mut [u8]'
      direction: out
      description: Output buffer filled with PRF bytes; any length is accepted.
    returns:
      type: Result<(), Error>
      error_variants:
      - name: NotOperational
        condition: Module not initialized, in SelfTest, or latched in Error state.
      - name: AlgorithmRestricted
        condition: Active AlgorithmProfile does not allow Service::Tls12Kdf.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Tls12Kdf

  - name: tls12_extended_master_secret
    module: oxicrypt-tls-kdf
    description: Derive the RFC 7627 extended master secret from the pre-master secret and session hash, then expand the key block from it.
    signature: 'pub fn tls12_extended_master_secret<P: PrfHmac<L>, const L: usize>(pre_master_secret: &[u8], session_hash: &[u8], server_random: &[u8], client_random: &[u8], key_block_out: &mut [u8]) -> Result<[u8; MASTER_SECRET_LEN], Error>'
    parameters:
    - name: pre_master_secret
      type: '&[u8]'
      direction: in
      description: Pre-master secret from the key-exchange step.
    - name: session_hash
      type: '&[u8]'
      direction: in
      description: RFC 7627 session hash over the handshake messages.
    - name: server_random
      type: '&[u8]'
      direction: in
      description: Server random for the key-expansion seed.
      constraints:
        valid_range: server_random.len() + client_random.len() must be <= 64
    - name: client_random
      type: '&[u8]'
      direction: in
      description: Client random for the key-expansion seed.
      constraints:
        valid_range: server_random.len() + client_random.len() must be <= 64
    - name: key_block_out
      type: '&mut [u8]'
      direction: out
      description: Output buffer filled with the expanded key block.
    returns:
      type: Result<[u8; 48], Error>
      description: The 48-byte extended master secret.
      error_variants:
      - name: NotOperational
        condition: Module not initialized, in SelfTest, or latched in Error state.
      - name: AlgorithmRestricted
        condition: Active AlgorithmProfile does not allow Service::Tls12Kdf.
    preconditions:
    - description: server_random.len() + client_random.len() must be at most 64; a violation panics on the internal assert rather than returning an error.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Tls12Kdf

  - name: tls12_master_secret
    module: oxicrypt-tls-kdf
    description: Derive the standard RFC 5246 §8.1 master secret from the pre-master secret and hello randoms, then expand the key block from it.
    signature: 'pub fn tls12_master_secret<P: PrfHmac<L>, const L: usize>(pre_master_secret: &[u8], client_hello_random: &[u8], server_hello_random: &[u8], server_random: &[u8], client_random: &[u8], key_block_out: &mut [u8]) -> Result<[u8; MASTER_SECRET_LEN], Error>'
    parameters:
    - name: pre_master_secret
      type: '&[u8]'
      direction: in
      description: Pre-master secret from the key-exchange step.
    - name: client_hello_random
      type: '&[u8]'
      direction: in
      description: Client hello random for the master-secret seed.
      constraints:
        valid_range: client_hello_random.len() + server_hello_random.len() must be <= 64
    - name: server_hello_random
      type: '&[u8]'
      direction: in
      description: Server hello random for the master-secret seed.
      constraints:
        valid_range: client_hello_random.len() + server_hello_random.len() must be <= 64
    - name: server_random
      type: '&[u8]'
      direction: in
      description: Server random for the key-expansion seed.
      constraints:
        valid_range: server_random.len() + client_random.len() must be <= 64
    - name: client_random
      type: '&[u8]'
      direction: in
      description: Client random for the key-expansion seed.
      constraints:
        valid_range: server_random.len() + client_random.len() must be <= 64
    - name: key_block_out
      type: '&mut [u8]'
      direction: out
      description: Output buffer filled with the expanded key block.
    returns:
      type: Result<[u8; 48], Error>
      description: The 48-byte master secret.
      error_variants:
      - name: NotOperational
        condition: Module not initialized, in SelfTest, or latched in Error state.
      - name: AlgorithmRestricted
        condition: Active AlgorithmProfile does not allow Service::Tls12Kdf.
    preconditions:
    - description: Each concatenated seed pair must be at most 64 bytes; a violation panics on the internal assert rather than returning an error.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Tls12Kdf

  # ── RSA ───────────────────────────────────────────────────────────

  - name: "RsaPrivateKey2048::sign_pkcs1_v15_sha256"
    module: oxicrypt-rsa
    description: Sign a message with RSA-2048 PKCS#1 v1.5 and SHA-256.
    signature: >-
      pub fn sign_pkcs1_v15_sha256(&self, msg: &[u8])
      -> Result<[u8; 256], Error>
    parameters:
      - name: self
        type: "&RsaPrivateKey2048"
        direction: in
        description: RSA private key (constructed via from_components or generate).
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to sign (hashed internally with SHA-256).
        constraints:
          valid_range: any length
    returns:
      type: "Result<[u8; 256], Error>"
      description: 256-byte RSA signature.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
      - description: Key must have been constructed (PCT passed).
    postconditions:
      - description: Returns a valid RSASSA-PKCS1-v1_5 signature; performs Bellcore verify-after-sign (IG D.G) internally.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: rsa_pkcs1_v15_verify_2048_sha256
    module: oxicrypt-rsa
    description: Verify an RSA-2048 PKCS#1 v1.5 SHA-256 signature.
    signature: >-
      pub fn rsa_pkcs1_v15_verify_2048_sha256(n: &[u8; 256], e: u64,
      msg: &[u8], sig: &[u8; 256]) -> bool
    parameters:
      - name: n
        type: "&[u8; 256]"
        direction: in
        description: RSA modulus (256 bytes, big-endian).
        constraints:
          size: 256
          encoding: big-endian
      - name: e
        type: u64
        direction: in
        description: Public exponent (typically 65537).
        constraints:
          valid_range: "odd, >= 65537"
      - name: msg
        type: "&[u8]"
        direction: in
        description: Original message that was signed.
      - name: sig
        type: "&[u8; 256]"
        direction: in
        description: Signature to verify.
        constraints:
          size: 256
          encoding: big-endian
    returns:
      type: bool
      description: true if signature is valid, false otherwise.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: false  # Verification is public-data only
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational

  # ── ECDSA ─────────────────────────────────────────────────────────

  - name: "EcdsaP256PrivateKey::generate"
    module: oxicrypt-ecdsa
    description: Generate an ECDSA P-256 key pair with DRBG-backed rejection sampling (FIPS 186-5 §A.2.2) and a pairwise consistency test.
    signature: >-
      pub fn generate(drbg: &mut HmacDrbgSha256)
      -> Result<Self, Error>
    parameters:
      - name: drbg
        type: "&mut HmacDrbgSha256"
        direction: in-out
        description: Instantiated HMAC-DRBG for keygen randomness; must already be instantiated with sufficient entropy.
    returns:
      type: "Result<EcdsaP256PrivateKey, Error>"
      description: New key handle with (d, Q) pair.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: ConditionalTestFailed
          condition: Pairwise consistency test (sign-then-verify) failed.
    preconditions:
      - description: Module must be Operational.
      - description: DRBG must be instantiated.
    postconditions:
      - description: Key handle contains a valid (d, Q) pair where Q = d * G, verified consistent by the PCT.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: "EcdsaP256PrivateKey::sign_sha256"
    module: oxicrypt-ecdsa
    description: Sign a message with ECDSA P-256 and SHA-256.
    signature: >-
      pub fn sign_sha256(&self, drbg: &mut HmacDrbgSha256, msg: &[u8])
      -> Result<[u8; 64], Error>
    parameters:
      - name: self
        type: "&EcdsaP256PrivateKey"
        direction: in
        description: Private key handle.
      - name: drbg
        type: "&mut HmacDrbgSha256"
        direction: in-out
        description: Instantiated DRBG for per-signature k sampling.
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to sign (hashed internally with SHA-256).
    returns:
      type: "Result<[u8; 64], Error>"
      description: "64-byte signature: r (32 bytes) || s (32 bytes), big-endian."
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
      - description: DRBG must be instantiated.
    postconditions:
      - description: Returns a valid ECDSA-P256-SHA256 signature; the per-signature nonce k is sampled via the FIPS 186-5 §A.2.2 rejection loop.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let key = EcdsaP256PrivateKey::generate(&mut drbg)?;
        let sig = key.sign_sha256(&mut drbg, b"hello")?;
        assert_eq!(sig.len(), 64);

  - name: verify
    module: oxicrypt-ecdsa
    description: Verify an ECDSA P-256 SHA-256 signature.
    signature: >-
      pub fn verify(pk: &[u8; 65], msg: &[u8], sig: &[u8; 64])
      -> Result<bool, Error>
    parameters:
      - name: pk
        type: "&[u8; 65]"
        direction: in
        description: Uncompressed SEC1 public key 0x04 || X(32) || Y(32); full SP 800-56Ar3 §5.6.2.3.3 point validation is performed.
        constraints:
          size: 65
          encoding: "SEC1 uncompressed (first byte must be 0x04)"
      - name: msg
        type: "&[u8]"
        direction: in
        description: Original message.
      - name: sig
        type: "&[u8; 64]"
        direction: in
        description: "Signature: r (32 bytes) || s (32 bytes), big-endian."
        constraints:
          size: 64
          encoding: big-endian
    returns:
      type: "Result<bool, Error>"
      description: Ok(true) if valid, Ok(false) if invalid.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: InvalidInput
          condition: Public key fails point validation.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: false  # Verification operates on public data only
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational

  # ── Ed25519 ───────────────────────────────────────────────────────

  - name: "Ed25519PrivateKey::sign"
    module: oxicrypt-eddsa
    description: Sign a message with Ed25519 (RFC 8032); deterministic, no per-signature DRBG draw.
    signature: "pub fn sign(&self, msg: &[u8]) -> Result<[u8; 64], Error>"
    parameters:
      - name: self
        type: "&Ed25519PrivateKey"
        direction: in
        description: Ed25519 private key handle.
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to sign.
    returns:
      type: "Result<[u8; 64], Error>"
      description: 64-byte Ed25519 signature.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
    postconditions:
      - description: Returns a valid RFC 8032 Ed25519 signature.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── ECDH ──────────────────────────────────────────────────────────

  - name: compute_shared_secret_p256
    module: oxicrypt-ecdh
    description: Compute ECDH P-256 shared secret (SP 800-56Ar3 CDH); returns the x-coordinate of d * Q.
    signature: >-
      pub fn compute_shared_secret_p256(d: &[u8; 32], peer_pk: &[u8; 65])
      -> Result<[u8; 32], Error>
    parameters:
      - name: d
        type: "&[u8; 32]"
        direction: in
        description: Our private scalar (big-endian).
        constraints:
          size: 32
          encoding: big-endian
      - name: peer_pk
        type: "&[u8; 65]"
        direction: in
        description: Peer's uncompressed SEC1 public key (0x04 || X || Y); point validation performed internally.
        constraints:
          size: 65
          encoding: "SEC1 uncompressed (first byte must be 0x04)"
    returns:
      type: "Result<[u8; 32], Error>"
      description: 32-byte shared secret (x-coordinate); feed to a KDF, do NOT use directly as a key.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: InvalidInput
          condition: Peer public key fails point validation.
    preconditions:
      - description: Module must be Operational.
      - description: Peer public key must be a valid P-256 point.
    postconditions:
      - description: Returns the x-coordinate of d * peer_pk; the caller MUST pass this through a KDF before use as keying material.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: The raw ECDH shared secret must not be used directly as a symmetric key; always derive through a KDF (HKDF, SP 800-56Cr2).
        wrong: |
          let key_bytes = compute_shared_secret_p256(&d, &pk)?;
          let aes_key = Aes256Key::new(&key_bytes)?;  // WRONG — no KDF
        right: |
          let z = compute_shared_secret_p256(&d, &pk)?;
          let mut okm = [0u8; 32];
          hkdf_sha256(&salt, &z, &info, &mut okm)?;
          let aes_key = Aes256Key::new(&okm)?;

  - name: compute_shared_secret_p384
    module: oxicrypt-ecdh
    description: Compute ECDH P-384 shared secret (SP 800-56Ar3 CDH); returns the x-coordinate of d * Q.
    signature: >-
      pub fn compute_shared_secret_p384(d: &[u8; 48], peer_pk: &[u8; 97])
      -> Result<[u8; 48], Error>
    parameters:
      - name: d
        type: "&[u8; 48]"
        direction: in
        description: Our private scalar (big-endian).
        constraints:
          size: 48
          encoding: big-endian
      - name: peer_pk
        type: "&[u8; 97]"
        direction: in
        description: Peer's uncompressed SEC1 public key (0x04 || X || Y); point validation performed internally.
        constraints:
          size: 97
          encoding: "SEC1 uncompressed (first byte must be 0x04)"
    returns:
      type: "Result<[u8; 48], Error>"
      description: 48-byte shared secret (x-coordinate); feed to a KDF, do NOT use directly as a key.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: InvalidInput
          condition: Peer public key fails point validation.
    preconditions:
      - description: Module must be Operational.
      - description: Peer public key must be a valid P-384 point.
    postconditions:
      - description: Returns the x-coordinate of d * peer_pk; the caller MUST pass this through a KDF before use as keying material.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: generate_keypair_p256
    module: oxicrypt-ecdh
    description: Generate a fresh ECDH P-256 key pair (d, Q) via the FIPS 186-5 §A.2.2 rejection sampler driven by the supplied DRBG, then run the IG 10.3.A pairwise consistency test before returning.
    signature: >-
