  - name: "Kmac128::new"
    module: oxicrypt-xof
    family: xof-hasher-new
    description: Create a KMAC128 keyed MAC with key and customization string S (SP 800-185 §4), followed by update* then finalize_into for a fixed-length tag.
    signature: "pub fn Kmac128::new(key: &[u8], s: &[u8]) -> Result<Self, Error>"
    parameters:
      - name: key
        type: "&[u8]"
        direction: in
        description: KMAC key K (sensitive security parameter) of any length; encode_string-framed and bytepad-padded to the rate internally (SP 800-185 §4).
        constraints:
          nullability: required
          valid_range: "any length; empty is technically valid"
      - name: s
        type: "&[u8]"
        direction: in
        description: Customization string S for domain separation.
        constraints:
          nullability: required
          valid_range: "any length, including empty"
    returns:
      type: "Result<Kmac128, Error>"
      description: A new KMAC128 instance ready to absorb message data.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: The SHA-3 derived function is blocked by the active profile.
    preconditions:
      - description: Module must be Operational.
        check: "oxicrypt_module::require_operational()"
    postconditions:
      - description: Instance initialized with the key; ready for update() calls.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let mut m = oxicrypt_xof::Kmac128::new(b"secret-key", b"")?;
        m.update(b"message");
        let mut tag = [0u8; 32];
        m.finalize_into(&mut tag);

  - name: "Kmac128::update"
    module: oxicrypt-xof
    family: xof-hasher-update
    description: Feed message data into the KMAC computation; legal only before finalize_into / finalize.
    signature: "pub fn update(&mut self, data: &[u8])"
    parameters:
      - name: self
        type: "&mut Kmac128"
        direction: in-out
        description: The KMAC instance to update.
      - name: data
        type: "&[u8]"
        direction: in
        description: Message data to absorb.
    returns:
      type: "()"
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: "Kmac128::finalize_into"
    module: oxicrypt-xof
    family: xof-hasher-finalize-into
    description: Bind the output length L = tag.len()*8 into the computation, then finalize and write exactly tag.len() bytes into tag; canonical for the xof-fixed-hasher finalize_into shape.
    signature: "pub fn finalize_into(&mut self, tag: &mut [u8])"
    parameters:
      - name: self
        type: "&mut Kmac128"
        direction: in-out
        description: The KMAC instance.
      - name: tag
        type: "&mut [u8]"
        direction: out
        description: Output buffer; exactly tag.len() bytes are written.
        constraints:
          nullability: required
          valid_range: "any length; tag.len()*8 is bound in as L"
    returns:
      type: "()"
      description: No return value; the tag is written to `tag`.
    preconditions:
      - description: Instance created via new(); finalize_into not already called.
    postconditions:
      - description: tag holds the KMAC tag for the chosen output length.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: KMAC binds the output length into the result, so a 32-byte tag is NOT a prefix of a 64-byte tag; for length-independent output use KmacXof128/256.
        wrong: |
          // Expecting tag32 == &tag64[..32] — it does NOT hold for KMAC.
          let mut tag32 = [0u8; 32];
          m.finalize_into(&mut tag32);
        right: |
          // Either commit to one fixed length, or use the XOF variant:
          let mut out = [0u8; 64];
          let mut x = KmacXof128::new(b"key", b"")?;
          x.update(b"msg"); x.finalize(); x.squeeze(&mut out);

