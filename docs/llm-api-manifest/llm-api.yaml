      RSA-2048 private-key handle into the caller buffer. The
      modulus is exactly the one the IG 10.3.A PCT verified
      against at handle construction time, so any signature
      produced by `oxi_rsa_2048_sign_pkcs1_v15_sha256` or
      `oxi_rsa_2048_sign_pss_sha256` on the same handle is
      guaranteed to verify under `(n, e)`.
    signature: >-
      int oxi_rsa_2048_modulus(const OxiRsaPrivateKey2048 *key,
      uint8_t *modulus_out)
    parameters:
      - { name: key, type: "const OxiRsaPrivateKey2048 *", direction: in, description: "Live handle" }
      - { name: modulus_out, type: "uint8_t *", direction: out, description: "256-byte big-endian modulus buffer" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 1 = NotOperational on finalised handle, 10 = NullPointer)."
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true

  - name: oxi_rsa_2048_public_exponent
    module: oxicrypt-ffi
    description: >-
