    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── KDF — PBKDF2 (SP 800-132) ────────────────────────────────────

  - name: "Pbkdf2HmacSha256::derive"
    module: oxicrypt-kdf
    description: PBKDF2 with HMAC-SHA-256 (SP 800-132, RFC 8018 §5.2), deriving out.len() bytes from password and salt over c iterations.
    signature: >-
      pub fn Pbkdf2HmacSha256::derive(password: &[u8], salt: &[u8],
      c: u32, out: &mut [u8]) -> Result<(), KdfError>
    parameters:
      - name: password
        type: "&[u8]"
        direction: in
        description: Password (secret).
      - name: salt
        type: "&[u8]"
        direction: in
        description: Salt (non-secret, unique per password); SP 800-132 recommends at least 16 bytes from an approved RBG.
      - name: c
        type: u32
        direction: in
        description: Iteration count; must be > 0 (panics if 0).
        constraints:
          valid_range: "1..=2^32-1"
      - name: out
        type: "&mut [u8]"
        direction: out
        description: Output buffer for derived key material.
        constraints:
          valid_range: "1..=(2^32-1)*32 bytes"
    returns:
      type: "Result<(), KdfError>"
      error_variants:
        - name: Module
          condition: Module not operational or service restricted.
        - name: OutputTooLong
          condition: "out.len() > (2^32-1) * 32"
    preconditions:
      - description: Module must be Operational.
      - description: c must be > 0.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: Low iteration counts make PBKDF2 vulnerable to offline dictionary attacks; SP 800-132 minimum is 1000, for password storage use >= 600000.
        wrong: |
          Pbkdf2HmacSha256::derive(password, salt, 1, &mut key)?;  // far too few
        right: |
          Pbkdf2HmacSha256::derive(password, salt, 600_000, &mut key)?;

  # ── TLS 1.3 KDF (RFC 8446 §7.1) ──────────────────────────────────

  - name: tls13_hkdf_expand_label
    module: oxicrypt-tls-kdf
    description: HKDF-Expand-Label (RFC 8446 §7.1), building the HkdfLabel wire structure and running HKDF-Expand to fill out; generic over the HMAC PRF.
    signature: >-
      pub fn tls13_hkdf_expand_label<P: PrfHmac<L>, const L: usize>(
      secret: &[u8], label: &[u8], context: &[u8], out: &mut [u8])
      -> Result<(), Error>
    parameters:
      - name: secret
        type: "&[u8]"
        direction: in
        description: "Pseudorandom key (PRK), L bytes (HMAC output size)."
      - name: label
        type: "&[u8]"
        direction: in
        description: "Short ASCII label (e.g. b\"c hs traffic\", b\"derived\")."
      - name: context
        type: "&[u8]"
        direction: in
        description: "Context bytes (typically transcript-hash digest)."
      - name: out
        type: "&mut [u8]"
        direction: out
        description: "Output buffer; a length above 65535 saturates the HkdfLabel length field at u16::MAX rather than erroring, so the caller must keep it within u16."
    returns:
      type: "Result<(), Error>"
      error_variants:
        - name: NotOperational
          condition: Module not initialized, in SelfTest, or latched in Error state.
        - name: AlgorithmRestricted
          condition: Active AlgorithmProfile does not allow Service::Tls13Kdf.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Tls13Kdf

  - name: tls13_derive_secret
    module: oxicrypt-tls-kdf
    description: Derive-Secret (RFC 8446 §7.1) = HKDF-Expand-Label(secret, label, transcript_hash, Hash.length); the caller computes the running transcript hash and passes it.
    signature: >-
      pub fn tls13_derive_secret<P: PrfHmac<L>, const L: usize>(
      secret: &[u8], label: &[u8], transcript_hash: &[u8],
      out: &mut [u8]) -> Result<(), Error>
    parameters:
      - name: secret
        type: "&[u8]"
        direction: in
        description: "Pseudorandom key (PRK), L bytes."
      - name: label
        type: "&[u8]"
        direction: in
        description: "Short ASCII label (e.g. b\"derived\", b\"c hs traffic\")."
      - name: transcript_hash
        type: "&[u8]"
        direction: in
        description: "Hash(messages) — pre-computed transcript-hash digest."
      - name: out
        type: "&mut [u8]"
        direction: out
        description: "Output buffer; typically Hash.length bytes for derived secrets."
    returns:
      type: "Result<(), Error>"
      error_variants:
        - name: NotOperational
          condition: Module not initialized, in SelfTest, or latched in Error state.
        - name: AlgorithmRestricted
          condition: Active AlgorithmProfile does not allow Service::Tls13Kdf.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Tls13Kdf

  # ── TLS 1.2 KDF (RFC 5246, RFC 7627) ─────────────────────────────

  - name: tls12_prf
    module: oxicrypt-tls-kdf
    description: TLS 1.2 PRF (RFC 5246 §5), generic over HMAC (HmacSha256 or HmacSha384 in standard TLS 1.2); fills out with PRF-derived bytes.
    signature: 'pub fn tls12_prf<P: PrfHmac<L>, const L: usize>(secret: &[u8], label: &[u8], seed: &[u8], out: &mut [u8]) -> Result<(), Error>'
    parameters:
    - name: secret
      type: '&[u8]'
      direction: in
      description: TLS secret input, such as pre_master_secret or master_secret.
    - name: label
      type: '&[u8]'
      direction: in
      description: ASCII label string, such as b"master secret" or b"key expansion".
    - name: seed
      type: '&[u8]'
      direction: in
      description: Seed, typically client_random concatenated with server_random, or the session hash.
    - name: out
      type: '&mut [u8]'
      direction: out
      description: Output buffer filled with PRF bytes; any length is accepted.
    returns:
      type: Result<(), Error>
      error_variants:
      - name: NotOperational
        condition: Module not initialized, in SelfTest, or latched in Error state.
      - name: AlgorithmRestricted
        condition: Active AlgorithmProfile does not allow Service::Tls12Kdf.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Tls12Kdf

  - name: tls12_extended_master_secret
    module: oxicrypt-tls-kdf
    description: Derive the RFC 7627 extended master secret from the pre-master secret and session hash, then expand the key block from it.
    signature: 'pub fn tls12_extended_master_secret<P: PrfHmac<L>, const L: usize>(pre_master_secret: &[u8], session_hash: &[u8], server_random: &[u8], client_random: &[u8], key_block_out: &mut [u8]) -> Result<[u8; MASTER_SECRET_LEN], Error>'
    parameters:
    - name: pre_master_secret
      type: '&[u8]'
      direction: in
      description: Pre-master secret from the key-exchange step.
    - name: session_hash
      type: '&[u8]'
      direction: in
      description: RFC 7627 session hash over the handshake messages.
    - name: server_random
      type: '&[u8]'
      direction: in
      description: Server random for the key-expansion seed.
      constraints:
        valid_range: server_random.len() + client_random.len() must be <= 64
    - name: client_random
      type: '&[u8]'
      direction: in
      description: Client random for the key-expansion seed.
      constraints:
        valid_range: server_random.len() + client_random.len() must be <= 64
    - name: key_block_out
      type: '&mut [u8]'
      direction: out
      description: Output buffer filled with the expanded key block.
    returns:
      type: Result<[u8; 48], Error>
      description: The 48-byte extended master secret.
      error_variants:
      - name: NotOperational
        condition: Module not initialized, in SelfTest, or latched in Error state.
      - name: AlgorithmRestricted
        condition: Active AlgorithmProfile does not allow Service::Tls12Kdf.
    preconditions:
    - description: server_random.len() + client_random.len() must be at most 64; a violation panics on the internal assert rather than returning an error.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Tls12Kdf

  - name: tls12_master_secret
    module: oxicrypt-tls-kdf
    description: Derive the standard RFC 5246 §8.1 master secret from the pre-master secret and hello randoms, then expand the key block from it.
    signature: 'pub fn tls12_master_secret<P: PrfHmac<L>, const L: usize>(pre_master_secret: &[u8], client_hello_random: &[u8], server_hello_random: &[u8], server_random: &[u8], client_random: &[u8], key_block_out: &mut [u8]) -> Result<[u8; MASTER_SECRET_LEN], Error>'
    parameters:
    - name: pre_master_secret
      type: '&[u8]'
