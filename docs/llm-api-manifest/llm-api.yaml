  # DH-3072 (RFC 3526 Group 15, SP 800-56Ar3 §5.7.1.1) — one stateless
  # entry point computing the finite-field DH primitive Z = y^x mod p
  # over the 3072-bit safe prime. DRBG-driven keygen
  # (oxicrypt_dh::generate_keypair_3072) deferred to a post-DRBG
  # follow-up per stabilized arc pattern #1.

  - name: oxi_dh3072_compute_shared_secret
    module: oxicrypt-ffi
    description: >-
      Compute the SP 800-56Ar3 §5.7.1.1 finite-field DH shared secret
      over RFC 3526 Group 15 (3072-bit safe prime, generator `g = 2`):
      `Z = y^x mod p`. Reads exactly 384 bytes from `x_ptr` (the
      caller's private key, big-endian, in `[1, q − 1]` where
      `q = (p − 1) / 2`) and exactly 384 bytes from
      `peer_public_key_ptr` (the peer's public key, big-endian, in
      `[2, p − 2]`). Writes 384 bytes (the raw shared secret `Z`,
      big-endian) into `shared_secret_out`. The shared secret is the
      **raw** FFC-DH output — the caller MUST run an SP 800-56C
      Rev. 2 extractor (HKDF, KBKDF) over `Z` before using it as
      keying material; same composition discipline as ECDH (see
      security-policy §4.8). Peer public key undergoes SP 800-56Ar3
      §5.6.2.3.1 **partial** validation (`2 ≤ y ≤ p − 2`) — distinct
      from ECDH's §5.6.2.3.3 **full** validation; the differential
      is upstream-mandated and FIPS-correct because safe-prime FFC
      groups have cofactor 2 and `[2, p − 2]` already excludes the
      sole order-2 element `p − 1` (see security-policy §4.8 FFC vs
      ECC validation paragraph). Errors: `InvalidInput = 5` covers
      non-canonical private key `x`, peer-key validation failure,
      OR the degenerate `Z == 1` outcome (the SP 800-56Ar3 §5.7.1.1
      "shall fail" condition).
    signature: >-
      int oxi_dh3072_compute_shared_secret(const uint8_t *x_ptr,
      const uint8_t *peer_public_key_ptr,
      uint8_t *shared_secret_out)
    parameters:
      - { name: x_ptr, type: "const uint8_t *", direction: in, description: "384-byte private key x in [1, q-1] (big-endian; the secret material)" }
      - { name: peer_public_key_ptr, type: "const uint8_t *", direction: in, description: "384-byte peer public key y in [2, p-2] (big-endian)" }
      - { name: shared_secret_out, type: "uint8_t *", direction: out, description: "Output buffer >= 384 bytes; receives the raw shared secret Z (big-endian)" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on non-canonical x, peer-key validation failure, or Z==1, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_dh3072_generate_keypair
    module: oxicrypt-ffi
    description: >-
      Generate a DH-3072 key pair `(private_key, public_key)` from the
      caller-supplied DRBG handle (RFC 3526 Group 15, SP 800-56Ar3
      §5.7.1.1). The private key `x` is sampled from `[1, q − 1]` via
      HMAC-DRBG-SHA-256 rejection sampling. The public key is
      `y = 2^x mod p`. The DRBG handle's
      internal `(K, V, reseed_counter)` state mutates during the
      rejection-sampling loop. **First C ABI surface to consume an
      opaque DRBG handle as a parameter** — establishes the pattern
      that future DRBG-driven keygen surfaces (RSA keygen, ECDSA
      generate, ECDH generate) will follow. Caller MUST instantiate
      the DRBG via `oxi_hmac_drbg_sha256_instantiate` before this
      call; an uninstantiated DRBG manifests as
      `OxiResult::InvalidInput = 5` (the upstream `Option::None` from
      DRBG generate failure collapses to `Err(InvalidInput)` in the
      gated public API). Caller MUST also serialize all calls on the
      same DRBG handle pointer per the per-call-mutating-handle
      thread-safety contract. Forwards to
      `oxicrypt_dh::generate_keypair_3072`.
    signature: >-
      int oxi_dh3072_generate_keypair(OxiHmacDrbgSha256 *drbg,
      uint8_t *private_out, uint8_t *public_out)
    parameters:
      - { name: drbg, type: "OxiHmacDrbgSha256 *", direction: in, description: "Live, instantiated HMAC_DRBG-SHA-256 handle from oxi_hmac_drbg_sha256_new + oxi_hmac_drbg_sha256_instantiate" }
      - { name: private_out, type: "uint8_t *", direction: out, description: "384-byte big-endian private key x" }
      - { name: public_out, type: "uint8_t *", direction: out, description: "384-byte big-endian public key y = 2^x mod p" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on DRBG-uninstantiated or rejection-sampling exhaustion, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  # RSA verify (FIPS 186-5 §5.4 / RFC 8017 §8) — six stateless entry
  # points across {2048, 3072, 4096} × {PKCS#1 v1.5, PSS}, all hash-
  # locked to SHA-256 (the only hash the upstream RSA crate currently
  # exposes for the 3072 and 4096 sizes). All six map upstream Err to
  # TagMismatch=22 to maintain the cross-family verify-mismatch
  # convention even though the upstream API collapses signature-
  # invalid and input-decode-fail into Err(InvalidInput); see security-
  # policy §4.8 RSA-Err-mapping paragraph for the boundary rationale.

  - name: oxi_rsa_pkcs1_v15_verify_2048_sha256
    module: oxicrypt-ffi
    description: >-
      Verify an RSASSA-PKCS#1-v1.5 signature with a 2048-bit RSA
      public key, SHA-256 hash (FIPS 186-5 §5.4 / RFC 8017 §8.2).
      Reads exactly 256 bytes from `n_ptr` (modulus, big-endian),
      takes the public exponent `e` as `uint64_t`, reads `msg_len`
      bytes from `msg_ptr`, and reads exactly 256 bytes from
      `sig_ptr`. Returns `OxiResult::Ok = 0` on a valid signature,
      `TagMismatch = 22` for any verification failure (upstream
      collapses signature-invalid and input-decode-fail into a
      single Err). Forwards to
      `oxicrypt_rsa::rsa_pkcs1_v15_verify_2048_sha256`.
    signature: >-
      int oxi_rsa_pkcs1_v15_verify_2048_sha256(const uint8_t *n_ptr,
      uint64_t e, const uint8_t *msg_ptr, size_t msg_len,
      const uint8_t *sig_ptr)
    parameters:
      - { name: n_ptr, type: "const uint8_t *", direction: in, description: "256-byte RSA-2048 public modulus, big-endian" }
      - { name: e, type: uint64_t, direction: in, description: "Public exponent (common values 3, 17, 65537 = F4)" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in }
      - { name: msg_len, type: size_t, direction: in }
      - { name: sig_ptr, type: "const uint8_t *", direction: in, description: "256-byte signature, big-endian" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 22 = TagMismatch on any verify failure, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: true

