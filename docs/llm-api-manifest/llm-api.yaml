          condition: "A library without oxi_abi_version states another release version."
        - name: SelfTestFailed
          condition: "The library's power-up self-tests failed."
        - name: NotOperational
          condition: "An earlier initialisation of the library failed."
        - name: InvalidInput
          condition: "The profile code is unknown to the library."
        - name: KeyFingerprint
          condition: "The library embeds another verifying key than the pinned one."
        - name: ProfileMismatch
          condition: "The library is initialised with another profile."
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

