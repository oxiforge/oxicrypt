    returns:
      type: "Option<&'static str>"
      description: The first failure's text, or None until the boot sequence's integrity test has failed.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: verify_key_fingerprint
    module: oxicrypt-integrity
    description: The fingerprint of the verifying key this module embeds, recorded by the integrity test from the key record it read, so it equals the fingerprint oxicrypt-integrity-sign --show prints for the file.
    signature: 'pub fn verify_key_fingerprint() -> Option<[u8; 32]>'
    returns:
      type: 'Option<[u8; 32]>'
      description: The fingerprint, or None until the test has read the key in this process and for a module built without one.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: ml_dsa_cast
    module: oxicrypt-integrity
    description: The integrity technique's cryptographic algorithm self-test, the ML-DSA-87 signature-verification CAST (oxicrypt_ml_dsa::verify_cast), which must accept a NIST vector's valid signature and reject it with one bit flipped; first in KATS, and its pass, with sha256_cast's, is required before verify_loaded_image runs.
    signature: 'pub fn ml_dsa_cast() -> Result<(), SelfTestFailure>'
    returns:
      type: 'Result<(), SelfTestFailure>'
      description: Ok when the known-answer test passes; a failure of a test that ran latches the module into Error and withdraws the CAST's pass on every path, while a call the module refuses runs nothing and changes nothing.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: true

  - name: sha256_cast
    module: oxicrypt-integrity
    description: The SHA-256 CAST (oxicrypt_sha::sha256::self_test) for the SHA-256 key fingerprint the integrity test computes; second in KATS, and its pass, with ml_dsa_cast's, is required before verify_loaded_image runs.
    signature: 'pub fn sha256_cast() -> Result<(), SelfTestFailure>'
    returns:
      type: 'Result<(), SelfTestFailure>'
      description: Ok when the known-answer test passes; a failure latches the module into Error and withdraws the CAST's pass on every path, while a call the module refuses runs nothing and changes nothing.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: true

  - name: file_signature_input
    module: oxicrypt-integrity
    description: Build a slot's signed message M′ from the file bytes of an image — MESSAGE_PREFIX, then the slot without its signature field, then each Plain, Relative and FileOnly entry's file bytes in table order — the signer's half of the message the verifier builds from the loaded image.
    signature: 'pub fn file_signature_input(image: &[u8], slot_bytes: &[u8], slot: &SlotImage, unslid: &dyn Fn(u64) -> Option<u64>) -> Result<Vec<u8>, IntegrityError>'
    parameters:
    - name: image
      type: '&[u8]'
      direction: in
      description: Full contents of the file.
    - name: slot_bytes
      type: '&[u8]'
      direction: in
      description: The slot's SLOT_SIZE bytes.
    - name: slot
      type: '&SlotImage'
      direction: in
      description: The same slot, parsed.
    - name: unslid
      type: '&dyn Fn(u64) -> Option<u64>'
      direction: in
      description: The format's decoder from a Relative word as the file holds it to its unslid value; the identity for ELF and PE.
    returns:
      type: 'Result<Vec<u8>, IntegrityError>'
      description: The message ML-DSA.Sign_internal signs and ML-DSA.Verify_internal verifies, M′ = 0x00 || 18 || "oxicrypt-integrity" || M.
      error_variants:
      - name: SlotInvalid
        condition: An entry falls outside image, or slot_bytes is not SLOT_SIZE long.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: key::key_record_address
    module: oxicrypt-integrity
    description: Runtime address of the embedded key record, which the verifier reads through the byte-acquisition mechanism.
    signature: 'pub fn key_record_address() -> usize'
    returns:
      type: usize
      description: The address of FIPS_INTEGRITY_VERIFY_KEY in this process.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: key::parse_key_record
    module: oxicrypt-integrity
    description: Decode a key record's bytes into the embedded key, or None for the all-zero key of a build without one.
    signature: 'pub fn parse_key_record(bytes: &[u8]) -> Result<Option<[u8; VERIFY_KEY_LEN]>, SlotDefect>'
    parameters:
    - name: bytes
      type: '&[u8]'
      direction: in
      description: KEY_RECORD_SIZE bytes.
    returns:
      type: 'Result<Option<[u8; VERIFY_KEY_LEN]>, SlotDefect>'
      description: The key, or None for an all-zero key.
      error_variants:
      - name: KeyRecord
        condition: The length is wrong or either magic is absent.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: key::find_key_record
    module: oxicrypt-integrity
    description: Locate the key record in an artifact's file bytes by both magics, requiring exactly one.
    signature: 'pub fn find_key_record(bytes: &[u8]) -> Result<usize, String>'
    parameters:
    - name: bytes
      type: '&[u8]'
      direction: in
      description: The artifact's file bytes.
    returns:
      type: 'Result<usize, String>'
      description: The record's file offset, or a description when none or several are found.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: slot::merge
    module: oxicrypt-integrity
    description: Merge ascending entries that continue each other in both coordinates with the same kind and meta into the canonical table parse requires.
    signature: 'pub fn merge(entries: &[Entry]) -> Vec<Entry>'
    parameters:
    - name: entries
      type: '&[Entry]'
      direction: in
      description: Ascending entries.
    returns:
      type: Vec<Entry>
      description: The canonical, maximal table.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: slot::signed_header
    module: oxicrypt-integrity
    description: The slot bytes the signature covers, everything but the SIG_LEN-byte signature field.
    signature: 'pub fn signed_header(slot: &[u8]) -> Result<Vec<u8>, SlotDefect>'
    parameters:
    - name: slot
      type: '&[u8]'
      direction: in
      description: SLOT_SIZE bytes.
    returns:
      type: 'Result<Vec<u8>, SlotDefect>'
      description: SLOT_SIZE - SIG_LEN bytes.
      error_variants:
      - name: WrongSize
        condition: slot is not SLOT_SIZE long.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: slot_address
    module: oxicrypt-integrity
    description: Runtime address of the embedded integrity slot, taken from the linked static without dereferencing it; used to derive the load base and, across runs, as a diagnostic showing whether the image moved.
    signature: 'pub fn slot_address() -> usize'
    returns:
      type: usize
      description: The address of FIPS_INTEGRITY_SLOT in this process.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: status
    module: oxicrypt-integrity
    description: Return the pre-operational integrity test's status indicator for the first run in this process, re-running nothing and remaining safe to call from the module's error state.
    signature: 'pub fn status() -> IntegrityStatus'
    returns:
      type: IntegrityStatus
      description: The first run's outcome, or NotRun when the test has not run in this process.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: verify_loaded_image
    module: oxicrypt-integrity
    description: Run the pre-operational software integrity test against the loaded module image — read the embedded key record and the slot through the platform mechanism, validate the slot and its key id, build the signature input from the loaded image framed under the integrity context, and verify the ML-DSA-87 signature with ML-DSA.Verify_internal, only inside the power-up self-tests and on the thread running them, since on-demand testing is a process restart.
    signature: 'pub fn verify_loaded_image() -> Result<(), IntegrityError>'
    returns:
      type: Result<(), IntegrityError>
      description: Ok when the signature verifies under the embedded key.
      error_variants:
      - name: Module
        condition: Called outside the power-up self-tests; runs nothing and changes no state. Carries AlreadyInitialized once the module is Operational, otherwise the guard's NotOperational (PowerOff, Error, or SelfTest on another thread).
      - name: CastNotRun
        condition: The self-tests reached the image check before ml_dsa_cast() and sha256_cast() both passed; latches Error.
      - name: NoVerifyKey
        condition: The module was built without a verifying key.
      - name: SignatureInvalid
        condition: The signature does not verify, or a bound import does not hold its recorded value.
      - name: SlotInvalid
        condition: The slot or the embedded key record is malformed, the slot is the unsigned template, it was signed for a different key (KeyMismatch), or it describes an impossible extent.
      - name: Unreadable
        condition: No memory route could supply the module's own bytes, the operating system refused a read of mapped memory or of the image file, or the image's mappings or file size could not be measured.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: encode
    module: oxicrypt-integrity
    description: Serialize a version 4 integrity slot from its fields and signature.
    signature: 'pub fn encode(fields: &SlotFields, signature: &[u8; SIG_LEN]) -> Result<Vec<u8>, SlotDefect>'
    parameters:
    - name: fields
      type: '&SlotFields'
      direction: in
      description: Everything the signature covers.
    - name: signature
      type: '&[u8; SIG_LEN]'
      constraints:
        size: 4627
      direction: in
      description: The ML-DSA-87 signature, or zeros while building the signature input.
    returns:
      type: Result<Vec<u8>, SlotDefect>
      description: SLOT_SIZE bytes in the wire format described by the slot module.
      error_variants:
      - name: TooManyEntries
        condition: The entries and string table do not fit between the header and the footer.
      - name: StringTable
        condition: A record's name is too long to encode.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: parse
    module: oxicrypt-integrity
    description: Parse and structurally validate a version 4 integrity slot, accepting only its canonical encoding; the key id and the signature are the verifier's checks.
    signature: 'pub fn parse(bytes: &[u8]) -> Result<SlotImage, SlotDefect>'
    parameters:
    - name: bytes
      type: '&[u8]'
      direction: in
      description: Acquired slot bytes, expected to be SLOT_SIZE long.
    returns:
      type: Result<SlotImage, SlotDefect>
      description: The parsed slot once every structural check passes.
      error_variants:
      - name: UnsupportedVersion
        condition: The version field is not 3; versions 1 and 2 and the unsigned 0 are refused.
      - name: NonMaximal
        condition: Two adjacent entries continue each other with the same kind and meta.
      - name: NonZeroPadding
        condition: An unused byte is not zero.
      - name: BindRecordOutOfRange
        condition: A Bind entry names a record the string table does not hold.
      - name: FileLenTooShort
        condition: An entry ends past file_len.
      - name: MalformedEntry
        condition: An entry's kind, run byte, meta or length is invalid for its kind.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: table_len
    module: oxicrypt-integrity
    description: How many stored entries a canonical table takes in a slot, after encode packs each Relative run into the Plain entry before it and each run of identical contiguous periods into one entry; the count MAX_ENTRIES bounds.
    signature: 'pub fn table_len(entries: &[Entry]) -> usize'
    parameters:
    - name: entries
      type: '&[Entry]'
      direction: in
      description: The canonical entry table.
    returns:
      type: usize
      description: The number of stored entries.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: slot::string_table_len
    module: oxicrypt-integrity
    description: How many bytes a list of bound-import records takes as a slot's string table, encoded exactly as encode writes them.
    signature: 'pub fn string_table_len(records: &[BindRecord]) -> Result<usize, SlotDefect>'
    parameters:
    - name: records
      type: '&[BindRecord]'
      direction: in
      description: The records the table holds.
    returns:
      type: 'Result<usize, SlotDefect>'
      description: The string table's length in bytes.
      error_variants:
      - name: StringTable
        condition: A record's name is too long to encode.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: slot_budget
    module: oxicrypt-integrity-sign
    description: What an image's extent takes of its slot as write_entries would encode it — the stored entries of the merged table, the string table of the records it names, and the stored entries that fit beside that string table; --show prints it as its slot budget line.
    signature: 'pub fn slot_budget(layout: &image::Layout) -> Result<SlotBudget, String>'
    returns:
      type: 'Result<SlotBudget, String>'
      description: The budget, or a description when a record's name is too long to encode.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: extent_len
    module: oxicrypt-integrity
    description: Total number of bytes a table's entries cover, of every kind.
    signature: 'pub fn extent_len(entries: &[Entry]) -> Option<u64>'
    parameters:
    - name: entries
      type: '&[Entry]'
      direction: in
      description: The entry table.
    returns:
      type: Option<u64>
      description: Sum of every entry's length, or None on overflow.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: lama_manifest
    module: oxicrypt-ffi
    description: Return the LAMA API manifest as a NUL-terminated UTF-8 string with static lifetime, for shared-library discovery.
    signature: pub extern "C" fn lama_manifest() -> *const core::ffi::c_char
    returns:
      type: '*const c_char'
      description: Pointer to a static NUL-terminated UTF-8 YAML document; valid for the lifetime of the loaded library and never freed by the caller.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false
      fips_gate: "none \u2014 callable outside the module state machine"



  # ── Integrity signing (out of boundary, build tool) ───────────────

  - name: sign_image
    module: oxicrypt-integrity-sign
    description: Sign an image in place — derive its extent, write the version 4 slot with the embedded key's fingerprint, and sign the slot and the extent's file bytes with ML-DSA-87 under the integrity context; refuses an image built without a verifying key (NoVerifyKey), embedding a different key (SigningKeyAbsent), or with a file-backed zero-initialised module static (FileBackedStatic) or no symbol table to check (StaticsUnchecked), and a PE image whose statics are read from its DWARF without a program database, as NoDwarf, DwarfForm, DuplicateStatic, StaticOutsideImage, StaticUnlocated or StaticUnsized.
    signature: 'pub fn sign_image(image: &mut [u8], key: &SigningKey) -> Result<[u8; slot::SIG_LEN], String>'
    returns:
      type: 'Result<[u8; slot::SIG_LEN], String>'
      description: The signature written into the slot, or a description of why the image could not be signed.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: false

  - name: embedded_verify_key
    module: oxicrypt-integrity-sign
    description: The verifying key an artifact embeds, read from its key record, or None for an artifact built without one.
    signature: 'pub fn embedded_verify_key(image: &[u8]) -> Result<Option<[u8; VERIFY_KEY_LEN]>, String>'
    returns:
      type: 'Result<Option<[u8; VERIFY_KEY_LEN]>, String>'
      description: The encoded public key, None for an all-zero key, or a description when the record is absent or ambiguous.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: embed_verify_key
    module: oxicrypt-integrity-sign
    description: Write a public key into an artifact's key record, what a build with OXICRYPT_INTEGRITY_VERIFY_KEY set produces, done after the link; for test fixtures, which need a key pair for an artifact built without one.
    signature: 'pub fn embed_verify_key(image: &mut [u8], public: &[u8; VERIFY_KEY_LEN]) -> Result<(), String>'
    returns:
      type: 'Result<(), String>'
      description: Ok once written, or a description when the record is absent or ambiguous.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: key::keygen
    module: oxicrypt-integrity-sign
    description: Generate an ML-DSA-87 key pair and write it into a directory outside any git work tree — the 32-byte key-generation seed to integrity-signing.key with mode 0600, the 2,592-byte public key to integrity-verify.pub — never overwriting an existing pair.
    signature: 'pub fn keygen(dir: &Path) -> Result<(PathBuf, PathBuf, [u8; 32]), String>'
    returns:
      type: 'Result<(PathBuf, PathBuf, [u8; 32]), String>'
      description: The private key path, the public key path and the key's fingerprint.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: false

  - name: start_module
    module: oxicrypt-integrity-sign
    description: Start this process's copy of the module so the signer can hash, sign and verify, with the ML-DSA-87 and SHA-256 CASTs as the integrity group and no image check (the signer is not the module image), followed by the SHA, HMAC, DRBG, SHAKE and ML-DSA self-tests; a module already operational is left as it is.
    signature: 'pub fn start_module() -> Result<(), String>'
    returns:
      type: 'Result<(), String>'
      description: Ok once the module is operational, or a description of why it did not start.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: write_extent
    module: oxicrypt-integrity-sign
    description: Write an arbitrary extent, as Plain entries, into an image's slot and sign it, separate from sign_image so a test can sign an image against an extent the classifier would never emit and thereby build the control proving the runtime stability probe can fail.
    signature: 'pub fn write_extent(image: &mut [u8], layout: &image::Layout, ranges: &[Range], key: &SigningKey) -> Result<[u8; slot::SIG_LEN], String>'
    returns:
      type: 'Result<[u8; slot::SIG_LEN], String>'
      description: The signature written into the slot, or a description of why the image could not be signed.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: false

  - name: classify_with
    module: oxicrypt-integrity-sign
    description: Derive an image's typed extent as classify does, with an ELF image typed for the loader SignOptions names instead of the one its notes declare, and a Mach-O or PE image's envelope holes measured against SignOptions' reserved_against reference.
    signature: 'pub fn classify_with(image: &[u8], options: &SignOptions<''_>) -> Result<image::Layout, String>'
    returns:
      type: 'Result<image::Layout, String>'
      description: The classified layout, or a description of why the image could not be classified.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: sign_image_with
    module: oxicrypt-integrity-sign
    description: Sign an image in place as sign_image does, with the loader, the debug-file symbol table and the Mach-O or PE reservation reference SignOptions supplies; refuses an image with a file-backed zero-initialised module static (FileBackedStatic) or no symbol table to check (StaticsUnchecked), and a PE image whose statics are read from its DWARF without a program database, as NoDwarf, DwarfForm, DuplicateStatic, StaticOutsideImage, StaticUnlocated or StaticUnsized.
    signature: 'pub fn sign_image_with(image: &mut [u8], key: &SigningKey, options: &SignOptions<''_>) -> Result<[u8; slot::SIG_LEN], String>'
    returns:
      type: 'Result<[u8; slot::SIG_LEN], String>'
      description: The signature written into the slot, or a description, beginning with the refusal's name where one applies, of why the image could not be signed.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: false

  - name: verify_image_for
    module: oxicrypt-integrity-sign
    description: Check an image against its slot as verify_image does, requiring an ELF slot's loader to be the one given rather than the one the image declares, the check for an artifact signed with --loader.
    signature: 'pub fn verify_image_for(image: &[u8], loader: Option<elf::Loader>) -> Result<[u8; 32], String>'
    returns:
      type: 'Result<[u8; 32], String>'
      description: The embedded key's fingerprint, or a description as verify_image gives.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: "elf::links_boot_test"
    module: oxicrypt-integrity-sign
    description: Report whether an image links the boot sequence's integrity test, by finding its test-inventory name in the image's bytes; the signer itself keeps only a masked copy of that name.
    signature: 'pub fn links_boot_test(image: &[u8]) -> bool'
    returns:
      type: 'bool'
      description: True when the image carries INTEGRITY_TEST_NAME.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: debug_symbols
    module: oxicrypt-integrity-sign
    description: The separated debug file an ELF artifact names through its .gnu_debuglink, looked for beside the artifact and in its .debug subdirectory and required to match the link's CRC, or for a Mach-O artifact the file under <artifact>.dSYM/Contents/Resources/DWARF whose LC_UUID is the artifact's, or for a PE artifact the program database its CodeView record names, by file name beside the artifact, required to carry the record's GUID and age, or None when the artifact keeps local data objects in its own symbol table or no debug file is found, for a PE artifact the statics then coming from the image's DWARF if it carries any.
    signature: 'pub fn debug_symbols(path: &std::path::Path, bytes: &[u8]) -> Result<Option<Vec<u8>>, String>'
    returns:
      type: 'Result<Option<Vec<u8>>, String>'
      description: The debug file's bytes, None, or a description beginning StaticsUnchecked when every debug file found fails the CRC.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: "elf::has_local_objects"
    module: oxicrypt-integrity-sign
    description: Report whether an ELF image's symbol table holds any local data object, which a strip keeping only global symbols removes along with the module's statics.
    signature: 'pub fn has_local_objects(bytes: &[u8]) -> bool'
    returns:
      type: 'bool'
      description: True when a SHT_SYMTAB section lists a local STT_OBJECT symbol.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: module_statics
    module: oxicrypt-integrity-sign
    description: The module statics of an ELF image, read from its own symbol table or, when it holds no local objects, from the supplied debug-file bytes, which must match the image's .gnu_debuglink CRC, with relocations read as the given loader reads them; of a Mach-O image, read from its own symbol table or its dSYM as macho::module_statics does; of a PE image, read from the supplied program database, or without one from the image's DWARF, as pe::module_statics does.
    signature: 'pub fn module_statics(image: &[u8], symbols: Option<&[u8]>, loader: Option<elf::Loader>) -> Result<elf::Statics, String>'
    returns:
      type: 'Result<elf::Statics, String>'
      description: The statics report, or a description beginning StaticsUnchecked when neither input carries a symbol table, or for a PE image read from its DWARF one beginning NoDwarf, DwarfForm, DuplicateStatic, StaticOutsideImage, StaticUnlocated or StaticUnsized.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: write_entries
    module: oxicrypt-integrity-sign
    description: Write an arbitrary typed table into an image's slot, merged into canonical form, and sign it; the typed counterpart of write_extent, for controls that retype entries the classifier emitted.
    signature: 'pub fn write_entries(image: &mut [u8], layout: &image::Layout, entries: &[Entry], key: &SigningKey) -> Result<[u8; slot::SIG_LEN], String>'
    returns:
      type: 'Result<[u8; slot::SIG_LEN], String>'
      description: The signature written into the slot, or a description of why the image could not be signed.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: false

  - name: elf::classify_for
    module: oxicrypt-integrity-sign
    description: Derive an ELF64 image's typed extent as elf::classify does, typed for the given loader when one is given rather than the loader the image's notes declare.
    signature: 'pub fn classify_for(bytes: &[u8], loader: Option<Loader>) -> Result<Layout, String>'
    returns:
      type: 'Result<Layout, String>'
      description: The classified layout, or a description beginning with the refusal's name where one applies.
    thread_safety: thread-safe
