  - name: BlockCipher
    module: oxicrypt-aes
    kind: trait
    description: Sealed trait implemented by Aes128Key, Aes192Key, and Aes256Key; all AES mode functions are generic over it.

  - name: KdfError
    module: oxicrypt-kdf
    kind: enum
    description: Error type returned by all HKDF, SP 800-108, and PBKDF2 functions.
    variants:
      - name: Module
        description: Module state error (wraps oxicrypt_module::Error — NotOperational, AlgorithmRestricted, etc.).
      - name: OutputTooLong
        description: "Requested OKM length exceeds the algorithm maximum: 255*HashLen for HKDF; (2^32-1)*HashLen for PBKDF2."

  - name: MinEntropy
    module: oxicrypt-entropy
    kind: struct
    description: Exact fixed-point min-entropy in 1/256-bit steps (H_STEPS_PER_BIT = 256); inexact conversions round down so a claim is never overstated.

  - name: SpecRatio
    module: oxicrypt-entropy
    kind: struct
    description: Exact rational (num/den) carrying a non-integer SP 800-90B value, e.g. the restart sanity-check alpha 1/200000 (90B §3.1.4.3).
    fields:
      - name: num
        type: u32
        description: Numerator.
      - name: den
        type: u32
        description: Denominator (non-zero by construction of each constant).

  - name: AptTable2Row
    module: oxicrypt-entropy
    kind: struct
    description: "One reference row of SP 800-90B Table 2 (§4.4.2): the APT cutoff C for a min-entropy level at alpha = 2^-20."
    fields:
      - name: h
        type: SpecRatio
        description: Min-entropy per sample (bits, exact rational).
      - name: cutoff
        type: u32
        description: Example cutoff value C.

  - name: SourceSpec
    module: oxicrypt-entropy
    kind: struct
    description: "Declared output alphabet of a noise source: sample width 1..=8 bits, validated at construction; is_binary() selects the APT window size."

  - name: TimerSource
    module: oxicrypt-entropy
    kind: enum
    description: Timer/counter a jitter-class noise source reads; configuration vocabulary only, with per-arch defaults and Phase-0 unselectability enforced by the timer layer.
    variants:
      - name: RawCounter
        description: Raw CPU cycle counter (TSC on x86_64, CNTVCT on aarch64).
      - name: OsNanoClock
        description: OS-provided nanosecond clock.
      - name: InternalTimerThread
        description: Reserved — unimplemented and unselectable in Phase 0.

  - name: SourceMetadata
    module: oxicrypt-entropy
    kind: struct
    description: "Collection-environment identity recorded with every dataset: timer source, nominal counter frequency, CPU model, OS, and collection parameters."

  - name: SourceError
    module: oxicrypt-entropy
    kind: enum
    description: Non-exhaustive noise-source failure.
    variants:
      - name: Unavailable
        description: The source cannot currently produce samples.

  - name: EntropyError
    module: oxicrypt-entropy
    kind: enum
    description: Typed entropy-pipeline errors; construction refuses (never clamps) a claim above the source ceiling or declared sample width.
    variants:
      - name: ClaimExceedsCeiling
        description: Injected claim exceeds the source's design-anchored ceiling.
      - name: ClaimExceedsSampleWidth
        description: Injected claim exceeds the information content of the declared width.
      - name: Source
        description: Underlying noise-source failure (wraps SourceError).

  - name: JitterConfig
    module: oxicrypt-entropy
    kind: struct
    description: "Jitter-source construction config: adequacy thresholds, recorded TimerSource, and collection-environment identity strings."

  - name: JitterSource
    module: oxicrypt-entropy
    kind: struct
    description: CPU execution-time jitter noise source (sealed NoiseSource impl, generic over TimerRead); new(timer, config) runs the two-stage timer-adequacy self-check (bare-read soundness via ensure_sound, then delta variety on workload_samples workload-measured deltas via ensure_varied) and emits 4-bit digitized delta symbols with a design ceiling of 1 bit/sample; adequacy() returns the workload-signal report, bare_adequacy() the bare-read report.

  - name: TimerError
    module: oxicrypt-entropy
    kind: enum
    description: "Typed timer-layer errors (non-exhaustive): Unsupported, Unavailable, Backwards, Inadequate { reason, report }."
    variants:
      - name: Unsupported
        description: Reserved timer source, unselectable this phase.
      - name: Unavailable
        description: Timer source not compiled into this build.
      - name: Backwards
        description: Read went backwards; sample must be discarded.
      - name: Inadequate
        description: "Measured behavior refused; struct variant carrying reason: InadequacyReason and report: AdequacyReport (the measured evidence)."

  - name: InadequacyReason
    module: oxicrypt-entropy
    kind: enum
    description: Why the adequacy check refused (TooCoarse / TooUniform / NonMonotonic).
    variants:
      - name: TooCoarse
        description: Zero-delta fraction above the configured bound.
      - name: TooUniform
        description: Too few distinct positive delta values.
      - name: NonMonotonic
        description: Backwards violations observed during measurement.

  - name: AdequacyConfig
    module: oxicrypt-entropy
    kind: struct
    description: "Adequacy thresholds: conservative engineering defaults (4096 bare-read samples, 256 workload_samples for the stage-2 workload measurement, max 900 permille zero deltas, min 4 distinct deltas), explicitly NOT SP 800-90B values; min_distinct_deltas is clamped below at MIN_DISTINCT_DELTAS_FLOOR by ensure_varied."


  - name: AdequacyReport
    module: oxicrypt-entropy
    kind: struct
    description: "Observed timer behavior: deltas, zero deltas, min positive delta, bounded distinct-delta count, backwards violations. ensure_sound(&AdequacyConfig) gates monotonicity+coarseness, ensure_varied(&AdequacyConfig) gates delta variety (bound clamped at MIN_DISTINCT_DELTAS_FLOOR), ensure_adequate(&AdequacyConfig) applies all gates to one measured signal; every refusal carries this report."

  - name: AdequacyAccumulator
    module: oxicrypt-entropy
    kind: struct
    description: "Bounded no-alloc delta-observation accumulator: new(), record(Result<u64, TimerError>), finish() -> AdequacyReport; backs measure_adequacy and the jitter source's workload-signal measurement."

  - name: TimerRead
    module: oxicrypt-entropy
    kind: trait
    description: Sealed counter-read abstraction (read() -> u64, width_bits()), implemented by PlatformTimer / RawCounterTimer / OsNanoClockTimer and synthetic test timers.

  - name: PlatformTimer
    module: oxicrypt-entropy
    kind: enum
    description: Platform timer for a configured TimerSource; new(source) returns typed Unsupported for InternalTimerThread and Unavailable for sources not compiled in.

  - name: Alpha
    module: oxicrypt-entropy
    kind: struct
    description: Health-test false-positive probability, restricted to alpha = 2^-a with a in 20..=40 (90B 4.3); default is 2^-30.

  - name: HealthTest
    module: oxicrypt-entropy
    kind: enum
    description: Which approved continuous test failed (non-exhaustive).
    variants:
      - name: Rct
        description: Repetition Count Test (90B 4.4.1).
      - name: Apt
        description: Adaptive Proportion Test (90B 4.4.2).

  - name: HealthError
    module: oxicrypt-entropy
    kind: enum
    description: "Typed health-layer errors (non-exhaustive): Failed(HealthTest) (permanent), Poisoned, UnsupportedAlpha."
    variants:
      - name: Failed
        description: A continuous test failed; the monitor is permanently poisoned.
      - name: Poisoned
        description: An earlier failure already poisoned this monitor.
      - name: UnsupportedAlpha
        description: No precomputed cutoff coverage for the requested point.

  - name: RepetitionCountTest
    module: oxicrypt-entropy
    kind: struct
    description: 90B 4.4.1 RCT with cutoff C = 1 + ceil(-log2(alpha)/H) in pure integer arithmetic over the fixed-point claim.

  - name: AdaptiveProportionTest
    module: oxicrypt-entropy
    kind: struct
    description: 90B 4.4.2 APT, window 1024 (binary) / 512 (non-binary); cutoff from the precomputed Table 2 grid, claimed H rounded down so the claim is never overstated.

  - name: HealthMonitor
    module: oxicrypt-entropy
    kind: struct
    description: RCT + APT over every sample with permanent poisoning on any failure; the failing sample is never released and only re-instantiation clears the condition.

  - name: NoiseSource
    module: oxicrypt-entropy
    kind: trait
    description: Stage one of the three-stage pipeline (NoiseSource -> health tests -> conditioner); SEALED and object-safe.

  - name: EntropyPipeline
    module: oxicrypt-entropy
    kind: struct
    description: Pipeline skeleton bound to one NoiseSource and one validated min-entropy claim; health-test and conditioning stages attach as they land.

  - name: OxiRsaPrivateKey2048
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque RSA-2048 private-key handle that passed an IG 10.3.A pairwise consistency test on the CRT path at construction; carries n (256 bytes), e, d (256 bytes), and CRT components p/q/dP/dQ/qInv (128 bytes each), zeroising d and the CRT halves on drop.

  - name: OxiRsaPrivateKey3072
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque RSA-3072 private-key handle; 384-byte modulus, 192-byte CRT halves, zeroising d and the five CRT halves on drop.

  - name: OxiRsaPrivateKey4096
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque RSA-4096 private-key handle; 512-byte modulus, 256-byte CRT halves, zeroising d and the five CRT halves on drop.

  - name: CollectionError
    module: oxicrypt-entropy
    kind: struct
    description: Operator-facing error from the off-boundary collection tool, folding typed EntropyError and filesystem IO errors into one message.

  - name: OxiEcdsaP256PrivateKey
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque ECDSA P-256 private-key handle that passed an IG 10.3.A pairwise consistency test at construction; carries the 32-byte scalar d and 65-byte SEC1 public key Q, and zeroises d on drop.

  - name: OxiEcdsaP384PrivateKey
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque ECDSA P-384 private-key handle that passed an IG 10.3.A pairwise consistency test at construction; carries the 48-byte scalar d and 97-byte SEC1 public key Q, and zeroises d on drop.

  - name: OxiHmacDrbgSha384
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque HMAC_DRBG-SHA-384 handle; same per-call-mutating thread-safety and Drop-zeroize contract as OxiHmacDrbgSha256.

  - name: OxiHmacDrbgSha512
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque HMAC_DRBG-SHA-512 handle; same per-call-mutating thread-safety and Drop-zeroize contract as OxiHmacDrbgSha256, with a wider 64-byte (K, V).

  - name: OxiHashDrbgSha256
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque Hash_DRBG-SHA-256 handle; same per-call-mutating thread-safety and Drop-zeroize contract as OxiHmacDrbgSha256.

  - name: OxiHashDrbgSha384
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque Hash_DRBG-SHA-384 handle; per SP 800-90A Table 2, security strength 192 bits.

  - name: OxiHashDrbgSha512
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque Hash_DRBG-SHA-512 handle; per SP 800-90A Table 2, security strength 256 bits.

  - name: OxiCtrDrbgAes128
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque CTR_DRBG-AES-128 handle; same per-call-mutating thread-safety and Drop-zeroize (Key, V, reseed_counter) contract as OxiHmacDrbgSha256.

  - name: OxiCtrDrbgAes192
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque CTR_DRBG-AES-192 handle; per SP 800-90A Table 3, security strength 192 bits, SEED_LEN = 40.

  - name: OxiCtrDrbgAes256
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque CTR_DRBG-AES-256 handle; per SP 800-90A Table 3, security strength 256 bits, SEED_LEN = 48.

  - name: IntegritySlot
    module: oxicrypt-integrity
    kind: struct
    description: repr(C) 64-byte reserved slot embedded in the module binary, holding the integrity MAC between a header and a footer magic.
    size_bytes: 64
    fields:
    - name: hdr
      type: '[u8; 16]'
      description: Header magic; equals SLOT_HEADER_MAGIC in a valid slot.
    - name: mac
      type: '[u8; 32]'
      description: HMAC-SHA-256 over the whole module binary computed with this field zeroed; all zeros in an unsigned binary.
    - name: ftr
      type: '[u8; 16]'
      description: Footer magic; equals SLOT_FOOTER_MAGIC in a valid slot.
    security:
      contains_secret: false
      zeroize_on_drop: false
      constant_time: false

  - name: IntegrityError
    module: oxicrypt-integrity
    kind: enum
    description: Error type returned by the standalone integrity signing and verification helpers.
    implements:
    - Debug
    - Display
    - std::error::Error
    variants:
    - name: CurrentExeUnresolved
      description: Carries the io::Error from a failed env::current_exe() resolution; declared but never constructed anywhere in the crate.
    - name: ExeReadFailed
      description: Carries the io::Error from a failed read of the executable file.
    - name: ExeWriteFailed
      description: Carries the io::Error from a failed write-back of the signed buffer.
    - name: SlotNotFound
      description: No header-plus-footer slot pair was found in the buffer, or the buffer is shorter than 64 bytes.
    - name: MultipleSlotsFound
      description: More than one valid slot was found in the buffer.
    - name: MacMismatch
      description: The MAC recomputed over the slot-zeroed buffer differs from the MAC stored in the slot.


# ─────────────────────────────────────────────────────────────────────
# Functions
# ─────────────────────────────────────────────────────────────────────

functions:

  # ── Module lifecycle ──────────────────────────────────────────────

  - name: initialize_with_tests
    module: oxicrypt-module
    description: Initialize the module by running all provided power-up KATs; transitions PowerOff -> SelfTest -> Operational (or Error).
    signature: "pub fn initialize_with_tests(tests: &[KatEntry]) -> Result<(), Error>"
    parameters:
      - name: tests
        type: "&[KatEntry]"
        direction: in
        description: Array of KAT entries to run, collected from each algorithm crate's KATS constant.
        constraints:
          nullability: required
          valid_range: non-empty
    returns:
      type: "Result<(), Error>"
      description: Ok(()) if all KATs pass, Err if any fail.
      error_variants:
        - name: AlreadyInitialized
          condition: Called more than once in the process lifetime.
        - name: SelfTestFailed
          condition: Any KatEntry::run() returned Err.
    preconditions:
      - description: Module must be in PowerOff state.
        check: "oxicrypt_module::state() == State::PowerOff"
    postconditions:
      - description: Module is in Operational state (on success).
      - description: Module is in Error state (on failure, terminal).
    thread_safety: not-thread-safe
    side_effects:
      - description: Sets global module state. Exactly once per process.
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false
      fips_gate: PowerOff
    pitfalls:
      - description: Must be called exactly once before any crypto operation.
        wrong: |
          let digest = oxicrypt_sha::sha256(b"data")?;
          // Error: NotOperational
        right: |
          oxicrypt_module::initialize_with_tests(&all_kats)?;
          let digest = oxicrypt_sha::sha256(b"data")?;

  - name: initialize_with_profile
    module: oxicrypt-module
    description: Initialize the module with a specific algorithm restriction profile and run all power-up KATs; KATs run all algorithms regardless of profile.
    signature: "pub fn initialize_with_profile(tests: &[KatEntry], profile: AlgorithmProfile) -> Result<(), Error>"
    parameters:
      - name: tests
        type: "&[KatEntry]"
        direction: in
        description: KAT entries to run.
      - name: profile
        type: AlgorithmProfile
        direction: in
        description: "Algorithm restriction policy: Unrestricted, Cnsa2, or Cnsa1."
    returns:
      type: "Result<(), Error>"
      description: Ok(()) if all KATs pass.
      error_variants:
        - name: AlreadyInitialized
          condition: Called more than once in the process lifetime.
        - name: SelfTestFailed
          condition: Any KatEntry::run() returned Err.
    thread_safety: not-thread-safe
    side_effects:
      - description: Sets global module state and algorithm profile. Once per process.

  - name: require_allowed
    module: oxicrypt-module
    description: "Guard for algorithm-profile enforcement: Ok(()) if the service is permitted under the active profile, Err(AlgorithmRestricted) otherwise."
    signature: "pub fn require_allowed(service: Service) -> Result<(), Error>"
    parameters:
      - name: service
        type: Service
        direction: in
        description: The specific service variant to check.
    returns:
      type: "Result<(), Error>"
      description: Ok if allowed, Err(AlgorithmRestricted) if blocked.
      error_variants:
        - name: AlgorithmRestricted
          condition: The service is not permitted under the active profile.

  - name: active_profile
    module: oxicrypt-module
    description: Returns the active algorithm restriction profile.
    signature: "pub fn active_profile() -> AlgorithmProfile"
    returns:
      type: AlgorithmProfile
      description: "The profile set by initialize_with_profile, or Unrestricted when the module was initialized without one."

  - name: require_operational
    module: oxicrypt-module
    description: Guard returning Ok(()) if the module is Operational, Err otherwise; called internally by every approved-service function.
    signature: "pub fn require_operational() -> Result<(), Error>"
    parameters: []
    returns:
      type: "Result<(), Error>"
      description: Ok if Operational, Err otherwise.
      error_variants:
        - name: NotOperational
          condition: Module state is not Operational.
    preconditions: []
    postconditions: []
    thread_safety: thread-safe
    side_effects: []
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false
      fips_gate: null

  # ── Hashing ───────────────────────────────────────────────────────

  - name: sha256
    module: oxicrypt-sha
    family: sha-oneshot
    description: One-shot SHA-256 hash.
    signature: "pub fn sha256(data: &[u8]) -> Result<[u8; 32], Error>"
    parameters:
      - name: data
        type: "&[u8]"
        direction: in
        description: Data to hash.
        constraints:
          nullability: required
          valid_range: "0..=2^64 - 1 bytes"
    returns:
      type: "Result<[u8; 32], Error>"
      description: 32-byte SHA-256 digest.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
        check: "oxicrypt_module::require_operational()"
    postconditions:
      - description: Returns the SHA-256 digest of the input.
    sequencing:
      must_call_before: [initialize_with_tests]
    thread_safety: thread-safe
    side_effects: []
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let digest = oxicrypt_sha::sha256(b"hello world")?;
        assert_eq!(digest.len(), 32);

  - name: "Sha256::new"
    module: oxicrypt-sha
    description: Create a streaming SHA-256 hasher.
    signature: "pub fn Sha256::new() -> Result<Self, Error>"
    parameters: []
    returns:
      type: "Result<Sha256, Error>"
      description: A new SHA-256 hasher ready to absorb data.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
        check: "oxicrypt_module::require_operational()"
    postconditions:
      - description: Hasher is ready for update() calls.
    sequencing:
      must_call_after:
        - update
        - finalize
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational

  - name: "Sha256::update"
    module: oxicrypt-sha
    description: Feed data into the streaming hasher.
    signature: "pub fn update(&mut self, data: &[u8])"
    parameters:
      - name: self
        type: "&mut Sha256"
        direction: in-out
        description: The hasher to update.
      - name: data
        type: "&[u8]"
        direction: in
        description: Data to absorb.
    returns:
      type: "()"
      description: No return value.
    preconditions:
      - description: Hasher was created via Sha256::new().
    postconditions:
      - description: Internal state updated with the provided data.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational

  - name: "Sha256::finalize"
    module: oxicrypt-sha
    description: Consume the hasher and return the digest.
    signature: "pub fn finalize(self) -> [u8; 32]"
    parameters:
      - name: self
        type: Sha256
        direction: in
        description: The hasher to finalize.
    returns:
      type: "[u8; 32]"
      description: 32-byte SHA-256 digest.
    preconditions:
      - description: Hasher was created and optionally updated.
    postconditions:
      - description: The hasher is consumed and cannot be used again.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: Finalize consumes the hasher. You cannot call update() after.
        wrong: |
          let mut h = Sha256::new()?;
          h.update(b"data");
          let d1 = h.finalize();
          h.update(b"more");  // compile error: h moved
        right: |
          let mut h = Sha256::new()?;
          h.update(b"data");
          h.update(b"more");
          let digest = h.finalize();

  - name: sha1
    module: oxicrypt-sha
    family: sha-oneshot
    description: One-shot SHA-1 hash.
    signature: "pub fn sha1(data: &[u8]) -> Result<[u8; 20], Error>"
