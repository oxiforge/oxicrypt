      P-384: `Z = x(d * Q)`. Reads exactly 48 bytes from `d_ptr` and
      exactly 97 bytes from `peer_public_key_ptr` (uncompressed SEC1,
      `0x04 || X(48) || Y(48)`). Writes 48 bytes (raw x-coordinate)
      into `shared_secret_out`. The shared secret is the raw ECDH
      output; the caller MUST run an SP 800-56C Rev. 2 extractor
      before using it as keying material. Peer public key undergoes
      full SP 800-56Ar3 §5.6.2.3.3 validation before scalar
      multiplication.
    signature: >-
      int oxi_ecdh_p384_compute_shared_secret(const uint8_t *d_ptr,
      const uint8_t *peer_public_key_ptr,
      uint8_t *shared_secret_out)
    parameters:
