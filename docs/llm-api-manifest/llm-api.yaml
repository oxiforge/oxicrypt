    family: xof-hasher-new
    description: Create a ParallelHash128 instance with block size B (bytes) and customization string S (SP 800-185 §6), followed by update* then finalize_into.
    signature: "pub fn ParallelHash128::new(block_size: usize, s: &[u8]) -> Result<Self, Error>"
    parameters:
      - name: block_size
        type: usize
        direction: in
        description: Block size B in bytes; input is split into B-byte blocks each hashed independently by the inner SHAKE, and different B values produce different hashes.
        constraints:
          nullability: required
          valid_range: "1..=8192 (PANICS outside this range)"
      - name: s
        type: "&[u8]"
        direction: in
        description: Customization string S for domain separation.
        constraints:
          nullability: required
          valid_range: "any length, including empty"
    returns:
      type: "Result<ParallelHash128, Error>"
      description: A new ParallelHash128 instance ready to absorb data.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: The SHA-3 derived function is blocked by the active profile.
    preconditions:
      - description: Module must be Operational.
        check: "oxicrypt_module::require_operational()"
      - description: 1 <= block_size <= 8192 (asserted; out-of-range panics, not an Error).
    postconditions:
      - description: Instance ready for update() calls with block size B fixed.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let mut h = oxicrypt_xof::ParallelHash128::new(8, b"")?;
        h.update(&data);
        let mut out = [0u8; 32];
        h.finalize_into(&mut out);
    pitfalls:
      - description: block_size of 0 or > 8192 PANICS — it is not reported as an Error.
        wrong: |
          let h = ParallelHash128::new(0, b"")?;     // panics: block_size must be > 0
        right: |
          let h = ParallelHash128::new(8, b"")?;     // 1..=8192

