  # ── AES-GCM ──────────────────────────────────────────────────────

  - name: gcm_encrypt
    module: oxicrypt-aes
    family: aes-mode-encrypt
    description: AES-GCM authenticated encryption.
    signature: >-
      pub fn gcm_encrypt<B: BlockCipher>(cipher: &B, iv: &[u8; 12],
      aad: &[u8], plaintext: &[u8], ciphertext: &mut [u8],
      tag: &mut [u8; 16]) -> Result<(), ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule (Aes128Key, Aes192Key, or Aes256Key)."
      - name: iv
        type: "&[u8; 12]"
        direction: in
        description: >-
          96-bit initialization vector. MUST be unique for every
          encryption under the same key. Reusing an IV with the
          same key completely breaks GCM's security.
        constraints:
          size: 12
          encoding: raw
      - name: aad
        type: "&[u8]"
        direction: in
        description: Additional authenticated data. Authenticated but not encrypted.
        constraints:
          valid_range: "0..=2^64 - 1 bytes"
      - name: plaintext
        type: "&[u8]"
        direction: in
        description: Data to encrypt.
        constraints:
          valid_range: "0..=2^36 - 32 bytes"
      - name: ciphertext
        type: "&mut [u8]"
        direction: out
        description: Output buffer for encrypted data.
        constraints:
          size: "plaintext.len()"
      - name: tag
        type: "&mut [u8; 16]"
        direction: out
        description: Output buffer for 128-bit authentication tag.
        constraints:
          size: 16
    returns:
      type: "Result<(), ModeError>"
      description: Ok on success.
      error_variants:
        - name: LengthMismatch
          condition: ciphertext.len() != plaintext.len()
        - name: InvalidPayloadLength
          condition: Plaintext exceeds GCM maximum.
    preconditions:
      - description: Module must be Operational.
      - description: IV must be unique for this key.
    postconditions:
      - description: ciphertext contains the encrypted data.
      - description: tag contains the 128-bit GCM authentication tag.
    thread_safety: thread-safe
    security:
      constant_time: false  # AES table-based; disclosed
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: >-
          GCM IV reuse is catastrophic. Never use the same IV twice
          with the same key. Use a counter or DRBG to generate IVs.
        wrong: |
          let iv = [0u8; 12];  // Static IV — fatal for multi-message use
          gcm_encrypt(&key, &iv, &[], &msg1, &mut ct1, &mut tag1)?;
          gcm_encrypt(&key, &iv, &[], &msg2, &mut ct2, &mut tag2)?;
        right: |
          let mut iv_counter: u128 = 0;
          let iv = &iv_counter.to_be_bytes()[4..];  // 96-bit counter
          gcm_encrypt(&key, iv.try_into().unwrap(), &[], &msg, &mut ct, &mut tag)?;
          iv_counter += 1;

  - name: gcm_decrypt
    module: oxicrypt-aes
    family: aes-mode-decrypt
    description: >-
      AES-GCM authenticated decryption. Verifies the authentication tag
      before writing to plaintext_out. If TagMismatch, do NOT use the
      output buffer — it may contain partially decrypted attacker data.
    signature: >-
      pub fn gcm_decrypt<B: BlockCipher>(cipher: &B, iv: &[u8], aad: &[u8],
      ciphertext: &[u8], tag: &[u8; 16], plaintext_out: &mut [u8]) -> Result<(), ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule (Aes128Key, Aes192Key, or Aes256Key)."
      - name: iv
        type: "&[u8]"
        direction: in
        description: >-
          Initialization vector. Must be 12 bytes (returns Err(InvalidIvLength) otherwise).
        constraints:
          size: 12
      - name: aad
        type: "&[u8]"
        direction: in
        description: Additional authenticated data. Must match exactly what was used in gcm_encrypt.
      - name: ciphertext
        type: "&[u8]"
        direction: in
        description: Data to decrypt.
      - name: tag
        type: "&[u8; 16]"
        direction: in
        description: 128-bit authentication tag from gcm_encrypt.
        constraints:
          size: 16
      - name: plaintext_out
        type: "&mut [u8]"
        direction: out
        description: Output buffer.
        constraints:
          size: "ciphertext.len()"
    returns:
      type: "Result<(), ModeError>"
      error_variants:
        - name: InvalidIvLength
          condition: iv.len() != 12
        - name: LengthMismatch
          condition: plaintext_out.len() != ciphertext.len()
        - name: TagMismatch
          condition: Authentication tag verification failed (constant-time compare).
    preconditions:
      - description: Module must be Operational.
      - description: Tag, IV, and AAD must match what was used during encryption.
    postconditions:
      - description: If Ok, plaintext_out contains decrypted data.
      - description: If TagMismatch, plaintext_out content is undefined — discard it.
    thread_safety: thread-safe
    security:
      constant_time: false  # AES table-based; tag comparison is constant-time
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: >-
          Do NOT use plaintext_out if gcm_decrypt returns Err(TagMismatch).
          The buffer may contain attacker-controlled partially decrypted data.
        wrong: |
          let _ = gcm_decrypt(&key, &iv, &aad, &ct, &tag, &mut pt);
          process(&pt);  // BUG: may use tampered data if tag failed
        right: |
          gcm_decrypt(&key, &iv, &aad, &ct, &tag, &mut pt)?;
          process(&pt);  // safe: only reached if authentication passed

  # ── AES-ECB (SP 800-38A §6.1) ─────────────────────────────────────

  - name: ecb_encrypt
    module: oxicrypt-aes
    family: aes-mode-encrypt
    description: >-
      AES-ECB encrypt. Identical plaintext blocks produce identical ciphertext
      blocks — do not use ECB for general-purpose encryption. Exists for
      FIPS compliance testing and key-wrapping primitives only.
    signature: >-
      pub fn ecb_encrypt<B: BlockCipher>(cipher: &B, input: &[u8],
      output: &mut [u8]) -> Result<(), ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule."
      - name: input
        type: "&[u8]"
        direction: in
        description: Plaintext. Must equal output.len() and be a multiple of 16.
      - name: output
        type: "&mut [u8]"
        direction: out
        description: Output buffer. Same length as input.
    returns:
      type: "Result<(), ModeError>"
      error_variants:
        - name: NotBlockAligned
          condition: "input.len() != output.len() or input.len() % 16 != 0"
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: ecb_decrypt
    module: oxicrypt-aes
    family: aes-mode-decrypt
    description: AES-ECB decrypt. Same block-alignment constraints as ecb_encrypt.
    signature: >-
      pub fn ecb_decrypt<B: BlockCipher>(cipher: &B, input: &[u8],
      output: &mut [u8]) -> Result<(), ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule."
      - name: input
        type: "&[u8]"
        direction: in
        description: Ciphertext. Must be a multiple of 16 bytes.
      - name: output
        type: "&mut [u8]"
        direction: out
        description: Output buffer. Same length as input.
    returns:
      type: "Result<(), ModeError>"
      error_variants:
        - name: NotBlockAligned
          condition: "input.len() != output.len() or input.len() % 16 != 0"
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── AES-CBC (SP 800-38A §6.2) ─────────────────────────────────────

  - name: cbc_encrypt
    module: oxicrypt-aes
    family: aes-mode-encrypt
    description: >-
      AES-CBC encrypt. IV must be 16 bytes. No padding is applied — input
      must be a multiple of 16. The IV must be unpredictable (random) per
      SP 800-38A; a predictable IV weakens confidentiality.
    signature: >-
      pub fn cbc_encrypt<B: BlockCipher>(cipher: &B, iv: &[u8; 16],
      input: &[u8], output: &mut [u8]) -> Result<(), ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule."
      - name: iv
        type: "&[u8; 16]"
        direction: in
        description: "16-byte IV. Must be random and unique per message."
        constraints:
          size: 16
      - name: input
        type: "&[u8]"
        direction: in
        description: Plaintext. Must equal output.len() and be a multiple of 16.
      - name: output
        type: "&mut [u8]"
        direction: out
        description: Output buffer. Same length as input.
    returns:
      type: "Result<(), ModeError>"
      error_variants:
        - name: NotBlockAligned
          condition: "input.len() != output.len() or input.len() % 16 != 0"
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: cbc_decrypt
    module: oxicrypt-aes
    family: aes-mode-decrypt
    description: AES-CBC decrypt. Same block-alignment constraints as cbc_encrypt.
    signature: >-
      pub fn cbc_decrypt<B: BlockCipher>(cipher: &B, iv: &[u8; 16],
      input: &[u8], output: &mut [u8]) -> Result<(), ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule."
      - name: iv
        type: "&[u8; 16]"
        direction: in
        description: "16-byte IV used during encryption."
        constraints:
          size: 16
      - name: input
        type: "&[u8]"
        direction: in
        description: Ciphertext. Must be a multiple of 16 bytes.
      - name: output
        type: "&mut [u8]"
        direction: out
        description: Output buffer. Same length as input.
    returns:
      type: "Result<(), ModeError>"
      error_variants:
        - name: NotBlockAligned
          condition: "input.len() != output.len() or input.len() % 16 != 0"
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── AES-CTR (SP 800-38A §6.5) ─────────────────────────────────────

  - name: ctr_xor
    module: oxicrypt-aes
    description: >-
      AES-CTR encrypt/decrypt (the same XOR operation). Uses icb as the
      initial counter block; the full 128-bit block is incremented as a
      big-endian counter per SP 800-38A Appendix F.5 convention (not
      just the low 32 bits as GCM uses). Input and output may be any
      length — no block alignment required.
    signature: >-
      pub fn ctr_xor<B: BlockCipher>(cipher: &B, icb: &[u8; 16],
      input: &[u8], output: &mut [u8])
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule."
      - name: icb
        type: "&[u8; 16]"
        direction: in
        description: "Initial counter block (16 bytes). Must be unique per (key, message) pair."
        constraints:
          size: 16
      - name: input
        type: "&[u8]"
        direction: in
        description: Plaintext or ciphertext. Any length.
      - name: output
        type: "&mut [u8]"
        direction: out
        description: Output buffer. Must be >= input.len() bytes.
    returns:
      type: "()"
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: >-
          CTR ICB must be unique per (key, message) pair. Reusing an ICB
          XORs two plaintexts together, making both trivially recoverable.

  # ── AES-KW / AES-KWP — inverse cipher direction ──────────────────
  # (Forward-cipher kw_wrap / kw_unwrap / kwp_wrap / kwp_unwrap are
  #  pre-existing public functions; manifest entries for those are
  #  pending separate backfill.)

  - name: kw_wrap_inverse_cipher
    module: oxicrypt-aes
    family: aes-mode-encrypt
    description: >-
      AES-KW wrap (RFC 3394 / SP 800-38F §6.2 "KW-AE") with the
      inverse cipher direction (ACVP `kwCipher = "inverse"`). The W
      function uses the AES inverse cipher (decrypt) as the
      underlying block primitive instead of the forward cipher. The
      ICV (`A6A6A6A6A6A6A6A6`) is unchanged; output ciphertext
      differs from the forward-direction wrap of the same input
      under the same key.
    signature: >-
      pub fn kw_wrap_inverse_cipher<B: BlockCipher>(cipher: &B,
      plaintext: &[u8], ciphertext_out: &mut [u8])
      -> Result<(), ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule."
      - name: plaintext
        type: "&[u8]"
        direction: in
        description: "Plaintext to wrap. Must be a positive multiple of 8 bytes, ≥ 16 bytes."
      - name: ciphertext_out
        type: "&mut [u8]"
        direction: out
        description: "Wrapped output. Must be exactly plaintext.len() + 8 bytes."
    returns:
      type: "Result<(), ModeError>"
      description: "LengthMismatch if buffer sizes are wrong."
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: kw_unwrap_inverse_cipher
    module: oxicrypt-aes
    family: aes-mode-decrypt
    description: >-
      AES-KW unwrap (SP 800-38F §6.2 "KW-AD") with the inverse
      cipher direction (ACVP `kwCipher = "inverse"`). The W^-1
      function uses the AES forward cipher (encrypt) as the
      underlying block primitive. Returns TagMismatch on ICV
      verification failure — including the case where the input
      was wrapped with the forward-cipher direction.
    signature: >-
      pub fn kw_unwrap_inverse_cipher<B: BlockCipher>(cipher: &B,
      ciphertext: &[u8], plaintext_out: &mut [u8])
      -> Result<(), ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule."
      - name: ciphertext
        type: "&[u8]"
        direction: in
        description: "Wrapped input. Must be a positive multiple of 8 bytes, ≥ 24 bytes."
      - name: plaintext_out
        type: "&mut [u8]"
        direction: out
        description: "Unwrapped output. Must be exactly ciphertext.len() - 8 bytes."
    returns:
      type: "Result<(), ModeError>"
      description: "TagMismatch on ICV failure (constant-time check); LengthMismatch on size error."
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: kwp_wrap_inverse_cipher
    module: oxicrypt-aes
    family: aes-mode-encrypt
    description: >-
      AES-KWP wrap (RFC 5649 / SP 800-38F §6.3 "KWP-AE") with the
      inverse cipher direction (ACVP `kwCipher = "inverse"`). The W
      function uses the AES inverse cipher; the alternative IV
      (`A65959A6 || [mli]_32`) is unchanged. Single-block path
      (RFC 5649 §4.1) drives `decrypt_block` directly.
    signature: >-
      pub fn kwp_wrap_inverse_cipher<B: BlockCipher>(cipher: &B,
      plaintext: &[u8], ciphertext_out: &mut [u8])
      -> Result<(), ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule."
      - name: plaintext
        type: "&[u8]"
        direction: in
        description: "Plaintext to wrap. Length 1..=2^32-1 bytes."
      - name: ciphertext_out
        type: "&mut [u8]"
        direction: out
        description: "Wrapped output. Length must be ((plaintext.len() + 7) / 8) * 8 + 8 bytes."
    returns:
      type: "Result<(), ModeError>"
      description: "LengthMismatch on size error."
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: kwp_unwrap_inverse_cipher
    module: oxicrypt-aes
    family: aes-mode-decrypt
    description: >-
      AES-KWP unwrap (SP 800-38F §6.3 "KWP-AD") with the inverse
      cipher direction (ACVP `kwCipher = "inverse"`). The W^-1
      function uses the AES forward cipher; returns TagMismatch on
      ICV-prefix mismatch, inconsistent declared `mli`, non-zero
      pad bytes, or input wrapped with the forward-cipher direction.
      Returns the recovered plaintext byte length on success so
      callers can truncate the scratch buffer.
    signature: >-
      pub fn kwp_unwrap_inverse_cipher<B: BlockCipher>(cipher: &B,
      ciphertext: &[u8], plaintext_out_scratch: &mut [u8])
      -> Result<usize, ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule."
      - name: ciphertext
        type: "&[u8]"
        direction: in
        description: "Wrapped input. Must be a positive multiple of 8 bytes, ≥ 16 bytes."
      - name: plaintext_out_scratch
        type: "&mut [u8]"
        direction: out
        description: "Padded plaintext scratch. Length must be ciphertext.len() - 8 bytes; first `mli` bytes are the recovered plaintext."
    returns:
      type: "Result<usize, ModeError>"
      description: "Recovered `mli` (plaintext byte length) on success; TagMismatch on ICV/pad failure (constant-time check); LengthMismatch on size error."
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── DRBG ──────────────────────────────────────────────────────────

  - name: "CtrDrbgAes256::instantiate_df"
    module: oxicrypt-drbg
    description: >-
      Instantiate CTR_DRBG with AES-256 using the derivation function.
    signature: >-
      pub fn instantiate_df(&mut self, entropy: &[u8], nonce: &[u8],
      personalization: &[u8]) -> Result<(), DrbgError>
    parameters:
      - name: entropy
        type: "&[u8]"
        direction: in
        description: Entropy input from a noise source.
        constraints:
          valid_range: "1..=192 bytes (MAX_DF_INPUT shared across all inputs)"
      - name: nonce
        type: "&[u8]"
        direction: in
        description: >-
          Nonce. Per SP 800-90A, must provide at least security_strength/2
          bits of entropy or be a value that is not repeated.
        constraints:
          valid_range: "0..=192 bytes"
      - name: personalization
        type: "&[u8]"
        direction: in
        description: Optional personalization string. May be empty.
        constraints:
          valid_range: "0..=192 bytes"
          nullability: required
    returns:
      type: "Result<(), DrbgError>"
      description: Ok if instantiation succeeds.
      error_variants:
        - name: InputTooLong
          condition: "entropy.len() + nonce.len() + personalization.len() > 192"
    preconditions:
      - description: DRBG must be in uninstantiated state (new or after uninstantiate).
    postconditions:
      - description: DRBG is instantiated and ready for generate calls.
    sequencing:
      must_call_after: [generate_df, reseed_df]
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let mut drbg = oxicrypt_drbg::CtrDrbgAes256::new();
        drbg.instantiate_df(&entropy, &nonce, b"my-app")?;
        let mut out = [0u8; 32];
        drbg.generate_df(&mut out, &[])?;

  - name: "CtrDrbgAes256::generate_df"
    module: oxicrypt-drbg
    description: Generate random bytes from an instantiated CTR_DRBG.
    signature: >-
      pub fn generate_df(&mut self, out: &mut [u8],
      additional_input: &[u8]) -> Result<(), DrbgError>
    parameters:
      - name: out
        type: "&mut [u8]"
        direction: out
        description: Buffer to fill with random bytes.
        constraints:
          valid_range: "1..=65536 bytes per call"
      - name: additional_input
        type: "&[u8]"
        direction: in
        description: Optional additional input. May be empty.
        constraints:
          valid_range: "0..=192 bytes"
    returns:
      type: "Result<(), DrbgError>"
      error_variants:
        - name: Uninstantiated
          condition: DRBG was not instantiated.
        - name: ReseedRequired
          condition: Reseed counter exceeded 2^48.
        - name: RequestTooLong
          condition: "out.len() > 65536"
        - name: InputTooLong
          condition: "additional_input.len() > 192"
    preconditions:
      - description: DRBG must be instantiated.
        check: Must have called instantiate_df or instantiate_no_df.
    postconditions:
      - description: out is filled with pseudorandom bytes.
      - description: Internal reseed counter incremented.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── CMAC (SP 800-38B) ────────────────────────────────────────────

  - name: cmac_aes128
    module: oxicrypt-cmac
    family: cmac-aes
    description: >-
      One-shot AES-128-CMAC (SP 800-38B). Takes a raw 16-byte key and
      builds the key schedule internally. Returns a 16-byte authentication
      tag (full AES block size).
    signature: "pub fn cmac_aes128(key: &[u8; 16], msg: &[u8]) -> Result<[u8; 16], Error>"
    parameters:
      - name: key
        type: "&[u8; 16]"
        direction: in
        description: 128-bit AES key.
        constraints:
          size: 16
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to authenticate. Any length.
    returns:
      type: "Result<[u8; 16], Error>"
      description: 16-byte CMAC tag.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: false  # AES table-based
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let tag = oxicrypt_cmac::cmac_aes128(&[0u8; 16], b"message")?;
        assert_eq!(tag.len(), 16);

  - name: cmac_aes192
    module: oxicrypt-cmac
    family: cmac-aes
    description: One-shot AES-192-CMAC. Returns a 16-byte authentication tag.
    signature: "pub fn cmac_aes192(key: &[u8; 24], msg: &[u8]) -> Result<[u8; 16], Error>"
    parameters:
      - name: key
        type: "&[u8; 24]"
        direction: in
        description: 192-bit AES key.
        constraints:
          size: 24
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to authenticate.
    returns:
      type: "Result<[u8; 16], Error>"
      description: 16-byte CMAC tag.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: cmac_aes256
    module: oxicrypt-cmac
    family: cmac-aes
    description: One-shot AES-256-CMAC. Returns a 16-byte authentication tag.
    signature: "pub fn cmac_aes256(key: &[u8; 32], msg: &[u8]) -> Result<[u8; 16], Error>"
    parameters:
      - name: key
        type: "&[u8; 32]"
        direction: in
        description: 256-bit AES key.
        constraints:
          size: 32
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to authenticate.
    returns:
      type: "Result<[u8; 16], Error>"
      description: 16-byte CMAC tag.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: cmac_tag
    module: oxicrypt-cmac
    description: >-
      Generic CMAC over any BlockCipher. No module-state gating — this is
      an internal composition helper used by cmac_aes128/192/256 and the
      CTR_DRBG. Callers that need FIPS gating should use the typed variants.
    signature: "pub fn cmac_tag<B: BlockCipher>(cipher: &B, msg: &[u8]) -> [u8; 16]"
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: Pre-built AES key schedule.
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to authenticate.
    returns:
      type: "[u8; 16]"
      description: 16-byte CMAC tag.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: null

  # ── KDF — HKDF (SP 800-56Cr2 / RFC 5869) ─────────────────────────

  - name: "HkdfSha256::extract"
    module: oxicrypt-kdf
    description: >-
      HKDF-Extract (RFC 5869 §2.2) with SHA-256. Produces a PRK from IKM
      and an optional salt. A None salt is treated as 32 zero bytes per
      RFC 5869 §2.2. Use HkdfSha1/HkdfSha384/HkdfSha512/HkdfSha3_* for
      other hash variants.
    signature: "pub fn HkdfSha256::extract(salt: Option<&[u8]>, ikm: &[u8]) -> Result<Self, KdfError>"
    parameters:
      - name: salt
        type: "Option<&[u8]>"
        direction: in
        description: >-
          Optional non-secret salt. None is treated as 32 zero bytes.
          A random salt of 32 bytes is recommended.
      - name: ikm
        type: "&[u8]"
        direction: in
        description: Input keying material (e.g. raw ECDH shared secret Z).
    returns:
      type: "Result<HkdfSha256, KdfError>"
      description: HKDF instance holding the 32-byte PRK, ready for expand().
      error_variants:
        - name: Module
          condition: Module not operational or service restricted.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let hkdf = HkdfSha256::extract(Some(b"salt"), &z)?;
        let mut okm = [0u8; 32];
        hkdf.expand(b"info", &mut okm)?;

  - name: "HkdfSha256::from_prk"
    module: oxicrypt-kdf
    description: >-
      Construct an HkdfSha256 from a pre-existing PRK. prk must be exactly
      32 bytes; any other length returns Err(OutputTooLong).
    signature: "pub fn HkdfSha256::from_prk(prk: &[u8]) -> Result<Self, KdfError>"
    parameters:
      - name: prk
        type: "&[u8]"
        direction: in
        description: Pre-extracted PRK. Must be exactly 32 bytes for HkdfSha256.
        constraints:
          valid_range: "exactly 32 bytes"
    returns:
      type: "Result<HkdfSha256, KdfError>"
      error_variants:
        - name: Module
          condition: Module not operational or service restricted.
        - name: OutputTooLong
          condition: prk.len() != 32
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: "HkdfSha256::expand"
    module: oxicrypt-kdf
    description: >-
      HKDF-Expand (RFC 5869 §2.3) with SHA-256. Fills okm with derived key
      material. okm.len() must not exceed 255 * 32 = 8160 bytes.
    signature: "pub fn expand(&self, info: &[u8], okm: &mut [u8]) -> Result<(), KdfError>"
    parameters:
      - name: self
        type: "&HkdfSha256"
        direction: in
        description: HKDF instance from extract() or from_prk().
      - name: info
        type: "&[u8]"
        direction: in
        description: "Context / application-specific info string. May be empty."
      - name: okm
        type: "&mut [u8]"
        direction: out
        description: Output key material buffer. Filled with derived bytes.
        constraints:
          valid_range: "0..=8160 bytes (255 * 32)"
    returns:
      type: "Result<(), KdfError>"
      error_variants:
        - name: Module
          condition: Module not operational or service restricted.
        - name: OutputTooLong
          condition: okm.len() > 255 * 32
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── KDF — SP 800-108r1 KBKDF ─────────────────────────────────────

  - name: "Sp800_108CounterHmacSha256::derive"
    module: oxicrypt-kdf
    family: kdf-sp800108-mode
    description: >-
      SP 800-108r1 §5.2 Counter Mode KBKDF with HMAC-SHA-256. Assembles
      the fixed-data structure (label || 0x00 || context || [L]_32) internally.
      Use Sp800_108CounterHmacSha1/384/512/Sha3_* for other PRF variants.
    signature: >-
      pub fn Sp800_108CounterHmacSha256::derive(key: &[u8], label: &[u8],
      context: &[u8], out: &mut [u8]) -> Result<(), KdfError>
    parameters:
      - name: key
        type: "&[u8]"
        direction: in
        description: Derivation key (KI).
      - name: label
        type: "&[u8]"
        direction: in
        description: Human-readable label identifying the derived key's purpose.
      - name: context
        type: "&[u8]"
        direction: in
        description: Context binding (e.g. parties, session identifiers).
      - name: out
        type: "&mut [u8]"
        direction: out
        description: Output buffer filled with derived key material.
        constraints:
          valid_range: "1..=2^29-1 bytes (out.len()*8 must fit in u32)"
    returns:
      type: "Result<(), KdfError>"
      error_variants:
        - name: Module
          condition: Module not operational or service restricted.
        - name: OutputTooLong
          condition: out.len() * 8 does not fit in a u32 bit-length field.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let mut okm = [0u8; 32];
        Sp800_108CounterHmacSha256::derive(&master_key, b"enc", b"ctx", &mut okm)?;

  - name: "Sp800_108FeedbackHmacSha256::derive"
    module: oxicrypt-kdf
    family: kdf-sp800108-mode
    description: >-
      SP 800-108r1 §5.3 Feedback Mode KBKDF with HMAC-SHA-256. Requires
      an IV (initial chaining value). The IV is non-secret and may be empty
      for zero-IV mode.
    signature: >-
      pub fn Sp800_108FeedbackHmacSha256::derive(key: &[u8], iv: &[u8],
      label: &[u8], context: &[u8], out: &mut [u8]) -> Result<(), KdfError>
    parameters:
      - name: key
        type: "&[u8]"
        direction: in
        description: Derivation key.
      - name: iv
        type: "&[u8]"
        direction: in
        description: Initial chaining value. May be empty for zero-IV mode.
      - name: label
        type: "&[u8]"
        direction: in
        description: Label identifying the derived key.
      - name: context
        type: "&[u8]"
        direction: in
        description: Context binding.
      - name: out
        type: "&mut [u8]"
        direction: out
        description: Output buffer.
    returns:
      type: "Result<(), KdfError>"
      error_variants:
        - name: Module
          condition: Module not operational or service restricted.
        - name: OutputTooLong
          condition: Output too large for 32-bit counter encoding.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: "Sp800_108DoublePipelineHmacSha256::derive"
    module: oxicrypt-kdf
    family: kdf-sp800108-mode
    description: >-
      SP 800-108r1 §5.4 Double-Pipeline Mode KBKDF with HMAC-SHA-256.
      No IV required. Uses a two-stage pipeline: A(i) = PRF(key, A(i-1))
      then K(i) = PRF(key, A(i) || fixed_data).
    signature: >-
      pub fn Sp800_108DoublePipelineHmacSha256::derive(key: &[u8], label: &[u8],
      context: &[u8], out: &mut [u8]) -> Result<(), KdfError>
    parameters:
      - name: key
        type: "&[u8]"
        direction: in
        description: Derivation key.
      - name: label
        type: "&[u8]"
        direction: in
        description: Label.
      - name: context
        type: "&[u8]"
        direction: in
        description: Context.
      - name: out
        type: "&mut [u8]"
        direction: out
        description: Output buffer.
    returns:
      type: "Result<(), KdfError>"
      error_variants:
        - name: Module
          condition: Module not operational or service restricted.
        - name: OutputTooLong
          condition: Output too large for 32-bit counter encoding.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── KDF — PBKDF2 (SP 800-132) ────────────────────────────────────

  - name: "Pbkdf2HmacSha256::derive"
    module: oxicrypt-kdf
    description: >-
      PBKDF2 with HMAC-SHA-256 (SP 800-132, RFC 8018 §5.2). Derives
      out.len() bytes from password and salt using c iterations.
      Use Pbkdf2HmacSha1/384/512/Sha3_* for other PRF variants.
    signature: >-
      pub fn Pbkdf2HmacSha256::derive(password: &[u8], salt: &[u8],
      c: u32, out: &mut [u8]) -> Result<(), KdfError>
    parameters:
      - name: password
        type: "&[u8]"
        direction: in
        description: Password (secret). Any length.
      - name: salt
        type: "&[u8]"
        direction: in
        description: >-
          Salt (non-secret, unique per password). SP 800-132 recommends
          at least 16 bytes from an approved RBG.
      - name: c
        type: u32
        direction: in
        description: >-
          Iteration count. Must be > 0 (panics if 0). SP 800-132 minimum
          is 1000; OWASP 2024 recommendation for password storage is >= 600000.
        constraints:
          valid_range: "1..=2^32-1"
      - name: out
        type: "&mut [u8]"
        direction: out
        description: Output buffer for derived key material.
        constraints:
          valid_range: "1..=(2^32-1)*32 bytes"
    returns:
      type: "Result<(), KdfError>"
      error_variants:
        - name: Module
          condition: Module not operational or service restricted.
        - name: OutputTooLong
          condition: "out.len() > (2^32-1) * 32"
    preconditions:
      - description: Module must be Operational.
      - description: c must be > 0.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: >-
          Low iteration counts make PBKDF2 vulnerable to offline dictionary
          attacks. SP 800-132 minimum is 1000; for password storage use >= 600000.
        wrong: |
          Pbkdf2HmacSha256::derive(password, salt, 1, &mut key)?;  // far too few
        right: |
          Pbkdf2HmacSha256::derive(password, salt, 600_000, &mut key)?;

  # ── TLS 1.3 KDF (RFC 8446 §7.1) ──────────────────────────────────
  #
  # FIPS-gated public wrappers around the gateless `*_internal` entry
  # points. The `*_internal` symbols stay out of this manifest by
  # project convention — they are `pub` in Rust solely for in-tree
  # reachability (ACVP harness, power-up self-test) and are not part of
  # the consumable external API.

  - name: tls13_hkdf_expand_label
    module: oxicrypt-tls-kdf
    description: >-
      HKDF-Expand-Label per RFC 8446 §7.1. Builds the HkdfLabel wire
      structure (length || "tls13 " + label || context) and runs
      HKDF-Expand (RFC 5869 §2.3) to fill `out`. Generic over the HMAC
      PRF — typical TLS 1.3 use is HmacSha256, HmacSha384, or
      HmacSha512. FIPS-gated public wrapper around
      tls13_hkdf_expand_label_internal.
    signature: >-
      pub fn tls13_hkdf_expand_label<P: PrfHmac<L>, const L: usize>(
      secret: &[u8], label: &[u8], context: &[u8], out: &mut [u8])
      -> Result<(), Error>
    parameters:
      - name: secret
        type: "&[u8]"
        direction: in
        description: "Pseudorandom key (PRK), L bytes (HMAC output size)."
      - name: label
        type: "&[u8]"
        direction: in
        description: "Short ASCII label (e.g. b\"c hs traffic\", b\"derived\"). Combined with the \"tls13 \" prefix the full label must be <= 255 bytes."
      - name: context
        type: "&[u8]"
        direction: in
        description: "Context bytes (typically transcript-hash digest). Length must be <= 255."
      - name: out
        type: "&mut [u8]"
        direction: out
        description: "Output buffer; length must fit u16. Realistic TLS 1.3 outputs are <= 96 bytes."
    returns:
      type: "Result<(), Error>"
      error_variants:
        - name: NotOperational
          condition: Module not initialized, in SelfTest, or latched in Error state.
        - name: AlgorithmRestricted
          condition: Active AlgorithmProfile does not allow Service::Tls13Kdf.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Tls13Kdf

  - name: tls13_derive_secret
    module: oxicrypt-tls-kdf
    description: >-
      Derive-Secret per RFC 8446 §7.1, defined as
      HKDF-Expand-Label(secret, label, Hash(messages), Hash.length).
      Caller computes the running transcript hash separately and
      passes it as `transcript_hash`. FIPS-gated public wrapper around
      tls13_derive_secret_internal.
    signature: >-
      pub fn tls13_derive_secret<P: PrfHmac<L>, const L: usize>(
      secret: &[u8], label: &[u8], transcript_hash: &[u8],
      out: &mut [u8]) -> Result<(), Error>
    parameters:
      - name: secret
        type: "&[u8]"
        direction: in
        description: "Pseudorandom key (PRK), L bytes."
      - name: label
        type: "&[u8]"
        direction: in
        description: "Short ASCII label (e.g. b\"derived\", b\"c hs traffic\")."
      - name: transcript_hash
        type: "&[u8]"
        direction: in
        description: "Hash(messages) — pre-computed transcript-hash digest."
      - name: out
        type: "&mut [u8]"
        direction: out
        description: "Output buffer; typically Hash.length bytes for derived secrets."
    returns:
      type: "Result<(), Error>"
      error_variants:
        - name: NotOperational
          condition: Module not initialized, in SelfTest, or latched in Error state.
        - name: AlgorithmRestricted
          condition: Active AlgorithmProfile does not allow Service::Tls13Kdf.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Tls13Kdf

  # ── TLS 1.2 KDF (RFC 5246, RFC 7627) ─────────────────────────────

  - name: tls12_prf
    module: oxicrypt-tls-kdf
    description: >-
      TLS 1.2 PRF (RFC 5246 §5) — generic over HMAC. In standard TLS 1.2,
      use P=HmacSha256 (SHA-256 cipher suites) or P=HmacSha384 (SHA-384
      suites). Fills out with PRF-derived bytes.
    signature: >-
      pub fn tls12_prf<P: PrfHmac<L>, const L: usize>(secret: &[u8],
      label: &[u8], seed: &[u8], out: &mut [u8]) -> Result<(), Error>
    parameters:
      - name: secret
        type: "&[u8]"
        direction: in
        description: "TLS secret input (e.g. pre_master_secret or master_secret)."
      - name: label
        type: "&[u8]"
        direction: in
        description: "ASCII label string (e.g. b\"master secret\", b\"key expansion\")."
      - name: seed
        type: "&[u8]"
        direction: in
        description: "Seed (typically client_random || server_random or session_hash)."
      - name: out
        type: "&mut [u8]"
        direction: out
        description: Output buffer filled with PRF bytes.
    returns:
      type: "Result<(), Error>"
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: tls12_extended_master_secret
    module: oxicrypt-tls-kdf
    description: >-
      TLS 1.2 master secret derivation with RFC 7627 Extended Master Secret.
      Runs two PRF calls:
      (1) master_secret = PRF(pms, "extended master secret", session_hash)[0..48]
      (2) key_block = PRF(master_secret, "key expansion", server_random || client_random)
      Returns the 48-byte master secret; fills key_block_out.
      Panics if server_random.len() + client_random.len() > 64.
    signature: >-
      pub fn tls12_extended_master_secret<P: PrfHmac<L>, const L: usize>(
      pre_master_secret: &[u8], session_hash: &[u8], server_random: &[u8],
      client_random: &[u8], key_block_out: &mut [u8]) -> Result<[u8; 48], Error>
    parameters:
      - name: pre_master_secret
        type: "&[u8]"
        direction: in
        description: The pre-master secret (e.g. from ECDH).
      - name: session_hash
        type: "&[u8]"
        direction: in
        description: Hash of the full handshake transcript (per RFC 7627).
      - name: server_random
        type: "&[u8]"
        direction: in
        description: "ServerHello.random (32 bytes). With client_random must total <= 64 bytes."
      - name: client_random
        type: "&[u8]"
        direction: in
        description: "ClientHello.random (32 bytes)."
      - name: key_block_out
        type: "&mut [u8]"
        direction: out
        description: Output buffer for key block. Length determines how much key material is derived.
    returns:
      type: "Result<[u8; 48], Error>"
      description: 48-byte TLS master secret.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: tls12_master_secret
    module: oxicrypt-tls-kdf
    description: >-
      TLS 1.2 master secret derivation without RFC 7627 EMS (standard
      RFC 5246 §8.1). Runs two PRF calls:
      (1) master_secret = PRF(pms, "master secret", chr || shr)[0..48]
      (2) key_block = PRF(master_secret, "key expansion", server_random || client_random)
      Panics if any concatenated pair exceeds 64 bytes.
    signature: >-
      pub fn tls12_master_secret<P: PrfHmac<L>, const L: usize>(
      pre_master_secret: &[u8], client_hello_random: &[u8],
      server_hello_random: &[u8], server_random: &[u8],
      client_random: &[u8], key_block_out: &mut [u8]) -> Result<[u8; 48], Error>
    parameters:
      - name: pre_master_secret
        type: "&[u8]"
        direction: in
        description: The pre-master secret.
      - name: client_hello_random
        type: "&[u8]"
        direction: in
        description: ClientHello.random (32 bytes).
      - name: server_hello_random
        type: "&[u8]"
        direction: in
        description: ServerHello.random (32 bytes).
      - name: server_random
        type: "&[u8]"
        direction: in
        description: server_random for key expansion phase.
      - name: client_random
        type: "&[u8]"
        direction: in
        description: client_random for key expansion phase.
      - name: key_block_out
        type: "&mut [u8]"
        direction: out
        description: Output buffer for the key block.
    returns:
      type: "Result<[u8; 48], Error>"
      description: 48-byte TLS master secret.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── RSA ───────────────────────────────────────────────────────────

  - name: "RsaPrivateKey2048::sign_pkcs1_v15_sha256"
    module: oxicrypt-rsa
    description: Sign a message with RSA-2048 PKCS#1 v1.5 and SHA-256.
    signature: >-
      pub fn sign_pkcs1_v15_sha256(&self, msg: &[u8])
      -> Result<[u8; 256], Error>
    parameters:
      - name: self
        type: "&RsaPrivateKey2048"
        direction: in
        description: RSA private key (constructed via from_components or generate).
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to sign (hashed internally with SHA-256).
        constraints:
          valid_range: any length
    returns:
      type: "Result<[u8; 256], Error>"
      description: 256-byte RSA signature.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
      - description: Key must have been constructed (PCT passed).
    postconditions:
      - description: >-
          Returns a valid RSASSA-PKCS1-v1_5 signature. Internally
          performs Bellcore verify-after-sign (IG D.G).
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: rsa_pkcs1_v15_verify_2048_sha256
    module: oxicrypt-rsa
    description: Verify an RSA-2048 PKCS#1 v1.5 SHA-256 signature.
    signature: >-
      pub fn rsa_pkcs1_v15_verify_2048_sha256(n: &[u8; 256], e: u64,
      msg: &[u8], sig: &[u8; 256]) -> bool
    parameters:
      - name: n
        type: "&[u8; 256]"
        direction: in
        description: RSA modulus (256 bytes, big-endian).
        constraints:
          size: 256
          encoding: big-endian
      - name: e
        type: u64
        direction: in
        description: Public exponent (typically 65537).
        constraints:
          valid_range: "odd, >= 65537"
      - name: msg
        type: "&[u8]"
        direction: in
        description: Original message that was signed.
      - name: sig
        type: "&[u8; 256]"
        direction: in
        description: Signature to verify.
        constraints:
          size: 256
          encoding: big-endian
    returns:
      type: bool
      description: true if signature is valid, false otherwise.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: false  # Verification is public-data only
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational

  # ── ECDSA ─────────────────────────────────────────────────────────

  - name: "EcdsaP256PrivateKey::generate"
    module: oxicrypt-ecdsa
    description: >-
      Generate an ECDSA P-256 key pair with DRBG-backed rejection
      sampling (FIPS 186-5 §A.2.2) and a pairwise consistency test.
    signature: >-
      pub fn generate(drbg: &mut HmacDrbgSha256)
      -> Result<Self, Error>
    parameters:
      - name: drbg
        type: "&mut HmacDrbgSha256"
        direction: in-out
        description: >-
          Instantiated HMAC-DRBG for key generation randomness.
          Must already be instantiated with sufficient entropy.
    returns:
      type: "Result<EcdsaP256PrivateKey, Error>"
      description: New key handle with (d, Q) pair.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: ConditionalTestFailed
          condition: Pairwise consistency test (sign-then-verify) failed.
    preconditions:
      - description: Module must be Operational.
      - description: DRBG must be instantiated.
    postconditions:
      - description: >-
          Key handle contains a valid (d, Q) pair where Q = d * G.
          The PCT has verified that signing and verifying with this
          key produces consistent results.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: "EcdsaP256PrivateKey::sign_sha256"
    module: oxicrypt-ecdsa
    description: Sign a message with ECDSA P-256 and SHA-256.
    signature: >-
      pub fn sign_sha256(&self, drbg: &mut HmacDrbgSha256, msg: &[u8])
      -> Result<[u8; 64], Error>
    parameters:
      - name: self
        type: "&EcdsaP256PrivateKey"
        direction: in
        description: Private key handle.
      - name: drbg
        type: "&mut HmacDrbgSha256"
        direction: in-out
        description: Instantiated DRBG for per-signature k sampling.
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to sign (hashed internally with SHA-256).
    returns:
      type: "Result<[u8; 64], Error>"
      description: "64-byte signature: r (32 bytes) || s (32 bytes), big-endian."
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
      - description: DRBG must be instantiated.
    postconditions:
      - description: >-
          Returns a valid ECDSA-P256-SHA256 signature. The per-signature
          nonce k is sampled via FIPS 186-5 §A.2.2 rejection loop.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let key = EcdsaP256PrivateKey::generate(&mut drbg)?;
        let sig = key.sign_sha256(&mut drbg, b"hello")?;
        assert_eq!(sig.len(), 64);

  - name: verify
    module: oxicrypt-ecdsa
    description: Verify an ECDSA P-256 SHA-256 signature.
    signature: >-
      pub fn verify(pk: &[u8; 65], msg: &[u8], sig: &[u8; 64])
      -> Result<bool, Error>
    parameters:
      - name: pk
        type: "&[u8; 65]"
        direction: in
        description: >-
          Uncompressed SEC1 public key: 0x04 || X (32 bytes) || Y (32 bytes).
          Full SP 800-56Ar3 §5.6.2.3.3 point validation is performed.
        constraints:
          size: 65
          encoding: "SEC1 uncompressed (first byte must be 0x04)"
      - name: msg
        type: "&[u8]"
        direction: in
        description: Original message.
      - name: sig
        type: "&[u8; 64]"
        direction: in
        description: "Signature: r (32 bytes) || s (32 bytes), big-endian."
        constraints:
          size: 64
          encoding: big-endian
    returns:
      type: "Result<bool, Error>"
      description: Ok(true) if valid, Ok(false) if invalid.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: InvalidInput
          condition: Public key fails point validation.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: false  # Verification operates on public data only
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational

  # ── Ed25519 ───────────────────────────────────────────────────────

  - name: "Ed25519PrivateKey::sign"
    module: oxicrypt-eddsa
    description: >-
      Sign a message with Ed25519 (RFC 8032). Deterministic — no
      per-signature DRBG draw.
    signature: "pub fn sign(&self, msg: &[u8]) -> Result<[u8; 64], Error>"
    parameters:
      - name: self
        type: "&Ed25519PrivateKey"
        direction: in
        description: Ed25519 private key handle.
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to sign.
    returns:
      type: "Result<[u8; 64], Error>"
      description: 64-byte Ed25519 signature.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
    postconditions:
      - description: Returns a valid RFC 8032 Ed25519 signature.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── ECDH ──────────────────────────────────────────────────────────

  - name: compute_shared_secret_p256
    module: oxicrypt-ecdh
    description: >-
      Compute ECDH P-256 shared secret (SP 800-56Ar3 CDH).
      Returns x-coordinate of d * Q.
    signature: >-
      pub fn compute_shared_secret_p256(d: &[u8; 32], peer_pk: &[u8; 65])
      -> Result<[u8; 32], Error>
    parameters:
      - name: d
        type: "&[u8; 32]"
        direction: in
        description: Our private scalar (big-endian).
        constraints:
          size: 32
          encoding: big-endian
      - name: peer_pk
        type: "&[u8; 65]"
        direction: in
        description: >-
          Peer's uncompressed SEC1 public key (0x04 || X || Y).
          Point validation performed internally.
        constraints:
          size: 65
          encoding: "SEC1 uncompressed (first byte must be 0x04)"
    returns:
      type: "Result<[u8; 32], Error>"
      description: >-
        32-byte shared secret (x-coordinate). Feed this to a KDF
        (e.g., HKDF) — do NOT use it directly as a key.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: InvalidInput
          condition: Peer public key fails point validation.
    preconditions:
      - description: Module must be Operational.
      - description: Peer public key must be a valid P-256 point.
    postconditions:
      - description: >-
          Returns the x-coordinate of d * peer_pk. The caller MUST
          pass this through a KDF before using it as keying material.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: >-
          The raw ECDH shared secret must not be used directly as a
          symmetric key. Always derive through a KDF (HKDF, SP 800-56Cr2).
        wrong: |
          let key_bytes = compute_shared_secret_p256(&d, &pk)?;
          let aes_key = Aes256Key::new(&key_bytes)?;  // WRONG — no KDF
        right: |
          let z = compute_shared_secret_p256(&d, &pk)?;
          let mut okm = [0u8; 32];
          hkdf_sha256(&salt, &z, &info, &mut okm)?;
          let aes_key = Aes256Key::new(&okm)?;

  - name: compute_shared_secret_p384
    module: oxicrypt-ecdh
    description: >-
      Compute ECDH P-384 shared secret (SP 800-56Ar3 CDH).
      Returns x-coordinate of d * Q.
    signature: >-
      pub fn compute_shared_secret_p384(d: &[u8; 48], peer_pk: &[u8; 97])
      -> Result<[u8; 48], Error>
    parameters:
      - name: d
        type: "&[u8; 48]"
        direction: in
        description: Our private scalar (big-endian).
        constraints:
          size: 48
          encoding: big-endian
      - name: peer_pk
        type: "&[u8; 97]"
        direction: in
        description: >-
          Peer's uncompressed SEC1 public key (0x04 || X || Y).
          Point validation performed internally.
        constraints:
          size: 97
          encoding: "SEC1 uncompressed (first byte must be 0x04)"
    returns:
      type: "Result<[u8; 48], Error>"
      description: >-
        48-byte shared secret (x-coordinate). Feed this to a KDF
        (e.g., HKDF) — do NOT use it directly as a key.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: InvalidInput
          condition: Peer public key fails point validation.
    preconditions:
      - description: Module must be Operational.
      - description: Peer public key must be a valid P-384 point.
    postconditions:
      - description: >-
          Returns the x-coordinate of d * peer_pk. The caller MUST
          pass this through a KDF before using it as keying material.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: generate_keypair_p256
    module: oxicrypt-ecdh
    description: >-
      Generate a fresh ECDH P-256 key pair (d, Q) via the FIPS 186-5
      §A.2.2 rejection sampler driven by the supplied DRBG, then run
      the IG 10.3.A pairwise consistency test as an ECDH-roundtrip
      against the RFC 5903 §8.1 responder keypair before returning.
      Reuses oxicrypt-ecdsa's scalar generator so a single FIPS 186-5
      §A.2.2 implementation serves both ECDH and ECDSA on this curve.
    signature: >-
      pub fn generate_keypair_p256(drbg: &mut HmacDrbgSha256)
      -> Result<([u8; 32], [u8; 65]), Error>
    parameters:
      - name: drbg
        type: "&mut HmacDrbgSha256"
        direction: inout
        description: >-
          Live, instantiated HMAC-DRBG-SHA-256 the keygen consumes
          for scalar sampling. Must be in the Operational state and
          may be reused for subsequent calls.
    returns:
      type: "Result<([u8; 32], [u8; 65]), Error>"
      description: >-
        On success, returns (d, Q) where d is the 32-byte private
        scalar in [1, n − 1] and Q is the 65-byte SEC1 uncompressed
        public key 0x04 || X(32) || Y(32) of d · G.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: ECDH-P-256 blocked by active profile.
        - name: InvalidInput
          condition: >-
            DRBG fault, rejection-sampling exhaustion, or IG 10.3.A
            PCT mismatch. In practice only a broken DRBG.
    preconditions:
      - description: Module must be Operational.
      - description: DRBG handle must be live and instantiated.
    postconditions:
      - description: >-
          Returns a freshly sampled (d, Q) pair that has passed the
          IG 10.3.A pairwise consistency test. Q = d · G.
    thread_safety: not-thread-safe-on-shared-drbg
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: generate_keypair_p384
    module: oxicrypt-ecdh
    description: >-
      Generate a fresh ECDH P-384 key pair via the FIPS 186-5 §A.2.2
      rejection sampler. Mirrors generate_keypair_p256 for the
      P-384 curve, with the IG 10.3.A PCT running against the
      RFC 5903 §8.2 responder keypair.
    signature: >-
      pub fn generate_keypair_p384(drbg: &mut HmacDrbgSha256)
      -> Result<([u8; 48], [u8; 97]), Error>
    parameters:
      - name: drbg
        type: "&mut HmacDrbgSha256"
        direction: inout
        description: Live, instantiated HMAC-DRBG-SHA-256.
    returns:
      type: "Result<([u8; 48], [u8; 97]), Error>"
      description: >-
        On success, returns (d, Q) where d is the 48-byte private
        scalar in [1, n − 1] and Q is the 97-byte SEC1 uncompressed
        public key of d · G.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: ECDH-P-384 blocked by active profile.
        - name: InvalidInput
          condition: DRBG fault, sampling exhaustion, or PCT mismatch.
    preconditions:
      - description: Module must be Operational.
      - description: DRBG handle must be live and instantiated.
    postconditions:
      - description: >-
          Returns a freshly sampled (d, Q) pair that has passed
          IG 10.3.A PCT. Q = d · G.
    thread_safety: not-thread-safe-on-shared-drbg
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── DH ──────────────────────────────────────────────────────────

  - name: compute_shared_secret_3072
    module: oxicrypt-dh
    description: >-
      Compute DH-3072 shared secret over RFC 3526 Group 15
      (SP 800-56Ar3 §5.7.1.1 FFC DH). Partial public-key validation
      per §5.6.2.3.2 (range check, sufficient for safe-prime groups).
    signature: >-
      pub fn compute_shared_secret_3072(x_bytes: &[u8; 384],
      y_bytes: &[u8; 384]) -> Result<[u8; 384], Error>
    parameters:
      - name: x_bytes
        type: "&[u8; 384]"
        direction: in
        description: Our private key (big-endian, 3072 bits).
        constraints:
          size: 384
          encoding: big-endian
          range: "1 ≤ x < q where q = (p−1)/2"
      - name: y_bytes
        type: "&[u8; 384]"
        direction: in
        description: >-
          Peer's public key (big-endian, 3072 bits). Validated via
          partial validation: 2 ≤ y ≤ p − 2.
        constraints:
          size: 384
          encoding: big-endian
          range: "2 ≤ y ≤ p − 2"
    returns:
      type: "Result<[u8; 384], Error>"
      description: >-
        384-byte raw shared secret Z = y^x mod p. Feed this to an
        SP 800-56Cr2 KDF — do NOT use directly as keying material.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: InvalidInput
          condition: Private key or peer public key out of range.
        - name: AlgorithmRestricted
          condition: DH-3072 blocked by active profile (e.g. CNSA 2.0).
    preconditions:
      - description: Module must be Operational.
      - description: Peer public key must pass partial validation (2 ≤ y ≤ p − 2).
    postconditions:
      - description: >-
          Returns Z = y^x mod p. Caller MUST pass through an SP 800-56Cr2
          extractor before use as keying material.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: >-
          The raw DH shared secret must not be used directly as a
          symmetric key. Always derive through a KDF (HKDF, SP 800-56Cr2).
        wrong: |
          let z = compute_shared_secret_3072(&x, &y)?;
          let aes_key = Aes256Key::new(&z[..32])?;  // WRONG — no KDF
        right: |
          let z = compute_shared_secret_3072(&x, &y)?;
          let mut okm = [0u8; 32];
          hkdf_sha256(&salt, &z, &info, &mut okm)?;
          let aes_key = Aes256Key::new(&okm)?;

  - name: generate_keypair_3072
    module: oxicrypt-dh
    description: >-
      Generate a DH-3072 key pair for RFC 3526 Group 15.
      Private key x sampled from HMAC-DRBG-SHA-256 via rejection
      sampling (x ∈ [1, q−1]). Public key y = 2^x mod p.
    signature: >-
      pub fn generate_keypair_3072(drbg: &mut HmacDrbgSha256)
      -> Result<([u8; 384], [u8; 384]), Error>
    parameters:
      - name: drbg
        type: "&mut HmacDrbgSha256"
        direction: inout
        description: >-
          Instantiated HMAC-DRBG-SHA-256. Must have been instantiated
          with sufficient entropy before calling.
    returns:
      type: "Result<([u8; 384], [u8; 384]), Error>"
      description: >-
        Tuple of (private_key, public_key) both as 384-byte big-endian arrays.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: InvalidInput
          condition: Keygen failed (DRBG exhaustion or repeated failures).
        - name: AlgorithmRestricted
          condition: DH-3072 blocked by active profile.
    preconditions:
      - description: Module must be Operational.
      - description: DRBG must be instantiated with sufficient entropy.
    postconditions:
      - description: >-
          Private key x ∈ [1, q−1], public key y = 2^x mod p. Both
          keys are valid for use with compute_shared_secret_3072.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── ML-KEM-1024 (FIPS 203) ────────────────────────────────────────

  - name: keygen
    module: oxicrypt-ml-kem
    signature: "pub fn keygen(d: &[u8; 32], z: &[u8; 32]) -> Result<([u8; 1568], [u8; 3168]), Error>"
    description: >-
      Generate an ML-KEM-1024 key pair. Both d and z must be 32 bytes
      of fresh randomness from an approved DRBG (SP 800-90A).
    parameters:
      - name: d
        type: "&[u8; 32]"
        direction: in
        description: "32-byte randomness for K-PKE key generation."
      - name: z
        type: "&[u8; 32]"
        direction: in
        description: "32-byte randomness for implicit-rejection seed."
    returns:
      type: "Result<([u8; 1568], [u8; 3168]), Error>"
      description: "(encapsulation_key, decapsulation_key)"
    error_variants:
      - name: NotOperational
        condition: Module not initialized.
      - name: AlgorithmRestricted
        condition: ML-KEM-1024 blocked by active profile.
      - name: InvalidInput
        condition: Invalid or insufficient randomness.
    preconditions:
      - description: Module must be Operational.
      - description: d and z must each be 32 bytes of fresh random data from an approved DRBG.
    postconditions:
      - description: >-
          Returns a valid ML-KEM-1024 key pair suitable for use with
          encapsulate and decapsulate.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles: [Unrestricted, Cnsa2]

  - name: encapsulate
    module: oxicrypt-ml-kem
    signature: "pub fn encapsulate(ek: &[u8; 1568], m: &[u8; 32]) -> Result<([u8; 32], [u8; 1568]), Error>"
    description: >-
      Encapsulate a shared secret against an ML-KEM-1024 encapsulation key.
      m must be 32 bytes of fresh randomness from an approved DRBG.
    parameters:
      - name: ek
        type: "&[u8; 1568]"
        direction: in
        description: "Encapsulation key (from keygen)."
      - name: m
        type: "&[u8; 32]"
        direction: in
        description: "32-byte randomness for encapsulation."
    returns:
      type: "Result<([u8; 32], [u8; 1568]), Error>"
      description: "(shared_secret, ciphertext)"
    error_variants:
      - name: NotOperational
        condition: Module not initialized.
      - name: AlgorithmRestricted
        condition: ML-KEM-1024 blocked by active profile.
      - name: InvalidInput
        condition: Invalid encapsulation key or randomness.
    preconditions:
      - description: Module must be Operational.
      - description: ek must be a valid 1568-byte encapsulation key from keygen.
      - description: m must be 32 bytes of fresh random data from an approved DRBG.
    postconditions:
      - description: >-
          Returns a 32-byte shared secret and 1568-byte ciphertext.
          The shared secret is deterministic and reproducible only with
          access to the private decapsulation key.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles: [Unrestricted, Cnsa2]

  - name: decapsulate
    module: oxicrypt-ml-kem
    signature: "pub fn decapsulate(dk: &[u8; 3168], ct: &[u8; 1568]) -> Result<[u8; 32], Error>"
    description: >-
      Decapsulate a shared secret from an ML-KEM-1024 ciphertext.
      Uses implicit rejection: if the ciphertext is invalid, a
      pseudorandom key is returned (constant-time, no observable difference).
    parameters:
      - name: dk
        type: "&[u8; 3168]"
        direction: in
        description: "Decapsulation key (from keygen)."
      - name: ct
        type: "&[u8; 1568]"
        direction: in
        description: "Ciphertext (from encapsulate)."
    returns:
      type: "Result<[u8; 32], Error>"
      description: "32-byte shared secret."
    error_variants:
      - name: NotOperational
        condition: Module not initialized.
      - name: AlgorithmRestricted
        condition: ML-KEM-1024 blocked by active profile.
    preconditions:
      - description: Module must be Operational.
      - description: dk must be a valid 3168-byte decapsulation key from keygen.
      - description: ct must be a 1568-byte ciphertext from encapsulate.
    postconditions:
      - description: >-
          Returns the 32-byte shared secret. By construction (implicit
          rejection), this operation is constant-time and returns a
          pseudorandom value even if ct is invalid or malformed.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles: [Unrestricted, Cnsa2]

  # ── ML-DSA-87 ──────────────────────────────────────────────────────

  - name: keygen
    module: oxicrypt-ml-dsa
    signature: "pub fn keygen(xi: &[u8; 32]) -> Result<([u8; 2592], [u8; 4896]), Error>"
    description: >-
      Generate an ML-DSA-87 key pair. xi must be 32 bytes of fresh
      randomness from an approved DRBG (SP 800-90A).
    parameters:
      - name: xi
        type: "&[u8; 32]"
        direction: in
        description: "32-byte randomness for key generation (FIPS 204 keygen seed)."
    returns:
      type: "Result<([u8; 2592], [u8; 4896]), Error>"
      description: "(public_key, secret_key)"
    error_variants:
      - name: NotOperational
        condition: Module not initialized.
      - name: AlgorithmRestricted
        condition: ML-DSA-87 blocked by active profile.
      - name: InvalidInput
        condition: Invalid or insufficient randomness.
    preconditions:
      - description: Module must be Operational.
      - description: xi must be 32 bytes of fresh random data from an approved DRBG.
    postconditions:
      - description: >-
          Returns a valid ML-DSA-87 key pair: 2592-byte public key and
          4896-byte secret key suitable for use with sign and verify.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles: [Unrestricted, Cnsa2]

  - name: sign
    module: oxicrypt-ml-dsa
    signature: "pub fn sign(sk: &[u8; 4896], message: &[u8], ctx: &[u8]) -> Result<[u8; 4627], Error>"
    description: >-
      External ML-DSA.Sign (FIPS 204 §5.2 Algorithm 2). Frames the message
      as M' = 0x00 || |ctx| || ctx || M (pure ML-DSA) before applying the
      internal signing primitive (§6.2 Algorithm 7). Signs deterministically
      using Fiat-Shamir-with-aborts (rejection sampling); the iteration
      count leaks information about the secret key, a known and accepted
      property of ML-DSA (NIST IG D.G §D.3.5). Pass b"" as ctx for the
      empty context used by X.509, CMS, and other LAMPS-conformant callers.
    parameters:
      - name: sk
        type: "&[u8; 4896]"
        direction: in
        description: "Secret key (from keygen)."
      - name: message
        type: "&[u8]"
        direction: in
        description: "Message to sign (arbitrary length)."
      - name: ctx
        type: "&[u8]"
        direction: in
        description: "Application-supplied context string, at most 255 bytes (FIPS 204 §5.2 limit). Use b\"\" for the empty context expected by X.509/CMS/LAMPS."
    returns:
      type: "Result<[u8; 4627], Error>"
      description: "4627-byte ML-DSA-87 signature."
    error_variants:
      - name: NotOperational
        condition: Module not initialized.
      - name: AlgorithmRestricted
        condition: ML-DSA-87 blocked by active profile.
      - name: InvalidInput
        condition: ctx.len() > 255, invalid secret key, or rejection loop exceeded limit.
    preconditions:
      - description: Module must be Operational.
      - description: sk must be a valid 4896-byte secret key from keygen.
      - description: message can be any byte string, including empty.
      - description: ctx.len() must be ≤ 255 (FIPS 204 §5.2).
    postconditions:
      - description: >-
          Returns a deterministic 4627-byte signature over M' =
          0x00 || |ctx| || ctx || message, suitable for verification with
          the corresponding public key (given the same ctx). On signing
          failure (rejection loop timeout), returns Err(InvalidInput).
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles: [Unrestricted, Cnsa2]

  - name: verify
    module: oxicrypt-ml-dsa
    signature: "pub fn verify(pk: &[u8; 2592], message: &[u8], ctx: &[u8], sig: &[u8; 4627]) -> Result<(), Error>"
    description: >-
      External ML-DSA.Verify (FIPS 204 §5.2 Algorithm 3). Frames the
      message as M' = 0x00 || |ctx| || ctx || M (pure ML-DSA) before
      applying the internal verification primitive (§6.3 Algorithm 8).
      Returns Ok(()) if the signature is valid, Err(InvalidInput) if
      verification fails. All verification operations are public-data
      only (no secret-dependent control flow). The ctx must match the
      value used at sign time.
    parameters:
      - name: pk
        type: "&[u8; 2592]"
        direction: in
        description: "Public key (from keygen)."
      - name: message
        type: "&[u8]"
        direction: in
        description: "Message to verify (arbitrary length)."
      - name: ctx
        type: "&[u8]"
        direction: in
        description: "Application-supplied context string, at most 255 bytes (FIPS 204 §5.2 limit). Must match the ctx used at sign time. Use b\"\" for X.509/CMS/LAMPS."
      - name: sig
        type: "&[u8; 4627]"
        direction: in
        description: "Signature to verify (from sign)."
    returns:
      type: "Result<(), Error>"
      description: "Ok(()) if signature is valid, Err(InvalidInput) if invalid."
    error_variants:
      - name: NotOperational
        condition: Module not initialized.
      - name: AlgorithmRestricted
        condition: ML-DSA-87 blocked by active profile.
      - name: InvalidInput
        condition: ctx.len() > 255 or signature verification failed.
    preconditions:
      - description: Module must be Operational.
      - description: pk must be a valid 2592-byte public key from keygen.
      - description: sig must be a 4627-byte signature from sign.
      - description: ctx.len() must be ≤ 255 and match the ctx used at sign time.
    postconditions:
      - description: >-
          Verification is deterministic and constant-time with respect to
          secret data (no secrets involved in verify). Invalid signatures
          produce Err(InvalidInput), not a panic or side channel.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational
    profiles: [Unrestricted, Cnsa2]

  # ── LMS (SP 800-208 / RFC 8554) ────────────────────────────────────

  - name: keygen
    module: oxicrypt-lms
    signature: "pub fn keygen(xi: &[u8; 32]) -> Result<(LmsPrivateKey, [u8; 56]), Error>"
    description: >-
      Generate an LMS key pair (LMS_SHA256_M32_H10 / LMOTS_SHA256_N32_W4).
      xi is a 32-byte secret seed from an approved DRBG. The tree root
      is computed from the seed (takes ~0.5 s for 1024 leaves).
    parameters:
      - name: xi
        type: "&[u8; 32]"
        direction: in
        description: "32-byte secret seed for the Merkle tree."
    returns:
      type: "Result<(LmsPrivateKey, [u8; 56]), Error>"
      description: "(private_key, public_key). Public key is 56 bytes: LMS type (4) || LMOTS type (4) || I (16) || T[1] (32)."
    error_variants:
      - name: NotOperational
        condition: Module not initialized.
      - name: AlgorithmRestricted
        condition: LMS blocked by active profile.
    preconditions:
      - description: Module must be Operational.
      - description: xi must be 32 bytes of fresh random data from an approved DRBG.
    postconditions:
      - description: >-
          Returns a fresh LMS key pair. The private key's leaf_index starts at 0.
          The key can sign at most 1024 messages (MAX_SIGNATURES).
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles: [Unrestricted, Cnsa2]

  - name: sign
    module: oxicrypt-lms
    signature: "pub fn sign(key: &mut LmsPrivateKey, message: &[u8]) -> Result<[u8; 2508], Error>"
    description: >-
      Sign a message with LMS. STATEFUL: advances the leaf index by 1.
      The caller MUST persist the private key after this call. Returns
      Err(InvalidInput) if the key is exhausted (all 1024 leaves used).
    parameters:
      - name: key
        type: "&mut LmsPrivateKey"
        direction: in-out
        description: "Mutable private key handle. leaf_index is incremented."
      - name: message
        type: "&[u8]"
        direction: in
        description: "Message to sign (arbitrary length)."
    returns:
      type: "Result<[u8; 2508], Error>"
      description: "2508-byte LMS signature: q (4) || LMOTS sig (2404) || LMS type (4) || auth path (10 × 32 = 320) minus padding overlaps."
    error_variants:
      - name: NotOperational
        condition: Module not initialized.
      - name: AlgorithmRestricted
        condition: LMS blocked by active profile.
      - name: InvalidInput
        condition: Key exhausted (leaf_index >= 1024).
    preconditions:
      - description: Module must be Operational.
      - description: key.leaf_index < 1024 (key not exhausted).
    postconditions:
      - description: key.leaf_index has been incremented by 1. Caller MUST persist key state.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles: [Unrestricted, Cnsa2]
    pitfalls:
      - description: >-
          LMS is STATEFUL. Each private key can only sign 1024 messages.
          The caller must persist the key state after every sign call.
          Reusing a leaf index voids the security of the entire tree.
        wrong: |
          let (mut sk, pk) = oxicrypt_lms::keygen(&seed)?;
          let sig = oxicrypt_lms::sign(&mut sk, b"msg")?;
          // BUG: sk not persisted — if process crashes, leaf index is lost
        right: |
          let (mut sk, pk) = oxicrypt_lms::keygen(&seed)?;
          let sig = oxicrypt_lms::sign(&mut sk, b"msg")?;
          persist_to_disk(&sk.to_bytes());  // MUST persist after every sign

  - name: verify
    module: oxicrypt-lms
    signature: "pub fn verify(public_key: &[u8; 56], message: &[u8], signature: &[u8; 2508]) -> Result<(), Error>"
    description: >-
      Verify an LMS signature. Returns Ok(()) if valid,
      Err(InvalidInput) if verification fails.
    parameters:
      - name: public_key
        type: "&[u8; 56]"
        direction: in
        description: "56-byte LMS public key."
      - name: message
        type: "&[u8]"
        direction: in
        description: "Original message."
      - name: signature
        type: "&[u8; 2508]"
        direction: in
        description: "2508-byte LMS signature."
    returns:
      type: "Result<(), Error>"
      description: "Ok(()) if valid, Err(InvalidInput) if invalid."
    error_variants:
      - name: NotOperational
        condition: Module not initialized.
      - name: AlgorithmRestricted
        condition: LMS blocked by active profile.
      - name: InvalidInput
        condition: Signature verification failed or malformed inputs.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational
    profiles: [Unrestricted, Cnsa2]

  # ── XMSS (SP 800-208 / RFC 8391) ─────────────────────────────────

  - name: keygen
    module: oxicrypt-xmss
    signature: "pub fn keygen(xi: &[u8; 32]) -> Result<(XmssPrivateKey, [u8; 68]), Error>"
    description: >-
      Generate an XMSS key pair (XMSS-SHA2_10_256). xi is a 32-byte
      secret seed from an approved DRBG. The tree root is computed from
      the seed (takes ~15 s for 1024 leaves with WOTS+ and L-tree).
    parameters:
      - name: xi
        type: "&[u8; 32]"
        direction: in
        description: "32-byte secret seed (derives SK_SEED, SK_PRF, PUB_SEED)."
    returns:
      type: "Result<(XmssPrivateKey, [u8; 68]), Error>"
      description: "(private_key, public_key). Public key is 68 bytes: OID (4) || root (32) || PUB_SEED (32)."
    error_variants:
      - name: NotOperational
        condition: Module not initialized.
      - name: AlgorithmRestricted
        condition: XMSS blocked by active profile.
    preconditions:
      - description: Module must be Operational.
      - description: xi must be 32 bytes of fresh random data from an approved DRBG.
    postconditions:
      - description: >-
          Returns a fresh XMSS key pair. Private key starts at leaf_index 0.
          Key can sign at most 1024 messages.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles: [Unrestricted, Cnsa2]

  - name: sign
    module: oxicrypt-xmss
    signature: "pub fn sign(key: &mut XmssPrivateKey, message: &[u8]) -> Result<[u8; 2500], Error>"
    description: >-
      Sign a message with XMSS. STATEFUL: advances leaf index by 1.
      Caller MUST persist key state after this call. Message is
      randomized with r = PRF(SK_PRF, idx) per RFC 8391.
    parameters:
      - name: key
        type: "&mut XmssPrivateKey"
        direction: in-out
        description: "Mutable private key handle. leaf_index is incremented."
      - name: message
        type: "&[u8]"
        direction: in
        description: "Message to sign (arbitrary length)."
    returns:
      type: "Result<[u8; 2500], Error>"
      description: "2500-byte XMSS signature: idx (4) || r (32) || WOTS+ sig (67 × 32 = 2144) || auth path (10 × 32 = 320)."
    error_variants:
      - name: NotOperational
        condition: Module not initialized.
      - name: AlgorithmRestricted
        condition: XMSS blocked by active profile.
      - name: InvalidInput
        condition: Key exhausted (leaf_index >= 1024).
    preconditions:
      - description: Module must be Operational.
      - description: key.leaf_index < 1024 (key not exhausted).
    postconditions:
      - description: key.leaf_index incremented by 1. Caller MUST persist key state.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles: [Unrestricted, Cnsa2]
    pitfalls:
      - description: >-
          XMSS is STATEFUL. The same pitfalls as LMS apply — the caller
          must persist private key state after every sign call.

  - name: verify
    module: oxicrypt-xmss
    signature: "pub fn verify(public_key: &[u8; 68], message: &[u8], signature: &[u8; 2500]) -> Result<(), Error>"
    description: >-
      Verify an XMSS signature. Returns Ok(()) if valid,
      Err(InvalidInput) if verification fails.
    parameters:
      - name: public_key
        type: "&[u8; 68]"
        direction: in
        description: "68-byte XMSS public key."
      - name: message
        type: "&[u8]"
        direction: in
        description: "Original message."
      - name: signature
        type: "&[u8; 2500]"
        direction: in
        description: "2500-byte XMSS signature."
    returns:
      type: "Result<(), Error>"
      description: "Ok(()) if valid, Err(InvalidInput) if invalid."
    error_variants:
      - name: NotOperational
        condition: Module not initialized.
      - name: AlgorithmRestricted
        condition: XMSS blocked by active profile.
      - name: InvalidInput
        condition: Signature verification failed or malformed inputs.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational
    profiles: [Unrestricted, Cnsa2]

  # ── SLH-DSA (FIPS 205) ───────────────────────────────────────────

  - name: keygen
    module: oxicrypt-slh-dsa
    kind: function
    description: >
      Generate an SLH-DSA-SHA2-256s key pair. xi must be 96 bytes of
      fresh randomness (SK.seed || SK.prf || PK.seed). Returns (pk, sk)
      where pk is 64 bytes (PK.seed || PK.root) and sk is 128 bytes
      (SK.seed || SK.prf || PK.seed || PK.root). This is a STATELESS
      scheme — no per-signature state management required.
    parameters:
      - name: xi
        type: "&[u8]"
        direction: in
        description: "96 bytes of fresh randomness."
    returns:
      type: "Result<([u8; 64], [u8; 128]), Error>"
      description: "Public key (64 B) and secret key (128 B)."
    error_variants:
      - name: NotOperational
        condition: Module not initialized.
      - name: AlgorithmRestricted
        condition: SLH-DSA blocked by active profile.
      - name: InvalidInput
        condition: xi is not 96 bytes.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles: [Unrestricted]

  - name: sign
    module: oxicrypt-slh-dsa
    kind: function
    signature: "pub fn sign(sk: &[u8], message: &[u8], ctx: &[u8]) -> Result<[u8; 29792], Error>"
    description: >
      External slh_sign (FIPS 205 §9.2 Algorithm 22) for SLH-DSA-SHA2-256s
      in deterministic mode (opt_rand = PK.seed). Frames the message as
      M' = 0x00 || |ctx| || ctx || M (pure SLH-DSA) before applying the
      internal signing primitive (§9.1 Algorithm 19). Returns a 29792-byte
      signature. Signing involves many SHA-256 evaluations and is
      computationally expensive. Pass b"" as ctx for the empty context
      used by X.509, CMS, and other LAMPS-conformant callers.
    parameters:
      - name: sk
        type: "&[u8]"
        direction: in
        description: "128-byte secret key."
      - name: message
        type: "&[u8]"
        direction: in
        description: "Message to sign (arbitrary length)."
      - name: ctx
        type: "&[u8]"
        direction: in
        description: "Application-supplied context string, at most 255 bytes (FIPS 205 §9.2 limit). Use b\"\" for the empty context expected by X.509/CMS/LAMPS."
    returns:
      type: "Result<[u8; 29792], Error>"
      description: "29792-byte SLH-DSA signature (R || FORS sig || HT sig)."
    error_variants:
      - name: NotOperational
        condition: Module not initialized.
      - name: AlgorithmRestricted
        condition: SLH-DSA blocked by active profile.
      - name: InvalidInput
        condition: sk is not 128 bytes or ctx.len() > 255.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles: [Unrestricted]
    pitfalls:
      - description: >
          SLH-DSA signatures are large (29792 bytes for SHA2-256s)
          and signing is slow (many hash evaluations). Consider ML-DSA
          if signature size or signing speed is a concern.

  - name: verify
    module: oxicrypt-slh-dsa
    kind: function
    signature: "pub fn verify(pk: &[u8], message: &[u8], ctx: &[u8], signature: &[u8]) -> Result<(), Error>"
    description: >
      External slh_verify (FIPS 205 §9.3 Algorithm 24) for SLH-DSA-SHA2-256s.
      Frames the message as M' = 0x00 || |ctx| || ctx || M (pure SLH-DSA)
      before applying the internal verification primitive (§9.1 Algorithm 20).
      Returns Ok(()) if valid, Err(InvalidInput) if invalid. The ctx must
      match the value used at sign time.
    parameters:
      - name: pk
        type: "&[u8]"
        direction: in
        description: "64-byte public key."
      - name: message
        type: "&[u8]"
        direction: in
        description: "Signed message."
      - name: ctx
        type: "&[u8]"
        direction: in
        description: "Application-supplied context string, at most 255 bytes (FIPS 205 §9.3 limit). Must match the ctx used at sign time. Use b\"\" for X.509/CMS/LAMPS."
      - name: signature
        type: "&[u8]"
        direction: in
        description: "29792-byte SLH-DSA signature."
    returns:
      type: "Result<(), Error>"
      description: "Ok(()) if valid, Err(InvalidInput) if invalid."
    error_variants:
      - name: NotOperational
        condition: Module not initialized.
      - name: AlgorithmRestricted
        condition: SLH-DSA blocked by active profile.
      - name: InvalidInput
        condition: Signature verification failed, malformed inputs, or ctx.len() > 255.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational
    profiles: [Unrestricted]

  # ── C ABI (oxicrypt-ffi) ──────────────────────────────────────────
  #
  # All symbols use the `oxi_` prefix. Status codes are OxiResult
  # discriminants (see OxiResult error_type below): 0 = Ok, 1-7 =
  # module errors, 10-11 = FFI errors, 20-27 = AES-mode errors,
  # 255 = Internal (catch-all reserved). AES-256-GCM exposure with
  # OxiAes256Key handle is added in T7 of the C ABI foundation chunk.

  - name: oxi_init
    module: oxicrypt-ffi
    description: >-
      Initialise the FIPS module with the given algorithm profile,
      running all power-up KATs. Single initialisation entry point —
      replaces the parallel oxicrypt_init / oxicrypt_init_with_profile
      pair from Phase 0 per F3 reviewer-framing. Profile 0 = Unrestricted,
      1 = CNSA 2.0, 2 = CNSA 1.0. Unknown values return
      OxiResult::InvalidInput rather than silently defaulting (F4).
      Idempotent: subsequent calls return Ok (the first init's outcome
      is authoritative).
    signature: "int oxi_init(int profile)"
    parameters:
      - name: profile
        type: int
        direction: in
        description: "0 = Unrestricted, 1 = CNSA 2.0, 2 = CNSA 1.0."
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput, 2 = SelfTestFailed, ...)."
    preconditions: []
    postconditions:
      - description: Module is in Operational state with the selected profile (on Ok).
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: oxi_active_profile
    module: oxicrypt-ffi
    description: >-
      Query the currently active algorithm profile.
      Returns 0 (Unrestricted), 1 (CNSA 2.0), or 2 (CNSA 1.0).
    signature: "int oxi_active_profile(void)"
    parameters: []
    returns:
      type: int
      description: "0 = Unrestricted, 1 = CNSA 2.0, 2 = CNSA 1.0."
    preconditions:
      - description: Module must be initialized.
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: oxi_is_operational
    module: oxicrypt-ffi
    description: >-
      Query whether the module is in the Operational state. Returns 1
      if power-up self-tests have completed without failure and the
      module is currently servicing approved cryptographic requests, 0
      otherwise (PowerOff, SelfTest, or Error). This is a query, not a
      gate — operational-only entry points self-gate via
      require_operational and return OxiResult::NotOperational when
      called outside the operational state. The query exists so C
      callers can present a clear "module ready" signal without making
      a cryptographic call to discover state.
    signature: "int oxi_is_operational(void)"
    parameters: []
    returns:
      type: int
      description: "1 = Operational, 0 = otherwise."
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: oxi_sha256
    module: oxicrypt-ffi
    description: >-
      Compute SHA-256 over data_len bytes. out must be >= 32 bytes.
    signature: "int oxi_sha256(const uint8_t *data_ptr, size_t data_len, uint8_t *out)"
    parameters:
      - name: data_ptr
        type: "const uint8_t *"
        direction: in
        description: Data to hash.
      - name: data_len
        type: size_t
        direction: in
        description: Length of data in bytes.
      - name: out
        type: "uint8_t *"
        direction: out
        description: Output buffer, must be >= 32 bytes.
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."

  - name: oxi_sha512
    module: oxicrypt-ffi
    description: >-
      Compute SHA-512 over data_len bytes. out must be >= 64 bytes.
    signature: "int oxi_sha512(const uint8_t *data_ptr, size_t data_len, uint8_t *out)"
    parameters:
      - name: data_ptr
        type: "const uint8_t *"
        direction: in
      - name: data_len
