  # ── AES-CTR (SP 800-38A §6.5) ─────────────────────────────────────

  - name: ctr_xor
    module: oxicrypt-aes
    description: AES-CTR encrypt/decrypt (the same XOR operation) over an icb-seeded full 128-bit big-endian counter (SP 800-38A Appendix F.5); input/output may be any length.
    signature: >-
      pub fn ctr_xor<B: BlockCipher>(cipher: &B, icb: &[u8; 16],
      input: &[u8], output: &mut [u8])
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule."
      - name: icb
        type: "&[u8; 16]"
        direction: in
        description: "Initial counter block (16 bytes)."
        constraints:
          size: 16
      - name: input
        type: "&[u8]"
        direction: in
        description: Plaintext or ciphertext.
      - name: output
        type: "&mut [u8]"
        direction: out
        description: Output buffer.
    returns:
      type: "()"
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: CTR ICB must be unique per (key, message) pair; reusing an ICB XORs two plaintexts together, making both trivially recoverable.

  # ── AES-KW / AES-KWP — inverse cipher direction ──────────────────

  - name: kw_wrap_inverse_cipher
    module: oxicrypt-aes
    family: aes-mode-encrypt
    description: AES-KW wrap (RFC 3394 / SP 800-38F §6.2 KW-AE) with the inverse cipher direction (ACVP kwCipher = "inverse"); the W function uses the AES inverse cipher, ICV A6A6A6A6A6A6A6A6 unchanged.
    signature: >-
      pub fn kw_wrap_inverse_cipher<B: BlockCipher>(cipher: &B,
      plaintext: &[u8], ciphertext_out: &mut [u8])
      -> Result<(), ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule."
      - name: plaintext
        type: "&[u8]"
        direction: in
        description: "Plaintext to wrap."
      - name: ciphertext_out
        type: "&mut [u8]"
        direction: out
        description: "Wrapped output."
    returns:
      type: "Result<(), ModeError>"
      description: "LengthMismatch if buffer sizes are wrong."
      error_variants:
        - name: LengthMismatch
          condition: The plaintext or output buffer length is not valid for KW-AE.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: kw_unwrap_inverse_cipher
    module: oxicrypt-aes
    family: aes-mode-decrypt
    description: AES-KW unwrap (SP 800-38F §6.2 KW-AD) with the inverse cipher direction (ACVP kwCipher = "inverse"); returns TagMismatch on ICV verification failure.
    signature: >-
      pub fn kw_unwrap_inverse_cipher<B: BlockCipher>(cipher: &B,
      ciphertext: &[u8], plaintext_out: &mut [u8])
      -> Result<(), ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule."
      - name: ciphertext
        type: "&[u8]"
        direction: in
        description: "Wrapped input."
      - name: plaintext_out
        type: "&mut [u8]"
        direction: out
        description: "Unwrapped output."
    returns:
      type: "Result<(), ModeError>"
      description: "TagMismatch on ICV failure (constant-time check); LengthMismatch on size error."
      error_variants:
        - name: TagMismatch
          condition: The ICV did not verify; checked in constant time.
        - name: LengthMismatch
          condition: The ciphertext or output buffer length is not valid for KW-AD.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: kwp_wrap_inverse_cipher
    module: oxicrypt-aes
    family: aes-mode-encrypt
    description: AES-KWP wrap (RFC 5649 / SP 800-38F §6.3 KWP-AE) with the inverse cipher direction (ACVP kwCipher = "inverse"); alternative IV A65959A6 || [mli]_32 unchanged.
    signature: >-
      pub fn kwp_wrap_inverse_cipher<B: BlockCipher>(cipher: &B,
      plaintext: &[u8], ciphertext_out: &mut [u8])
      -> Result<(), ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
