      fips_approved: true

  - name: oxi_ml_kem_1024_keygen
    module: oxicrypt-ffi
    description: >-
      Generate an ML-KEM-1024 key pair from two 32-byte caller-supplied
      seeds (FIPS 203 §6.1 ML-KEM.KeyGen). Reads exactly 32 bytes from
      `d_ptr` (K-PKE keygen randomness) and exactly 32 bytes from
      `z_ptr` (implicit-rejection seed embedded in dk). Writes the
      1568-byte encapsulation key into `ek_out` and the 3168-byte
      decapsulation key into `dk_out`. Both seeds caller-sourced from
      an SP 800-90A DRBG. `d` and `z` are NOT interchangeable: `d`
      drives the K-PKE matrix expansion and secret sampling; `z` is
      written into `dk` for the FO transform's implicit-rejection
      branch. Forwards to `oxicrypt_ml_kem::keygen`.
    signature: >-
      int oxi_ml_kem_1024_keygen(const uint8_t *d_ptr,
      const uint8_t *z_ptr, uint8_t *ek_out, uint8_t *dk_out)
    parameters:
      - { name: d_ptr, type: "const uint8_t *", direction: in, description: "32-byte K-PKE keygen randomness" }
      - { name: z_ptr, type: "const uint8_t *", direction: in, description: "32-byte implicit-rejection seed (embedded in dk)" }
      - { name: ek_out, type: "uint8_t *", direction: out, description: "1568-byte encapsulation key buffer" }
      - { name: dk_out, type: "uint8_t *", direction: out, description: "3168-byte decapsulation key buffer" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on rare K-PKE NTT decode failure, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_ml_kem_1024_encapsulate
    module: oxicrypt-ffi
    description: >-
      Encapsulate a shared secret against an ML-KEM-1024 encapsulation
      key (FIPS 203 §6.2 ML-KEM.Encaps). Reads exactly 1568 bytes from
      `ek_ptr` and exactly 32 bytes from `m_ptr` (encapsulation
      randomness, caller-supplied from an SP 800-90A DRBG). Writes the
      32-byte shared secret into `ss_out` and the 1568-byte ciphertext
      into `ct_out`. Forwards to `oxicrypt_ml_kem::encapsulate`.
    signature: >-
      int oxi_ml_kem_1024_encapsulate(const uint8_t *ek_ptr,
      const uint8_t *m_ptr, uint8_t *ss_out, uint8_t *ct_out)
    parameters:
      - { name: ek_ptr, type: "const uint8_t *", direction: in, description: "1568-byte ML-KEM-1024 encapsulation key" }
      - { name: m_ptr, type: "const uint8_t *", direction: in, description: "32-byte encapsulation randomness" }
      - { name: ss_out, type: "uint8_t *", direction: out, description: "32-byte shared secret buffer" }
      - { name: ct_out, type: "uint8_t *", direction: out, description: "1568-byte ciphertext buffer" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_ml_kem_1024_decapsulate
    module: oxicrypt-ffi
    description: >-
      Decapsulate a shared secret from an ML-KEM-1024 ciphertext
      (FIPS 203 §6.3 ML-KEM.Decaps). Reads exactly 3168 bytes from
      `dk_ptr` and exactly 1568 bytes from `ct_ptr`. Writes the
      32-byte shared secret into `ss_out`. Fully deterministic;
      tampered ciphertext is absorbed by the FO transform's
      implicit-rejection branch into a deterministic-but-pseudorandom
      shared secret in constant time — there is NO `TagMismatch = 22`
      mapping (deliberate FIPS 203 §6.3 design property).
      Forwards to `oxicrypt_ml_kem::decapsulate`.
    signature: >-
      int oxi_ml_kem_1024_decapsulate(const uint8_t *dk_ptr,
      const uint8_t *ct_ptr, uint8_t *ss_out)
    parameters:
      - { name: dk_ptr, type: "const uint8_t *", direction: in, description: "3168-byte ML-KEM-1024 decapsulation key" }
      - { name: ct_ptr, type: "const uint8_t *", direction: in, description: "1568-byte ML-KEM-1024 ciphertext" }
      - { name: ss_out, type: "uint8_t *", direction: out, description: "32-byte shared secret buffer" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer). Tampered ct does NOT surface as TagMismatch — see implicit-rejection paragraph in security-policy §4.9."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_slh_dsa_sha2_256s_keygen
    module: oxicrypt-ffi
    description: >-
      Generate an SLH-DSA-SHA2-256s key pair from a 96-byte
      caller-supplied seed (FIPS 205 §9.1 Algorithm 17). Reads exactly
      96 bytes from `xi_ptr`, internally framed as `SK.seed ‖ SK.prf
      ‖ PK.seed` (3 × 32 bytes). Writes the 64-byte public key into
      `pk_out` and the 128-byte secret key into `sk_out`. The 96 bytes
      are caller-sourced from an SP 800-90A DRBG. The three 32-byte
      components are NOT interchangeable: SK.seed drives WOTS+ / FORS
      secret derivation, SK.prf is the PRF key for deterministic
      message-randomness in sign, and PK.seed is the domain-separation
      tweak baked into every hash call. Mixing them would put PRF key
      material into the secret-derivation slot or vice-versa, breaking
      the FIPS 205 §10.2 security argument. Forwards to
      `oxicrypt_slh_dsa::keygen`.
    signature: >-
      int oxi_slh_dsa_sha2_256s_keygen(const uint8_t *xi_ptr,
      uint8_t *pk_out, uint8_t *sk_out)
    parameters:
      - { name: xi_ptr, type: "const uint8_t *", direction: in, description: "96-byte caller-supplied seed (SK.seed ‖ SK.prf ‖ PK.seed)" }
      - { name: pk_out, type: "uint8_t *", direction: out, description: "64-byte public key buffer" }
      - { name: sk_out, type: "uint8_t *", direction: out, description: "128-byte secret key buffer" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_slh_dsa_sha2_256s_sign
    module: oxicrypt-ffi
    description: >-
      Sign a message with SLH-DSA-SHA2-256s (FIPS 205 §9.2 Algorithm
      22, external `slh_sign`). Reads exactly 128 bytes from `sk_ptr`,
      `msg_len` bytes from `msg_ptr`, and `ctx_len` bytes from
      `ctx_ptr` (≤ 255 per FIPS 205 §9.2). Writes the 29 792-byte
      signature into `sig_out`. Pass `ctx_len = 0` for the empty
      context used by X.509 / CMS / LAMPS. Signing is **deterministic**
      (opt_rand = PK.seed): bit-identical signature across calls for
      the same `(sk, msg, ctx)` triple. Forwards to
      `oxicrypt_slh_dsa::sign`.
    signature: >-
      int oxi_slh_dsa_sha2_256s_sign(const uint8_t *sk_ptr,
      const uint8_t *msg_ptr, size_t msg_len,
      const uint8_t *ctx_ptr, size_t ctx_len, uint8_t *sig_out)
    parameters:
      - { name: sk_ptr, type: "const uint8_t *", direction: in, description: "128-byte SLH-DSA-256s secret key" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in, description: "Message bytes (length given by msg_len)" }
      - { name: msg_len, type: "size_t", direction: in, description: "Message length in bytes" }
      - { name: ctx_ptr, type: "const uint8_t *", direction: in, description: "Application context bytes (length given by ctx_len; ≤ 255)" }
      - { name: ctx_len, type: "size_t", direction: in, description: "Context length in bytes (FIPS 205 §9.2 caps at 255)" }
      - { name: sig_out, type: "uint8_t *", direction: out, description: "29 792-byte signature buffer" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on ctx_len > 255, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_slh_dsa_sha2_256s_verify
    module: oxicrypt-ffi
    description: >-
      Verify an SLH-DSA-SHA2-256s signature (FIPS 205 §9.3 Algorithm
      24, external `slh_verify`). Reads exactly 64 bytes from
      `pk_ptr`, `msg_len` bytes from `msg_ptr`, `ctx_len` bytes from
      `ctx_ptr` (≤ 255), and 29 792 bytes from `sig_ptr`. Pass
      `ctx_len = 0` for the empty context used by X.509 / CMS /
      LAMPS. Returns `Ok = 0` for a valid signature, `TagMismatch =
      22` for any verification failure (decode-fail OR
      signature-invalid — upstream collapses these into a single
      `Err(InvalidInput)`; same shape as RSA verify and ML-DSA
      verify). Forwards to `oxicrypt_slh_dsa::verify`.
    signature: >-
      int oxi_slh_dsa_sha2_256s_verify(const uint8_t *pk_ptr,
      const uint8_t *msg_ptr, size_t msg_len,
      const uint8_t *ctx_ptr, size_t ctx_len, const uint8_t *sig_ptr)
    parameters:
      - { name: pk_ptr, type: "const uint8_t *", direction: in, description: "64-byte SLH-DSA-256s public key" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in, description: "Message bytes (length given by msg_len)" }
      - { name: msg_len, type: "size_t", direction: in, description: "Message length in bytes" }
      - { name: ctx_ptr, type: "const uint8_t *", direction: in, description: "Application context bytes (length given by ctx_len; ≤ 255)" }
      - { name: ctx_len, type: "size_t", direction: in, description: "Context length in bytes (FIPS 205 §9.2 caps at 255)" }
      - { name: sig_ptr, type: "const uint8_t *", direction: in, description: "29 792-byte signature" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 22 = TagMismatch on any verification failure, 1 = NotOperational, 6 = AlgorithmRestricted)."
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: true

  - name: oxi_lms_keygen
    module: oxicrypt-ffi
    description: >-
      Generate an LMS key pair (LMS_SHA256_M32_H10 / LMOTS_SHA256_N32_W4
      parameter set per SP 800-208 / RFC 8554) from a 32-byte
      caller-supplied seed. Reads exactly 32 bytes from `xi_ptr`,
      deterministically derives the tree seed (`SHA-256(xi || 0x00)`)
      and 16-byte tree identifier `I` (`SHA-256(xi || 0x01)[0..16]`),
      computes the Merkle tree root (1024 leaves), and writes the
      52-byte opaque private-key blob into `sk_out` and the 56-byte
      public key into `pk_out`. The 32 seed bytes are caller-sourced
      from an SP 800-90A DRBG. The private-key blob is the
      persistence-of-record format produced by the upstream
      `to_bytes()` round-trip; treat it as opaque. Forwards to
      `oxicrypt_lms::keygen`.
    signature: >-
      int oxi_lms_keygen(const uint8_t *xi_ptr,
      uint8_t *sk_out, uint8_t *pk_out)
    parameters:
      - { name: xi_ptr, type: "const uint8_t *", direction: in, description: "32-byte caller-supplied seed" }
      - { name: sk_out, type: "uint8_t *", direction: out, description: "52-byte opaque LMS private-key blob" }
      - { name: pk_out, type: "uint8_t *", direction: out, description: "56-byte LMS public key" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_lms_sign
    module: oxicrypt-ffi
    description: >-
      Sign a message with an LMS private key (SP 800-208 / RFC 8554).
      Reads the 52-byte opaque private-key blob from `sk_in_ptr`,
      `msg_len` bytes from `msg_ptr`, signs the message, advances the
      internal leaf index by one, writes the **updated** 52-byte blob
      into `sk_out`, and writes the 2508-byte signature into `sig_out`.
      LMS is a stateful scheme: each leaf may sign exactly one
      message. The caller MUST persist `sk_out` (the post-state) to
      durable storage before using `sig_out`; failure to persist
      before a crash, followed by a restart that re-signs from the
      pre-state, reuses the same one-time key — a catastrophic break
      of LMS. The byte-buffer pass-through API encodes the
      persistence obligation in the function signature so a caller
      cannot accidentally hold long-lived in-memory state and forget
      to write it down. `sk_in_ptr` and `sk_out` may alias (in-place
      advance). Forwards to `oxicrypt_lms::sign`.
    signature: >-
      int oxi_lms_sign(const uint8_t *sk_in_ptr,
      const uint8_t *msg_ptr, size_t msg_len,
      uint8_t *sk_out, uint8_t *sig_out)
    parameters:
      - { name: sk_in_ptr, type: "const uint8_t *", direction: in, description: "52-byte opaque LMS private-key blob (pre-state)" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in, description: "Message bytes (length given by msg_len)" }
      - { name: msg_len, type: "size_t", direction: in, description: "Message length in bytes" }
      - { name: sk_out, type: "uint8_t *", direction: out, description: "52-byte opaque LMS private-key blob (post-state, leaf index advanced; MUST be persisted before using sig_out)" }
      - { name: sig_out, type: "uint8_t *", direction: out, description: "2508-byte LMS signature buffer" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput when key is exhausted (1024 signatures issued), 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_lms_verify
    module: oxicrypt-ffi
    description: >-
      Verify an LMS signature (SP 800-208 / RFC 8554). Reads the
      56-byte public key from `pk_ptr`, `msg_len` bytes from
      `msg_ptr`, and the 2508-byte signature from `sig_ptr`. Returns
      `Ok = 0` for a valid signature, `TagMismatch = 22` for any
      verification failure (parse / structural mismatch / cryptographic
      mismatch — upstream collapses these into a single
      `Err(InvalidInput)`; same convention as RSA verify, ML-DSA
      verify, and SLH-DSA verify). Forwards to
      `oxicrypt_lms::verify`.
    signature: >-
      int oxi_lms_verify(const uint8_t *pk_ptr,
      const uint8_t *msg_ptr, size_t msg_len,
      const uint8_t *sig_ptr)
    parameters:
      - { name: pk_ptr, type: "const uint8_t *", direction: in, description: "56-byte LMS public key" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in, description: "Message bytes (length given by msg_len)" }
      - { name: msg_len, type: "size_t", direction: in, description: "Message length in bytes" }
      - { name: sig_ptr, type: "const uint8_t *", direction: in, description: "2508-byte LMS signature" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 22 = TagMismatch on any verification failure, 1 = NotOperational, 6 = AlgorithmRestricted)."
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: true

  - name: oxi_xmss_keygen
    module: oxicrypt-ffi
    description: >-
      Generate an XMSS key pair (XMSS-SHA2_10_256, OID 0x00000001 per
      SP 800-208 / RFC 8391) from a 32-byte caller-supplied seed.
      Reads exactly 32 bytes from `xi_ptr`, deterministically derives
      `SK_SEED = SHA-256(xi || 0x00)`, `SK_PRF = SHA-256(xi || 0x01)`,
      and `PUB_SEED = SHA-256(xi || 0x02)`, computes the Merkle tree
      root (1024 leaves with WOTS+ and L-tree compression), and writes
      the 132-byte opaque private-key blob into `sk_out` and the
      68-byte public key into `pk_out`. The 32 seed bytes are
      caller-sourced from an SP 800-90A DRBG. The private-key blob is
      the persistence-of-record format produced by the upstream
      `to_bytes()` round-trip; treat it as opaque. Forwards to
      `oxicrypt_xmss::keygen`.
    signature: >-
      int oxi_xmss_keygen(const uint8_t *xi_ptr,
      uint8_t *sk_out, uint8_t *pk_out)
    parameters:
      - { name: xi_ptr, type: "const uint8_t *", direction: in, description: "32-byte caller-supplied seed" }
      - { name: sk_out, type: "uint8_t *", direction: out, description: "132-byte opaque XMSS private-key blob" }
      - { name: pk_out, type: "uint8_t *", direction: out, description: "68-byte XMSS public key" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_xmss_sign
    module: oxicrypt-ffi
    description: >-
      Sign a message with an XMSS private key (SP 800-208 / RFC 8391).
      Reads the 132-byte opaque private-key blob from `sk_in_ptr`,
      `msg_len` bytes from `msg_ptr`, signs the message, advances the
      internal leaf index by one, writes the **updated** 132-byte blob
      into `sk_out`, and writes the 2500-byte signature into `sig_out`.
      XMSS is stateful — same persistence contract as `oxi_lms_sign`:
      caller MUST persist `sk_out` before using `sig_out`. The
      byte-buffer pass-through API mirrors LMS so a caller learning
      either API knows the other. `sk_in_ptr` and `sk_out` may alias
      (in-place advance). Forwards to `oxicrypt_xmss::sign`.
    signature: >-
      int oxi_xmss_sign(const uint8_t *sk_in_ptr,
      const uint8_t *msg_ptr, size_t msg_len,
      uint8_t *sk_out, uint8_t *sig_out)
    parameters:
      - { name: sk_in_ptr, type: "const uint8_t *", direction: in, description: "132-byte opaque XMSS private-key blob (pre-state)" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in, description: "Message bytes (length given by msg_len)" }
      - { name: msg_len, type: "size_t", direction: in, description: "Message length in bytes" }
      - { name: sk_out, type: "uint8_t *", direction: out, description: "132-byte opaque XMSS private-key blob (post-state, leaf index advanced; MUST be persisted before using sig_out)" }
      - { name: sig_out, type: "uint8_t *", direction: out, description: "2500-byte XMSS signature buffer" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput when key is exhausted (1024 signatures issued), 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_xmss_verify
    module: oxicrypt-ffi
    description: >-
      Verify an XMSS signature (SP 800-208 / RFC 8391). Reads the
      68-byte public key from `pk_ptr`, `msg_len` bytes from
      `msg_ptr`, and the 2500-byte signature from `sig_ptr`. Returns
      `Ok = 0` for a valid signature, `TagMismatch = 22` for any
      verification failure (parse / structural mismatch / cryptographic
      mismatch — upstream collapses these into a single
      `Err(InvalidInput)`; same convention as RSA verify, ML-DSA
