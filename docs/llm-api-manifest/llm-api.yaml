error_types:
  - name: Error
    module: oxicrypt-module
    variants:
      - name: NotOperational
        description: Module is not in Operational state.
        recoverable: false
        user_action: Call initialize_with_tests() first.
      - name: SelfTestFailed
        description: A power-up KAT returned incorrect output.
        recoverable: false
        user_action: >-
          Module is in terminal Error state. The binary may be
          corrupted or the algorithm implementation has a bug.
          Restart the process.
      - name: ConditionalTestFailed
        description: A pairwise consistency test failed during key construction.
        recoverable: true
        user_action: Retry key generation with fresh entropy.
      - name: IntegrityNotAttested
        description: Initialisation was attempted with an empty integrity group, leaving the module in the terminal IntegrityUnverified state.
        recoverable: false
        user_action: Pass oxicrypt_integrity::KATS as the integrity argument of initialize_with_tests or initialize_with_profile and restart the process.
      - name: AlreadyInitialized
        description: initialize_with_tests called more than once.
        recoverable: false
        user_action: Only call initialize_with_tests once per process.
      - name: InvalidInput
        description: Caller provided invalid parameters.
        recoverable: true
        user_action: Check parameter constraints and retry.
      - name: EntropyInputTooShort
        description: A DRBG instantiate was given an entropy input shorter than min_length for the instantiated security strength.
        recoverable: true
        user_action: Supply at least security_strength bits of entropy input (32 bytes for Hash_DRBG and HMAC_DRBG, the AES key length for CTR_DRBG with a derivation function).
      - name: NonceTooShort
        description: A DRBG instantiate was given a nonce shorter than security_strength/2 bits.
        recoverable: true
        user_action: Supply a nonce of at least half the security strength (16 bytes for Hash_DRBG and HMAC_DRBG, half the AES key length for CTR_DRBG with a derivation function).

  - name: ModeError
    module: oxicrypt-aes
    variants:
      - name: NotBlockAligned
        description: Input not a multiple of 16 bytes (ECB/CBC).
        recoverable: true
        user_action: Pad input to block boundary.
      - name: TagMismatch
        description: GCM/CCM decryption authentication failed.
        recoverable: false
        user_action: >-
          The ciphertext or AAD was tampered with, or the wrong key/IV
          was used. Do NOT use the plaintext output.
      - name: LengthMismatch
        description: Output buffer wrong size.
        recoverable: true
        user_action: Resize output buffer to match input length.
      - name: Module
        description: The module refused the operation; it is not in SelfTest or Operational.
        recoverable: false
        user_action: Initialise the module before use; after it enters the Error state, restart the process.

  - name: DrbgError
    module: oxicrypt-drbg
    variants:
      - name: Uninstantiated
        description: Called generate/reseed before instantiate.
        recoverable: true
        user_action: Call instantiate_df or instantiate_no_df first.
      - name: ReseedRequired
        description: Reseed counter exceeded 2^48 (SP 800-90A limit).
        recoverable: true
        user_action: Call reseed_df with fresh entropy.
      - name: RequestTooLong
        description: Requested more than 65536 bytes in one call.
        recoverable: true
        user_action: Split into multiple generate calls.
      - name: EntropyInputTooShort
        description: Reseed entropy input is shorter than min_length for the instantiated security strength.
        recoverable: true
        user_action: Reseed with at least security_strength bits of entropy input.
      - name: Module
        description: Module state error (wraps oxicrypt_module::Error).
        recoverable: false
        user_action: If the module was never started (PowerOff), initialise it; if it is in the Error state, restart the process.

  - name: KdfError
    module: oxicrypt-kdf
    variants:
      - name: Module
        description: Module state error (wraps oxicrypt_module::Error).
        recoverable: false
        user_action: >-
          Check that initialize_with_tests() has been called (NotOperational)
          or that the active algorithm profile permits the KDF service
          (AlgorithmRestricted).
      - name: OutputTooLong
        description: Requested output exceeds the algorithm maximum.
        recoverable: true
        user_action: >-
          For HKDF: reduce okm.len() to at most 255 * HashLen (e.g. 8160 for SHA-256).
          For PBKDF2: reduce to at most (2^32-1) * HashLen.
          For SP 800-108: reduce to fit a 32-bit bit-length field.

  - name: VerifyAnyError
    module: oxicrypt-lms
    variants:
      - name: Unroutable
        description: The input names none of the 80 LMS parameter pairs, or a length is not the named pair's.
        recoverable: false
        user_action: >-
          The public key is not an SP 800-208 LMS key, or the key or signature
          was truncated or padded. Check the source of both.
      - name: VerificationFailed
        description: The named pair's verifier rejected the signature.
        recoverable: false
        user_action: Treat the message as unauthenticated.
      - name: Module
        description: Module state error (wraps oxicrypt_module::Error).
        recoverable: false
        user_action: >-
          Check that initialize_with_tests() has been called (NotOperational)
          or that the active algorithm profile permits LMS verification
          (AlgorithmRestricted).

# ─────────────────────────────────────────────────────────────────────
# Constants
# ─────────────────────────────────────────────────────────────────────

  - name: OxiResult
    module: oxicrypt-ffi
    description: "C ABI status code returned by every oxi_* function, with Ok as 0 and every non-zero value a distinct failure mode whose discriminant is fixed by #[repr(C)] and banded by source crate."
    variants:
      - name: Ok
        value: 0
        description: The call succeeded.
        recoverable: true
        user_action: None; the operation completed and any output buffer is valid.
      - name: NotOperational
        value: 1
        description: A service was called while the module was not in the Operational state.
        recoverable: true
        user_action: Call oxi_init() and check it returns Ok before calling any other oxi_* function.
      - name: SelfTestFailed
        value: 2
        description: A power-up known-answer test returned incorrect output during oxi_init().
        recoverable: false
        user_action: >-
          The module is in the terminal Error state and no service will run.
          The binary may be corrupted or its integrity slot unsigned; verify it
          with oxicrypt-integrity-sign --verify and reinstall from a published
          release artifact.
      - name: ConditionalTestFailed
        value: 3
        description: A conditional self-test (DRBG continuous RNG test, or a pairwise consistency test during key generation) failed.
        recoverable: true
        user_action: Retry the operation with fresh entropy; if it repeats, treat the entropy source as failed and stop using the module.
      - name: AlreadyInitialized
        value: 4
        description: oxi_init() was called more than once in this process.
        recoverable: true
        user_action: Remove the duplicate call; the first init's outcome is authoritative and no state changed.
      - name: InvalidInput
        value: 5
        description: An input was not a valid domain element, such as an out-of-range scalar or a point not on the curve.
        recoverable: true
        user_action: Check the encoding and length of each input against the function's parameter constraints; this is raised before any cryptographic comparison.
      - name: AlgorithmRestricted
        value: 6
        description: The requested service is blocked by the algorithm profile active in this process.
        recoverable: false
        user_action: Restart the process and select a profile that permits the service; the active profile cannot be changed in place.
      - name: NotImplemented
        value: 7
        description: The service exists in the Service enum but its implementation is a stub in this build.
        recoverable: false
        user_action: Use a different service; no version of this build provides it.
      - name: Uninstantiated
        value: 8
        description: generate or reseed was called on a DRBG handle before instantiate had succeeded on it.
        recoverable: true
        user_action: Call the matching instantiate function on this handle and check it returns Ok, then retry.
      - name: ReseedRequired
        value: 9
        description: The handle's reseed_counter reached the SP 800-90A Table 3 reseed-interval bound.
        recoverable: true
        user_action: Call reseed with fresh entropy on this handle; generate will not return further output until it succeeds.
      - name: NullPointer
        value: 10
        description: A NULL pointer was passed where the function requires a valid one.
        recoverable: true
        user_action: Pass a valid pointer for every parameter the signature does not document as optional.
      - name: BufferTooSmall
        value: 11
        description: A caller-allocated output buffer is smaller than the documented minimum for the operation.
        recoverable: true
        user_action: Allocate at least the size named in the function's parameter constraints and retry; nothing was written.
      - name: OutputTooLong
        value: 12
        description: "The requested output length exceeds its family's bound: HKDF-Expand above 255*HashLen bytes (RFC 5869 section 2.3), or HMAC_DRBG generate above 2^19 bits per request (SP 800-90A Table 3)."
        recoverable: true
        user_action: Request fewer bytes in one call, and issue multiple calls if more output is needed.
      - name: NotBlockAligned
        value: 20
        description: An input length is not a multiple of the cipher block size where the mode requires alignment.
        recoverable: true
        user_action: Pad the input to a multiple of 16 bytes, or use a mode that does not require block alignment.
      - name: InvalidIvLength
        value: 21
        description: The IV length does not match the mode's specification.
        recoverable: true
        user_action: Supply an IV of exactly the length the mode requires; AES-GCM requires 12 bytes.
      - name: TagMismatch
        value: 22
        description: "A cryptographic verification ran cleanly and disagreed with the claimed value, covering AEAD tag and signature verification alike, and distinct from InvalidInput which is raised before any comparison happens."
        recoverable: false
        user_action: >-
          Treat the message as inauthentic and discard it. Any AEAD plaintext
          output buffer holds UNDEFINED contents and must not be read.
      - name: LengthMismatch
        value: 23
        description: An input and output buffer length pair disagree where the mode requires them to be equal.
        recoverable: true
        user_action: Size the output buffer to match the input length exactly.
      - name: InvalidNonceLength
        value: 24
        description: The nonce length does not match the mode's specification.
        recoverable: true
        user_action: Supply a nonce of exactly the length the mode requires.
      - name: InvalidTagLength
        value: 25
        description: The tag length does not match the mode's specification.
        recoverable: true
        user_action: Request a tag length the mode permits.
      - name: InvalidPayloadLength
        value: 26
        description: The payload length exceeds the mode's allowed maximum.
        recoverable: true
        user_action: Split the payload across multiple operations, each within the mode's maximum.
      - name: InvalidAadLength
        value: 27
        description: The additional-authenticated-data length exceeds the mode's allowed maximum.
        recoverable: true
        user_action: Reduce the AAD to within the mode's maximum.
      - name: IntegrityUnverified
        value: 28
        description: The module was initialised without the pre-operational software integrity test in its inventory, so it was never verified against its signature rather than having failed a test.
        recoverable: false
        user_action: Initialise the module with an inventory that includes the integrity test, and run a signed artifact.
      - name: EntropyInputTooShort
        value: 29
        description: A DRBG instantiate or reseed was given an entropy input shorter than min_length for the instantiated security strength (SP 800-90A Rev. 1 Tables 2 and 3).
        recoverable: true
        user_action: Retry with at least security_strength bits of entropy input; an over-long input returns InvalidInput instead, as does CTR_DRBG seed material without a derivation function that is not exactly seedlen bytes.
      - name: NonceTooShort
        value: 30
        description: A DRBG instantiate was given a nonce shorter than security_strength/2 bits, the module's nonce floor (permitted by SP 800-90A Rev. 1 section 9.1 step 8; a nonce of that length can meet the entropy condition of section 8.6.7, and a shorter one meeting only its uniqueness condition is refused).
        recoverable: true
        user_action: Retry with a nonce of at least half the security strength.
      - name: Internal
        value: 255
        description: A should-never-happen case reached the catch-all arm.
        recoverable: false
        user_action: Report this with the calling sequence; reaching Internal indicates a defect in the module, not in the call.

  - name: IntegrityError
    module: oxicrypt-integrity
    description: Failure of the pre-operational software integrity test (ISO/IEC 19790:2012 §7.10.2.2, AS10.17-AS10.18).
    variants:
      - name: CastNotRun
        description: The integrity technique's own ML-DSA-87 signature-verification self-test has not passed in this process, so the integrity test may not use it.
        recoverable: true
        user_action: Run ml_dsa_cast() and sha256_cast() before calling verify_loaded_image(); the crate's KATS constant already lists them in the required order. This is a front-end sequencing fault, not a finding about the module image.
      - name: NoVerifyKey
        description: The module was built without a verifying key.
        recoverable: false
        user_action: The module cannot tell a build without a key from one whose key was erased. If you built this binary from source yourself, generate a key pair with oxicrypt-integrity-sign --keygen, rebuild with OXICRYPT_INTEGRITY_VERIFY_KEY set to its public half, and sign with its private half. If you received it from anyone else, do not sign it; obtain a fresh copy from its publisher.
      - name: SignatureInvalid
        description: The signature over the image does not verify under the embedded key.
        recoverable: false
        user_action: >-
          The module is in the terminal Error state and no service will run. The binary changed after it was signed; do not re-sign it. Replace it with a published release artifact or rebuild from source.
      - name: SlotInvalid
        description: The slot is the unsigned template (status 3), names a different key (status 9), or is damaged (status 10).
        recoverable: false
        user_action: 'For the unsigned template, the module cannot tell a never-signed binary from a signed one whose slot was overwritten. If you built this binary from source yourself and have not signed it yet, sign it with your own key (docs/integrity-signing.md). If you received it from anyone else, do not sign it: obtain a fresh copy from its publisher. For KeyMismatch or damage, do not sign it again; compare verify_key_fingerprint with the slot''s key id, and replace the binary.'
      - name: Unreadable
        description: No memory route could supply the module's own bytes, so the test was not performed.
        recoverable: false
        user_action: Treat the module as unverified rather than proceeding. On Linux, check that neither /proc/self/mem nor process_vm_readv is denied to this process (for example by a seccomp filter). Do not sign it; if this persists in an ordinary environment, obtain a fresh copy from its publisher.

  - name: SlotDefect
    module: oxicrypt-integrity
    description: Why an integrity slot was refused, returned by encode and parse and nested in IntegrityError::SlotInvalid.
    variants:
      - name: UnsupportedVersion
        description: The version is not SLOT_VERSION; zero means the artifact was never signed, and versions 1 and 2 are refused.
        recoverable: false
        user_action: In a version-3 build this is damage, not an unsigned binary. Do not sign it; replace it with a fresh copy from its publisher, or rebuild from source.
      - name: KeyMismatch
        description: The slot was signed for a different verifying key than the one the module embeds.
        recoverable: false
        user_action: Do not sign it again. Compare the module's verify_key_fingerprint with the slot's key id from oxicrypt-integrity-sign --show; if the binary is not one you built with that key, replace it.
      - name: KeyRecord
        description: The embedded verifying-key record is absent or malformed.
        recoverable: false
        user_action: Treat the artifact as corrupt; rebuild from a trusted source.
      - name: HeaderMagic
        description: The header magic is absent — the artifact was not linked against oxicrypt-integrity, or the slot was stripped.
        recoverable: false
        user_action: In a version-3 build the slot is the module's own static, so a missing magic is damage. Do not sign it; replace it with a fresh copy from its publisher, or rebuild from source.
      - name: UnresolvedImport
        description: A Bind entry names a non-weak import that did not resolve.
        recoverable: false
        user_action: The library the artifact was signed against is not the one loaded; install the matching dependency.
      - name: NonMaximal
        description: The table is not in canonical form.
        recoverable: false
        user_action: The signer writes only the canonical form, so this is damage. Do not sign it again; replace the binary.

  - name: EntropyError
    module: oxicrypt-entropy
    description: Refusal from the SP 800-90B entropy pipeline, at construction or while producing a sample.
    variants:
      - name: ClaimExceedsCeiling
        description: The claimed min-entropy per sample exceeds the source ceiling.
        recoverable: false
        user_action: Lower the claim to at most the ceiling; the pipeline refuses rather than clamping, so the claim must be corrected by the caller.
      - name: ClaimExceedsSampleWidth
        description: The claimed min-entropy per sample exceeds the declared sample width, or the alpha has no APT table coverage.
        recoverable: false
        user_action: Lower the claim to at most the sample width, or choose an alpha the APT tables cover.
      - name: Source
        description: The underlying noise source failed to produce a sample.
        recoverable: true
        user_action: Retry; if the failure persists the source is unavailable and no entropy should be drawn from it.
      - name: Health
        description: A continuous health test failed.
        recoverable: false
        user_action: Discard the pipeline. The failure permanently poisons it, and the sample that failed is never released.
      - name: NotReady
        description: Startup has not completed, or the pipeline has been poisoned, or startup has already run.
        recoverable: false
        user_action: Run the startup tests once before sampling, and construct a fresh pipeline after any poisoning.
      - name: ConditionerKat
        description: The conditioning component's known-answer test failed.
        recoverable: false
        user_action: Treat as a self-test failure of the module rather than a caller error.
      - name: Io
        description: An I/O operation in the pipeline failed.
        recoverable: true
        user_action: Check the underlying device or file, then retry.
  - name: TimerError
    module: oxicrypt-entropy
    description: Failure reading or interpreting the high-resolution counter the jitter source samples.
    variants:
      - name: Unsupported
        description: The target architecture has no counter this crate can read.
        recoverable: false
        user_action: Use a different noise source on this platform.
      - name: Unavailable
        description: The counter exists but could not be read.
        recoverable: true
        user_action: Retry; a persistent failure means the counter cannot be used as a noise source here.
      - name: Backwards
        description: The masked delta has the width top bit set, indicating the counter moved backwards.
        recoverable: true
        user_action: Discard the sample and continue; this is a per-sample condition, not a pipeline failure.
      - name: Inadequate
        description: The counter's measured resolution is too coarse to carry the claimed entropy.
        recoverable: false
        user_action: Lower the claim, or use a source with finer resolution.
  - name: CollectionError
    module: oxicrypt-entropy
    description: Sole error of the off-boundary collection binary, carrying an operator-facing message rather than a discriminated cause.
    variants:
      - name: CollectionError
        description: A newtype over a String, so the cause is a human-readable message and callers cannot branch on it.
        recoverable: true
        user_action: Read the message. This is an operator tool outside the module boundary, so the text is the interface; nothing in the type identifies the cause programmatically.

  - name: ReadError
    module: oxicrypt-imageread
    variants:
      - name: NoMechanism
        description: This target has no implemented mechanism for the request.
        recoverable: false
        user_action: The module cannot perform its pre-operational integrity test on this platform and will not become operational.
      - name: Os
        description: The operating system refused the request and reported a status — errno on Linux and Android, a kern_return_t or errno on Darwin, a GetLastError value on Windows.
        recoverable: false
        user_action: The address named by the artifact's table is not readable, or the process lacks the right. Do not sign the binary; treat a persistent failure as a corrupt or mismatched image and replace it.
      - name: Short
        description: The mechanism succeeded but supplied fewer bytes than requested, which means the request straddled the end of a mapping.
        recoverable: false
        user_action: A statement about the table rather than about permissions. Do not sign the binary; replace it.
      - name: InvalidName
        description: A library or symbol name could not be passed to the operating system.
        recoverable: false
        user_action: The slot's string table names an import no loader could have produced. Do not sign the binary; replace it.
      - name: NoImage
        description: The loader names no image file for the address, which lies in no loaded object or whose recorded name is empty.
        recoverable: false
        user_action: The environment cannot name the module's image file. Provide /proc where it is missing; do not sign the binary.

