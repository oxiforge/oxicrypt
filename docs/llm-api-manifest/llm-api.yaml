  - name: HkdfPrk
    module: oxicrypt
    kind: struct
    description: "48-byte HKDF-SHA384 pseudorandom key, zeroed on drop, whose Debug prints only the type name and which implements no Clone, Copy, PartialEq or Hash."
    security:
      contains_secret: true
