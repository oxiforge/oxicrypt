        direction: in
        description: Message bytes (length given by msg_len)
      - name: msg_len
        type: size_t
        direction: in
        description: Message length in bytes
      - name: sk_out
        type: uint8_t *
        direction: out
        description: 52-byte opaque LMS private-key blob (post-state, leaf index advanced; MUST be persisted before using sig_out)
