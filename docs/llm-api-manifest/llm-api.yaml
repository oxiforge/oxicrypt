    parameters:
      - { name: handle, type: "OxiHmacDrbgSha256 *", direction: in, description: "Live, instantiated handle" }
      - { name: entropy, type: "const uint8_t *", direction: in, description: "Caller-sourced fresh entropy bytes" }
      - { name: entropy_len, type: "size_t", direction: in, description: "Entropy length in bytes" }
      - { name: additional_input, type: "const uint8_t *", direction: in, description: "Optional additional input (NULL+0 = none)" }
      - { name: additional_input_len, type: "size_t", direction: in, description: "Additional input length in bytes" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 8 = Uninstantiated, 5 = InvalidInput on length-bound, 10 = NullPointer)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_hmac_drbg_sha256_generate
    module: oxicrypt-ffi
    description: >-
      HMAC_DRBG-SHA-256 Generate (SP 800-90A §10.1.2.5). Produces
      `out_len` pseudorandom bytes into `out`, advancing the internal
      `(K, V)` state and incrementing `reseed_counter`.
      `additional_input` may be NULL when `additional_input_len` is
      0 (mapped to upstream `additional_input = None`). Returns
      `Uninstantiated = 8` if instantiate has not yet succeeded.
      Returns `ReseedRequired = 9` when `reseed_counter` reaches the
      SP 800-90A Table 3 bound — caller MUST call reseed before
      retrying. Returns `OutputTooLong = 12` if `out_len` exceeds
      `2^19` bits (= 65 536 bytes), the SP 800-90A Table 3
      max_number_of_bits_per_request ceiling.
    signature: >-
      int oxi_hmac_drbg_sha256_generate(OxiHmacDrbgSha256 *handle,
      const uint8_t *additional_input, size_t additional_input_len,
      uint8_t *out, size_t out_len)
    parameters:
      - { name: handle, type: "OxiHmacDrbgSha256 *", direction: in, description: "Live, instantiated handle" }
      - { name: additional_input, type: "const uint8_t *", direction: in, description: "Optional additional input (NULL+0 = upstream None)" }
      - { name: additional_input_len, type: "size_t", direction: in, description: "Additional input length in bytes" }
      - { name: out, type: "uint8_t *", direction: out, description: "Output buffer (≥ out_len writable bytes)" }
      - { name: out_len, type: "size_t", direction: in, description: "Number of pseudorandom bytes to produce (≤ 65536)" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 8 = Uninstantiated, 9 = ReseedRequired, 12 = OutputTooLong, 5 = InvalidInput on additional_input length-bound, 10 = NullPointer)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

