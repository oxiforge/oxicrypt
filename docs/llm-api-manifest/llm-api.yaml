  - name: SharedSecret
    module: oxicrypt
    kind: struct
    description: "32-byte ML-KEM-1024 shared secret, zeroed on drop, whose Debug prints only the type name and which implements no Clone, Copy, PartialEq or Hash."
    security:
      contains_secret: true
