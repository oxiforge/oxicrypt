      handle into the caller-supplied `uint64_t*`. Pairs with
      `oxi_rsa_2048_modulus` to give a C caller the full public
      key `(n, e)` extracted from a handle.
    signature: >-
      int oxi_rsa_2048_public_exponent(const OxiRsaPrivateKey2048 *key,
      uint64_t *e_out)
    parameters:
      - { name: key, type: "const OxiRsaPrivateKey2048 *", direction: in, description: "Live handle" }
      - { name: e_out, type: "uint64_t *", direction: out, description: "Receives the public exponent" }
    returns:
      type: int
