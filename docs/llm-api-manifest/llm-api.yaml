        type: usize
        direction: in
        description: Block size B in bytes; input is split into B-byte blocks each hashed independently by the inner SHAKE, and different B values produce different hashes.
        constraints:
          nullability: required
          valid_range: "1..=8192 (PANICS outside this range)"
      - name: s
        type: "&[u8]"
