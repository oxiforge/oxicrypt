  # ── HMAC ──────────────────────────────────────────────────────────

  - name: "HmacSha256::new"
    module: oxicrypt-hmac
    family: hmac-new
    description: Create an HMAC-SHA-256 instance with the given key.
    signature: "pub fn HmacSha256::new(key: &[u8]) -> Result<Self, Error>"
    parameters:
      - name: key
        type: "&[u8]"
        direction: in
        description: >-
          HMAC key. Any length is accepted; keys shorter than the hash
          block size (64 bytes) are zero-padded, longer keys are hashed
          first (per FIPS 198-1 §4).
        constraints:
          nullability: required
          valid_range: "1+ bytes recommended; empty is technically valid"
    returns:
      type: "Result<HmacSha256, Error>"
      description: HMAC instance ready for update() calls.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
    postconditions:
      - description: HMAC instance initialized with the key.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let mut mac = oxicrypt_hmac::HmacSha256::new(b"secret-key")?;
        mac.update(b"message");
        let tag = mac.finalize();  // [u8; 32]

  - name: "HmacSha256::update"
    module: oxicrypt-hmac
    description: >-
      Feed data into the HMAC computation. Applies to all HMAC variants
      (HmacSha1, HmacSha384, HmacSha512, HmacSha3_256, etc.) — only the
      tag-length type parameter differs.
    signature: "pub fn update(&mut self, data: &[u8])"
    parameters:
      - name: self
        type: "&mut HmacSha256"
        direction: in-out
        description: The HMAC instance to update.
      - name: data
        type: "&[u8]"
        direction: in
        description: Data to absorb. May be called multiple times.
    returns:
      type: "()"
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: "HmacSha256::finalize"
    module: oxicrypt-hmac
    description: >-
      Compute and return the HMAC tag. IMPORTANT: unlike SHA::finalize, this
      takes &mut self — the instance is NOT consumed. After calling finalize,
      the hasher resets to the initial keyed state and can accept new update
      calls. Applies to all HMAC variants; the return type is [u8; L] where L
      is the hash output length.
    signature: "pub fn finalize(&mut self) -> [u8; 32]"
    parameters:
      - name: self
        type: "&mut HmacSha256"
        direction: in-out
        description: The HMAC instance. Not consumed — resets to initial keyed state.
    returns:
      type: "[u8; 32]"
      description: 32-byte HMAC-SHA-256 tag.
    postconditions:
      - description: Tag is returned. Instance resets to the initial key-padded state.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: >-
          HMAC finalize takes &mut self, NOT self. The object is NOT consumed.
          It resets to the initial keyed state — you can call update() again.
          This differs from SHA::finalize which consumes self.
        wrong: |
          let mac = HmacSha256::new(b"key")?;  // immutable — cannot call update
          let tag = mac.finalize();              // compile error: immutable binding
        right: |
          let mut mac = HmacSha256::new(b"key")?;
          mac.update(b"message");
          let tag = mac.finalize();  // mac still valid; can re-use for next message

