        description: Label suffix; the "tls13 " prefix is prepended internally per RFC 8446 §7.1.
      - name: label_len
        type: size_t
        direction: in
      - name: context_ptr
        type: "const uint8_t *"
        direction: in
        description: Optional context bytes; pass NULL with context_len=0 for empty context.
      - name: context_len
        type: size_t
        direction: in
      - name: out
        type: "uint8_t *"
        direction: out
      - name: out_len
        type: size_t
        direction: in
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."

  - name: oxi_tls13_derive_secret_sha256
    module: oxicrypt-ffi
    description: >-
      Run Derive-Secret per RFC 8446 §7.1 with HMAC-SHA-256.
      Equivalent to HKDF-Expand-Label(secret, label, transcript_hash, out_len).
      The caller computes Hash(messages) — the running TLS 1.3 transcript hash —
      and passes it as transcript_hash.
    signature: >-
      int oxi_tls13_derive_secret_sha256(const uint8_t *secret_ptr, size_t secret_len,
      const uint8_t *label_ptr, size_t label_len,
      const uint8_t *transcript_hash_ptr, size_t transcript_hash_len,
      uint8_t *out, size_t out_len)
    parameters:
      - name: secret_ptr
        type: "const uint8_t *"
        direction: in
      - name: secret_len
        type: size_t
        direction: in
      - name: label_ptr
        type: "const uint8_t *"
        direction: in
      - name: label_len
        type: size_t
        direction: in
      - name: transcript_hash_ptr
        type: "const uint8_t *"
        direction: in
        description: Caller-computed Hash(messages) — running TLS 1.3 transcript hash.
      - name: transcript_hash_len
        type: size_t
        direction: in
      - name: out
        type: "uint8_t *"
        direction: out
      - name: out_len
        type: size_t
        direction: in
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."

  - name: oxi_tls13_derive_secret_sha384
    module: oxicrypt-ffi
    description: >-
      Run Derive-Secret per RFC 8446 §7.1 with HMAC-SHA-384.
      Equivalent to HKDF-Expand-Label(secret, label, transcript_hash, out_len).
      The caller computes Hash(messages) — the running TLS 1.3 transcript hash —
      and passes it as transcript_hash.
    signature: >-
      int oxi_tls13_derive_secret_sha384(const uint8_t *secret_ptr, size_t secret_len,
      const uint8_t *label_ptr, size_t label_len,
      const uint8_t *transcript_hash_ptr, size_t transcript_hash_len,
      uint8_t *out, size_t out_len)
    parameters:
      - name: secret_ptr
        type: "const uint8_t *"
        direction: in
      - name: secret_len
        type: size_t
        direction: in
      - name: label_ptr
        type: "const uint8_t *"
        direction: in
      - name: label_len
        type: size_t
        direction: in
      - name: transcript_hash_ptr
        type: "const uint8_t *"
        direction: in
        description: Caller-computed Hash(messages) — running TLS 1.3 transcript hash.
      - name: transcript_hash_len
        type: size_t
        direction: in
      - name: out
        type: "uint8_t *"
        direction: out
      - name: out_len
        type: size_t
        direction: in
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."

  # AES-256-GCM with opaque OxiAes256Key handle. One-shot only —
  # streaming exposure deferred per PRD Decision D1.

  - name: oxi_aes256_new
    module: oxicrypt-ffi
    description: >-
      Allocate a new AES-256 key handle from raw 32-byte key material.
      On Ok, writes a heap-allocated OxiAes256Key pointer through
      out_handle. The caller owns the handle and MUST release it with
      oxi_aes256_free.
    signature: "int oxi_aes256_new(OxiAes256Key **out_handle, const uint8_t *key)"
    parameters:
      - name: out_handle
        type: "OxiAes256Key **"
        direction: out
        description: "Receives the heap-allocated handle pointer on success."
      - name: key
        type: "const uint8_t *"
        direction: in
        description: "32-byte AES-256 key material."
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 10 = NullPointer, 1 = NotOperational, 6 = AlgorithmRestricted)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_aes256_free
    module: oxicrypt-ffi
    description: >-
      Free an AES-256 key handle. NULL-safe (early return). After
      this call the caller's pointer is dangling; the caller SHOULD
      set their pointer to NULL. A double-free of the same non-NULL
      pointer is undefined behaviour (matches malloc/free semantics).
    signature: "void oxi_aes256_free(OxiAes256Key *handle)"
    parameters:
      - name: handle
        type: "OxiAes256Key *"
        direction: in
        description: "Handle from oxi_aes256_new, or NULL."
    returns:
      type: void
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_aes256_gcm_encrypt
    module: oxicrypt-ffi
    description: >-
      AES-256-GCM authenticated encryption (one-shot). Buffer rules —
      iv = 12 bytes, ciphertext >= pt_len bytes, tag = 16 bytes. AAD
      may be NULL when aad_len == 0 (F9, SP 800-38D logical-by-length).
      Plaintext may be NULL when pt_len == 0.
    signature: >-
      int oxi_aes256_gcm_encrypt(const OxiAes256Key *key,
      const uint8_t *iv, const uint8_t *aad, size_t aad_len,
      const uint8_t *plaintext, size_t pt_len,
      uint8_t *ciphertext, uint8_t *tag)
    parameters:
      - { name: key, type: "const OxiAes256Key *", direction: in, description: "Live handle from oxi_aes256_new" }
      - { name: iv, type: "const uint8_t *", direction: in, description: "12-byte nonce" }
      - { name: aad, type: "const uint8_t *", direction: in }
      - { name: aad_len, type: size_t, direction: in }
      - { name: plaintext, type: "const uint8_t *", direction: in }
      - { name: pt_len, type: size_t, direction: in }
      - { name: ciphertext, type: "uint8_t *", direction: out, description: ">= pt_len bytes" }
      - { name: tag, type: "uint8_t *", direction: out, description: "16-byte tag" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 10 = NullPointer, 21 = InvalidIvLength, 6 = AlgorithmRestricted, ...)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_aes256_gcm_decrypt
    module: oxicrypt-ffi
    description: >-
      AES-256-GCM authenticated decryption (one-shot). Returns
      OxiResult::TagMismatch (=22) on authentication failure. On any
      non-Ok return the plaintext-buffer contents are UNDEFINED — the
      caller MUST NOT use them.
    signature: >-
      int oxi_aes256_gcm_decrypt(const OxiAes256Key *key,
      const uint8_t *iv, const uint8_t *aad, size_t aad_len,
      const uint8_t *ciphertext, size_t ct_len,
      uint8_t *plaintext, const uint8_t *tag)
    parameters:
      - { name: key, type: "const OxiAes256Key *", direction: in, description: "Live handle from oxi_aes256_new" }
      - { name: iv, type: "const uint8_t *", direction: in, description: "12-byte nonce" }
      - { name: aad, type: "const uint8_t *", direction: in }
      - { name: aad_len, type: size_t, direction: in }
      - { name: ciphertext, type: "const uint8_t *", direction: in }
      - { name: ct_len, type: size_t, direction: in }
      - { name: plaintext, type: "uint8_t *", direction: out, description: ">= ct_len bytes; UNDEFINED on non-Ok" }
      - { name: tag, type: "const uint8_t *", direction: in, description: "16-byte tag" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 22 = TagMismatch, 10 = NullPointer, 21 = InvalidIvLength, 6 = AlgorithmRestricted, ...)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_aes256_cbc_encrypt
    module: oxicrypt-ffi
    description: >-
      AES-256-CBC encryption (one-shot, SP 800-38A §6.2). Confidentiality
      only — no authentication. `input_len` MUST be a positive multiple
      of 16; padding is the caller's responsibility. Returns
      OxiResult::NotBlockAligned (=20) when length is not a positive
      multiple of 16.
    signature: >-
      int oxi_aes256_cbc_encrypt(const OxiAes256Key *key,
      const uint8_t *iv, const uint8_t *input, size_t input_len,
      uint8_t *output)
    parameters:
      - { name: key, type: "const OxiAes256Key *", direction: in, description: "Live handle from oxi_aes256_new" }
      - { name: iv, type: "const uint8_t *", direction: in, description: "16-byte IV" }
      - { name: input, type: "const uint8_t *", direction: in }
      - { name: input_len, type: size_t, direction: in, description: "Positive multiple of 16" }
      - { name: output, type: "uint8_t *", direction: out, description: "input_len writable bytes" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 10 = NullPointer, 20 = NotBlockAligned, 23 = LengthMismatch, 6 = AlgorithmRestricted, ...)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_aes256_cbc_decrypt
    module: oxicrypt-ffi
    description: >-
      AES-256-CBC decryption (one-shot, SP 800-38A §6.2). Buffer rules
      identical to oxi_aes256_cbc_encrypt with input/output directions
      reversed. No authentication is performed.
    signature: >-
      int oxi_aes256_cbc_decrypt(const OxiAes256Key *key,
      const uint8_t *iv, const uint8_t *input, size_t input_len,
      uint8_t *output)
    parameters:
      - { name: key, type: "const OxiAes256Key *", direction: in, description: "Live handle from oxi_aes256_new" }
      - { name: iv, type: "const uint8_t *", direction: in, description: "16-byte IV" }
      - { name: input, type: "const uint8_t *", direction: in }
      - { name: input_len, type: size_t, direction: in, description: "Positive multiple of 16" }
      - { name: output, type: "uint8_t *", direction: out, description: "input_len writable bytes" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 10 = NullPointer, 20 = NotBlockAligned, 23 = LengthMismatch, 6 = AlgorithmRestricted, ...)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_aes256_ctr
    module: oxicrypt-ffi
    description: >-
      AES-256-CTR XOR (one-shot, SP 800-38A §6.5). CTR is symmetric:
      encrypt and decrypt are the same operation, hence a single entry
      point. `icb` is the full 16-byte initial counter block; the FFI
      does not impose a particular nonce/counter split (mirroring SP
      800-38A Appendix B). `(key, icb)` MUST NOT be reused — caller
      is responsible for nonce uniqueness within a key.
    signature: >-
      int oxi_aes256_ctr(const OxiAes256Key *key,
      const uint8_t *icb, const uint8_t *input, size_t len,
      uint8_t *output)
    parameters:
      - { name: key, type: "const OxiAes256Key *", direction: in, description: "Live handle from oxi_aes256_new" }
      - { name: icb, type: "const uint8_t *", direction: in, description: "16-byte initial counter block" }
      - { name: input, type: "const uint8_t *", direction: in }
      - { name: len, type: size_t, direction: in, description: "Any length" }
      - { name: output, type: "uint8_t *", direction: out, description: "len writable bytes" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 10 = NullPointer, 6 = AlgorithmRestricted, ...)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_aes256_ccm_encrypt
    module: oxicrypt-ffi
    description: >-
      AES-256-CCM authenticated encryption (one-shot, SP 800-38C).
      Caller-chosen nonce length 7..=13 and tag length from
      {4, 6, 8, 10, 12, 14, 16}. `aad` may be NULL when `aad_len == 0`
      (F9, AAD logically defined by length). `plaintext` may be NULL
      when `pt_len == 0`. Output buffer is `pt_len + tlen` bytes;
      layout is `C || T` (ciphertext concatenated with tag).
    signature: >-
      int oxi_aes256_ccm_encrypt(const OxiAes256Key *key,
      const uint8_t *nonce, size_t nonce_len,
      const uint8_t *aad, size_t aad_len,
      const uint8_t *plaintext, size_t pt_len,
      size_t tlen, uint8_t *out)
    parameters:
      - { name: key, type: "const OxiAes256Key *", direction: in, description: "Live handle from oxi_aes256_new" }
      - { name: nonce, type: "const uint8_t *", direction: in }
      - { name: nonce_len, type: size_t, direction: in, description: "7..=13 per SP 800-38C" }
      - { name: aad, type: "const uint8_t *", direction: in }
      - { name: aad_len, type: size_t, direction: in }
      - { name: plaintext, type: "const uint8_t *", direction: in }
      - { name: pt_len, type: size_t, direction: in }
      - { name: tlen, type: size_t, direction: in, description: "Tag length: {4,6,8,10,12,14,16}" }
      - { name: out, type: "uint8_t *", direction: out, description: "pt_len + tlen writable bytes; layout C || T" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 10 = NullPointer, 21 = InvalidIvLength, 23 = LengthMismatch, 6 = AlgorithmRestricted, ...)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_aes256_ccm_decrypt
    module: oxicrypt-ffi
    description: >-
      AES-256-CCM authenticated decryption (one-shot, SP 800-38C).
      `ciphertext` is the full `C || T` buffer of length
      `ct_len = pt_len + tlen`. On success writes the recovered
      plaintext (length `ct_len - tlen`) into `out`. On tag-verification
      failure returns OxiResult::TagMismatch (=22) and the upstream
      zeroises the output buffer so unverified plaintext is never
      exposed.
    signature: >-
      int oxi_aes256_ccm_decrypt(const OxiAes256Key *key,
      const uint8_t *nonce, size_t nonce_len,
      const uint8_t *aad, size_t aad_len,
      const uint8_t *ciphertext, size_t ct_len,
      size_t tlen, uint8_t *out)
    parameters:
      - { name: key, type: "const OxiAes256Key *", direction: in, description: "Live handle from oxi_aes256_new" }
      - { name: nonce, type: "const uint8_t *", direction: in }
      - { name: nonce_len, type: size_t, direction: in, description: "7..=13 per SP 800-38C" }
      - { name: aad, type: "const uint8_t *", direction: in }
      - { name: aad_len, type: size_t, direction: in }
      - { name: ciphertext, type: "const uint8_t *", direction: in, description: "C || T packed buffer" }
      - { name: ct_len, type: size_t, direction: in, description: "pt_len + tlen" }
      - { name: tlen, type: size_t, direction: in, description: "Tag length: {4,6,8,10,12,14,16}" }
      - { name: out, type: "uint8_t *", direction: out, description: "ct_len - tlen writable bytes; UNDEFINED on TagMismatch (zeroised by upstream)" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 22 = TagMismatch, 10 = NullPointer, 21 = InvalidIvLength, 23 = LengthMismatch, 6 = AlgorithmRestricted, ...)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_aes256_cmac
    module: oxicrypt-ffi
    description: >-
      CMAC-AES-256 (one-shot, SP 800-38B). MAC over arbitrary-length
      message under an AES-256 block cipher; tag is always 16 bytes
      (full BLOCK_SIZE). Callers that need a truncated MAC must
      truncate at the application layer per SP 800-38B §4. Gated on
      Service::CmacAes256 (60-band) distinct from the cipher-mode
      Aes256* services (90-band). `msg` may be NULL when `msg_len == 0`.
    signature: >-
      int oxi_aes256_cmac(const OxiAes256Key *key,
      const uint8_t *msg, size_t msg_len, uint8_t *tag)
    parameters:
      - { name: key, type: "const OxiAes256Key *", direction: in, description: "Live handle from oxi_aes256_new" }
      - { name: msg, type: "const uint8_t *", direction: in }
      - { name: msg_len, type: size_t, direction: in }
      - { name: tag, type: "uint8_t *", direction: out, description: "16-byte tag" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 10 = NullPointer, 6 = AlgorithmRestricted, ...)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_aes256_kw_wrap
    module: oxicrypt-ffi
    description: >-
      AES-256-KW wrap (SP 800-38F §6.2 KW-AE). `pt_len` MUST be a
      positive multiple of 8 and at least 16 bytes. Output is
      `pt_len + 8` bytes (plaintext + 8-byte ICV).
    signature: >-
      int oxi_aes256_kw_wrap(const OxiAes256Key *key,
      const uint8_t *plaintext, size_t pt_len, uint8_t *out)
    parameters:
      - { name: key, type: "const OxiAes256Key *", direction: in, description: "Live handle from oxi_aes256_new" }
      - { name: plaintext, type: "const uint8_t *", direction: in }
      - { name: pt_len, type: size_t, direction: in, description: "Positive multiple of 8, >= 16" }
      - { name: out, type: "uint8_t *", direction: out, description: "pt_len + 8 writable bytes" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 10 = NullPointer, 20 = NotBlockAligned, 23 = LengthMismatch, 6 = AlgorithmRestricted, ...)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_aes256_kw_unwrap
    module: oxicrypt-ffi
    description: >-
      AES-256-KW unwrap (SP 800-38F §6.2 KW-AD). `ct_len` MUST be a
      positive multiple of 8 and at least 24 bytes. Output is
      `ct_len - 8` bytes. Returns OxiResult::TagMismatch (=22) if the
      integrity check value did not verify.
    signature: >-
      int oxi_aes256_kw_unwrap(const OxiAes256Key *key,
      const uint8_t *ciphertext, size_t ct_len, uint8_t *out)
    parameters:
      - { name: key, type: "const OxiAes256Key *", direction: in, description: "Live handle from oxi_aes256_new" }
      - { name: ciphertext, type: "const uint8_t *", direction: in }
      - { name: ct_len, type: size_t, direction: in, description: "Positive multiple of 8, >= 24" }
      - { name: out, type: "uint8_t *", direction: out, description: "ct_len - 8 writable bytes" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 22 = TagMismatch, 10 = NullPointer, 20 = NotBlockAligned, 23 = LengthMismatch, 6 = AlgorithmRestricted, ...)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_aes256_kwp_wrap
    module: oxicrypt-ffi
    description: >-
      AES-256-KWP wrap (SP 800-38F §6.3 KWP-AE / RFC 5649). Accepts
      any plaintext length in `1..=2^32-1` bytes. Output is
      `((pt_len + 7) / 8) * 8 + 8` bytes — padded plaintext plus the
      8-byte AIV. KWP differs from KW only in the alternative IV
      and the implicit zero-padding to a multiple of 8.
    signature: >-
      int oxi_aes256_kwp_wrap(const OxiAes256Key *key,
      const uint8_t *plaintext, size_t pt_len, uint8_t *out)
    parameters:
      - { name: key, type: "const OxiAes256Key *", direction: in, description: "Live handle from oxi_aes256_new" }
      - { name: plaintext, type: "const uint8_t *", direction: in }
      - { name: pt_len, type: size_t, direction: in, description: "1..=2^32-1" }
      - { name: out, type: "uint8_t *", direction: out, description: "((pt_len+7)/8)*8 + 8 writable bytes" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 10 = NullPointer, 23 = LengthMismatch, 6 = AlgorithmRestricted, ...)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_aes256_kwp_unwrap
    module: oxicrypt-ffi
    description: >-
      AES-256-KWP unwrap (SP 800-38F §6.3 KWP-AD / RFC 5649).
      `ct_len` MUST be a positive multiple of 8 and at least 16
      bytes. `out_scratch` is the padded plaintext buffer of length
      `ct_len - 8`; only the first `*out_len` bytes are the recovered
      message after success. `out_len` is unmodified on any non-Ok
      return. Returns OxiResult::TagMismatch (=22) on AIV / padding
      mismatch.
    signature: >-
      int oxi_aes256_kwp_unwrap(const OxiAes256Key *key,
      const uint8_t *ciphertext, size_t ct_len,
      uint8_t *out_scratch, size_t *out_len)
    parameters:
      - { name: key, type: "const OxiAes256Key *", direction: in, description: "Live handle from oxi_aes256_new" }
      - { name: ciphertext, type: "const uint8_t *", direction: in }
      - { name: ct_len, type: size_t, direction: in, description: "Positive multiple of 8, >= 16" }
      - { name: out_scratch, type: "uint8_t *", direction: out, description: "ct_len - 8 writable bytes (padded plaintext scratch)" }
      - { name: out_len, type: "size_t *", direction: out, description: "Recovered plaintext length on success; unmodified on non-Ok" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 22 = TagMismatch, 10 = NullPointer, 20 = NotBlockAligned, 23 = LengthMismatch, 6 = AlgorithmRestricted, ...)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  # ECDSA (FIPS 186-5) — stateless surface. Three pure-functional
  # entry points per curve over byte arrays. The DRBG-driven keygen
  # and DRBG-sampled signing surfaces (`*_generate`, `*_sign_sha*`)
  # land in a follow-up PR after the DRBG family C ABI ships.

  - name: oxi_ecdsa_p256_derive_public_key
    module: oxicrypt-ffi
    description: >-
      Derive the uncompressed SEC1 public key for an ECDSA P-256
      private scalar (FIPS 186-5 §6.2.1). Reads exactly 32 bytes
      from `d_ptr`. Writes 65 bytes (`0x04 || X(32) || Y(32)`) into
      `public_key_out` per SEC1 §2.3.3 — the leading 0x04 is the
      uncompressed-point indicator, NOT a length prefix.
    signature: >-
      int oxi_ecdsa_p256_derive_public_key(const uint8_t *d_ptr, uint8_t *public_key_out)
    parameters:
      - { name: d_ptr, type: "const uint8_t *", direction: in, description: "32-byte private scalar" }
      - { name: public_key_out, type: "uint8_t *", direction: out, description: "Output buffer >= 65 bytes" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on out-of-range scalar, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_ecdsa_p256_sign_with_k
    module: oxicrypt-ffi
    description: >-
      Sign `msg` with ECDSA P-256 using a caller-supplied per-message
      secret `k` (FIPS 186-5 §6.4.1). The hash step is computed
      INSIDE the upstream sign — caller passes the raw message, not
      a digest. `k` must be uniformly random in `[1, n-1]` per
      FIPS 186-5 §A.2.2 — the FFI cannot enforce uniformity.
    signature: >-
      int oxi_ecdsa_p256_sign_with_k(const uint8_t *d_ptr,
      const uint8_t *msg_ptr, size_t msg_len,
      const uint8_t *k_ptr, uint8_t *sig_out)
    parameters:
      - { name: d_ptr, type: "const uint8_t *", direction: in, description: "32-byte private scalar" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in }
      - { name: msg_len, type: size_t, direction: in }
      - { name: k_ptr, type: "const uint8_t *", direction: in, description: "32-byte uniformly-random per-message secret" }
      - { name: sig_out, type: "uint8_t *", direction: out, description: "Output buffer >= 64 bytes; receives r(32) || s(32)" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on r=0/s=0/scalar-out-of-range, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_ecdsa_p256_verify
    module: oxicrypt-ffi
    description: >-
      Verify an ECDSA P-256 signature over `msg` against the public
      key (FIPS 186-5 §6.4.2). Returns 0 (Ok) for valid, 22
      (TagMismatch) for well-formed-but-invalid (the upstream
      Ok(false)). The TagMismatch reuse generalizes the AEAD
      tag-mismatch semantic to the signature-verification family —
      see security-policy §4.7 for the cross-family rationale.
    signature: >-
      int oxi_ecdsa_p256_verify(const uint8_t *public_key_ptr,
      const uint8_t *msg_ptr, size_t msg_len,
      const uint8_t *sig_ptr)
    parameters:
      - { name: public_key_ptr, type: "const uint8_t *", direction: in, description: "65-byte uncompressed SEC1 public key" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in }
      - { name: msg_len, type: size_t, direction: in }
      - { name: sig_ptr, type: "const uint8_t *", direction: in, description: "64-byte signature (r || s)" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok valid signature, 22 = TagMismatch invalid signature, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true

  - name: oxi_ecdsa_p384_derive_public_key
    module: oxicrypt-ffi
    description: >-
      Derive the uncompressed SEC1 public key for an ECDSA P-384
      private scalar (FIPS 186-5 §6.2.1). Reads exactly 48 bytes
      from `d_ptr`. Writes 97 bytes (`0x04 || X(48) || Y(48)`) into
      `public_key_out` per SEC1 §2.3.3.
    signature: >-
      int oxi_ecdsa_p384_derive_public_key(const uint8_t *d_ptr, uint8_t *public_key_out)
    parameters:
      - { name: d_ptr, type: "const uint8_t *", direction: in, description: "48-byte private scalar" }
      - { name: public_key_out, type: "uint8_t *", direction: out, description: "Output buffer >= 97 bytes" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on out-of-range scalar, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_ecdsa_p384_sign_with_k
    module: oxicrypt-ffi
    description: >-
      Sign `msg` with ECDSA P-384 using a caller-supplied per-message
      secret `k` (FIPS 186-5 §6.4.1). The hash step is computed
      INSIDE the upstream sign. `k` must be uniformly random in
      `[1, n-1]` per FIPS 186-5 §A.2.2.
    signature: >-
      int oxi_ecdsa_p384_sign_with_k(const uint8_t *d_ptr,
      const uint8_t *msg_ptr, size_t msg_len,
      const uint8_t *k_ptr, uint8_t *sig_out)
    parameters:
      - { name: d_ptr, type: "const uint8_t *", direction: in, description: "48-byte private scalar" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in }
      - { name: msg_len, type: size_t, direction: in }
      - { name: k_ptr, type: "const uint8_t *", direction: in, description: "48-byte uniformly-random per-message secret" }
      - { name: sig_out, type: "uint8_t *", direction: out, description: "Output buffer >= 96 bytes; receives r(48) || s(48)" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on r=0/s=0/scalar-out-of-range, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_ecdsa_p384_verify
    module: oxicrypt-ffi
    description: >-
      Verify an ECDSA P-384 signature over `msg` against the public
      key (FIPS 186-5 §6.4.2). Returns 0 (Ok) for valid, 22
      (TagMismatch) for well-formed-but-invalid.
    signature: >-
      int oxi_ecdsa_p384_verify(const uint8_t *public_key_ptr,
      const uint8_t *msg_ptr, size_t msg_len,
      const uint8_t *sig_ptr)
    parameters:
      - { name: public_key_ptr, type: "const uint8_t *", direction: in, description: "97-byte uncompressed SEC1 public key" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in }
      - { name: msg_len, type: size_t, direction: in }
      - { name: sig_ptr, type: "const uint8_t *", direction: in, description: "96-byte signature (r || s)" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok valid signature, 22 = TagMismatch invalid signature, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true

  # ECDSA DRBG-driven (FIPS 186-5 §A.2.2 + IG 10.3.A) — eight C ABI
  # entry points + two opaque private-key handle types. Each handle
  # carries both the private scalar `d` and the derived uncompressed
  # SEC1 public key `Q`, and has passed an IG 10.3.A pairwise
  # consistency test at construction. The `_new_generate` constructor
  # consumes a DRBG handle to sample `d` via FIPS 186-5 §A.2.2
  # rejection sampling, then re-borrows the same DRBG to draw the
  # PCT nonce `k`. Per-call `_sign_sha{256,384}` re-borrows the DRBG
  # for fresh `k` on every signature. Drop on the upstream
  # `EcdsaP{256,384}PrivateKey` zeroises `d` via `oxicrypt-zeroize`.
  # Stateless `from_bytes(d, drbg)` import constructor and
  # `private_scalar(&self)` exfil accessor are deferred to additive
  # follow-up rounds. See security-policy §4.8 PCT-at-construction
  # handle invariant gem.

  - name: OxiEcdsaP256PrivateKey
    kind: opaque_type
    module: oxicrypt-ffi
    description: >-
      Opaque ECDSA P-256 private-key handle that has passed an
      IG 10.3.A pairwise consistency test at construction time. The
      internal layout (`OxiHandle<EcdsaP256PrivateKey>`) is
      implementation detail and not part of the C ABI; cbindgen
      renders this as an opaque struct. Carries both the private
      scalar `d` (32 bytes) and the derived uncompressed SEC1 public
      key `Q` (65 bytes). Drop chain calls upstream
      `oxicrypt_zeroize::zeroize(&mut self.d)`. Allocate via
      `oxi_ecdsa_p256_private_key_new_generate`; release via
      `oxi_ecdsa_p256_private_key_free`.

  - name: OxiEcdsaP384PrivateKey
    kind: opaque_type
    module: oxicrypt-ffi
    description: >-
      Opaque ECDSA P-384 private-key handle that has passed an
      IG 10.3.A pairwise consistency test at construction time.
      Carries both the private scalar `d` (48 bytes) and the derived
      uncompressed SEC1 public key `Q` (97 bytes). Drop chain
      zeroises `d`. Allocate via
      `oxi_ecdsa_p384_private_key_new_generate`; release via
      `oxi_ecdsa_p384_private_key_free`.

  - name: oxi_ecdsa_p256_private_key_new_generate
    module: oxicrypt-ffi
    description: >-
      Allocate a new ECDSA P-256 private-key handle, generating its
      private scalar via the FIPS 186-5 §A.2.2 rejection sampler on
      the caller-supplied DRBG handle, deriving its public key, and
      running the IG 10.3.A pairwise consistency test against a fixed
      probe message before returning. On success, writes a
      heap-allocated handle pointer through `out_key`. PCT failure
      (signalling a faulted sign or verify primitive) collapses to
      `OxiResult::InvalidInput = 5`; no half-initialised pointer ever
      reaches the caller. The DRBG handle's internal
      `(K, V, reseed_counter)` state mutates during scalar and PCT
      nonce sampling. Caller MUST instantiate the DRBG via
      `oxi_hmac_drbg_sha256_instantiate` before this call and MUST
      serialise concurrent calls on the same DRBG handle pointer per
      the per-call-mutating-handle thread-safety contract. Forwards
      to `oxicrypt_ecdsa::p256_ecdsa::EcdsaP256PrivateKey::generate`.
    signature: >-
      int oxi_ecdsa_p256_private_key_new_generate(OxiHmacDrbgSha256 *drbg,
      OxiEcdsaP256PrivateKey **out_key)
    parameters:
      - { name: drbg, type: "OxiHmacDrbgSha256 *", direction: in, description: "Live, instantiated HMAC_DRBG-SHA-256 handle" }
      - { name: out_key, type: "OxiEcdsaP256PrivateKey **", direction: out, description: "Receives a heap-allocated handle on success; caller MUST free with oxi_ecdsa_p256_private_key_free" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on DRBG fault or PCT fail, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_ecdsa_p256_private_key_free
    module: oxicrypt-ffi
    description: >-
      Free an ECDSA P-256 private-key handle. NULL-safe. Drop on the
      upstream `EcdsaP256PrivateKey` zeroises the private scalar `d`
      via the workspace-wide `oxicrypt-zeroize` volatile-write
      convention; no caller-side scrubbing is required. Double-free
      of the same non-NULL pointer is undefined behaviour (matches
      malloc/free semantics).
    signature: >-
      void oxi_ecdsa_p256_private_key_free(OxiEcdsaP256PrivateKey *key)
    parameters:
      - { name: key, type: "OxiEcdsaP256PrivateKey *", direction: in, description: "Handle to free, or NULL" }
    returns:
      type: void
      description: "No return value."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_ecdsa_p256_private_key_public_key
    module: oxicrypt-ffi
    description: >-
      Copy the uncompressed SEC1 public key
      (`0x04 || X(32) || Y(32)`, 65 bytes) from an ECDSA P-256
      private-key handle into the caller buffer. The public key
      returned is exactly the one the IG 10.3.A PCT verified against
      at handle construction time, so any signature produced by
      `oxi_ecdsa_p256_private_key_sign_sha256` on the same handle is
      guaranteed to verify under this public key.
    signature: >-
      int oxi_ecdsa_p256_private_key_public_key(const OxiEcdsaP256PrivateKey *key,
      uint8_t *public_key_out)
    parameters:
      - { name: key, type: "const OxiEcdsaP256PrivateKey *", direction: in, description: "Live handle" }
      - { name: public_key_out, type: "uint8_t *", direction: out, description: "65-byte uncompressed SEC1 public key buffer" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 1 = NotOperational on finalised handle, 10 = NullPointer)."
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true

  - name: oxi_ecdsa_p256_private_key_sign_sha256
    module: oxicrypt-ffi
    description: >-
      Sign `msg` with ECDSA P-256 + SHA-256 under the private-key
      handle, sampling a fresh per-signature nonce `k` from the
      caller-supplied DRBG handle via the FIPS 186-5 §A.2.2 rejection
      sampler. If the sampled `k` produces `r == 0` or `s == 0`
      (mathematically possible but astronomically unlikely; on the
      order of `2^(-256)` per draw), the call retries with a fresh
      draw up to 8 times before returning `OxiResult::InvalidInput
      = 5`. On success, writes 64 bytes (`r(32) || s(32)`) into
      `sig_out`. The DRBG handle's internal state mutates during
      nonce sampling; caller MUST serialise concurrent calls on the
      same DRBG pointer per the per-call-mutating-handle thread-safety
      contract. Forwards to
      `oxicrypt_ecdsa::p256_ecdsa::EcdsaP256PrivateKey::sign_sha256`.
    signature: >-
      int oxi_ecdsa_p256_private_key_sign_sha256(const OxiEcdsaP256PrivateKey *key,
      OxiHmacDrbgSha256 *drbg, const uint8_t *msg_ptr, size_t msg_len,
      uint8_t *sig_out)
    parameters:
      - { name: key, type: "const OxiEcdsaP256PrivateKey *", direction: in, description: "Live private-key handle" }
      - { name: drbg, type: "OxiHmacDrbgSha256 *", direction: in, description: "Live, instantiated DRBG handle" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in }
      - { name: msg_len, type: size_t, direction: in }
      - { name: sig_out, type: "uint8_t *", direction: out, description: "64-byte signature buffer (r || s)" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on DRBG fault or retry exhaustion, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_ecdsa_p384_private_key_new_generate
    module: oxicrypt-ffi
    description: >-
      Allocate a new ECDSA P-384 private-key handle, generating its
      private scalar via the FIPS 186-5 §A.2.2 rejection sampler on
      the caller-supplied DRBG handle, deriving its public key, and
      running the IG 10.3.A pairwise consistency test before
      returning. Mirrors `oxi_ecdsa_p256_private_key_new_generate`
      with curve-specific lengths (48-byte `d`, 97-byte `Q`).
      Forwards to
      `oxicrypt_ecdsa::p384_ecdsa::EcdsaP384PrivateKey::generate`.
    signature: >-
      int oxi_ecdsa_p384_private_key_new_generate(OxiHmacDrbgSha256 *drbg,
      OxiEcdsaP384PrivateKey **out_key)
    parameters:
      - { name: drbg, type: "OxiHmacDrbgSha256 *", direction: in, description: "Live, instantiated HMAC_DRBG-SHA-256 handle" }
      - { name: out_key, type: "OxiEcdsaP384PrivateKey **", direction: out, description: "Receives a heap-allocated handle on success; caller MUST free with oxi_ecdsa_p384_private_key_free" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on DRBG fault or PCT fail, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_ecdsa_p384_private_key_free
    module: oxicrypt-ffi
    description: >-
      Free an ECDSA P-384 private-key handle. NULL-safe. Drop
      zeroises `d`. Mirrors `oxi_ecdsa_p256_private_key_free`.
    signature: >-
      void oxi_ecdsa_p384_private_key_free(OxiEcdsaP384PrivateKey *key)
    parameters:
      - { name: key, type: "OxiEcdsaP384PrivateKey *", direction: in, description: "Handle to free, or NULL" }
    returns:
      type: void
      description: "No return value."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

  - name: oxi_ecdsa_p384_private_key_public_key
    module: oxicrypt-ffi
    description: >-
      Copy the uncompressed SEC1 public key
      (`0x04 || X(48) || Y(48)`, 97 bytes) from an ECDSA P-384
      private-key handle into the caller buffer. Mirrors the P-256
      variant.
    signature: >-
      int oxi_ecdsa_p384_private_key_public_key(const OxiEcdsaP384PrivateKey *key,
      uint8_t *public_key_out)
    parameters:
      - { name: key, type: "const OxiEcdsaP384PrivateKey *", direction: in, description: "Live handle" }
      - { name: public_key_out, type: "uint8_t *", direction: out, description: "97-byte uncompressed SEC1 public key buffer" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 1 = NotOperational on finalised handle, 10 = NullPointer)."
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true

  - name: oxi_ecdsa_p384_private_key_sign_sha384
    module: oxicrypt-ffi
    description: >-
      Sign `msg` with ECDSA P-384 + SHA-384 under the private-key
      handle, sampling a fresh per-signature nonce `k` from the
      caller-supplied DRBG handle via the FIPS 186-5 §A.2.2 rejection
      sampler. Mirrors `oxi_ecdsa_p256_private_key_sign_sha256` with
      a 96-byte signature output. Forwards to
      `oxicrypt_ecdsa::p384_ecdsa::EcdsaP384PrivateKey::sign_sha384`.
    signature: >-
      int oxi_ecdsa_p384_private_key_sign_sha384(const OxiEcdsaP384PrivateKey *key,
      OxiHmacDrbgSha256 *drbg, const uint8_t *msg_ptr, size_t msg_len,
      uint8_t *sig_out)
    parameters:
      - { name: key, type: "const OxiEcdsaP384PrivateKey *", direction: in, description: "Live private-key handle" }
      - { name: drbg, type: "OxiHmacDrbgSha256 *", direction: in, description: "Live, instantiated DRBG handle" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in }
      - { name: msg_len, type: size_t, direction: in }
      - { name: sig_out, type: "uint8_t *", direction: out, description: "96-byte signature buffer (r || s)" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput on DRBG fault or retry exhaustion, 1 = NotOperational, 6 = AlgorithmRestricted, 10 = NullPointer)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  # EdDSA Ed25519 (RFC 8032, FIPS 186-5 §7.8) — three pure-deterministic
  # entry points over byte arrays. Unlike ECDSA, every operation
  # (keygen, sign, verify) is deterministic by construction; there is
  # no `sign_with_k` variant because RFC 8032 §5.1.6 supplies the
  # per-message nonce internally via HMAC-SHA512.

  - name: oxi_ed25519_keygen
    module: oxicrypt-ffi
    description: >-
      Derive the Ed25519 public key from a 32-byte seed (RFC 8032
      §5.1.5). Reads exactly 32 bytes from `seed_ptr`. Writes 32
      bytes (compressed twisted Edwards point per RFC 8032 §5.1.2 —
      Y-coord plus 1 sign bit packed into the high bit of the last
      byte; NOT SEC1 uncompressed, distinct from ECDSA's 65/97 byte
      public keys) into `public_key_out`. **Deterministic**: same
      seed → same public key. The `Service::Ed25519Keygen` gate
      enforces curve restriction, NOT entropy availability — no DRBG
      is consumed.
    signature: >-
      int oxi_ed25519_keygen(const uint8_t *seed_ptr, uint8_t *public_key_out)
    parameters:
      - { name: seed_ptr, type: "const uint8_t *", direction: in, description: "32-byte seed (the secret material)" }
      - { name: public_key_out, type: "uint8_t *", direction: out, description: "Output buffer >= 32 bytes" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_ed25519_sign
    module: oxicrypt-ffi
    description: >-
      Sign `msg` with Ed25519 using the 32-byte seed (RFC 8032 §5.1.6).
      Reads exactly 32 bytes from `seed_ptr`. Writes 64 bytes
      (`R(32) || S(32)`) into `sig_out`. **Deterministic**: the
      per-message nonce is derived via HMAC-SHA512 over a prefix of
      the secret and the message, so signatures are bit-identical
      for the same `(seed, msg)` pair. There is NO `sign_with_k`
      variant because RFC 8032 supplies the `k` internally — distinct
      from ECDSA's `oxi_ecdsa_*_sign_with_k`.
    signature: >-
      int oxi_ed25519_sign(const uint8_t *seed_ptr,
      const uint8_t *msg_ptr, size_t msg_len, uint8_t *sig_out)
    parameters:
      - { name: seed_ptr, type: "const uint8_t *", direction: in, description: "32-byte seed (the secret material)" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in }
      - { name: msg_len, type: size_t, direction: in }
      - { name: sig_out, type: "uint8_t *", direction: out, description: "Output buffer >= 64 bytes; receives R(32) || S(32)" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 5 = InvalidInput, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true

  - name: oxi_ed25519_verify
    module: oxicrypt-ffi
    description: >-
      Verify an Ed25519 signature over `msg` against the public key
      (RFC 8032 §5.1.7). Reads exactly 32 bytes from
      `public_key_ptr` and exactly 64 bytes from `sig_ptr`. Returns
      `OxiResult::TagMismatch = 22` for well-formed-but-invalid
      signatures (the upstream `Ok(false)`) — same cross-family
      verify-mismatch code as ECDSA verify and AEAD AES-GCM/CCM/KW
      authentication failures (see security-policy §4.7).
    signature: >-
      int oxi_ed25519_verify(const uint8_t *public_key_ptr,
      const uint8_t *msg_ptr, size_t msg_len,
      const uint8_t *sig_ptr)
    parameters:
      - { name: public_key_ptr, type: "const uint8_t *", direction: in, description: "32-byte compressed Edwards public key" }
      - { name: msg_ptr, type: "const uint8_t *", direction: in }
      - { name: msg_len, type: size_t, direction: in }
      - { name: sig_ptr, type: "const uint8_t *", direction: in, description: "64-byte signature (R || S)" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok valid signature, 22 = TagMismatch invalid signature, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true

  # ECDH (SP 800-56Ar3 §5.7.1.2) — two stateless entry points, one per
  # curve. No `derive_public_key` in this round because ECDH and ECDSA
  # share scalar-multiplication on each curve; callers reuse
  # `oxi_ecdsa_p{256,384}_derive_public_key` from the ECDSA family
  # when a private scalar needs to be turned into its public key.

  - name: oxi_ecdh_p256_compute_shared_secret
    module: oxicrypt-ffi
    description: >-
      Compute the SP 800-56Ar3 §5.7.1.2 ECC CDH shared secret for
      P-256: `Z = x(d * Q)`. Reads exactly 32 bytes from `d_ptr` (the
      caller's private scalar) and exactly 65 bytes from
      `peer_public_key_ptr` (peer's uncompressed SEC1 public key,
      `0x04 || X(32) || Y(32)`). Writes 32 bytes (the raw big-endian
      x-coordinate) into `shared_secret_out`. The shared secret is
      the **raw** ECDH output per SP 800-56Ar3 — the caller MUST run
      an SP 800-56C Rev. 2 extractor (HKDF, KBKDF) over `Z` before
      using it as keying material; the FFI intentionally does not
      bundle a KDF (see security-policy §4.8). Peer public key
      undergoes full SP 800-56Ar3 §5.6.2.3.3 validation (canonical
      SEC1, coordinate canonicality, non-identity, on-curve) before
      any scalar multiplication; a peer key failing any check causes
      the call to return `InvalidInput = 5` without performing the
      scalar-mul.
    signature: >-
      int oxi_ecdh_p256_compute_shared_secret(const uint8_t *d_ptr,
      const uint8_t *peer_public_key_ptr,
      uint8_t *shared_secret_out)
    parameters:
      - { name: d_ptr, type: "const uint8_t *", direction: in, description: "32-byte private scalar (the secret material)" }
      - { name: peer_public_key_ptr, type: "const uint8_t *", direction: in, description: "65-byte SEC1 uncompressed peer public key (0x04 || X || Y)" }
      - { name: shared_secret_out, type: "uint8_t *", direction: out, description: "Output buffer >= 32 bytes; receives the raw shared-secret x-coordinate" }
