      description: Word array to clear, such as a SHA-1 or SHA-2 32-bit state.
    returns:
      type: ()
      description: No value; the effect is entirely on buf.
    postconditions:
    - description: Every word of buf is 0.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: false

  - name: zeroize_u64
    module: oxicrypt-zeroize
    description: Overwrite every limb of a u64 slice with zero using volatile stores.
    signature: 'pub fn zeroize_u64(buf: &mut [u64])'
    parameters:
    - name: buf
      type: '&mut [u64]'
      direction: inout
      description: Limb array to clear, such as an RSA bigint representation.
    returns:
      type: ()
      description: No value; the effect is entirely on buf.
    postconditions:
    - description: Every limb of buf is 0.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: false

  - name: sha256_compress_available
    module: oxicrypt-sha-accel
    description: Report whether the running CPU supports the SHA-NI accelerated SHA-256 compression path.
    signature: pub fn sha256_compress_available() -> bool
    returns:
      type: bool
      description: True on x86_64 with SHA, SSE2, SSSE3 and SSE4.1 confirmed by CPUID; constant false on every other target.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: sha256_compress
    module: oxicrypt-sha-accel
    description: Compress one 512-bit message block into the FIPS 180-4 SHA-256 state via SHA-NI, or decline and leave the state untouched.
    signature: 'pub fn sha256_compress(state: &mut [u32; 8], block: &[u8; 64]) -> bool'
    parameters:
    - name: state
      type: '&mut [u32; 8]'
      direction: inout
      description: Running FIPS 180-4 hash value H, H[0] first; advanced by exactly one block on success and untouched on failure.
    - name: block
      type: '&[u8; 64]'
      constraints:
        size: 64
      direction: in
      description: One 64-byte message block.
    returns:
      type: bool
      description: True if the accelerated compression ran; false if SHA-NI is unavailable or the target is not x86_64, in which case the caller must run its portable compression.
    postconditions:
    - description: On false, state is bit-identical to its value on entry; no path applies a block partially.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: false

  - name: keccak_f1600_x4_available
    module: oxicrypt-keccak-accel
    description: Report whether the running CPU supports the AVX2 4-way batched Keccak-f[1600] path.
    signature: pub fn keccak_f1600_x4_available() -> bool
    returns:
      type: bool
      description: True on x86_64 with AVX2, AVX and SSE2 confirmed by CPUID; constant false on every other target.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: keccak_f1600_x4
    module: oxicrypt-keccak-accel
    description: Apply the 24-round FIPS 202 Keccak-f[1600] permutation to four independent states in parallel via AVX2, or decline and leave all four untouched.
    signature: 'pub fn keccak_f1600_x4(states: &mut [[u64; 25]; 4]) -> bool'
    parameters:
    - name: states
      type: '&mut [[u64; 25]; 4]'
      direction: inout
      description: Four independent 25-lane Keccak states, lane (x, y) at index x + 5*y; each advanced by one full permutation on success and untouched on failure.
    returns:
      type: bool
      description: True if the accelerated permutation ran; false if AVX2 is unavailable or the target is not x86_64, in which case the caller must run the portable permutation four times.
    postconditions:
    - description: On false, all four states are bit-identical to their values on entry; no path applies the permutation partially.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: false

  - name: aes_block_available
    module: oxicrypt-aes-accel
    description: Report whether the running CPU supports the AES-NI accelerated block path.
    signature: pub fn aes_block_available() -> bool
    returns:
      type: bool
      description: True on x86_64 with AESNI and SSE2 confirmed by CPUID leaf 1; constant false on every other target.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: ghash_available
    module: oxicrypt-aes-accel
    description: Report whether the running CPU supports the PCLMULQDQ accelerated GHASH multiply.
    signature: pub fn ghash_available() -> bool
    returns:
      type: bool
      description: True on x86_64 with PCLMULQDQ, SSSE3 and SSE2 confirmed by CPUID; constant false on every other target.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: ghash_mul
    module: oxicrypt-aes-accel
    description: Compute the SP 800-38D §6.3 GF(2^128) product of two 16-byte GCM field elements via PCLMULQDQ, or decline and leave the output untouched.
    signature: 'pub fn ghash_mul(x: &[u8; 16], y: &[u8; 16], out: &mut [u8; 16]) -> bool'
    parameters:
    - name: x
      type: '&[u8; 16]'
      constraints:
        size: 16
      direction: in
      description: First GCM field element in GCM bit order, bit 7 of byte 0 being the highest coefficient.
    - name: y
      type: '&[u8; 16]'
      constraints:
        size: 16
      direction: in
      description: Second GCM field element in the same bit order.
    - name: out
      type: '&mut [u8; 16]'
      constraints:
        size: 16
      direction: out
      description: Product in GCM bit order on success; untouched on failure.
    returns:
      type: bool
      description: True if the accelerated multiply ran; false if PCLMULQDQ is unavailable or the target is not x86_64, in which case the caller must run its portable schoolbook multiply.
    postconditions:
    - description: On true, out is byte-identical to the portable gf_mul result for the same operands.
    - description: On false, out is byte-identical to its value on entry.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: false

  - name: encrypt_block
    module: oxicrypt-aes-accel
    description: Encrypt one 16-byte block under a pre-expanded FIPS 197 round-key schedule via AES-NI, or decline and leave the block untouched.
    signature: 'pub fn encrypt_block(rk: &[u8], nr: usize, block: &mut [u8; 16]) -> bool'
    parameters:
    - name: rk
      type: '&[u8]'
      direction: in
      description: Pre-expanded FIPS 197 round-key schedule, round 0 first.
      constraints:
        valid_range: exactly 16 * (nr + 1) bytes
    - name: nr
      type: usize
      direction: in
      description: Round count for the key size in use.
      constraints:
        valid_range: 10, 12 or 14
    - name: block
      type: '&mut [u8; 16]'
      constraints:
        size: 16
      direction: inout
      description: Plaintext block on entry, ciphertext block on success; untouched on failure.
    returns:
      type: bool
      description: True if the accelerated path ran; false if the schedule shape is invalid, AES-NI is unavailable, or the target is not x86_64, in which case the caller must run its portable path.
    preconditions:
    - description: rk.len() must equal 16 * (nr + 1) and nr must be 10, 12 or 14; a violation returns false rather than computing.
    postconditions:
    - description: On false, block is byte-identical to its value on entry.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: false

  - name: decrypt_block
    module: oxicrypt-aes-accel
    description: Decrypt one 16-byte block under a pre-expanded FIPS 197 round-key schedule via AES-NI, deriving the equivalent inverse-cipher round keys per call, or decline and leave the block untouched.
    signature: 'pub fn decrypt_block(rk: &[u8], nr: usize, block: &mut [u8; 16]) -> bool'
    parameters:
    - name: rk
      type: '&[u8]'
      direction: in
      description: Pre-expanded FIPS 197 forward round-key schedule, round 0 first.
      constraints:
        valid_range: exactly 16 * (nr + 1) bytes
    - name: nr
      type: usize
      direction: in
      description: Round count for the key size in use.
      constraints:
        valid_range: 10, 12 or 14
    - name: block
      type: '&mut [u8; 16]'
      constraints:
        size: 16
      direction: inout
      description: Ciphertext block on entry, plaintext block on success; untouched on failure.
    returns:
      type: bool
      description: True if the accelerated path ran; false if the schedule shape is invalid, AES-NI is unavailable, or the target is not x86_64, in which case the caller must run its portable path.
    preconditions:
    - description: rk.len() must equal 16 * (nr + 1) and nr must be 10, 12 or 14; a violation returns false rather than computing.
    postconditions:
    - description: On false, block is byte-identical to its value on entry.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: false

  - name: find_slot_offset
    module: oxicrypt-integrity
    description: Scan a module-binary buffer for the single embedded integrity slot and return the byte offset of its header.
    signature: 'pub fn find_slot_offset(bytes: &[u8]) -> Result<usize, IntegrityError>'
    parameters:
    - name: bytes
      type: '&[u8]'
      direction: in
      description: Full contents of a module binary.
    returns:
      type: Result<usize, IntegrityError>
      description: Offset of the slot header, accepted only when SLOT_HEADER_MAGIC sits at that offset and SLOT_FOOTER_MAGIC sits 48 bytes later.
      error_variants:
      - name: SlotNotFound
        condition: bytes.len() < 64, or no offset satisfies both the header and footer match.
      - name: MultipleSlotsFound
        condition: Two or more offsets satisfy both the header and footer match.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: encode_hmac_hex
    module: oxicrypt-integrity
    description: Format a 32-byte MAC as 64 lowercase ASCII hex characters.
    signature: 'pub fn encode_hmac_hex(mac: &[u8; 32]) -> [u8; 64]'
    parameters:
    - name: mac
      type: '&[u8; 32]'
      constraints:
        size: 32
      direction: in
      description: MAC bytes to encode.
    returns:
      type: '[u8; 64]'
      description: Lowercase hex encoding, high nibble first per input byte.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: constant_time_eq
    module: oxicrypt-integrity
    description: Compare two 32-byte MACs by OR-accumulating the XOR of every byte pair, without short-circuiting.
    signature: 'pub fn constant_time_eq(a: &[u8; 32], b: &[u8; 32]) -> bool'
    parameters:
    - name: a
      type: '&[u8; 32]'
      constraints:
        size: 32
      direction: in
      description: First MAC.
    - name: b
      type: '&[u8; 32]'
      constraints:
        size: 32
      direction: in
      description: Second MAC.
    returns:
      type: bool
      description: True if all 32 byte pairs are equal.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: false

  - name: sign_exe
    module: oxicrypt-integrity
    description: Compute HMAC-SHA-256 over the executable at exe_path with the slot MAC field zeroed, splice the result into the slot, and write the buffer back over the file.
    signature: 'pub fn sign_exe(exe_path: &Path) -> Result<[u8; 32], IntegrityError>'
    parameters:
    - name: exe_path
      type: '&Path'
      direction: in
      description: Path to the module binary to sign in place.
    returns:
      type: Result<[u8; 32], IntegrityError>
      description: The MAC that was written into the slot.
      error_variants:
      - name: ExeReadFailed
        condition: fs::read of exe_path failed.
      - name: SlotNotFound
        condition: No valid slot in the file, or the file is shorter than 64 bytes.
      - name: MultipleSlotsFound
        condition: More than one valid slot in the file.
      - name: ExeWriteFailed
        condition: fs::write of the spliced buffer back to exe_path failed.
    preconditions:
    - description: exe_path must not currently back a running process image; Linux rejects the write-back with ETXTBSY.
    side_effects:
    - description: Overwrites the file at exe_path with the spliced buffer.
    thread_safety: not-thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: verify_exe
    module: oxicrypt-integrity
    description: Recompute HMAC-SHA-256 over the executable at exe_path with the slot MAC field zeroed and compare it in constant time against the MAC stored in the slot.
    signature: 'pub fn verify_exe(exe_path: &Path) -> Result<(), IntegrityError>'
    parameters:
    - name: exe_path
      type: '&Path'
      direction: in
      description: Path to the module binary to verify.
    returns:
      type: Result<(), IntegrityError>
      description: Ok when the recomputed MAC equals the stored MAC.
      error_variants:
      - name: ExeReadFailed
        condition: fs::read of exe_path failed.
      - name: SlotNotFound
        condition: No valid slot in the file, or the file is shorter than 64 bytes.
      - name: MultipleSlotsFound
        condition: More than one valid slot in the file.
      - name: MacMismatch
        condition: The recomputed MAC differs from the MAC stored in the slot.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: lama_manifest
    module: oxicrypt-ffi
    description: Return the LAMA API manifest as a NUL-terminated UTF-8 string with static lifetime, for shared-library discovery.
    signature: pub extern "C" fn lama_manifest() -> *const core::ffi::c_char
    returns:
      type: '*const c_char'
      description: Pointer to a static NUL-terminated UTF-8 YAML document; valid for the lifetime of the loaded library and never freed by the caller.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false
      fips_gate: "none \u2014 callable outside the module state machine"



# ─────────────────────────────────────────────────────────────────────
# Error types (consolidated)
# ─────────────────────────────────────────────────────────────────────

# Function-level error_variants carry a name and the exact condition that
# triggers it, and deliberately do NOT repeat user_action. The recovery advice
# for a variant does not vary by call site, so restating it on each of the 968
# occurrences below would be 968 places for it to drift.
#
# The rule a consumer relies on: every name appearing in a function's
# returns.error_variants also appears as a variant of an entry in this section,
# and that entry carries recoverable and user_action. Resolution is by name.
# This holds for all 968 occurrences as written, and it is the reason the four
# error types below were added rather than left implicit — 23 occurrences
# across IntegrityError, EntropyError, TimerError and CollectionError resolved
# to nothing until they were.
#
# Names are unique across error types here, so resolution needs no
# qualification by the function's return type.
error_types:
  - name: Error
    module: oxicrypt-module
    variants:
      - name: NotOperational
        description: Module is not in Operational state.
        recoverable: false
        user_action: Call initialize_with_tests() first.
      - name: SelfTestFailed
        description: A power-up KAT returned incorrect output.
        recoverable: false
        user_action: >-
          Module is in terminal Error state. The binary may be
          corrupted or the algorithm implementation has a bug.
          Restart the process.
      - name: ConditionalTestFailed
        description: A pairwise consistency test failed during key construction.
        recoverable: true
        user_action: Retry key generation with fresh entropy.
      - name: AlreadyInitialized
        description: initialize_with_tests called more than once.
        recoverable: false
        user_action: Only call initialize_with_tests once per process.
      - name: InvalidInput
        description: Caller provided invalid parameters.
        recoverable: true
        user_action: Check parameter constraints and retry.

  - name: ModeError
    module: oxicrypt-aes
    variants:
      - name: NotBlockAligned
        description: Input not a multiple of 16 bytes (ECB/CBC).
        recoverable: true
        user_action: Pad input to block boundary.
      - name: TagMismatch
        description: GCM/CCM decryption authentication failed.
        recoverable: false
        user_action: >-
          The ciphertext or AAD was tampered with, or the wrong key/IV
          was used. Do NOT use the plaintext output.
      - name: LengthMismatch
        description: Output buffer wrong size.
        recoverable: true
        user_action: Resize output buffer to match input length.

  - name: DrbgError
    module: oxicrypt-drbg
    variants:
      - name: Uninstantiated
        description: Called generate/reseed before instantiate.
        recoverable: true
        user_action: Call instantiate_df or instantiate_no_df first.
      - name: ReseedRequired
        description: Reseed counter exceeded 2^48 (SP 800-90A limit).
        recoverable: true
        user_action: Call reseed_df with fresh entropy.
      - name: RequestTooLong
        description: Requested more than 65536 bytes in one call.
        recoverable: true
        user_action: Split into multiple generate calls.

  - name: KdfError
    module: oxicrypt-kdf
    variants:
      - name: Module
        description: Module state error (wraps oxicrypt_module::Error).
        recoverable: false
        user_action: >-
          Check that initialize_with_tests() has been called (NotOperational)
          or that the active algorithm profile permits the KDF service
          (AlgorithmRestricted).
      - name: OutputTooLong
        description: Requested output exceeds the algorithm maximum.
        recoverable: true
        user_action: >-
          For HKDF: reduce okm.len() to at most 255 * HashLen (e.g. 8160 for SHA-256).
          For PBKDF2: reduce to at most (2^32-1) * HashLen.
          For SP 800-108: reduce to fit a 32-bit bit-length field.

# ─────────────────────────────────────────────────────────────────────
# Constants
# ─────────────────────────────────────────────────────────────────────

  - name: OxiResult
    module: oxicrypt-ffi
    description: "C ABI status code returned by every oxi_* function, with Ok as 0 and every non-zero value a distinct failure mode whose discriminant is fixed by #[repr(C)] and banded by source crate."
    variants:
      - name: Ok
        value: 0
        description: The call succeeded.
        recoverable: true
        user_action: None; the operation completed and any output buffer is valid.
      - name: NotOperational
        value: 1
        description: A service was called while the module was not in the Operational state.
        recoverable: true
        user_action: Call oxi_init() and check it returns Ok before calling any other oxi_* function.
      - name: SelfTestFailed
        value: 2
        description: A power-up known-answer test returned incorrect output during oxi_init().
        recoverable: false
        user_action: >-
          The module is in the terminal Error state and no service will run.
          The binary may be corrupted or its integrity slot unsigned; verify it
          with fips-integrity-sign --verify and reinstall from a published
          release artifact.
      - name: ConditionalTestFailed
        value: 3
        description: A conditional self-test (DRBG continuous RNG test, or a pairwise consistency test during key generation) failed.
        recoverable: true
        user_action: Retry the operation with fresh entropy; if it repeats, treat the entropy source as failed and stop using the module.
      - name: AlreadyInitialized
        value: 4
        description: oxi_init() was called more than once in this process.
        recoverable: true
        user_action: Remove the duplicate call; the first init's outcome is authoritative and no state changed.
      - name: InvalidInput
        value: 5
        description: An input was not a valid domain element, such as an out-of-range scalar or a point not on the curve.
        recoverable: true
        user_action: Check the encoding and length of each input against the function's parameter constraints; this is raised before any cryptographic comparison.
      - name: AlgorithmRestricted
        value: 6
        description: The requested service is blocked by the algorithm profile active in this process.
        recoverable: false
        user_action: Restart the process and select a profile that permits the service; the active profile cannot be changed in place.
      - name: NotImplemented
        value: 7
        description: The service exists in the Service enum but its implementation is a stub in this build.
        recoverable: false
        user_action: Use a different service; no version of this build provides it.
      - name: Uninstantiated
        value: 8
        description: generate or reseed was called on a DRBG handle before instantiate had succeeded on it.
        recoverable: true
        user_action: Call the matching instantiate function on this handle and check it returns Ok, then retry.
      - name: ReseedRequired
        value: 9
        description: The handle's reseed_counter reached the SP 800-90A Table 3 reseed-interval bound.
        recoverable: true
        user_action: Call reseed with fresh entropy on this handle; generate will not return further output until it succeeds.
      - name: NullPointer
        value: 10
        description: A NULL pointer was passed where the function requires a valid one.
        recoverable: true
        user_action: Pass a valid pointer for every parameter the signature does not document as optional.
      - name: BufferTooSmall
        value: 11
        description: A caller-allocated output buffer is smaller than the documented minimum for the operation.
        recoverable: true
        user_action: Allocate at least the size named in the function's parameter constraints and retry; nothing was written.
      - name: OutputTooLong
        value: 12
        description: "The requested output length exceeds its family's bound: HKDF-Expand above 255*HashLen bytes (RFC 5869 section 2.3), or HMAC_DRBG generate above 2^19 bits per request (SP 800-90A Table 3)."
        recoverable: true
        user_action: Request fewer bytes in one call, and issue multiple calls if more output is needed.
      - name: NotBlockAligned
        value: 20
        description: An input length is not a multiple of the cipher block size where the mode requires alignment.
        recoverable: true
        user_action: Pad the input to a multiple of 16 bytes, or use a mode that does not require block alignment.
      - name: InvalidIvLength
        value: 21
        description: The IV length does not match the mode's specification.
        recoverable: true
        user_action: Supply an IV of exactly the length the mode requires; AES-GCM requires 12 bytes.
      - name: TagMismatch
        value: 22
        description: "A cryptographic verification ran cleanly and disagreed with the claimed value, covering AEAD tag and signature verification alike, and distinct from InvalidInput which is raised before any comparison happens."
        recoverable: false
        user_action: >-
          Treat the message as inauthentic and discard it. Any AEAD plaintext
          output buffer holds UNDEFINED contents and must not be read.
      - name: LengthMismatch
        value: 23
        description: An input and output buffer length pair disagree where the mode requires them to be equal.
        recoverable: true
        user_action: Size the output buffer to match the input length exactly.
      - name: InvalidNonceLength
        value: 24
        description: The nonce length does not match the mode's specification.
        recoverable: true
        user_action: Supply a nonce of exactly the length the mode requires.
      - name: InvalidTagLength
        value: 25
        description: The tag length does not match the mode's specification.
        recoverable: true
        user_action: Request a tag length the mode permits.
      - name: InvalidPayloadLength
        value: 26
        description: The payload length exceeds the mode's allowed maximum.
        recoverable: true
        user_action: Split the payload across multiple operations, each within the mode's maximum.
      - name: InvalidAadLength
        value: 27
        description: The additional-authenticated-data length exceeds the mode's allowed maximum.
        recoverable: true
        user_action: Reduce the AAD to within the mode's maximum.
      - name: Internal
        value: 255
        description: A should-never-happen case reached the catch-all arm.
        recoverable: false
        user_action: Report this with the calling sequence; reaching Internal indicates a defect in the module, not in the call.

  - name: IntegrityError
    module: oxicrypt-integrity
    description: Failure of the IG 10.3.A software integrity check or of the signing step that installs its tag.
    variants:
      - name: CurrentExeUnresolved
        description: The path of the running executable could not be resolved.
        recoverable: false
        user_action: The integrity check cannot run on this platform or under this launcher; treat the module as unverified rather than proceeding.
      - name: ExeReadFailed
        description: The executable could not be read.
        recoverable: false
        user_action: Check that the binary is present and readable by this process, then re-run the check.
      - name: ExeWriteFailed
        description: The signed buffer could not be written back to the executable path.
        recoverable: true
        user_action: Check write permission and free space on the target path, then re-run the signing step.
      - name: SlotNotFound
        description: No header-MAC-footer slot was found in the binary.
        recoverable: false
        user_action: The binary was not linked against this crate, or the slot was stripped after linking; rebuild and re-sign rather than shipping it.
      - name: MultipleSlotsFound
        description: More than one valid slot was found, which a benign binary never contains.
        recoverable: false
        user_action: Treat the binary as tampered with; discard it and rebuild from source.
      - name: MacMismatch
        description: The HMAC computed over the slot-zeroed buffer did not match the MAC stored in the slot.
        recoverable: false
        user_action: The binary does not match what was signed; do not run it as a validated module, and re-sign only a build you trust.
      - name: InputTooLong
        description: The input exceeded the length the integrity routine accepts.
        recoverable: false
        user_action: Report this; a module binary of this size is outside the range the check was built for.
  - name: EntropyError
    module: oxicrypt-entropy
    description: Refusal from the SP 800-90B entropy pipeline, at construction or while producing a sample.
    variants:
      - name: ClaimExceedsCeiling
        description: The claimed min-entropy per sample exceeds the source ceiling.
        recoverable: false
        user_action: Lower the claim to at most the ceiling; the pipeline refuses rather than clamping, so the claim must be corrected by the caller.
      - name: ClaimExceedsSampleWidth
        description: The claimed min-entropy per sample exceeds the declared sample width, or the alpha has no APT table coverage.
        recoverable: false
        user_action: Lower the claim to at most the sample width, or choose an alpha the APT tables cover.
      - name: Source
        description: The underlying noise source failed to produce a sample.
        recoverable: true
        user_action: Retry; if the failure persists the source is unavailable and no entropy should be drawn from it.
      - name: Health
        description: A continuous health test failed.
        recoverable: false
        user_action: Discard the pipeline. The failure permanently poisons it, and the sample that failed is never released.
      - name: NotReady
        description: Startup has not completed, or the pipeline has been poisoned, or startup has already run.
        recoverable: false
        user_action: Run the startup tests once before sampling, and construct a fresh pipeline after any poisoning.
      - name: ConditionerKat
        description: The conditioning component's known-answer test failed.
        recoverable: false
        user_action: Treat as a self-test failure of the module rather than a caller error.
      - name: Io
        description: An I/O operation in the pipeline failed.
        recoverable: true
        user_action: Check the underlying device or file, then retry.
  - name: TimerError
    module: oxicrypt-entropy
    description: Failure reading or interpreting the high-resolution counter the jitter source samples.
    variants:
      - name: Unsupported
        description: The target architecture has no counter this crate can read.
        recoverable: false
        user_action: Use a different noise source on this platform.
      - name: Unavailable
        description: The counter exists but could not be read.
        recoverable: true
        user_action: Retry; a persistent failure means the counter cannot be used as a noise source here.
      - name: Backwards
        description: The masked delta has the width top bit set, indicating the counter moved backwards.
        recoverable: true
        user_action: Discard the sample and continue; this is a per-sample condition, not a pipeline failure.
      - name: Inadequate
        description: The counter's measured resolution is too coarse to carry the claimed entropy.
        recoverable: false
        user_action: Lower the claim, or use a source with finer resolution.
  - name: CollectionError
    module: oxicrypt-entropy
    description: Sole error of the off-boundary collection binary, carrying an operator-facing message rather than a discriminated cause.
    variants:
      - name: CollectionError
        description: A newtype over a String, so the cause is a human-readable message and callers cannot branch on it.
        recoverable: true
        user_action: Read the message. This is an operator tool outside the module boundary, so the text is the interface; nothing in the type identifies the cause programmatically.

