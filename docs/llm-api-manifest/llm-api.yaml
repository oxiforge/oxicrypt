    signature: 'pub fn ghash_mul(x: &[u8; 16], y: &[u8; 16], out: &mut [u8; 16]) -> bool'
    parameters:
    - name: x
      type: '&[u8; 16]'
      constraints:
        size: 16
      direction: in
      description: First GCM field element in GCM bit order, bit 7 of byte 0 being the highest coefficient.
    - name: y
      type: '&[u8; 16]'
      constraints:
        size: 16
      direction: in
      description: Second GCM field element in the same bit order.
    - name: out
      type: '&mut [u8; 16]'
      constraints:
        size: 16
      direction: out
      description: Product in GCM bit order on success; untouched on failure.
