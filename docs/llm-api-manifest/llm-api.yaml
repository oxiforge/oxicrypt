      - { name: seed_material, type: "const uint8_t *", direction: in, description: "Caller-supplied seed (= entropy || personalization)" }
      - { name: seed_material_len, type: "size_t", direction: in, description: "Must be exactly 32 bytes (SEED_LEN)" }
    returns:
