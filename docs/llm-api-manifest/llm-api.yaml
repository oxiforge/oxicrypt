  # ── RSA DRBG-driven C ABI handle surface (FIPS 186-5 / RFC 8017 §8) ──
  # 3 opaque PCT-at-construction private-key handles plus 24 entry points: keygen, PKCS#1 v1.5 sign, PSS sign, OAEP encrypt/decrypt, and modulus/exponent accessors.

  - name: MIN_DISTINCT_DELTAS_FLOOR
    module: oxicrypt-entropy
    type: u32
    value: "2"
    description: "Hard floor on AdequacyConfig.min_distinct_deltas applied by AdequacyReport::ensure_varied; no operator configuration may accept fewer."

  - name: MASTER_SECRET_LEN
    module: oxicrypt-tls-kdf
    type: usize
    value: '48'
    description: TLS 1.2 master-secret length in bytes per RFC 5246 §8.1.

  - name: THREAD_ID_CHECK
    module: oxicrypt-module
    type: '&str'
    value: '"initialising thread id: none the module can record"'
    description: The test name in Error::SelfTestFailed when the platform gives the initialising thread no id the module can record.

  - name: INTEGRITY_TEST_NAME
    module: oxicrypt-integrity
    type: '&str'
    value: '"Module image integrity (ML-DSA-87 signature over the typed extent)"'
    description: The integrity test's name in KATS, present in an artifact's read-only data exactly when the boot sequence's integrity test is linked; the signer reads it to decide which module statics the artifact must name.

  - name: ML_DSA_CAST_NAME
    module: oxicrypt-integrity
    type: '&str'
    value: '"ML-DSA-87 CAST (signature verification, FIPS 204, integrity technique)"'
    description: The integrity technique's CAST name, used by every inventory and the Security Policy; distinct from the name oxicrypt_ml_dsa::KATS gives the same vector.

  - name: SHA256_CAST_NAME
    module: oxicrypt-integrity
    type: '&str'
    value: '"SHA-256 CAST (NIST CAVP SHA256ShortMsg Len=8, integrity key fingerprint)"'
    description: The integrity group's SHA-256 CAST name; distinct from the name oxicrypt_sha::KATS gives the same test.

  - name: SIGNATURE_CONTEXT
    module: oxicrypt-integrity
    type: '&[u8]'
    value: 'b"oxicrypt-integrity"'
    description: The FIPS 204 context string every integrity signature is made under, which separates integrity signatures from signatures the same key makes under any other context string.

  - name: MESSAGE_PREFIX
    module: oxicrypt-integrity
    type: '[u8; 20]'
    value: 0x00, 0x12, then the ASCII bytes oxicrypt-integrity
    description: FIPS 204's external framing of SIGNATURE_CONTEXT for pure ML-DSA (0x00 || len(ctx) || ctx); the signed message M′ is this prefix followed by the signature input, built by both the verifier and file_signature_input.

  - name: VERIFY_KEY_LEN
    module: oxicrypt-integrity
    type: usize
    value: '2592'
    description: Length of an encoded ML-DSA-87 public key (oxicrypt_ml_dsa::ml_dsa_87::PK_LEN), as the key record holds it.

  - name: KEY_RECORD_HEADER_MAGIC
    module: oxicrypt-integrity
    type: '[u8; 16]'
    value: 0xfa followed by the ASCII bytes OXICRYPT_VKEY_H
    description: Header magic of the embedded verifying-key record.

  - name: KEY_RECORD_FOOTER_MAGIC
    module: oxicrypt-integrity
    type: '[u8; 16]'
    value: 0xfb followed by the ASCII bytes OXICRYPT_VKEY_F
    description: Footer magic of the embedded verifying-key record.

  - name: KEY_RECORD_SIZE
    module: oxicrypt-integrity
    type: usize
    value: '2624'
    description: Size of a KeyRecord in bytes.

  - name: KEY_RECORD_KEY_OFFSET
    module: oxicrypt-integrity
    type: usize
    value: '16'
    description: Offset of the key within a KeyRecord.

  - name: FIPS_INTEGRITY_VERIFY_KEY
    module: oxicrypt-integrity
    type: KeyRecord
    value: "hdr = KEY_RECORD_HEADER_MAGIC, key = the build's OXICRYPT_INTEGRITY_VERIFY_KEY or 2,592 zero bytes, ftr = KEY_RECORD_FOOTER_MAGIC"
    description: "The #[used] static carrying the verifying key this module was built with, read through the byte-acquisition mechanism by address."

  - name: SLOT_HEADER_MAGIC
    module: oxicrypt-integrity
    type: '[u8; 16]'
    value: 0xfc followed by the ASCII bytes OXICRYPT_FIPS_H
    description: Header magic marking the start of the embedded integrity slot.

  - name: SLOT_FOOTER_MAGIC
    module: oxicrypt-integrity
    type: '[u8; 16]'
    value: 0xfd followed by the ASCII bytes OXICRYPT_FIPS_F
    description: Footer magic marking the end of the embedded integrity slot.

  - name: SLOT_SIZE
    module: oxicrypt-integrity
    type: usize
    value: '65536'
    description: Total size in bytes of the embedded integrity slot; 64 KiB, sized to hold the entry table and the string table.

  - name: SLOT_VERSION
    module: oxicrypt-integrity
    type: u32
    value: '4'
    description: Format version written by the signer and required by the verifier, currently 4; versions 1 to 3 are refused.

  - name: FIPS_INTEGRITY_SLOT
    module: oxicrypt-integrity
    type: IntegritySlot
    value: "hdr = SLOT_HEADER_MAGIC, body = SLOT_BODY_SIZE zero bytes, ftr = SLOT_FOOTER_MAGIC"
    description: "The #[used] 64 KiB static carrying the module's integrity slot, read through the byte-acquisition mechanism by address rather than dereferenced directly."

  - name: SLOT_BODY_SIZE
    module: oxicrypt-integrity
    type: usize
    value: 'SLOT_SIZE - 32'
    description: Size of the slot's body — everything between the header and footer magics.

  - name: OFF_HDR
    module: oxicrypt-integrity
    type: usize
    value: '0'
    description: Offset of the header magic within the slot.

  - name: OFF_VERSION
    module: oxicrypt-integrity
    type: usize
    value: '16'
    description: Offset of the format-version field within the slot.

  - name: OFF_FLAGS
    module: oxicrypt-integrity
    type: usize
    value: '20'
    description: Offset of the flags word within the slot.

  - name: OFF_COUNT
    module: oxicrypt-integrity
    type: usize
    value: '24'
    description: Offset of the entry-count field within the slot.

  - name: OFF_SLOT_RVA
    module: oxicrypt-integrity
    type: usize
    value: '28'
    description: Offset of the slot's own RVA field within the slot.

  - name: OFF_SIG
    module: oxicrypt-integrity
    type: usize
    value: '32'
    description: Offset of the ML-DSA-87 signature within the slot.

  - name: SIG_LEN
    module: oxicrypt-integrity
    type: usize
    value: '4627'
    description: Length of the signature field, an encoded ML-DSA-87 signature (oxicrypt_ml_dsa::ml_dsa_87::SIG_LEN).

  - name: OFF_KEY_ID
    module: oxicrypt-integrity
    type: usize
    value: '4659'
    description: Offset of the verifying key's fingerprint within the slot.

  - name: OFF_LINK_BASE
    module: oxicrypt-integrity
    type: usize
    value: '4691'
    description: Offset of the link base within the slot.

  - name: OFF_STRTAB_OFF
    module: oxicrypt-integrity
    type: usize
    value: '4699'
    description: Offset of the string table's offset field within the slot.

  - name: OFF_STRTAB_LEN
    module: oxicrypt-integrity
    type: usize
    value: '4703'
    description: Offset of the string table's length field within the slot.

  - name: OFF_SLOT_FILE_OFF
    module: oxicrypt-integrity
    type: usize
    value: '4707'
    description: Offset of the slot's own file offset within the slot.

  - name: OFF_FILE_LEN
    module: oxicrypt-integrity
    type: usize
    value: '4711'
    description: Offset of the signed file image's length within the slot.

  - name: OFF_TABLE
    module: oxicrypt-integrity
    type: usize
    value: '4715'
    description: Offset of the first entry within the slot.

  - name: OFF_FTR
    module: oxicrypt-integrity
    type: usize
    value: 'SLOT_SIZE - 16'
    description: Offset of the footer magic within the slot.

  - name: ENTRY_SIZE
    module: oxicrypt-integrity
    type: usize
    value: '16'
    description: Size of one stored entry — rva, file_off and len as little-endian u32s, then kind, a run byte (on a Plain entry, bit 7 marks its words Relative rather than Hole and bits 0–6 count further identical periods, 0 to 127) and a u16 meta.

  - name: BIND_RECORD_HEADER
    module: oxicrypt-integrity
    type: usize
    value: '16'
    description: Size of a BindRecord's fixed header in the string table, before its library and symbol names.

  - name: FLAG_LOADER_BIONIC
    module: oxicrypt-integrity
    type: u32
    value: '1'
    description: Slot flag recording that the artifact is loaded by bionic rather than glibc.

  - name: MAX_EXPANDED
    module: oxicrypt-integrity
    type: usize
    value: '65536'
    description: The most entries a stored table may expand to; parse refuses a slot that expands to more with TooManyEntries before reading it further.

  - name: MAX_ENTRIES
    module: oxicrypt-integrity
    type: usize
    value: '3800'
    description: Number of stored entries the table can hold when no string table is present, computed as (OFF_FTR - OFF_TABLE) / ENTRY_SIZE with the remainder left as padding; a stored Plain entry may stand for up to 128 periods of Plain bytes and their words.

  - name: "key::SEED_LEN"
    module: oxicrypt-integrity-sign
    type: usize
    value: '32'
    description: Length of an ML-DSA-87 key-generation seed, the whole of a signing key file.

  - name: SIGNING_KEY_FILE
    module: oxicrypt-integrity-sign
    type: '&str'
    value: '"integrity-signing.key"'
    description: File name keygen gives the private key.

  - name: VERIFY_KEY_FILE
    module: oxicrypt-integrity-sign
    type: '&str'
    value: '"integrity-verify.pub"'
    description: File name keygen gives the public key, the file OXICRYPT_INTEGRITY_VERIFY_KEY names.

  # ── Power-up self-test slices ─────────────────────────────────────

  - name: KATS
    module: oxicrypt-sha
    type: "&[KatEntry]"
    value: "11 entries"
    description: Power-up KAT slice for this crate, one known-answer test per hash (SHA-1, SHA-224, SHA-256, SHA-384, SHA-512, SHA-512/224, SHA-512/256, SHA3-224, SHA3-256, SHA3-384, SHA3-512), passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

  - name: KATS
    module: oxicrypt-xof
    type: "&[KatEntry]"
    value: "12 entries"
    description: Power-up KAT slice for this crate, one known-answer test each for SHAKE128, SHAKE256, cSHAKE128, cSHAKE256, KMAC128, KMAC256, KMACXOF128, KMACXOF256, TupleHash128, TupleHash256, ParallelHash128 and ParallelHash256, passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

  - name: KATS
    module: oxicrypt-hmac
    type: "&[KatEntry]"
    value: "11 entries"
    description: Power-up KAT slice for this crate, one HMAC known-answer test per approved hash (SHA-1, SHA-2 family, SHA-3 family), passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

  - name: KATS
    module: oxicrypt-kdf
    type: "&[KatEntry]"
    value: "45 entries"
    description: Power-up KAT slice for this crate, 11 HKDF tests and 33 SP 800-108 KBKDF tests (counter, feedback and double-pipeline mode, each over the 11 HMAC hashes) and one PBKDF2-HMAC-SHA2-224 CAST, passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

  - name: KATS
    module: oxicrypt-aes
    type: "&[KatEntry]"
    value: "23 entries"
    description: Power-up KAT slice for this crate, encrypt-and-decrypt known-answer tests for ECB, CBC, CTR, GCM and CCM at each key size plus six KW and two KWP tests, passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

  - name: KATS
    module: oxicrypt-cmac
    type: "&[KatEntry]"
    value: "6 entries"
    description: Power-up KAT slice for this crate, two AES-CMAC known-answer tests per key size covering the K1 and K2 subkey paths, passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

  - name: KATS
    module: oxicrypt-drbg
    type: "&[KatEntry]"
    value: "24 entries"
    description: Power-up KAT slice for this crate, 12 CTR_DRBG, Hash_DRBG and HMAC_DRBG known-answer tests without prediction resistance, nine with prediction resistance and three SP 800-90A health tests, passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

  - name: KATS
    module: oxicrypt-ecdsa
    type: "&[KatEntry]"
    value: "2 entries"
    description: Power-up KAT slice for this crate, a sign-and-verify test each for ECDSA P-256 and P-384, passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

  - name: KATS
    module: oxicrypt-eddsa
    type: "&[KatEntry]"
    value: "1 entry"
    description: Power-up KAT slice for this crate, one Ed25519 keygen, sign and verify test, passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

  - name: KATS
    module: oxicrypt-rsa
    type: "&[KatEntry]"
    value: "1 entry"
    description: Power-up KAT slice for this crate, one test covering PKCS#1 v1.5 and PSS sign and verify, tamper rejection and the pairwise consistency test, passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

  - name: KATS
    module: oxicrypt-ecdh
    type: "&[KatEntry]"
    value: "2 entries"
    description: Power-up KAT slice for this crate, a shared-secret test each for P-256 and P-384 in both directions with tamper rejection, passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

  - name: KATS
    module: oxicrypt-tls-kdf
    type: "&[KatEntry]"
    value: "2 entries"
    description: Power-up KAT slice for this crate, one TLS 1.2 PRF test and one TLS 1.3 key schedule test, passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

  - name: KATS
    module: oxicrypt-dh
    type: "&[KatEntry]"
    value: "1 entry"
    description: Power-up KAT slice for this crate, one 3072-bit finite-field DH test in both directions with tamper rejection, passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

  - name: KATS
    module: oxicrypt-ml-kem
    type: "&[KatEntry]"
    value: "4 entries"
    description: Power-up KAT slice for this crate, ML-KEM-1024 self-tests on NIST ACVP vectors for key generation (decapsulation key and encapsulation key), encapsulation, decapsulation and implicit rejection, passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

  - name: KATS
    module: oxicrypt-ml-dsa
    type: "&[KatEntry]"
    value: "5 entries"
    description: Power-up KAT slice for this crate, ML-DSA self-tests on NIST vectors for ML-DSA-87 key generation, signature generation and verification (accepting a valid signature and rejecting it with one bit flipped) plus two rejection-path signature-generation tests from the ACVP ML-DSA specification draft-celi-acvp-ml-dsa-01 (ML-DSA-87, ML-DSA-44), passed in the tests argument of oxicrypt_module::initialize_with_tests or initialize_with_profile.

  - name: KATS
    module: oxicrypt-slh-dsa
    type: "&[KatEntry]"
    value: "6 entries"
