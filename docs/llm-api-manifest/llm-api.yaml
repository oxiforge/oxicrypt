lama: "0.1"

# ─────────────────────────────────────────────────────────────────────
# oxicrypt — Library API Manifest for LLM Agents
#
# This file describes the oxicrypt public API in a structured format
# designed for consumption by AI coding agents. Every constraint that
# a human developer would infer from context is stated explicitly.
#
# Schema specification: https://github.com/lamaspec/lama/blob/main/SPEC.md
# ─────────────────────────────────────────────────────────────────────

library:
  name: oxicrypt
  version: "0.5.0"
  description: >-
    Pure-Rust FIPS 140-3 Level 1 cryptographic module implementing
    NIST-approved classical algorithms with a formal module boundary,
    power-up self-tests, and zero third-party dependencies.
  repository: https://github.com/oxiforge/oxicrypt
  homepage: https://oxicrypt.dev
  license: Apache-2.0 OR MIT
  languages:
    - rust
    - c           # oxicrypt-ffi provides extern "C" wrappers (cdylib + staticlib)
  minimum_toolchain: "rust 1.95"

  constraints:
    - description: >-
        The module must be initialized via initialize_with_tests()
        before any cryptographic function is called. Every public
        function gates on require_operational().
      enforcement: runtime
      severity: error

    - description: >-
        Zero third-party dependencies. All cryptographic code is
        written in-tree in pure Rust. No crate outside the workspace
        may be added without Security Policy justification.
      enforcement: convention
      severity: error

    - description: >-
        All algorithm crates are no_std. The module crate and integrity
        crate require std for file I/O and self-test orchestration.
      enforcement: compile-time
      severity: error

  security:
    certification: "FIPS 140-3 Level 1 (targeting, pre-validation)"
    threat_model: >-
      Software-only module. Protects confidentiality and integrity of
      data processed through approved services. Does not claim
      side-channel resistance at Level 1 but discloses and validates
      timing behavior via dudect methodology.
    side_channel_posture: validated
    zeroization: "volatile-on-drop (all CSP-holding types via oxicrypt-zeroize: SHA-1/SHA-2 streaming state, Keccak sponge, HMAC ipad/opad state, AES round-key schedules, DRBG state, private-key types)"

# ─────────────────────────────────────────────────────────────────────
# State machines
# ─────────────────────────────────────────────────────────────────────

state_machines:
  - name: ModuleLifecycle
    description: >-
      FIPS 140-3 module state machine. The module starts in PowerOff,
      transitions through SelfTest during initialization, and reaches
      Operational if all KATs pass. Error is a terminal state.
    initial_state: PowerOff
    terminal_states: [Error]
    states:
      - name: PowerOff
        description: Module not yet initialized. No services available.
      - name: SelfTest
        description: Running power-up known-answer tests. No services available.
      - name: Operational
        description: All KATs passed. Approved services are available.
      - name: Error
        description: >-
          A self-test failed or enter_error_state() was called.
          Terminal — the process must be restarted.
    transitions:
      - from: PowerOff
        to: SelfTest
        trigger: initialize_with_tests
        condition: Called exactly once per process lifetime.
      - from: SelfTest
        to: Operational
        trigger: initialize_with_tests
        condition: All KatEntry tests pass.
      - from: SelfTest
        to: Error
        trigger: initialize_with_tests
        condition: Any KatEntry test fails.
      - from: Operational
        to: Error
        trigger: enter_error_state
        condition: Called by any code path detecting a runtime failure.

# ─────────────────────────────────────────────────────────────────────
# Modules (Rust crates)
# ─────────────────────────────────────────────────────────────────────

modules:
  - name: oxicrypt-module
    description: >-
      Module state machine, approved-mode indicator, self-test runner.
      Provides initialize_with_tests(), require_operational(), and the
      Error type used by all algorithm crates.
    no_std: false
    depends_on: []

  - name: oxicrypt-sha
    description: >-
      SHA-1, SHA-2 (224/256/384/512/512-224/512-256), SHA-3
      (224/256/384/512) hash functions. Both one-shot and streaming APIs.
    no_std: true
    depends_on: [oxicrypt-module]

  - name: oxicrypt-xof
    description: >-
      SHAKE128, SHAKE256, cSHAKE-128/256, KMAC-128/256, TupleHash,
      ParallelHash and their XOF variants (SP 800-185).
    no_std: true
    depends_on: [oxicrypt-module, oxicrypt-sha]

  - name: oxicrypt-hmac
    description: >-
      HMAC over all 11 approved hashes. Generic Hmac<H, B, L> struct
      with type aliases for each variant.
    no_std: true
    depends_on: [oxicrypt-module, oxicrypt-sha]

  - name: oxicrypt-cmac
    description: AES-CMAC (SP 800-38B) over AES-128/192/256.
    no_std: true
    depends_on: [oxicrypt-module, oxicrypt-aes]

  - name: oxicrypt-aes
    description: >-
      AES block cipher (FIPS 197) and modes: ECB, CBC, CTR, GCM, CCM,
      KW, KWP. Generic over BlockCipher trait for key-size polymorphism.
    no_std: true
    depends_on: [oxicrypt-module]

  - name: oxicrypt-drbg
    description: >-
      CTR_DRBG (AES-128/192/256), Hash_DRBG (SHA-256/384/512),
      HMAC_DRBG (SHA-256/384/512). SP 800-90A Rev. 1.
    no_std: true
    depends_on: [oxicrypt-module, oxicrypt-aes, oxicrypt-sha, oxicrypt-hmac]

  - name: oxicrypt-kdf
    description: >-
      SP 800-108r1 KBKDF (counter/feedback/double-pipeline), HKDF
      (SP 800-56Cr2), PBKDF2 (SP 800-132).
    no_std: true
    depends_on: [oxicrypt-module, oxicrypt-hmac]

  - name: oxicrypt-rsa
    description: >-
      RSA-2048/3072/4096 PKCS#1 v1.5 and PSS sign/verify, OAEP
      encrypt/decrypt, keygen. CRT path with Bellcore verify-after-sign
      (IG D.G) at all three widths. RSA-3072/4096 key structs
      (RsaPrivateKey3072/RsaPrivateKey4096) with PCT, CRT, and full
      encoding support generated by the define_rsa_wide macro.
    no_std: true
    depends_on: [oxicrypt-module, oxicrypt-sha, oxicrypt-drbg]

  - name: oxicrypt-ecdsa
    description: >-
      ECDSA P-256 and P-384 sign/verify/keygen with DRBG-backed
      rejection sampling and pairwise consistency tests.
    no_std: true
    depends_on: [oxicrypt-module, oxicrypt-sha, oxicrypt-drbg]

  - name: oxicrypt-ecdh
    description: ECDH P-256 and P-384 CDH shared secret (SP 800-56Ar3).
    no_std: true
    depends_on: [oxicrypt-module, oxicrypt-ecdsa]

  - name: oxicrypt-dh
    description: >-
      Finite-field DH-3072 key agreement and keygen over RFC 3526 Group 15
      (SP 800-56Ar3). Reuses U3072/MontCtx3072 from oxicrypt-rsa.
    no_std: true
    depends_on: [oxicrypt-module, oxicrypt-rsa, oxicrypt-drbg]

  - name: oxicrypt-ml-kem
    description: >-
      ML-KEM-1024 (FIPS 203) post-quantum key encapsulation mechanism.
      Provides keygen, encapsulate, and decapsulate operations with
      implicit-rejection construction and DRBG-backed randomness.
    no_std: true
    depends_on: [oxicrypt-module, oxicrypt-sha, oxicrypt-drbg]

  - name: oxicrypt-ml-dsa
    description: >-
      ML-DSA-87 (FIPS 204) post-quantum digital signature algorithm.
      Provides keygen, sign, and verify operations with deterministic
      Fiat-Shamir-with-aborts signing and FIPS 204 compliance.
    no_std: true
    depends_on: [oxicrypt-module, oxicrypt-sha]

  - name: oxicrypt-lms
    description: >-
      LMS hash-based stateful signatures (SP 800-208 / RFC 8554).
      Parameter set LMS_SHA256_M32_H10 with LMOTS_SHA256_N32_W4.
      Stateful key management: each key can sign at most 1024 messages.
      Caller is responsible for persisting private-key state between
      sign calls to prevent one-time key reuse.
    no_std: true
    depends_on: [oxicrypt-module, oxicrypt-sha, oxicrypt-zeroize]

  - name: oxicrypt-xmss
    description: >-
      XMSS hash-based stateful signatures (SP 800-208 / RFC 8391).
      Parameter set XMSS-SHA2_10_256. Randomized hashing with WOTS+
      one-time signatures and L-tree compression. Stateful key
      management: each key can sign at most 1024 messages. Caller is
      responsible for persisting private-key state between sign calls
      to prevent one-time key reuse.
    no_std: true
    depends_on: [oxicrypt-module, oxicrypt-sha, oxicrypt-zeroize]

  - name: oxicrypt-slh-dsa
    description: >-
      SLH-DSA-SHA2-256s stateless hash-based digital signatures (FIPS 205).
      Parameter set SHA2-256s: n=32, h=64, d=8, a=14, k=22, w=16. Public
      key 64 bytes, secret key 128 bytes, signature 29792 bytes. Stateless
      — no per-signature state management required. Allowed in Unrestricted
      profile only. Signing is computationally expensive (many SHA-256
      evaluations) but security rests entirely on hash function properties.
    no_std: true
    depends_on: [oxicrypt-module, oxicrypt-sha]

  - name: oxicrypt-eddsa
    description: >-
      Ed25519 deterministic sign/verify/keygen (RFC 8032, FIPS 186-5).
    no_std: true
    depends_on: [oxicrypt-module, oxicrypt-sha, oxicrypt-drbg]

  - name: oxicrypt-integrity
    description: >-
      HMAC-SHA-256 software integrity check over the module binary.
      Embeds and verifies a 64-byte reserved tag slot.
    no_std: false
    depends_on: [oxicrypt-module, oxicrypt-hmac]

  - name: oxicrypt-zeroize
    description: >-
      Volatile-write zeroization for CSP buffers. The only crate in the
      workspace that uses unsafe code. Provides zeroize() for byte slices,
      zeroize_u32() for u32 word arrays (SHA-1/SHA-2 state), and
      zeroize_u64() for u64 limb arrays (SHA-2 64-bit, Keccak, RSA), all
      using core::ptr::write_volatile to prevent dead-store elimination.
    no_std: true
    depends_on: []

  - name: acvp-harness
    description: >-
      ACVP protocol harness and transport client. 78 registered handlers
      dispatch NIST ACVP vector sets offline (dispatch subcommand) and
      online against the ACVP demo server (demo-run subcommand). The
      demo-run transport uses TOTP-signed JWT login, curl-based HTTPS
      with mutual TLS, and exponential-backoff polling. Outside the
      cryptographic boundary.
    no_std: false
    entry_points:
      - "acvp-harness dispatch <prompt.json> <response.json>"
      - "acvp-harness dispatch-shs <algorithm> <prompt.rsp> <response.json>"
      - "acvp-harness demo-run --cert <cert> --key <key> --totp-secret <hex>"
    depends_on:
      - oxicrypt-module
      - oxicrypt-sha
      - oxicrypt-hmac
      - oxicrypt-aes
      - oxicrypt-drbg
      - all algorithm crates

  - name: oxicrypt-ffi
    description: >-
      C ABI wrappers (extern "C") for language bindings. Builds as cdylib
      and staticlib. Outside the cryptographic boundary — performs only
      pointer-to-slice translation and status-code mapping.
    no_std: false
    depends_on:
      - oxicrypt-module
      - oxicrypt-sha
      - oxicrypt-hmac
      - oxicrypt-aes
      - oxicrypt-drbg
      - oxicrypt-ecdsa
      - oxicrypt-eddsa
      - oxicrypt-ecdh

# ─────────────────────────────────────────────────────────────────────
# Variant families
#
# Declarative legend and style guide for `family:` tags carried on
# individual `types:` and `functions:` entries below. Per LAMA SPEC
# §"Variant families — the `family:` tag", this section is the
# canonical answer to "what are the family conventions in this
# manifest?" It is authoritative about family vocabulary and shape,
# not about membership — the `family:` tag on each entry is the
# single source of truth for which entries belong to a family.
# Structural queries (e.g. `grep -A N 'family: hmac-new'`) remain the
# sole membership mechanism.
# ─────────────────────────────────────────────────────────────────────

families:
  - name: sha-oneshot
    description: >-
      One-shot hash functions taking a message slice and returning a
      fixed-size digest array. One variant per backing hash.
    applies_to: functions

  - name: sha-streaming-hasher
    description: >-
      Incremental hasher types exposing new/update/finalize with
      zeroize-on-drop state. One variant per backing hash.
    applies_to: types

  - name: hmac-new
    description: >-
      HMAC keyed-hasher constructors taking a key slice and returning
      a zeroize-on-drop hasher. One variant per backing hash.
    applies_to: functions

  - name: hmac-type
    description: >-
      HMAC keyed-hasher types exposing new/update/finalize with
      zeroize-on-drop ipad/opad state. One variant per backing hash.
    applies_to: types

  - name: aes-mode-encrypt
    description: >-
      AES mode-of-operation encrypt entry points taking a key and
      plaintext and producing ciphertext. One variant per mode.
    applies_to: functions

  - name: aes-mode-decrypt
    description: >-
      AES mode-of-operation decrypt entry points taking a key and
      ciphertext and producing plaintext. One variant per mode.
    applies_to: functions

  - name: cmac-aes
    description: >-
      CMAC-AES one-shot tag functions taking a key and message and
      returning a 16-byte tag. One variant per AES key size.
    applies_to: functions

  - name: kdf-sp800108-mode
    description: >-
      SP 800-108 KDF modes (Counter, Feedback, Double-Pipeline) built
      over HMAC-SHA-256, exposing identical `derive` entry points.
    applies_to: functions

# ─────────────────────────────────────────────────────────────────────
# Types
# ─────────────────────────────────────────────────────────────────────

types:
  - name: State
    module: oxicrypt-module
    kind: enum
    description: Module lifecycle state.
    variants:
      - name: PowerOff
        description: Not initialized.
      - name: SelfTest
        description: Running KATs.
      - name: Operational
        description: Ready for approved services.
      - name: Error
        description: Terminal failure.

  - name: Error
    module: oxicrypt-module
    kind: enum
    description: Error type returned by all approved-service functions.
    variants:
      - name: NotOperational
        description: Module is not in Operational state.
      - name: SelfTestFailed
        description: A power-up KAT failed.
      - name: ConditionalTestFailed
        description: A conditional self-test (e.g., PCT) failed.
      - name: AlreadyInitialized
        description: initialize_with_tests() called more than once.
      - name: InvalidInput
        description: Caller supplied invalid parameters.
      - name: AlgorithmRestricted
        description: Service is not permitted under the active algorithm profile.
      - name: NotImplemented
        description: Algorithm exists in Service enum but implementation is not yet available (stub).

  - name: AlgorithmProfile
    module: oxicrypt-module
    kind: enum
    description: >
      Runtime algorithm restriction profile. Set once at initialization
      via initialize_with_profile(). Unrestricted is the default.
    variants:
      - name: Unrestricted
        description: All FIPS-approved algorithms available.
      - name: Cnsa2
        description: "CNSA 2.0: quantum-resistant algorithms only."
      - name: Cnsa1
        description: "CNSA 1.0: classical transition period algorithms."

  - name: Service
    module: oxicrypt-module
    kind: enum
    description: >
      Per-algorithm-and-parameter enumeration of every approved service.
      Approximately 90 variants. Used with require_allowed() to enforce
      profile restrictions. See the crate source for the full list.

  - name: KatEntry
    module: oxicrypt-module
    kind: struct
    description: A single known-answer test entry for power-up self-tests.
    fields:
      - name: name
        type: "&'static str"
        description: Human-readable test name.
      - name: run
        type: "fn() -> Result<(), SelfTestFailure>"
        description: Function that executes the KAT and returns Ok or Err.

  - name: OxiResult
    module: oxicrypt-ffi
    kind: enum
    description: >
      C ABI status code returned by every oxi_* function. Discriminants
      are banded by source crate so the originating failure mode is
      identifiable at a glance: 0 = success, 1-7 = oxicrypt_module::Error
      variants, 10-11 = FFI-layer errors (null pointer, buffer too small),
      20-27 = oxicrypt_aes::ModeError variants, 255 = Internal (catch-all,
      reserved for should-never-happen). #[repr(C)] so the C-side
      discriminants are stable across cbindgen regenerations.
      From<oxicrypt_module::Error> and From<oxicrypt_aes::ModeError>
      impls give exhaustive distinct-discriminant mapping — adding a new
      Error variant without an OxiResult mapping is a compile error,
      structurally preventing aliasing-by-default.
    variants:
      - name: Ok
        description: Operation succeeded. Discriminant 0.
      - name: NotOperational
        description: Module not in Operational state. Discriminant 1.
      - name: SelfTestFailed
        description: Power-up self-test failed during init. Discriminant 2.
      - name: ConditionalTestFailed
        description: Conditional self-test (DRBG CRNGT, PCT) failed during operation. Discriminant 3.
      - name: AlreadyInitialized
        description: oxi_init called more than once. Discriminant 4.
      - name: InvalidInput
        description: Cryptographic input is not a valid domain element. Discriminant 5.
      - name: AlgorithmRestricted
        description: Service blocked by the active algorithm profile. Discriminant 6.
      - name: NotImplemented
        description: Service is in the Service enum but implementation is a stub. Discriminant 7.
      - name: NullPointer
        description: Caller passed a NULL pointer where one is required. Discriminant 10.
      - name: BufferTooSmall
        description: Caller-allocated output buffer is smaller than the documented minimum. Discriminant 11.
      - name: NotBlockAligned
        description: Input length is not aligned to the cipher block size. Discriminant 20.
      - name: InvalidIvLength
        description: IV length doesn't match mode specification (e.g. GCM requires 12 bytes). Discriminant 21.
      - name: TagMismatch
        description: AEAD tag verification failed. Plaintext output is UNDEFINED. Discriminant 22.
      - name: LengthMismatch
        description: Input/output buffer lengths don't match. Discriminant 23.
      - name: InvalidNonceLength
        description: Nonce length doesn't match mode specification. Discriminant 24.
      - name: InvalidTagLength
        description: Tag length doesn't match mode specification. Discriminant 25.
      - name: InvalidPayloadLength
        description: Payload length exceeds the mode's allowed maximum. Discriminant 26.
      - name: InvalidAadLength
        description: AAD length exceeds the mode's allowed maximum. Discriminant 27.
      - name: Internal
        description: >-
          Catch-all for should-never-happen cases. New error sources should
          be paired with new OxiResult variants in the same change set —
          reaching Internal is a flag for reviewer attention. Discriminant 255.

  - name: Sha256
    module: oxicrypt-sha
    family: sha-streaming-hasher
    kind: struct
    description: Streaming SHA-256 hasher. Absorbs data via update(), produces digest via finalize().
    size_bytes: null  # Internal state, not fixed public size
    implements: []
    security:
      contains_secret: false
      zeroize_on_drop: true
      constant_time: true

  - name: HmacSha256
    module: oxicrypt-hmac
    family: hmac-type
    kind: alias
    description: "Type alias for Hmac<Sha256, 64, 32>. HMAC-SHA-256."
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: true

  - name: Aes128Key
    module: oxicrypt-aes
    kind: struct
    description: AES-128 expanded key schedule.
    size_bytes: null  # Expanded schedule, not just the 16-byte key
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: false  # Table-based S-box; disclosed in security policy

  - name: Aes192Key
    module: oxicrypt-aes
    kind: struct
    description: AES-192 expanded key schedule.
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: false

  - name: Aes256Key
    module: oxicrypt-aes
    kind: struct
    description: AES-256 expanded key schedule.
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: false

  - name: ModeError
    module: oxicrypt-aes
    kind: enum
    description: Error type for AES mode operations.
    variants:
      - name: NotBlockAligned
        description: Input length is not a multiple of 16 bytes.
      - name: InvalidIvLength
        description: IV/nonce is wrong size for the mode.
      - name: TagMismatch
        description: GCM/CCM authentication tag verification failed.
      - name: LengthMismatch
        description: Output buffer is wrong size.
      - name: InvalidNonceLength
        description: CCM nonce outside valid range.
      - name: InvalidTagLength
        description: CCM tag length outside valid range.
      - name: InvalidPayloadLength
        description: Payload exceeds mode's maximum.
      - name: InvalidAadLength
        description: AAD exceeds mode's maximum.

  - name: CtrDrbgAes256
    module: oxicrypt-drbg
    kind: struct
    description: CTR_DRBG instantiated with AES-256. Must be instantiated before generating.
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: true

  - name: DrbgError
    module: oxicrypt-drbg
    kind: enum
    description: Error type for DRBG operations.
    variants:
      - name: Uninstantiated
        description: generate or reseed called before instantiate.
      - name: ReseedRequired
        description: Reseed counter exceeded SP 800-90A limit.
      - name: InputTooLong
        description: Entropy or additional input exceeds maximum.
      - name: InvalidSeedLength
        description: Seed material wrong length for no-df instantiate.
      - name: RequestTooLong
        description: Requested output exceeds single-call maximum.

  - name: RsaPrivateKey2048
    module: oxicrypt-rsa
    kind: struct
    description: >-
      RSA-2048 private key. Holds (n, e, d) and optionally CRT
      components. Runs a pairwise consistency test on construction.
    size_bytes: null
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: true

  - name: EcdsaP256PrivateKey
    module: oxicrypt-ecdsa
    kind: struct
    description: >-
      ECDSA P-256 private key handle. Stores (d, Q) pair. Runs a
      sign-and-verify PCT on construction.
    fields:
      - name: d
        type: "[u8; 32]"
        description: Private scalar.
        constraints: "1 <= d < n (P-256 group order)"
      - name: q
        type: "[u8; 65]"
        description: "Uncompressed SEC1 public key: 0x04 || X || Y."
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: true

  - name: Ed25519PrivateKey
    module: oxicrypt-eddsa
    kind: struct
    description: >-
      Ed25519 private key handle. Stores (seed, A) pair. Runs a
      sign-and-verify PCT on construction.
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: true

  - name: LmsPrivateKey
    module: oxicrypt-lms
    kind: struct
    description: >-
      LMS stateful private key (LMS_SHA256_M32_H10 / LMOTS_SHA256_N32_W4).
      Holds the tree seed, identifier I, and current leaf index.
      STATEFUL: the leaf index advances after each signature. The caller
      MUST persist the key state after every sign call. Reusing a leaf
      index destroys the security of the entire tree.
    fields:
      - name: seed
        type: "[u8; 32]"
        description: "Tree seed (secret). All OTS private keys derive from this."
      - name: identifier
        type: "[u8; 16]"
        description: "Tree identifier I (public, binds hash computations to this tree)."
      - name: leaf_index
        type: u32
        description: "Next unused leaf index (0..1023). Incremented after each sign."
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: true

  - name: XmssPrivateKey
    module: oxicrypt-xmss
    kind: struct
    description: >-
      XMSS stateful private key (XMSS-SHA2_10_256). Holds SK_SEED,
      SK_PRF, PUB_SEED, cached root, and current leaf index. STATEFUL:
      leaf index advances after each signature. Caller MUST persist
      after every sign call.
    fields:
      - name: sk_seed
        type: "[u8; 32]"
        description: "Secret seed for WOTS+ key derivation."
      - name: sk_prf
        type: "[u8; 32]"
        description: "PRF secret for message randomisation."
      - name: pub_seed
        type: "[u8; 32]"
        description: "Public seed for randomized hashing (RAND_HASH)."
      - name: root
        type: "[u8; 32]"
        description: "Cached Merkle tree root (part of the public key)."
      - name: leaf_index
        type: u32
        description: "Next unused leaf index (0..1023). Incremented after each sign."
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: true

  - name: Sha1
    module: oxicrypt-sha
    family: sha-streaming-hasher
    kind: struct
    description: Streaming SHA-1 hasher. Same new/update/finalize pattern as Sha256; digest is [u8; 20].
    security:
      contains_secret: false
      zeroize_on_drop: true
      constant_time: true

  - name: Sha224
    module: oxicrypt-sha
    family: sha-streaming-hasher
    kind: struct
    description: Streaming SHA-224 hasher. Same new/update/finalize pattern as Sha256; digest is [u8; 28].
    security:
      contains_secret: false
      zeroize_on_drop: true
      constant_time: true

  - name: Sha384
    module: oxicrypt-sha
    family: sha-streaming-hasher
    kind: struct
    description: Streaming SHA-384 hasher. Same new/update/finalize pattern as Sha256; digest is [u8; 48].
    security:
      contains_secret: false
