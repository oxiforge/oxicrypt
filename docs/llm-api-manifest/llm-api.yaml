  # ── SHAKE / cSHAKE (FIPS 202 §6.2, SP 800-185 §3) ─────────────────

  - name: "Shake128::new"
    module: oxicrypt-xof
    family: xof-hasher-new
    description: Create a streaming SHAKE128 extendable-output hasher.
    signature: "pub fn Shake128::new() -> Result<Self, Error>"
    parameters: []
    returns:
      type: "Result<Shake128, Error>"
      description: A new SHAKE128 XOF ready to absorb data.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: The SHA-3 derived function is blocked by the active profile.
    preconditions:
      - description: Module must be Operational.
        check: "oxicrypt_module::require_operational()"
    postconditions:
      - description: Hasher is ready for update() calls (absorb phase).
    sequencing:
      must_call_after:
        - update
        - finalize
        - squeeze
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let mut x = oxicrypt_xof::Shake128::new()?;
        x.update(b"hello world");
        x.finalize();
        let mut out = [0u8; 64];
        x.squeeze(&mut out)?;  // may squeeze again for more output

  - name: "Shake128::update"
    module: oxicrypt-xof
    family: xof-hasher-update
    description: Feed data into the XOF absorb phase; canonical for the xof-streaming-hasher family.
    signature: "pub fn update(&mut self, data: &[u8])"
    parameters:
      - name: self
        type: "&mut Shake128"
        direction: in-out
        description: The XOF to update.
      - name: data
        type: "&[u8]"
        direction: in
        description: Data to absorb.
    returns:
      type: "()"
      description: No return value.
    preconditions:
      - description: XOF was created and finalize() has NOT been called.
    postconditions:
      - description: Internal sponge state updated with the provided data.
    sequencing:
      mutually_exclusive: [squeeze]
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: update() is illegal after finalize(). Absorb, then finalize, then squeeze.
        wrong: |
          let mut x = Shake128::new()?;
          x.finalize();
          x.update(b"data");  // debug-assert failure: already finalized
        right: |
          let mut x = Shake128::new()?;
          x.update(b"data");
          x.finalize();
          let mut out = [0u8; 32];
          x.squeeze(&mut out)?;

  - name: "Shake128::finalize"
    module: oxicrypt-xof
    description: End the absorb phase (takes &mut self, not consumed); after this no more update()s are legal and squeeze() may be called repeatedly.
    signature: "pub fn finalize(&mut self)"
    parameters:
      - name: self
        type: "&mut Shake128"
        direction: in-out
        description: The XOF.
    returns:
      type: "()"
      description: No return value.
    preconditions:
      - description: finalize() has not already been called.
    postconditions:
      - description: XOF is in the squeeze phase; squeeze() is now legal and update() is not.
    sequencing:
      must_call_before: [update]
      must_call_after: [squeeze]
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational

  - name: "Shake128::squeeze"
    module: oxicrypt-xof
    description: Read out.len() bytes of extendable output; may be called repeatedly after finalize() with the same byte stream as one combined squeeze.
    signature: "pub fn squeeze(&mut self, out: &mut [u8]) -> Result<(), Error>"
    parameters:
      - name: self
        type: "&mut Shake128"
        direction: in-out
        description: The finalized XOF.
      - name: out
        type: "&mut [u8]"
        direction: out
        description: Output buffer; out.len() bytes are written.
        constraints:
          nullability: required
          valid_range: "any length, including 0"
    returns:
      type: "Result<(), Error>"
      description: Output is written to `out`.
      error_variants:
        - name: NotOperational
          condition: The module is not in SelfTest or Operational, including after it entered the Error state since the object was built.
    preconditions:
      - description: finalize() must have been called.
        check: "internal: debug_assert!(finalized)"
    postconditions:
      - description: out is filled with the next out.len() bytes of XOF output.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: squeeze() before finalize() is illegal. Always finalize() first.
        wrong: |
          let mut x = Shake128::new()?;
          x.update(b"data");
          let mut out = [0u8; 32];
          x.squeeze(&mut out)?;  // debug-assert failure: not finalized
        right: |
          let mut x = Shake128::new()?;
          x.update(b"data");
          x.finalize();
          let mut out = [0u8; 32];
          x.squeeze(&mut out)?;

  - name: "Shake256::new"
    module: oxicrypt-xof
    family: xof-hasher-new
    description: Create a streaming SHAKE256 extendable-output hasher.
    signature: "pub fn Shake256::new() -> Result<Self, Error>"
    returns:
      type: "Result<Shake256, Error>"
      error_variants:
        - name: NotOperational
