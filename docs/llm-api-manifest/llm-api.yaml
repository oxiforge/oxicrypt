  # ── CTR-DRBG-AES-128 / -192 / -256 — additive variants ──
  #
  # SP 800-90A §10.2 CTR_DRBG family. Distinct from HMAC-DRBG and
  # Hash-DRBG in that BOTH `_no_df` and `_df` derivation modes are
  # surfaced through DISTINCT entry points per lifecycle stage
  # (rather than a runtime flag) — one-to-one with upstream methods.
  # Per SP 800-90A Table 3, security strength matches block-cipher
  # key length: AES-128 = 128, AES-192 = 192, AES-256 = 256 bits.
  # `SEED_LEN` = `KEY_LEN + OUTLEN` = 32 / 40 / 48 bytes respectively.

  - name: OxiCtrDrbgAes128
    kind: opaque_type
    module: oxicrypt-ffi
    description: >-
      Opaque CTR_DRBG-AES-128 handle. Internal layout
      (`OxiHandle<CtrDrbgAes128>`) is implementation detail; cbindgen
      renders this as an opaque struct. Same per-call-mutating
      thread-safety and Drop-zeroize contract as `OxiHmacDrbgSha256`;
      Drop chain zeroizes the internal `(Key, V, reseed_counter)` via
      `oxicrypt-zeroize`. Per SP 800-90A Table 3, security strength
      is 128 bits; `SEED_LEN = 32`. Allocate via
      `oxi_ctr_drbg_aes128_new`; release via
      `oxi_ctr_drbg_aes128_free`.

  - name: OxiCtrDrbgAes192
    kind: opaque_type
    module: oxicrypt-ffi
    description: >-
      Opaque CTR_DRBG-AES-192 handle. Per SP 800-90A Table 3,
      security strength is 192 bits; `SEED_LEN = 40`.

  - name: OxiCtrDrbgAes256
    kind: opaque_type
    module: oxicrypt-ffi
    description: >-
      Opaque CTR_DRBG-AES-256 handle. Per SP 800-90A Table 3,
      security strength is 256 bits; `SEED_LEN = 48`.

  - name: oxi_ctr_drbg_aes128_new
    module: oxicrypt-ffi
    description: >-
      Allocate a new, uninstantiated CTR_DRBG-AES-128 handle. Caller
      MUST subsequently call exactly one of `_instantiate_no_df` or
      `_instantiate_df` before generate/reseed becomes operational.
      Forwards to `oxicrypt_drbg::CtrDrbgAes128::new`.
    signature: >-
      int oxi_ctr_drbg_aes128_new(OxiCtrDrbgAes128 **out_handle)
    parameters:
      - { name: out_handle, type: "OxiCtrDrbgAes128 **", direction: out, description: "Receives heap-allocated opaque handle pointer on success" }
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 10 = NullPointer)."
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true

