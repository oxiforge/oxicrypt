      DRBG with fresh entropy and (optionally) additional input.
      After successful reseed, `reseed_counter` resets to 1 and the
      handle is ready to serve new generate calls. `additional_input`
      may be NULL when `additional_input_len` is 0. Returns
      `Uninstantiated = 8` if the handle has not yet been
      instantiated.
