    module: oxicrypt-zeroize
    description: Overwrite every byte of a slice with zero using a volatile store that the compiler cannot elide.
    signature: 'pub fn zeroize(buf: &mut [u8])'
    parameters:
    - name: buf
      type: '&mut [u8]'
      direction: inout
      description: Buffer to clear; an empty slice is a no-op.
    returns:
      type: ()
      description: No value; the effect is entirely on buf.
    postconditions:
    - description: Every byte of buf is 0.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: false

