    module: oxicrypt-ffi
    description: Run HKDF-Expand (RFC 5869 §2.3) with HMAC-SHA-256 from a 32-byte PRK, filling okm_out with okm_len bytes; returns OxiResult::OutputTooLong (12) when okm_len exceeds 8160.
