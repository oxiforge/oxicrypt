  # ── LMS per-pair family ─────────────────────────────────────────
  # oxi_lms_verify covers LMS_SHA256_M32_H10 / LMOTS_SHA256_N32_W4. The 80 per-pair
  # oxi_lms_<family>_m<N>_h<H>_w<W>_verify functions, one per SP 800-208 §4.1-§4.4 pair,
  # share its signature, sized by the pair's public-key and signature lengths.

  - name: oxi_lms_verify
    module: oxicrypt-ffi
    description: Verify an LMS signature (SP 800-208 / RFC 8554); reads the 56-byte public key from pk_ptr, msg, and the 2508-byte signature from sig_ptr.
    signature: >-
      int oxi_lms_verify(const uint8_t *pk_ptr,
      const uint8_t *msg_ptr, size_t msg_len,
      const uint8_t *sig_ptr)
    parameters:
      - name: pk_ptr
        type: const uint8_t *
        direction: in
        description: 56-byte LMS public key
      - name: msg_ptr
        type: const uint8_t *
        direction: in
        description: Message bytes (length given by msg_len)
      - name: msg_len
        type: size_t
        direction: in
        description: Message length in bytes
      - name: sig_ptr
        type: const uint8_t *
        direction: in
        description: 2508-byte LMS signature
    returns:
      type: int
      description: "OxiResult discriminant: Ok on success, otherwise one of the error variants below."
      error_variants:
        - name: TagMismatch
          condition: The cryptographic verification ran cleanly and the result disagreed with the claimed value.
        - name: NotOperational
          condition: oxi_init has not completed successfully, or the module has entered the terminal Error state.
        - name: AlgorithmRestricted
          condition: The active algorithm profile does not permit this service.
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: true

  - name: oxi_lms_verify_any
    module: oxicrypt-ffi
    description: Verify an LMS signature under whichever of the 80 SP 800-208 parameter pairs the public key's typecodes name; each buffer is passed with its length.
    signature: >-
      int oxi_lms_verify_any(const uint8_t *pk_ptr, size_t pk_len,
      const uint8_t *msg_ptr, size_t msg_len,
      const uint8_t *sig_ptr, size_t sig_len)
    parameters:
      - name: pk_ptr
        type: const uint8_t *
        direction: in
        description: LMS public key (length given by pk_len)
      - name: pk_len
        type: size_t
        direction: in
        description: Public key length in bytes
      - name: msg_ptr
        type: const uint8_t *
        direction: in
        description: Message bytes (length given by msg_len)
      - name: msg_len
        type: size_t
        direction: in
        description: Message length in bytes
      - name: sig_ptr
        type: const uint8_t *
        direction: in
        description: LMS signature (length given by sig_len)
      - name: sig_len
        type: size_t
        direction: in
        description: Signature length in bytes
    returns:
      type: int
      description: "OxiResult discriminant: Ok on success, otherwise one of the error variants below."
      error_variants:
        - name: InvalidInput
          condition: The input names no LMS pair (public key under 8 bytes, a typecode pair outside the 80, or a length that is not the named pair's); no verifier ran.
        - name: TagMismatch
          condition: The named pair's verifier ran and rejected the signature.
        - name: NullPointer
          condition: A NULL pointer was passed with a non-zero length.
