  # ── AES-GCM ──────────────────────────────────────────────────────

  - name: gcm_encrypt
    module: oxicrypt-aes
    family: aes-mode-encrypt
    description: AES-GCM authenticated encryption.
    signature: >-
      pub fn gcm_encrypt<B: BlockCipher>(cipher: &B, iv: &[u8; 12],
      aad: &[u8], plaintext: &[u8], ciphertext: &mut [u8],
      tag: &mut [u8; 16]) -> Result<(), ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule (Aes128Key, Aes192Key, or Aes256Key)."
      - name: iv
        type: "&[u8; 12]"
        direction: in
        description: 96-bit initialization vector; MUST be unique for every encryption under the same key.
        constraints:
          size: 12
          encoding: raw
      - name: aad
        type: "&[u8]"
        direction: in
        description: Additional authenticated data.
        constraints:
          valid_range: "0..=2^64 - 1 bytes"
      - name: plaintext
        type: "&[u8]"
        direction: in
        description: Data to encrypt.
        constraints:
          valid_range: "0..=2^36 - 32 bytes"
      - name: ciphertext
        type: "&mut [u8]"
        direction: out
        description: Output buffer for encrypted data.
        constraints:
          size: "plaintext.len()"
      - name: tag
        type: "&mut [u8; 16]"
        direction: out
        description: Output buffer for 128-bit authentication tag.
        constraints:
          size: 16
    returns:
      type: "Result<(), ModeError>"
      description: Ok on success.
      error_variants:
        - name: LengthMismatch
          condition: ciphertext.len() != plaintext.len()
        - name: InvalidPayloadLength
          condition: Plaintext exceeds GCM maximum.
    preconditions:
      - description: Module must be Operational.
      - description: IV must be unique for this key.
    postconditions:
      - description: ciphertext contains the encrypted data.
      - description: tag contains the 128-bit GCM authentication tag.
    thread_safety: thread-safe
    security:
      constant_time: false  # AES table-based; disclosed
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: GCM IV reuse is catastrophic; never use the same IV twice with the same key. Use a counter or DRBG to generate IVs.
        wrong: |
          let iv = [0u8; 12];  // Static IV — fatal for multi-message use
          gcm_encrypt(&key, &iv, &[], &msg1, &mut ct1, &mut tag1)?;
          gcm_encrypt(&key, &iv, &[], &msg2, &mut ct2, &mut tag2)?;
        right: |
          let mut iv_counter: u128 = 0;
          let iv = &iv_counter.to_be_bytes()[4..];  // 96-bit counter
          gcm_encrypt(&key, iv.try_into().unwrap(), &[], &msg, &mut ct, &mut tag)?;
          iv_counter += 1;

  - name: gcm_decrypt
    module: oxicrypt-aes
    family: aes-mode-decrypt
    description: AES-GCM authenticated decryption; verifies the tag before writing plaintext_out.
    signature: >-
      pub fn gcm_decrypt<B: BlockCipher>(cipher: &B, iv: &[u8], aad: &[u8],
      ciphertext: &[u8], tag: &[u8; 16], plaintext_out: &mut [u8]) -> Result<(), ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule (Aes128Key, Aes192Key, or Aes256Key)."
      - name: iv
        type: "&[u8]"
        direction: in
        description: Initialization vector; must be 12 bytes (returns Err(InvalidIvLength) otherwise).
        constraints:
          size: 12
      - name: aad
        type: "&[u8]"
        direction: in
        description: Additional authenticated data.
      - name: ciphertext
        type: "&[u8]"
        direction: in
        description: Data to decrypt.
      - name: tag
        type: "&[u8; 16]"
        direction: in
        description: 128-bit authentication tag from gcm_encrypt.
        constraints:
          size: 16
      - name: plaintext_out
        type: "&mut [u8]"
        direction: out
        description: Output buffer.
        constraints:
          size: "ciphertext.len()"
    returns:
      type: "Result<(), ModeError>"
      error_variants:
        - name: InvalidIvLength
          condition: iv.len() != 12
        - name: LengthMismatch
          condition: plaintext_out.len() != ciphertext.len()
        - name: TagMismatch
          condition: Authentication tag verification failed (constant-time compare).
    preconditions:
      - description: Module must be Operational.
      - description: Tag, IV, and AAD must match what was used during encryption.
    postconditions:
      - description: If Ok, plaintext_out contains decrypted data.
      - description: If TagMismatch, plaintext_out content is undefined — discard it.
    thread_safety: thread-safe
    security:
      constant_time: false  # AES table-based; tag comparison is constant-time
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    pitfalls:
      - description: Do NOT use plaintext_out if gcm_decrypt returns Err(TagMismatch); the buffer may contain attacker-controlled partially decrypted data.
        wrong: |
          let _ = gcm_decrypt(&key, &iv, &aad, &ct, &tag, &mut pt);
          process(&pt);  // BUG: may use tampered data if tag failed
        right: |
          gcm_decrypt(&key, &iv, &aad, &ct, &tag, &mut pt)?;
          process(&pt);  // safe: only reached if authentication passed

