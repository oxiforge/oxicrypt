        direction: in
        description: "Plaintext to wrap."
      - name: ciphertext_out
        type: "&mut [u8]"
        direction: out
        description: "Wrapped output."
    returns:
      type: "Result<(), ModeError>"
      description: "LengthMismatch if buffer sizes are wrong."
      error_variants:
        - name: LengthMismatch
          condition: The plaintext or output buffer length is not valid for KW-AE.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: kw_unwrap_inverse_cipher
    module: oxicrypt-aes
    family: aes-mode-decrypt
    description: AES-KW unwrap (SP 800-38F §6.2 KW-AD) with the inverse cipher direction (ACVP kwCipher = "inverse"); returns TagMismatch on ICV verification failure.
    signature: >-
      pub fn kw_unwrap_inverse_cipher<B: BlockCipher>(cipher: &B,
      ciphertext: &[u8], plaintext_out: &mut [u8])
      -> Result<(), ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule."
      - name: ciphertext
        type: "&[u8]"
        direction: in
        description: "Wrapped input."
      - name: plaintext_out
        type: "&mut [u8]"
        direction: out
        description: "Unwrapped output."
    returns:
      type: "Result<(), ModeError>"
      description: "TagMismatch on ICV failure (constant-time check); LengthMismatch on size error."
      error_variants:
        - name: TagMismatch
          condition: The ICV did not verify; checked in constant time.
        - name: LengthMismatch
          condition: The ciphertext or output buffer length is not valid for KW-AD.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: kwp_wrap_inverse_cipher
    module: oxicrypt-aes
    family: aes-mode-encrypt
    description: AES-KWP wrap (RFC 5649 / SP 800-38F §6.3 KWP-AE) with the inverse cipher direction (ACVP kwCipher = "inverse"); alternative IV A65959A6 || [mli]_32 unchanged.
    signature: >-
      pub fn kwp_wrap_inverse_cipher<B: BlockCipher>(cipher: &B,
      plaintext: &[u8], ciphertext_out: &mut [u8])
      -> Result<(), ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule."
      - name: plaintext
        type: "&[u8]"
        direction: in
        description: "Plaintext to wrap."
      - name: ciphertext_out
        type: "&mut [u8]"
        direction: out
        description: "Wrapped output."
    returns:
      type: "Result<(), ModeError>"
      description: "LengthMismatch on size error."
      error_variants:
        - name: LengthMismatch
          condition: The plaintext or output buffer length is not valid for KWP-AE.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: kwp_unwrap_inverse_cipher
    module: oxicrypt-aes
    family: aes-mode-decrypt
    description: AES-KWP unwrap (SP 800-38F §6.3 KWP-AD) with the inverse cipher direction (ACVP kwCipher = "inverse"); returns TagMismatch on ICV-prefix mismatch, inconsistent mli, or non-zero pad, and returns the recovered plaintext byte length on success.
    signature: >-
      pub fn kwp_unwrap_inverse_cipher<B: BlockCipher>(cipher: &B,
      ciphertext: &[u8], plaintext_out_scratch: &mut [u8])
      -> Result<usize, ModeError>
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: "AES key schedule."
      - name: ciphertext
        type: "&[u8]"
        direction: in
        description: "Wrapped input."
      - name: plaintext_out_scratch
        type: "&mut [u8]"
        direction: out
        description: "Padded plaintext scratch."
    returns:
      type: "Result<usize, ModeError>"
      description: "Recovered `mli` (plaintext byte length) on success; TagMismatch on ICV/pad failure (constant-time check); LengthMismatch on size error."
      error_variants:
        - name: TagMismatch
          condition: The ICV prefix, the encoded message length, or the padding did not verify; checked in constant time.
        - name: LengthMismatch
          condition: The ciphertext or scratch buffer length is not valid for KWP-AD.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── DRBG ──────────────────────────────────────────────────────────

  - name: "CtrDrbgAes256::instantiate_df"
    module: oxicrypt-drbg
    description: Instantiate CTR_DRBG with AES-256 using the derivation function.
    signature: >-
      pub fn instantiate_df(&mut self, entropy: &[u8], nonce: &[u8],
      personalization: &[u8]) -> Result<(), Error>
    parameters:
      - name: entropy
        type: "&[u8]"
        direction: in
        description: Entropy input from a noise source.
        constraints:
          valid_range: "32..=192 bytes (at least the 256-bit security strength; MAX_DF_INPUT shared across all inputs)"
      - name: nonce
        type: "&[u8]"
        direction: in
        description: "Nonce of at least security_strength/2 bits, a length floor SP 800-90A section 9.1 step 8 permits that refuses a shorter value meeting only the uniqueness condition of section 8.6.7."
        constraints:
          valid_range: "16..=192 bytes"
      - name: personalization
        type: "&[u8]"
        direction: in
        description: Optional personalization string.
        constraints:
          valid_range: "0..=192 bytes"
          nullability: required
    returns:
      type: "Result<(), Error>"
      description: Ok if instantiation succeeds.
      error_variants:
        - name: InvalidInput
          condition: "entropy.len() + nonce.len() + personalization.len() > 192"
        - name: EntropyInputTooShort
          condition: "entropy.len() < 32"
        - name: NonceTooShort
          condition: "nonce.len() < 16"
    preconditions:
      - description: DRBG must be in uninstantiated state (new or after uninstantiate).
    postconditions:
      - description: DRBG is instantiated and ready for generate calls.
    sequencing:
      must_call_after:
        - generate_df
        - reseed_df
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let mut drbg = oxicrypt_drbg::CtrDrbgAes256::new();
        drbg.instantiate_df(&entropy, &nonce, b"my-app")?;
        let mut out = [0u8; 32];
        drbg.generate_df(&mut out, &[])?;

  - name: "CtrDrbgAes256::generate_df"
    module: oxicrypt-drbg
    description: Generate random bytes from an instantiated CTR_DRBG.
    signature: >-
      pub fn generate_df(&mut self, out: &mut [u8],
      additional_input: &[u8]) -> Result<(), DrbgError>
    parameters:
      - name: out
        type: "&mut [u8]"
        direction: out
        description: Buffer to fill with random bytes.
        constraints:
          valid_range: "1..=65536 bytes per call"
      - name: additional_input
        type: "&[u8]"
        direction: in
        description: Optional additional input.
        constraints:
          valid_range: "0..=192 bytes"
    returns:
      type: "Result<(), DrbgError>"
      error_variants:
        - name: Uninstantiated
          condition: DRBG was not instantiated.
        - name: ReseedRequired
          condition: Reseed counter exceeded 2^48.
        - name: RequestTooLong
          condition: "out.len() > 65536"
        - name: InputTooLong
          condition: "additional_input.len() > 192"
        - name: Module
          condition: The module refused the operation because it is not in SelfTest or Operational.
    preconditions:
      - description: DRBG must be instantiated.
        check: Must have called instantiate_df or instantiate_no_df.
    postconditions:
      - description: out is filled with pseudorandom bytes.
      - description: Internal reseed counter incremented.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── Entropy (SP 800-90B scaffolding) ──────────────────────────────

  - name: EntropyPipeline::new
    module: oxicrypt-entropy
    description: Construct an entropy pipeline, injecting the claimed min-entropy per sample and the health-test alpha; refuses (never clamps) claims above the source ceiling, declared sample width, or without APT table coverage.
    signature: "pub fn new(source: S, claimed_h: MinEntropy, alpha: Alpha) -> Result<EntropyPipeline<S>, EntropyError>"
    parameters:
      - name: source
        type: "S"
        direction: in
        description: The noise source this pipeline is bound to for its lifetime.
        constraints:
          nullability: required
          valid_range: any type implementing NoiseSource
      - name: claimed_h
        type: "MinEntropy"
        direction: in
        description: Claimed min-entropy per sample; refused rather than clamped if it exceeds the source ceiling or the declared sample width.
        constraints:
          nullability: required
          valid_range: at most min(NoiseSource::max_claimable_h, sample width in bits)
      - name: alpha
        type: "Alpha"
        direction: in
        description: Health-test cutoff-generating parameter that determines the APT cutoff.
        constraints:
          nullability: required
          valid_range: must have precomputed APT cutoff coverage for this alpha, alphabet and H
    returns:
      type: "Result<EntropyPipeline<S>, EntropyError>"
      description: Pipeline (awaiting startup) on success; typed refusal otherwise.
      error_variants:
        - name: ClaimExceedsCeiling
          condition: The claimed min-entropy per sample exceeds the source ceiling; the claim is refused rather than clamped.
        - name: ClaimExceedsSampleWidth
          condition: The claimed min-entropy per sample exceeds the declared sample width, or the alpha has no APT table coverage.
        - name: Health
          condition: The requested alpha, alphabet and H point has no precomputed APT cutoff coverage.

  - name: EntropyPipeline::run_startup
    module: oxicrypt-entropy
    description: "Run the startup tests: continuous health tests over at least 1024 consecutive samples (90B 4.3); tested samples are discarded and failure permanently poisons the pipeline."
    signature: "pub fn run_startup(&mut self) -> Result<(), EntropyError>"
    returns:
      type: "Result<(), EntropyError>"
      description: Operational on success; NotReady if already started; Health on failure.
      error_variants:
        - name: NotReady
          condition: Startup has already run on this pipeline.
        - name: Health
          condition: A continuous health test failed; the pipeline is permanently poisoned.
        - name: Module
          condition: The module refused the conditioning KAT's hash; the pipeline is not poisoned and startup may be retried.

  - name: EntropyPipeline::on_demand_test
    module: oxicrypt-entropy
    description: "On-demand testing (90B 4.3): re-runs the startup battery on fresh test state, only while operational; tested samples discarded and failure permanently poisons."
    signature: "pub fn on_demand_test(&mut self) -> Result<(), EntropyError>"
    returns:
      type: "Result<(), EntropyError>"
      description: Ok when the battery passes; typed error otherwise.
      error_variants:
        - name: NotReady
          condition: The pipeline is not operational, having not completed startup or having been poisoned.
        - name: Health
          condition: The re-run battery failed; the pipeline is permanently poisoned.

  - name: EntropyPipeline::sample
    module: oxicrypt-entropy
    description: Emit one health-tested raw sample, the ONLY path by which a sample leaves the pipeline; NotReady before startup or after poisoning, and a failing sample is never released.
    signature: "pub fn sample(&mut self) -> Result<RawSample, EntropyError>"
    returns:
      type: "Result<RawSample, EntropyError>"
      description: One tested sample, or a typed refusal.
      error_variants:
        - name: NotReady
          condition: Startup has not completed, or the pipeline has been poisoned by a health-test failure.
        - name: Health
          condition: The sample failed a continuous health test and is never released.
        - name: Source
          condition: The underlying noise source failed to produce a sample.

  - name: MinEntropy::from_fraction_floor
    module: oxicrypt-entropy
    description: Convert num/den bits of min-entropy to the 1/256-bit grid, rounding down so a claim is never overstated.
    signature: "pub fn from_fraction_floor(num: u64, den: u64) -> Option<MinEntropy>"
    parameters:
      - name: num
        type: "u64"
        direction: in
        description: Numerator of the claim expressed as num/den bits.
        constraints:
          nullability: required
          valid_range: any
      - name: den
        type: "u64"
        direction: in
        description: Denominator of the claim; the value is rounded down to the 1/256-bit grid, never up.
        constraints:
          nullability: required
          valid_range: non-zero; zero returns None
    returns:
      type: "Option<MinEntropy>"
      description: Floored fixed-point value; None on zero denominator or overflow.

  - name: SourceSpec::new
    module: oxicrypt-entropy
    description: Validated constructor — sample width must be 1..=8 bits.
    signature: "pub const fn new(sample_width_bits: u8) -> Option<SourceSpec>"
    parameters:
      - name: sample_width_bits
        type: "u8"
        direction: in
        description: Declared width in bits of each sample the source emits.
        constraints:
          nullability: required
          valid_range: 1..=8; outside this range returns None
    returns:
      type: "Option<SourceSpec>"
      description: Spec, or None for width 0 or greater than 8.

  - name: TimerSource::default_for_target
    module: oxicrypt-entropy
    description: "Per-architecture default timer source: x86_64 -> RawCounter (TSC), aarch64 and others -> OsNanoClock."
    signature: "pub const fn default_for_target() -> TimerSource"
    returns:
      type: TimerSource
      description: The default for the compilation target.

  - name: wrapping_delta
    module: oxicrypt-entropy
    description: Width-aware wrapping delta between two counter reads; a masked delta with the width's top bit set is a Backwards violation.
    signature: "pub fn wrapping_delta(prev: u64, now: u64, width_bits: u32) -> Result<u64, TimerError>"
    parameters:
      - name: prev
        type: "u64"
        direction: in
        description: The previous raw counter read.
        constraints:
          nullability: required
          valid_range: any
      - name: now
        type: "u64"
        direction: in
        description: The current raw counter read.
        constraints:
          nullability: required
          valid_range: any
      - name: width_bits
        type: "u32"
        direction: in
        description: The counter significant width in bits; legitimate wraparound within this width yields the correct small delta.
        constraints:
          nullability: required
          valid_range: 1..=64
    returns:
      type: "Result<u64, TimerError>"
      description: The delta, or Backwards (caller discards the sample).
      error_variants:
        - name: Backwards
          condition: The masked delta has the width top bit set, indicating the counter moved backwards; the caller discards the sample.

  - name: measure_adequacy
    module: oxicrypt-entropy
    description: Bare-read adequacy measurement over config.samples consecutive reads (zero-delta fraction, min positive delta, distinct-delta variety, backwards violations); refusal policy lives on AdequacyReport (ensure_sound for bare reads; ensure_adequate on the operational workload-measured signal).
    signature: "pub fn measure_adequacy<T: TimerRead>(timer: &mut T, config: &AdequacyConfig) -> AdequacyReport"
    parameters:
      - name: timer
        type: "&mut T"
        direction: in
        description: The timer to sample; read config.samples times consecutively.
        constraints:
          nullability: required
          valid_range: any type implementing TimerRead
      - name: config
        type: "&AdequacyConfig"
        direction: in
        description: Sample count and the thresholds the report is measured against.
        constraints:
          nullability: required
          valid_range: required
    returns:
      type: AdequacyReport
      description: Observed behavior for adequacy adjudication.

  - name: collection::run
    module: oxicrypt-entropy
    description: Entry point of the off-boundary collect binary (default-off collection feature); writes SP 800-90B raw and restart datasets under a versioned per-OE layout with a sha256 manifest, resumable via a content-hash checkpoint.
    signature: "pub fn run<W: Write>(args: &[String], out: &mut W) -> Result<(), CollectionError>"
    parameters:
      - name: args
        type: "&[String]"
        direction: in
        description: Command-line arguments for the off-boundary collect binary.
        constraints:
          nullability: required
          valid_range: any
      - name: out
        type: "&mut W"
        direction: in
        description: Injected sink for operator-facing output; the binary passes a locked stdout handle, so the library performs no direct stdout writes.
        constraints:
          nullability: required
          valid_range: any type implementing Write
    returns:
      type: "Result<(), CollectionError>"
      description: Ok on success, else an operator-facing collection error.
      error_variants:
        - name: CollectionError
          condition: The only error this returns. It is a newtype over a String carrying an operator-facing message, so the cause cannot be branched on programmatically.


  - name: oxi_timer::read_raw_counter
    module: oxicrypt-timer
    description: "Serialized raw counter read: lfence+rdtsc (x86_64) or ISB+MRS CNTVCT_EL0 (aarch64); side-effect-free, with nominal frequency never to be trusted."
    signature: "pub fn read_raw_counter() -> u64"
    returns:
      type: u64
      description: Raw counter value.

  # ── CMAC (SP 800-38B) ────────────────────────────────────────────

  - name: cmac_aes128
    module: oxicrypt-cmac
    family: cmac-aes
    description: One-shot AES-128-CMAC (SP 800-38B) over a raw 16-byte key, building the key schedule internally and returning a 16-byte tag.
    signature: "pub fn cmac_aes128(key: &[u8; 16], msg: &[u8]) -> Result<[u8; 16], Error>"
    parameters:
      - name: key
        type: "&[u8; 16]"
        direction: in
        description: 128-bit AES key.
        constraints:
          size: 16
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to authenticate.
    returns:
      type: "Result<[u8; 16], Error>"
      description: 16-byte CMAC tag.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: false  # AES table-based
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let tag = oxicrypt_cmac::cmac_aes128(&[0u8; 16], b"message")?;
        assert_eq!(tag.len(), 16);

  - name: cmac_aes192
    module: oxicrypt-cmac
    family: cmac-aes
    description: One-shot AES-192-CMAC.
    signature: "pub fn cmac_aes192(key: &[u8; 24], msg: &[u8]) -> Result<[u8; 16], Error>"
    parameters:
      - name: key
        type: "&[u8; 24]"
        direction: in
        description: 192-bit AES key.
        constraints:
          size: 24
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to authenticate.
    returns:
      type: "Result<[u8; 16], Error>"
      description: 16-byte CMAC tag.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: cmac_aes256
    module: oxicrypt-cmac
    family: cmac-aes
    description: One-shot AES-256-CMAC.
    signature: "pub fn cmac_aes256(key: &[u8; 32], msg: &[u8]) -> Result<[u8; 16], Error>"
    parameters:
      - name: key
        type: "&[u8; 32]"
        direction: in
        description: 256-bit AES key.
        constraints:
          size: 32
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to authenticate.
    returns:
      type: "Result<[u8; 16], Error>"
      description: 16-byte CMAC tag.
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: cmac_tag
    module: oxicrypt-cmac
    description: Generic CMAC over any BlockCipher, without the profile gate and refusing outside SelfTest and Operational; an internal composition helper, callers needing FIPS gating use the typed variants.
    signature: "pub fn cmac_tag<B: BlockCipher>(cipher: &B, msg: &[u8]) -> Result<[u8; 16], Error>"
    parameters:
      - name: cipher
        type: "&impl BlockCipher"
        direction: in
        description: Pre-built AES key schedule.
      - name: msg
        type: "&[u8]"
        direction: in
        description: Message to authenticate.
    returns:
      type: "Result<[u8; 16], Error>"
      description: 16-byte CMAC tag.
      error_variants:
        - name: NotOperational
          condition: The module is not in SelfTest or Operational.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: true
      fips_approved: true
      fips_gate: null

  # ── KDF — HKDF (SP 800-56Cr2 / RFC 5869) ─────────────────────────

  - name: "HkdfSha256::extract"
    module: oxicrypt-kdf
    description: HKDF-Extract (RFC 5869 §2.2) with SHA-256, producing a PRK from IKM and an optional salt; a None salt is treated as 32 zero bytes.
    signature: "pub fn HkdfSha256::extract(salt: Option<&[u8]>, ikm: &[u8]) -> Result<Self, KdfError>"
    parameters:
      - name: salt
        type: "Option<&[u8]>"
        direction: in
        description: Optional non-secret salt; None is treated as 32 zero bytes, and a random 32-byte salt is recommended.
      - name: ikm
        type: "&[u8]"
        direction: in
        description: Input keying material (e.g. raw ECDH shared secret Z).
    returns:
      type: "Result<HkdfSha256, KdfError>"
      description: HKDF instance holding the 32-byte PRK, ready for expand().
      error_variants:
        - name: Module
          condition: Module not operational or service restricted.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let hkdf = HkdfSha256::extract(Some(b"salt"), &z)?;
        let mut okm = [0u8; 32];
        hkdf.expand(b"info", &mut okm)?;

  - name: "HkdfSha256::from_prk"
    module: oxicrypt-kdf
    description: Construct an HkdfSha256 from a pre-existing 32-byte PRK; any other length returns Err(OutputTooLong).
    signature: "pub fn HkdfSha256::from_prk(prk: &[u8]) -> Result<Self, KdfError>"
    parameters:
      - name: prk
        type: "&[u8]"
        direction: in
        description: Pre-extracted PRK.
        constraints:
          valid_range: "exactly 32 bytes"
    returns:
      type: "Result<HkdfSha256, KdfError>"
      error_variants:
        - name: Module
          condition: Module not operational or service restricted.
        - name: OutputTooLong
          condition: prk.len() != 32
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: "HkdfSha256::expand"
    module: oxicrypt-kdf
    description: HKDF-Expand (RFC 5869 §2.3) with SHA-256, filling okm with derived key material; okm.len() must not exceed 8160 bytes.
    signature: "pub fn expand(&self, info: &[u8], okm: &mut [u8]) -> Result<(), KdfError>"
    parameters:
      - name: self
        type: "&HkdfSha256"
        direction: in
        description: HKDF instance from extract() or from_prk().
      - name: info
        type: "&[u8]"
        direction: in
        description: "Context / application-specific info string."
      - name: okm
        type: "&mut [u8]"
        direction: out
        description: Output key material buffer.
        constraints:
          valid_range: "0..=8160 bytes (255 * 32)"
    returns:
      type: "Result<(), KdfError>"
      error_variants:
        - name: Module
          condition: Module not operational or service restricted.
        - name: OutputTooLong
          condition: okm.len() > 255 * 32
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── KDF — SP 800-108r1 KBKDF ─────────────────────────────────────

  - name: "Sp800_108CounterHmacSha256::derive"
    module: oxicrypt-kdf
    family: kdf-sp800108-mode
    description: SP 800-108r1 §5.2 Counter Mode KBKDF with HMAC-SHA-256, assembling the fixed-data structure (label || 0x00 || context || [L]_32) internally.
    signature: >-
      pub fn Sp800_108CounterHmacSha256::derive(key: &[u8], label: &[u8],
      context: &[u8], out: &mut [u8]) -> Result<(), KdfError>
    parameters:
      - name: key
        type: "&[u8]"
        direction: in
        description: Derivation key (KI).
      - name: label
        type: "&[u8]"
        direction: in
        description: Human-readable label identifying the derived key's purpose.
      - name: context
        type: "&[u8]"
        direction: in
        description: Context binding (e.g. parties, session identifiers).
      - name: out
        type: "&mut [u8]"
        direction: out
        description: Output buffer filled with derived key material.
        constraints:
          valid_range: "1..=2^29-1 bytes (out.len()*8 must fit in u32)"
    returns:
      type: "Result<(), KdfError>"
      error_variants:
        - name: Module
          condition: Module not operational or service restricted.
        - name: OutputTooLong
          condition: out.len() * 8 does not fit in a u32 bit-length field.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let mut okm = [0u8; 32];
        Sp800_108CounterHmacSha256::derive(&master_key, b"enc", b"ctx", &mut okm)?;

  - name: "Sp800_108FeedbackHmacSha256::derive"
    module: oxicrypt-kdf
    family: kdf-sp800108-mode
    description: SP 800-108r1 §5.3 Feedback Mode KBKDF with HMAC-SHA-256; requires an IV (non-secret, may be empty for zero-IV mode).
    signature: >-
      pub fn Sp800_108FeedbackHmacSha256::derive(key: &[u8], iv: &[u8],
      label: &[u8], context: &[u8], out: &mut [u8]) -> Result<(), KdfError>
    parameters:
      - name: key
        type: "&[u8]"
        direction: in
        description: Derivation key.
      - name: iv
        type: "&[u8]"
        direction: in
        description: Initial chaining value.
      - name: label
        type: "&[u8]"
        direction: in
        description: Label identifying the derived key.
      - name: context
        type: "&[u8]"
        direction: in
        description: Context binding.
      - name: out
        type: "&mut [u8]"
        direction: out
        description: Output buffer.
    returns:
      type: "Result<(), KdfError>"
      error_variants:
        - name: Module
          condition: Module not operational or service restricted.
        - name: OutputTooLong
          condition: Output too large for 32-bit counter encoding.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  - name: "Sp800_108DoublePipelineHmacSha256::derive"
    module: oxicrypt-kdf
    family: kdf-sp800108-mode
    description: SP 800-108r1 §5.4 Double-Pipeline Mode KBKDF with HMAC-SHA-256; no IV required.
    signature: >-
      pub fn Sp800_108DoublePipelineHmacSha256::derive(key: &[u8], label: &[u8],
      context: &[u8], out: &mut [u8]) -> Result<(), KdfError>
    parameters:
      - name: key
        type: "&[u8]"
        direction: in
