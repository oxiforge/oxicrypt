      - description: xi must be 32 bytes of fresh random data from an approved DRBG.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles:
      - Unrestricted
      - Cnsa2

  - name: "LmsSigningKey::from_private_key"
    module: oxicrypt-lms
    signature: "pub fn from_private_key(key: LmsPrivateKey) -> Result<LmsSigningKey, Error>"
    description: Wrap an existing private key (resumed from persisted state), rebuilding the Merkle node table from its seed; the current leaf_index is preserved so cached signing continues where the uncached key left off.
    parameters:
      - name: key
        type: LmsPrivateKey
        direction: in
        description: "Private key to wrap; leaf state preserved."
    returns:
      type: "Result<LmsSigningKey, Error>"
      description: "Cached signing key over the same key state."
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: LMS blocked by active profile.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles:
      - Unrestricted
      - Cnsa2

  - name: "LmsSigningKey::sign"
    module: oxicrypt-lms
    signature: "pub fn sign(&mut self, message: &[u8]) -> Result<[u8; 2508], Error>"
    description: Sign a message reading the authentication path from the cached node table, O(H) per signature; STATEFUL, advances the wrapped key's leaf index by 1, returns Err(InvalidInput) on exhaustion, and the caller MUST persist private_key().to_bytes() afterwards.
    parameters:
      - name: message
        type: "&[u8]"
        direction: in
        description: "Message to sign (arbitrary length)."
    returns:
      type: "Result<[u8; 2508], Error>"
      description: "2508-byte LMS signature, byte-identical to the uncached sign."
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: LMS blocked by active profile.
        - name: InvalidInput
          condition: Key exhausted (leaf_index >= 1024).
    preconditions:
      - description: Module must be Operational.
      - description: Wrapped key not exhausted.
    postconditions:
      - description: Wrapped key's leaf_index incremented by 1. Caller MUST persist key state.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles:
      - Unrestricted
      - Cnsa2
    pitfalls:
      - description: "The same one-leaf-per-signature contract as the uncached sign applies: persist the wrapped private key after every call. The node table is public data and does not capture leaf state; only the wrapped LmsPrivateKey does."
        wrong: |
          let (mut csk, pk) = lms_sha256_m32_h10_w4::LmsSigningKey::new(&seed)?;
          let sig = csk.sign(b"msg")?;
          // BUG: wrapped key not persisted — crash loses the advanced leaf index
        right: |
          let (mut csk, pk) = lms_sha256_m32_h10_w4::LmsSigningKey::new(&seed)?;
          let sig = csk.sign(b"msg")?;
          persist_to_disk(&csk.private_key().to_bytes());  // MUST persist after every sign

