  # TLS 1.3 KDF (RFC 8446 §7.1) — HKDF-Expand-Label and Derive-Secret.
  # Exposed for the two ciphersuite hashes pinned by RFC 8446 §B.4
  # (SHA-256: TLS_AES_128_GCM_SHA256, TLS_CHACHA20_POLY1305_SHA256;
  # SHA-384: TLS_AES_256_GCM_SHA384). SHA-512 is not in the IANA TLS
  # 1.3 ciphersuite registry and is intentionally not exposed.

  - name: oxi_tls13_hkdf_expand_label_sha256
    module: oxicrypt-ffi
    description: >-
      Run HKDF-Expand-Label per RFC 8446 §7.1 with HMAC-SHA-256.
      Builds the HkdfLabel wire structure
      length || "tls13 " + label || context and runs HKDF-Expand
      (RFC 5869 §2.3) to fill out with out_len bytes.
    signature: >-
      int oxi_tls13_hkdf_expand_label_sha256(const uint8_t *secret_ptr, size_t secret_len,
      const uint8_t *label_ptr, size_t label_len,
      const uint8_t *context_ptr, size_t context_len,
      uint8_t *out, size_t out_len)
    parameters:
      - name: secret_ptr
        type: "const uint8_t *"
        direction: in
      - name: secret_len
        type: size_t
        direction: in
      - name: label_ptr
        type: "const uint8_t *"
        direction: in
        description: Label suffix; the "tls13 " prefix is prepended internally per RFC 8446 §7.1.
      - name: label_len
        type: size_t
        direction: in
      - name: context_ptr
        type: "const uint8_t *"
        direction: in
        description: Optional context bytes; pass NULL with context_len=0 for empty context.
      - name: context_len
        type: size_t
        direction: in
      - name: out
        type: "uint8_t *"
        direction: out
      - name: out_len
        type: size_t
        direction: in
    returns:
      type: int
      description: "OxiResult discriminant (0 = Ok, 1 = NotOperational, 10 = NullPointer, 6 = AlgorithmRestricted)."

