lama: "0.1"

# ─────────────────────────────────────────────────────────────────────
# oxicrypt — Library API Manifest for LLM Agents
# Schema specification: https://github.com/lamaspec/lama/blob/main/SPEC.md
# ─────────────────────────────────────────────────────────────────────

library:
  name: oxicrypt
  version: "0.21.0"
  description: Pure-Rust FIPS 140-3 Level 1 cryptographic module implementing NIST-approved algorithms with a formal module boundary and power-up self-tests.
  repository: https://github.com/oxiforge/oxicrypt
  homepage: https://oxicrypt.dev
  license: Apache-2.0 OR MIT
  languages:
    - rust
    - c           # oxicrypt-ffi provides extern "C" wrappers (cdylib + staticlib)
  minimum_toolchain: "rust 1.95"

  constraints:
    - description: The module must be initialized via initialize_with_tests() before any cryptographic function is called; every public function gates on require_operational().
      enforcement: runtime
      severity: error

    - description: Zero third-party dependencies in the cryptographic boundary; all cryptographic code is in-tree pure Rust.
      enforcement: convention
      severity: error

    - description: All algorithm crates are no_std; the module and integrity crates require std.
      enforcement: compile-time
      severity: error

  security:
    certification: "FIPS 140-3 Level 1 (targeting, pre-validation)"
    threat_model: >-
      Software-only module protecting confidentiality and integrity of
      data processed through approved services. Does not claim
      side-channel resistance at Level 1; discloses and validates timing
      behavior via dudect methodology.
    side_channel_posture: "disclosed; no side-channel resistance claimed at Level 1, timing behavior validated via dudect"
    zeroization: "volatile-on-drop (all CSP-holding types via oxicrypt-zeroize: SHA-1/SHA-2 streaming state, Keccak sponge, HMAC ipad/opad state, AES round-key schedules, DRBG state, private-key types)"

# ─────────────────────────────────────────────────────────────────────
# State machines
# ─────────────────────────────────────────────────────────────────────

state_machines:
  - name: ModuleLifecycle
    description: FIPS 140-3 module state machine — PowerOff → SelfTest → Operational on KAT pass; Error is terminal.
    initial_state: PowerOff
    terminal_states: [Error]
    states:
      - name: PowerOff
        description: Module not yet initialized.
      - name: SelfTest
        description: Running power-up known-answer tests.
      - name: Operational
        description: All KATs passed.
      - name: Error
        description: A self-test failed or enter_error_state() was called; terminal, requires process restart.
    transitions:
      - from: PowerOff
        to: SelfTest
        trigger: initialize_with_tests
        condition: Called exactly once per process lifetime.
      - from: SelfTest
        to: Operational
        trigger: initialize_with_tests
        condition: All KatEntry tests pass.
      - from: SelfTest
        to: Error
        trigger: initialize_with_tests
        condition: Any KatEntry test fails.
      - from: Operational
        to: Error
        trigger: enter_error_state
        condition: Called by any code path detecting a runtime failure.

# ─────────────────────────────────────────────────────────────────────
# Modules (Rust crates)
# ─────────────────────────────────────────────────────────────────────

modules:
  - name: oxicrypt-module
    description: Module state machine, approved-mode indicator, and self-test runner; provides initialize_with_tests(), require_operational(), and the shared Error type.
    no_std: false
    depends_on: []

  - name: oxicrypt-sha
    description: SHA-1, SHA-2, and SHA-3 hash functions with one-shot and streaming APIs, plus a batched Sponge4 four-way Keccak sponge; default-off accel-sha dispatches SHA-256/SHA-224 to oxicrypt-sha-accel on x86_64 SHA-NI, and default-off accel-keccak dispatches Sponge4 to oxicrypt-keccak-accel on x86_64 AVX2.
    no_std: true
    depends_on: [oxicrypt-module]

  - name: oxicrypt-xof
    description: SHAKE128, SHAKE256, cSHAKE-128/256, KMAC-128/256, TupleHash, ParallelHash and their XOF variants (SP 800-185).
    no_std: true
    depends_on:
      - oxicrypt-module
      - oxicrypt-sha

  - name: oxicrypt-hmac
    description: HMAC over all 11 approved hashes via a generic Hmac<H, B, L> struct with per-variant type aliases.
    no_std: true
    depends_on:
      - oxicrypt-module
      - oxicrypt-sha

  - name: oxicrypt-cmac
    description: AES-CMAC (SP 800-38B) over AES-128/192/256.
    no_std: true
    depends_on:
      - oxicrypt-module
      - oxicrypt-aes

  - name: oxicrypt-aes
    description: AES block cipher (FIPS 197) and ECB/CBC/CTR/GCM/CCM/KW/KWP modes, generic over the BlockCipher trait.
    no_std: true
    depends_on: [oxicrypt-module]

  - name: oxicrypt-drbg
    description: CTR_DRBG (AES-128/192/256), Hash_DRBG and HMAC_DRBG (SHA-256/384/512) per SP 800-90A Rev. 1.
    no_std: true
    depends_on:
      - oxicrypt-module
      - oxicrypt-aes
      - oxicrypt-sha
      - oxicrypt-hmac

  - name: oxicrypt-kdf
    description: SP 800-108r1 KBKDF (counter/feedback/double-pipeline), HKDF (SP 800-56Cr2), and PBKDF2 (SP 800-132).
    no_std: true
    depends_on:
      - oxicrypt-module
      - oxicrypt-hmac

  - name: oxicrypt-rsa
    description: RSA-2048/3072/4096 PKCS#1 v1.5 and PSS sign/verify, OAEP encrypt/decrypt, and keygen, with CRT-path Bellcore verify-after-sign (IG D.G).
    no_std: true
    depends_on:
      - oxicrypt-module
      - oxicrypt-sha
      - oxicrypt-drbg

  - name: oxicrypt-ecdsa
    description: ECDSA P-256 and P-384 sign/verify/keygen with DRBG-backed rejection sampling and pairwise consistency tests.
    no_std: true
    depends_on:
      - oxicrypt-module
      - oxicrypt-sha
      - oxicrypt-drbg

  - name: oxicrypt-ecdh
    description: ECDH P-256 and P-384 CDH shared secret (SP 800-56Ar3).
    no_std: true
    depends_on:
      - oxicrypt-module
      - oxicrypt-ecdsa

  - name: oxicrypt-dh
    description: Finite-field DH-3072 key agreement and keygen over RFC 3526 Group 15 (SP 800-56Ar3).
    no_std: true
    depends_on:
      - oxicrypt-module
      - oxicrypt-rsa
      - oxicrypt-drbg

  - name: oxicrypt-entropy
    description: "SP 800-90B entropy-source scaffolding: NoiseSource abstraction, fixed-point min-entropy, RCT/APT health tests with startup gating and permanent poisoning, per-arch timer layer, CPU jitter source, and vetted SHA-256 conditioning; makes no entropy claims (pre-validation)."
    no_std: true
    depends_on: [oxicrypt-sha]

  - name: oxicrypt-timer
    description: "Audited read-only CPU timer/counter reads for the entropy source: serialized TSC (x86_64) and CNTVCT_EL0 (aarch64)."
    no_std: true
    depends_on: []

  - name: oxicrypt-ml-kem
    description: "ML-KEM-1024 (FIPS 203) key encapsulation: keygen, encapsulate, decapsulate with implicit-rejection construction."
    no_std: true
    depends_on:
      - oxicrypt-module
      - oxicrypt-sha
      - oxicrypt-drbg

  - name: oxicrypt-ml-dsa
    description: "ML-DSA-87 (FIPS 204) digital signatures: keygen, sign, verify with deterministic Fiat-Shamir-with-aborts signing; a default-off accel-keccak feature batches ExpandA four SHAKE-128 streams at a time through oxicrypt-sha's Sponge4, byte-identical to the scalar build."
    no_std: true
    depends_on:
      - oxicrypt-module
      - oxicrypt-sha

  - name: oxicrypt-lms
    description: "LMS hash-based stateful signatures (SP 800-208, RFC 8554, RFC 8708): the full 80-pair §A.3 grid, each pair a distinct LmsPrivateKey type, with an optional alloc-gated LmsSigningKey tree cache and a default-off rayon parallel feature."
    no_std: true
    depends_on:
      - oxicrypt-module
      - oxicrypt-sha
      - oxicrypt-zeroize

  - name: oxicrypt-xmss
    description: XMSS hash-based stateful signatures (SP 800-208 / RFC 8391), parameter set XMSS-SHA2_10_256, with WOTS+ and L-tree compression.
    no_std: true
    depends_on:
      - oxicrypt-module
      - oxicrypt-sha
      - oxicrypt-zeroize

  - name: oxicrypt-slh-dsa
    description: "SLH-DSA stateless hash-based signatures (FIPS 205): all 12 §11 parameter sets (SHA-2 and SHAKE, each 128/192/256 s and f), only SHA2-256s approved under CNSA 2.0."
    no_std: true
    depends_on:
      - oxicrypt-module
      - oxicrypt-sha
      - oxicrypt-xof

  - name: oxicrypt-eddsa
    description: Ed25519 deterministic sign/verify/keygen (RFC 8032, FIPS 186-5).
    no_std: true
    depends_on:
      - oxicrypt-module
      - oxicrypt-sha
      - oxicrypt-drbg

  - name: oxicrypt-integrity
    description: HMAC-SHA-256 software integrity check over the module binary, with a 64-byte reserved tag slot.
    no_std: false
    depends_on:
      - oxicrypt-module
      - oxicrypt-hmac

  - name: oxicrypt-zeroize
    description: "Volatile-write zeroization for CSP buffers: zeroize() for byte slices, zeroize_u32() for u32 arrays, zeroize_u64() for u64 arrays."
    no_std: true
    depends_on: []

  - name: oxicrypt-sha-accel
    description: Audited x86_64 SHA-NI acceleration for oxicrypt-sha; compiled in only via the default-off accel-sha feature.
    no_std: true
    depends_on: []

  - name: oxicrypt-aes-accel
    description: Audited x86_64 AES-NI block plus PCLMULQDQ GCM GHASH acceleration for oxicrypt-aes; compiled in only via the default-off accel-aes feature.
    no_std: true
    depends_on: []

  - name: oxicrypt-keccak-accel
    description: Audited x86_64 AVX2 4-way batched Keccak-f[1600] permutation for oxicrypt-sha; compiled in only behind a default-off feature, runtime-detected via CPUID.
    no_std: true
    depends_on: []

  - name: acvp-harness
    description: ACVP protocol harness and transport client; 78 handlers dispatch NIST ACVP vector sets offline or online against the demo server.
    no_std: false
    entry_points:
      - "acvp-harness dispatch <prompt.json> <response.json>"
      - "acvp-harness dispatch-shs <algorithm> <prompt.rsp> <response.json>"
      - "acvp-harness demo-run --cert <cert> --key <key> --totp-secret <hex>"
      - "acvp-harness resubmit <tsId> <vsId> --cert <cert> --key <key> --totp-secret <hex>"
    depends_on:
      - oxicrypt-module
      - oxicrypt-sha
      - oxicrypt-hmac
      - oxicrypt-aes
      - oxicrypt-drbg
      - all algorithm crates

  - name: esv-harness
    description: ESV protocol client for SP 800-90B entropy-source validation; builds and drives ESVP login, single/bulk token refresh, entropy-source registration, offline payload preflight, data-file multipart upload plus bounded processing-status polling, supporting-document upload, certify request builders, and a resumable per-submission session store, over acvp-harness's curl(1)/mTLS transport.
    no_std: false
    entry_points:
      - "esv-harness login-body < secret.b64"
      - "esv-harness bulk-refresh-body <jwt>... < secret.b64"
    depends_on:
      - acvp-harness

  - name: oxicrypt-ffi
    description: C ABI wrappers (extern "C") for language bindings, built as cdylib and staticlib.
    no_std: false
    depends_on:
      - oxicrypt-module
      - oxicrypt-sha
      - oxicrypt-hmac
      - oxicrypt-aes
      - oxicrypt-drbg
      - oxicrypt-ecdsa
      - oxicrypt-eddsa
      - oxicrypt-ecdh

  - name: oxicrypt-tls-kdf
    description: TLS 1.2 PRF and master-secret derivation (SP 800-135r1, RFC 5246, RFC 7627) plus TLS 1.3 HKDF-Expand-Label and Derive-Secret (RFC 8446 §7.1), generic over the HMAC PRF.
    no_std: true
    depends_on:
    - oxicrypt-module
    - oxicrypt-kdf
    - oxicrypt-hmac

  - name: oxicrypt-maxwell
    description: Out-of-boundary SP 800-90B min-entropy estimator suite with a NIST EA-tool parity harness; publish = false, so no API surface is described here.
    no_std: false
    depends_on:
    - oxicrypt-entropy

  - name: oxicrypt-test-vectors
    description: NIST-derived known-answer-test constants consumed by the power-up self-tests; test-support data rather than callable API, so no API surface is described here.
    no_std: true
    depends_on: []
  - name: oxi
    description: Command-line front end to the module, installed with `cargo install oxi` and self-describing via `oxi --lama`; a binary crate with no public Rust items, so no API surface is described here.
    no_std: false
    depends_on:
    - oxicrypt-module

  - name: doc-guard
    description: Out-of-boundary test crate asserting documentation claims against the workspace as built; publish = false, so no API surface is described here.
    no_std: false
    depends_on: []

  - name: ct-validation
    description: Out-of-boundary dudect-style timing-variation harness; publish = false, so no API surface is described here.
    no_std: false
    depends_on: []

  - name: oxicrypt-bench
    description: Out-of-boundary Criterion benchmark suite; publish = false, so no API surface is described here.
    no_std: false
    depends_on: []




# ─────────────────────────────────────────────────────────────────────
# Variant families — declarative legend for `family:` tags
# ─────────────────────────────────────────────────────────────────────

families:
  - name: sha-oneshot
    description: One-shot hash functions taking a message slice and returning a fixed-size digest array.
    applies_to: functions

  - name: sha-streaming-hasher
    description: Incremental hasher types exposing new/update/finalize with zeroize-on-drop state.
    applies_to: types

  - name: xof-streaming-hasher
    description: Extendable-output hasher types exposing new/update/finalize/squeeze, where squeeze may be called repeatedly for arbitrary-length output.
    applies_to: types

  - name: xof-fixed-hasher
    description: Fixed-output Keccak-derived hasher types exposing new/update/finalize_into, where the output length is bound into the hash.
    applies_to: types

  - name: xof-oneshot
    description: One-shot SP 800-185 / FIPS 202 XOF convenience functions returning a const-generic fixed-size output array.
    applies_to: functions

  - name: hmac-new
    description: HMAC keyed-hasher constructors taking a key slice and returning a zeroize-on-drop hasher.
    applies_to: functions

  - name: hmac-type
    description: HMAC keyed-hasher types exposing new/update/finalize with zeroize-on-drop ipad/opad state.
    applies_to: types

  - name: aes-mode-encrypt
    description: AES mode-of-operation encrypt entry points taking a key and plaintext and producing ciphertext.
    applies_to: functions

  - name: aes-mode-decrypt
    description: AES mode-of-operation decrypt entry points taking a key and ciphertext and producing plaintext.
    applies_to: functions

  - name: cmac-aes
    description: CMAC-AES one-shot tag functions taking a key and message and returning a 16-byte tag.
    applies_to: functions

  - name: kdf-sp800108-mode
    description: SP 800-108 KDF modes (Counter, Feedback, Double-Pipeline) over HMAC-SHA-256, exposing identical `derive` entry points.
    applies_to: functions

  - name: ffi-drbg-lifecycle
    description: C ABI handle lifecycle for the three SP 800-90A DRBG mechanisms, taking an opaque handle through allocation, instantiation, reseeding, generation and release.
    applies_to: functions

# ─────────────────────────────────────────────────────────────────────
# Types
# ─────────────────────────────────────────────────────────────────────

  - name: xof-hasher-new
    description: Extendable-output and SP 800-185 hasher constructors, one per variant.
    applies_to: functions

  - name: xof-hasher-update
    description: Extendable-output hasher absorb methods taking a message slice.
    applies_to: functions

  - name: xof-hasher-finalize-into
    description: SP 800-185 hasher finalizers writing into a caller-sized output buffer.
    applies_to: functions

  - name: slh-dsa-keygen
    description: SLH-DSA key generation, one per FIPS 205 parameter set.
    applies_to: functions

  - name: slh-dsa-sign
    description: SLH-DSA signature generation, one per FIPS 205 parameter set.
    applies_to: functions

  - name: slh-dsa-verify
    description: SLH-DSA signature verification, one per FIPS 205 parameter set.
    applies_to: functions

  - name: ml-kem-keygen
    description: ML-KEM key generation, one per FIPS 203 parameter set.
    applies_to: functions

  - name: ml-kem-encapsulate
    description: ML-KEM encapsulation, one per FIPS 203 parameter set.
    applies_to: functions

  - name: ml-kem-decapsulate
    description: ML-KEM decapsulation, one per FIPS 203 parameter set.
    applies_to: functions

  - name: ml-dsa-keygen
    description: ML-DSA key generation, one per FIPS 204 parameter set.
    applies_to: functions

  - name: ml-dsa-sign
    description: ML-DSA signature generation, one per FIPS 204 parameter set.
    applies_to: functions

  - name: ml-dsa-verify
    description: ML-DSA signature verification, one per FIPS 204 parameter set.
    applies_to: functions

types:
  - name: State
    module: oxicrypt-module
    kind: enum
    description: Module lifecycle state.
    variants:
      - name: PowerOff
        description: Not initialized.
      - name: SelfTest
        description: Running KATs.
      - name: Operational
        description: Ready for approved services.
      - name: Error
        description: Terminal failure.

  - name: Error
    module: oxicrypt-module
    kind: enum
    description: Error type returned by all approved-service functions.
    variants:
      - name: NotOperational
        description: Module is not in Operational state.
      - name: SelfTestFailed
        description: A power-up KAT failed.
      - name: ConditionalTestFailed
        description: A conditional self-test (e.g., PCT) failed.
      - name: AlreadyInitialized
        description: initialize_with_tests() called more than once.
      - name: InvalidInput
        description: Caller supplied invalid parameters.
      - name: AlgorithmRestricted
        description: Service is not permitted under the active algorithm profile.
      - name: NotImplemented
        description: Algorithm exists in Service enum but implementation is not yet available (stub).

  - name: AlgorithmProfile
    module: oxicrypt-module
    kind: enum
    description: Runtime algorithm restriction profile, set once via initialize_with_profile(); Unrestricted is the default.
    variants:
      - name: Unrestricted
        description: All FIPS-approved algorithms available.
      - name: Cnsa2
        description: "CNSA 2.0: quantum-resistant algorithms only."
      - name: Cnsa1
        description: "CNSA 1.0: classical transition period algorithms."

  - name: Service
    module: oxicrypt-module
    kind: enum
    description: Per-algorithm-and-parameter enumeration of every approved service, used with require_allowed() to enforce profile restrictions.

  - name: KatEntry
    module: oxicrypt-module
    kind: struct
    description: A single known-answer test entry for power-up self-tests.
    fields:
      - name: name
        type: "&'static str"
        description: Human-readable test name.
      - name: run
        type: "fn() -> Result<(), SelfTestFailure>"
        description: Function that executes the KAT and returns Ok or Err.

  - name: OxiResult
    module: oxicrypt-ffi
    kind: enum
    description: "C ABI status code returned by every oxi_* function, banded by source crate. #[repr(C)] for stable C-side discriminants."
    variants:
      - name: Ok
        description: Operation succeeded.
      - name: NotOperational
        description: Module not in Operational state.
      - name: SelfTestFailed
        description: Power-up self-test failed during init.
      - name: ConditionalTestFailed
        description: Conditional self-test (DRBG CRNGT, PCT) failed during operation.
      - name: AlreadyInitialized
        description: oxi_init called more than once.
      - name: InvalidInput
        description: Cryptographic input is not a valid domain element.
      - name: AlgorithmRestricted
        description: Service blocked by the active algorithm profile.
      - name: NotImplemented
        description: Service is in the Service enum but implementation is a stub.
      - name: Uninstantiated
        description: generate or reseed was called before instantiate succeeded on this DRBG handle.
      - name: ReseedRequired
        description: reseed_counter reached the SP 800-90A Table 3 reseed-interval bound.
      - name: NullPointer
        description: Caller passed a NULL pointer where one is required.
      - name: BufferTooSmall
        description: Caller-allocated output buffer is smaller than the documented minimum.
      - name: OutputTooLong
        description: Requested output exceeds the family's bound (HKDF-Expand 255*HashLen per RFC 5869 section 2.3; HMAC_DRBG generate 2^19 bits per SP 800-90A Table 3).
      - name: NotBlockAligned
        description: Input length is not aligned to the cipher block size.
      - name: InvalidIvLength
        description: IV length doesn't match mode specification (e.g.
      - name: TagMismatch
        description: AEAD tag verification failed.
      - name: LengthMismatch
        description: Input/output buffer lengths don't match.
      - name: InvalidNonceLength
        description: Nonce length doesn't match mode specification.
      - name: InvalidTagLength
        description: Tag length doesn't match mode specification.
      - name: InvalidPayloadLength
        description: Payload length exceeds the mode's allowed maximum.
      - name: InvalidAadLength
        description: AAD length exceeds the mode's allowed maximum.
      - name: Internal
        description: Catch-all for should-never-happen cases.

  - name: Sha256
    module: oxicrypt-sha
    family: sha-streaming-hasher
    kind: struct
    description: Streaming SHA-256 hasher.
    size_bytes: null  # Internal state, not fixed public size
    implements: []
    security:
      contains_secret: false
      zeroize_on_drop: true
      constant_time: true

  - name: HmacSha256
    module: oxicrypt-hmac
    family: hmac-type
    kind: alias
    description: "Type alias for Hmac<Sha256, 64, 32>."
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: true

  - name: Aes128Key
    module: oxicrypt-aes
    kind: struct
    description: AES-128 expanded key schedule.
    size_bytes: null  # Expanded schedule, not just the 16-byte key
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: false  # Table-based S-box; disclosed in security policy

  - name: Aes192Key
    module: oxicrypt-aes
    kind: struct
    description: AES-192 expanded key schedule.
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: false

  - name: Aes256Key
    module: oxicrypt-aes
    kind: struct
    description: AES-256 expanded key schedule.
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: false

  - name: ModeError
    module: oxicrypt-aes
    kind: enum
    description: Error type for AES mode operations.
    variants:
      - name: NotBlockAligned
        description: Input length is not a multiple of 16 bytes.
      - name: InvalidIvLength
        description: IV/nonce is wrong size for the mode.
      - name: TagMismatch
        description: GCM/CCM authentication tag verification failed.
      - name: LengthMismatch
        description: Output buffer is wrong size.
      - name: InvalidNonceLength
        description: CCM nonce outside valid range.
      - name: InvalidTagLength
        description: CCM tag length outside valid range.
      - name: InvalidPayloadLength
        description: Payload exceeds mode's maximum.
      - name: InvalidAadLength
        description: AAD exceeds mode's maximum.

  - name: CtrDrbgAes256
    module: oxicrypt-drbg
    kind: struct
    description: CTR_DRBG instantiated with AES-256.
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: true

  - name: DrbgError
    module: oxicrypt-drbg
    kind: enum
    description: Error type for DRBG operations.
    variants:
      - name: Uninstantiated
        description: generate or reseed called before instantiate.
      - name: ReseedRequired
        description: Reseed counter exceeded SP 800-90A limit.
      - name: InputTooLong
        description: Entropy or additional input exceeds maximum.
      - name: InvalidSeedLength
        description: Seed material wrong length for no-df instantiate.
      - name: RequestTooLong
        description: Requested output exceeds single-call maximum.

  - name: RsaPrivateKey2048
    module: oxicrypt-rsa
    kind: struct
    description: RSA-2048 private key holding (n, e, d) and optional CRT components; runs a pairwise consistency test on construction.
    size_bytes: null
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: true

  - name: EcdsaP256PrivateKey
    module: oxicrypt-ecdsa
    kind: struct
    description: ECDSA P-256 private key handle storing (d, Q); runs a sign-and-verify PCT on construction.
    fields:
      - name: d
        type: "[u8; 32]"
        description: Private scalar.
        constraints: "1 <= d < n (P-256 group order)"
      - name: q
        type: "[u8; 65]"
        description: "Uncompressed SEC1 public key: 0x04 || X || Y."
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: true

  - name: Ed25519PrivateKey
    module: oxicrypt-eddsa
    kind: struct
    description: Ed25519 private key handle storing (seed, A); runs a sign-and-verify PCT on construction.
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: true

  - name: LmsPrivateKey
    module: oxicrypt-lms
    kind: struct
    description: LMS stateful private key (LMS_SHA256_M32_H10 / LMOTS_SHA256_N32_W4) holding tree seed, identifier I, and current leaf index; the caller MUST persist key state after every sign call.
    fields:
      - name: seed
        type: "[u8; 32]"
        description: "Tree seed (secret)."
      - name: identifier
        type: "[u8; 16]"
        description: "Tree identifier I (public, binds hash computations to this tree)."
      - name: leaf_index
        type: u32
        description: "Next unused leaf index (0..1023)."
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: true

  - name: LmsSigningKey
