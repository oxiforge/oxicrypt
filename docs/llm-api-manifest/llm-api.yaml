  # ── DRBG ──────────────────────────────────────────────────────────

  - name: "CtrDrbgAes256::instantiate_df"
    module: oxicrypt-drbg
    description: Instantiate CTR_DRBG with AES-256 using the derivation function.
    signature: >-
      pub fn instantiate_df(&mut self, entropy: &[u8], nonce: &[u8],
      personalization: &[u8]) -> Result<(), DrbgError>
    parameters:
      - name: entropy
        type: "&[u8]"
        direction: in
        description: Entropy input from a noise source.
        constraints:
          valid_range: "1..=192 bytes (MAX_DF_INPUT shared across all inputs)"
      - name: nonce
        type: "&[u8]"
        direction: in
        description: Nonce; per SP 800-90A must provide at least security_strength/2 bits of entropy or be a non-repeating value.
        constraints:
          valid_range: "0..=192 bytes"
      - name: personalization
        type: "&[u8]"
        direction: in
        description: Optional personalization string.
        constraints:
          valid_range: "0..=192 bytes"
          nullability: required
    returns:
      type: "Result<(), DrbgError>"
      description: Ok if instantiation succeeds.
      error_variants:
        - name: InputTooLong
          condition: "entropy.len() + nonce.len() + personalization.len() > 192"
    preconditions:
      - description: DRBG must be in uninstantiated state (new or after uninstantiate).
    postconditions:
      - description: DRBG is instantiated and ready for generate calls.
    sequencing:
      must_call_after:
        - generate_df
        - reseed_df
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    example:
      language: rust
      code: |
        let mut drbg = oxicrypt_drbg::CtrDrbgAes256::new();
        drbg.instantiate_df(&entropy, &nonce, b"my-app")?;
        let mut out = [0u8; 32];
        drbg.generate_df(&mut out, &[])?;

  - name: "CtrDrbgAes256::generate_df"
    module: oxicrypt-drbg
    description: Generate random bytes from an instantiated CTR_DRBG.
    signature: >-
      pub fn generate_df(&mut self, out: &mut [u8],
      additional_input: &[u8]) -> Result<(), DrbgError>
    parameters:
      - name: out
        type: "&mut [u8]"
        direction: out
        description: Buffer to fill with random bytes.
        constraints:
          valid_range: "1..=65536 bytes per call"
      - name: additional_input
        type: "&[u8]"
        direction: in
        description: Optional additional input.
        constraints:
          valid_range: "0..=192 bytes"
    returns:
      type: "Result<(), DrbgError>"
      error_variants:
        - name: Uninstantiated
          condition: DRBG was not instantiated.
        - name: ReseedRequired
          condition: Reseed counter exceeded 2^48.
        - name: RequestTooLong
          condition: "out.len() > 65536"
        - name: InputTooLong
          condition: "additional_input.len() > 192"
    preconditions:
      - description: DRBG must be instantiated.
        check: Must have called instantiate_df or instantiate_no_df.
    postconditions:
      - description: out is filled with pseudorandom bytes.
      - description: Internal reseed counter incremented.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational

  # ── Entropy (SP 800-90B scaffolding) ──────────────────────────────

  - name: EntropyPipeline::new
    module: oxicrypt-entropy
    description: Construct an entropy pipeline, injecting the claimed min-entropy per sample and the health-test alpha; refuses (never clamps) claims above the source ceiling, declared sample width, or without APT table coverage.
    signature: "pub fn new(source: S, claimed_h: MinEntropy, alpha: Alpha) -> Result<EntropyPipeline<S>, EntropyError>"
    parameters:
      - name: source
        type: "S"
        direction: in
        description: The noise source this pipeline is bound to for its lifetime.
        constraints:
          nullability: required
          valid_range: any type implementing NoiseSource
      - name: claimed_h
        type: "MinEntropy"
        direction: in
        description: Claimed min-entropy per sample; refused rather than clamped if it exceeds the source ceiling or the declared sample width.
        constraints:
          nullability: required
          valid_range: at most min(NoiseSource::max_claimable_h, sample width in bits)
      - name: alpha
        type: "Alpha"
        direction: in
        description: Health-test cutoff-generating parameter that determines the APT cutoff.
        constraints:
          nullability: required
          valid_range: must have precomputed APT cutoff coverage for this alpha, alphabet and H
    returns:
      type: "Result<EntropyPipeline<S>, EntropyError>"
      description: Pipeline (awaiting startup) on success; typed refusal otherwise.
      error_variants:
        - name: ClaimExceedsCeiling
          condition: The claimed min-entropy per sample exceeds the source ceiling; the claim is refused rather than clamped.
        - name: ClaimExceedsSampleWidth
          condition: The claimed min-entropy per sample exceeds the declared sample width, or the alpha has no APT table coverage.
        - name: Health
          condition: The requested alpha, alphabet and H point has no precomputed APT cutoff coverage.

  - name: EntropyPipeline::run_startup
    module: oxicrypt-entropy
    description: "Run the startup tests: continuous health tests over at least 1024 consecutive samples (90B 4.3); tested samples are discarded and failure permanently poisons the pipeline."
    signature: "pub fn run_startup(&mut self) -> Result<(), EntropyError>"
    returns:
      type: "Result<(), EntropyError>"
      description: Operational on success; NotReady if already started; Health on failure.
      error_variants:
        - name: NotReady
          condition: Startup has already run on this pipeline.
        - name: Health
          condition: A continuous health test failed; the pipeline is permanently poisoned.

  - name: EntropyPipeline::on_demand_test
    module: oxicrypt-entropy
    description: "On-demand testing (90B 4.3): re-runs the startup battery on fresh test state, only while operational; tested samples discarded and failure permanently poisons."
    signature: "pub fn on_demand_test(&mut self) -> Result<(), EntropyError>"
    returns:
      type: "Result<(), EntropyError>"
      description: Ok when the battery passes; typed error otherwise.
      error_variants:
        - name: NotReady
          condition: The pipeline is not operational, having not completed startup or having been poisoned.
        - name: Health
          condition: The re-run battery failed; the pipeline is permanently poisoned.

  - name: EntropyPipeline::sample
    module: oxicrypt-entropy
    description: Emit one health-tested raw sample, the ONLY path by which a sample leaves the pipeline; NotReady before startup or after poisoning, and a failing sample is never released.
    signature: "pub fn sample(&mut self) -> Result<RawSample, EntropyError>"
    returns:
      type: "Result<RawSample, EntropyError>"
      description: One tested sample, or a typed refusal.
      error_variants:
        - name: NotReady
          condition: Startup has not completed, or the pipeline has been poisoned by a health-test failure.
        - name: Health
          condition: The sample failed a continuous health test and is never released.
        - name: Source
          condition: The underlying noise source failed to produce a sample.

  - name: MinEntropy::from_fraction_floor
    module: oxicrypt-entropy
    description: Convert num/den bits of min-entropy to the 1/256-bit grid, rounding down so a claim is never overstated.
    signature: "pub fn from_fraction_floor(num: u64, den: u64) -> Option<MinEntropy>"
    parameters:
      - name: num
        type: "u64"
        direction: in
        description: Numerator of the claim expressed as num/den bits.
        constraints:
          nullability: required
          valid_range: any
      - name: den
        type: "u64"
        direction: in
        description: Denominator of the claim; the value is rounded down to the 1/256-bit grid, never up.
        constraints:
          nullability: required
          valid_range: non-zero; zero returns None
    returns:
      type: "Option<MinEntropy>"
      description: Floored fixed-point value; None on zero denominator or overflow.

  - name: SourceSpec::new
    module: oxicrypt-entropy
    description: Validated constructor — sample width must be 1..=8 bits.
    signature: "pub const fn new(sample_width_bits: u8) -> Option<SourceSpec>"
    parameters:
      - name: sample_width_bits
        type: "u8"
        direction: in
        description: Declared width in bits of each sample the source emits.
        constraints:
          nullability: required
          valid_range: 1..=8; outside this range returns None
    returns:
      type: "Option<SourceSpec>"
      description: Spec, or None for width 0 or greater than 8.

  - name: TimerSource::default_for_target
    module: oxicrypt-entropy
    description: "Per-architecture default timer source: x86_64 -> RawCounter (TSC), aarch64 and others -> OsNanoClock."
    signature: "pub const fn default_for_target() -> TimerSource"
    returns:
      type: TimerSource
      description: The default for the compilation target.

  - name: wrapping_delta
    module: oxicrypt-entropy
    description: Width-aware wrapping delta between two counter reads; a masked delta with the width's top bit set is a Backwards violation.
    signature: "pub fn wrapping_delta(prev: u64, now: u64, width_bits: u32) -> Result<u64, TimerError>"
    parameters:
      - name: prev
        type: "u64"
        direction: in
        description: The previous raw counter read.
        constraints:
          nullability: required
          valid_range: any
      - name: now
        type: "u64"
        direction: in
        description: The current raw counter read.
        constraints:
          nullability: required
          valid_range: any
      - name: width_bits
        type: "u32"
        direction: in
        description: The counter significant width in bits; legitimate wraparound within this width yields the correct small delta.
        constraints:
          nullability: required
          valid_range: 1..=64
    returns:
      type: "Result<u64, TimerError>"
      description: The delta, or Backwards (caller discards the sample).
      error_variants:
        - name: Backwards
          condition: The masked delta has the width top bit set, indicating the counter moved backwards; the caller discards the sample.

  - name: measure_adequacy
    module: oxicrypt-entropy
    description: Bare-read adequacy measurement over config.samples consecutive reads (zero-delta fraction, min positive delta, distinct-delta variety, backwards violations); refusal policy lives on AdequacyReport (ensure_sound for bare reads; ensure_adequate on the operational workload-measured signal).
    signature: "pub fn measure_adequacy<T: TimerRead>(timer: &mut T, config: &AdequacyConfig) -> AdequacyReport"
    parameters:
      - name: timer
        type: "&mut T"
        direction: in
        description: The timer to sample; read config.samples times consecutively.
        constraints:
          nullability: required
          valid_range: any type implementing TimerRead
      - name: config
        type: "&AdequacyConfig"
        direction: in
        description: Sample count and the thresholds the report is measured against.
        constraints:
          nullability: required
          valid_range: required
    returns:
      type: AdequacyReport
      description: Observed behavior for adequacy adjudication.

  - name: collection::run
    module: oxicrypt-entropy
    description: Entry point of the off-boundary collect binary (default-off collection feature); writes SP 800-90B raw and restart datasets under a versioned per-OE layout with a sha256 manifest, resumable via a content-hash checkpoint.
    signature: "pub fn run<W: Write>(args: &[String], out: &mut W) -> Result<(), CollectionError>"
    parameters:
      - name: args
        type: "&[String]"
        direction: in
        description: Command-line arguments for the off-boundary collect binary.
        constraints:
          nullability: required
          valid_range: any
      - name: out
        type: "&mut W"
        direction: in
        description: Injected sink for operator-facing output; the binary passes a locked stdout handle, so the library performs no direct stdout writes.
        constraints:
          nullability: required
          valid_range: any type implementing Write
    returns:
      type: "Result<(), CollectionError>"
      description: Ok on success, else an operator-facing collection error.
      error_variants:
        - name: CollectionError
          condition: The only error this returns. It is a newtype over a String carrying an operator-facing message, so the cause cannot be branched on programmatically.


  - name: oxi_timer::read_raw_counter
    module: oxicrypt-timer
    description: "Serialized raw counter read: lfence+rdtsc (x86_64) or ISB+MRS CNTVCT_EL0 (aarch64); side-effect-free, with nominal frequency never to be trusted."
    signature: "pub fn read_raw_counter() -> u64"
    returns:
      type: u64
      description: Raw counter value.

