      - name: message
        type: "&[u8]"
        direction: in
        description: "Original message."
      - name: signature
        type: "&[u8; 2500]"
        constraints:
          size: 2500
        direction: in
        description: "2500-byte XMSS signature."
    returns:
      type: "Result<(), Error>"
      description: "Ok(()) if valid, Err(InvalidInput) if invalid."
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: XMSS blocked by active profile.
        - name: InvalidInput
          condition: Signature verification failed or malformed inputs.
    preconditions:
      - description: Module must be Operational.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: true
      fips_gate: Operational
    profiles:
