  - name: BlockCipher
    module: oxicrypt-aes
    kind: trait
    description: Sealed trait implemented by Aes128Key, Aes192Key, and Aes256Key; all AES mode functions are generic over it.

  - name: KdfError
    module: oxicrypt-kdf
    kind: enum
    description: Error type returned by all HKDF, SP 800-108, and PBKDF2 functions.
    variants:
      - name: Module
        description: Module state error (wraps oxicrypt_module::Error — NotOperational, AlgorithmRestricted, etc.).
      - name: OutputTooLong
        description: "Requested OKM length exceeds the algorithm maximum: 255*HashLen for HKDF; (2^32-1)*HashLen for PBKDF2."

  - name: VerifyAnyError
    module: oxicrypt-lms
    kind: enum
    description: Error type returned by verify_any, keeping input that names no LMS parameter pair apart from a signature that fails to verify.
    variants:
      - name: Unroutable
        description: "The input names none of the 80 pairs: public key under 8 bytes, a typecode pair outside SP 800-208 §4.1-§4.4, or a key or signature length that is not the named pair's, so no verifier ran."
      - name: VerificationFailed
        description: The named pair's verifier rejected the signature.
      - name: Module
        description: The module gate refused the named pair's service (wraps oxicrypt_module::Error — NotOperational, AlgorithmRestricted).

  - name: MinEntropy
    module: oxicrypt-entropy
    kind: struct
    description: Exact fixed-point min-entropy in 1/256-bit steps (H_STEPS_PER_BIT = 256); inexact conversions round down so a claim is never overstated.

  - name: SpecRatio
    module: oxicrypt-entropy
    kind: struct
    description: Exact rational (num/den) carrying a non-integer SP 800-90B value, e.g. the restart sanity-check alpha 1/200000 (90B §3.1.4.3).
    fields:
      - name: num
        type: u32
        description: Numerator.
      - name: den
        type: u32
        description: Denominator (non-zero by construction of each constant).

  - name: AptTable2Row
    module: oxicrypt-entropy
    kind: struct
    description: "One reference row of SP 800-90B Table 2 (§4.4.2): the APT cutoff C for a min-entropy level at alpha = 2^-20."
    fields:
      - name: h
        type: SpecRatio
        description: Min-entropy per sample (bits, exact rational).
      - name: cutoff
        type: u32
        description: Example cutoff value C.

  - name: SourceSpec
    module: oxicrypt-entropy
    kind: struct
    description: "Declared output alphabet of a noise source: sample width 1..=8 bits, validated at construction; is_binary() selects the APT window size."

  - name: TimerSource
    module: oxicrypt-entropy
    kind: enum
    description: Timer/counter a jitter-class noise source reads; configuration vocabulary only, with per-arch defaults and Phase-0 unselectability enforced by the timer layer.
    variants:
      - name: RawCounter
        description: Raw CPU cycle counter (TSC on x86_64, CNTVCT on aarch64).
      - name: OsNanoClock
        description: OS-provided nanosecond clock.
      - name: InternalTimerThread
        description: Reserved — unimplemented and unselectable in Phase 0.

  - name: SourceMetadata
    module: oxicrypt-entropy
    kind: struct
    description: "Collection-environment identity recorded with every dataset: timer source, nominal counter frequency, CPU model, OS, and collection parameters."

  - name: SourceError
    module: oxicrypt-entropy
    kind: enum
    description: Non-exhaustive noise-source failure.
    variants:
      - name: Unavailable
        description: The source cannot currently produce samples.
      - name: Module
        description: The module refused the source's hash computation (wraps oxicrypt_module::Error).

  - name: EntropyError
    module: oxicrypt-entropy
    kind: enum
    description: Typed entropy-pipeline errors; construction refuses (never clamps) a claim above the source ceiling or declared sample width.
    variants:
      - name: ClaimExceedsCeiling
        description: Injected claim exceeds the source's design-anchored ceiling.
      - name: ClaimExceedsSampleWidth
        description: Injected claim exceeds the information content of the declared width.
      - name: Source
        description: Underlying noise-source failure (wraps SourceError).
      - name: Module
        description: The module refused the pipeline's hash computation (wraps oxicrypt_module::Error); the pipeline is not poisoned.

  - name: JitterConfig
    module: oxicrypt-entropy
    kind: struct
    description: "Jitter-source construction config: adequacy thresholds, recorded TimerSource, and collection-environment identity strings."

  - name: JitterSource
    module: oxicrypt-entropy
    kind: struct
    description: CPU execution-time jitter noise source (sealed NoiseSource impl, generic over TimerRead); new(timer, config) runs the two-stage timer-adequacy self-check (bare-read soundness via ensure_sound, then delta variety on workload_samples workload-measured deltas via ensure_varied) and emits 4-bit digitized delta symbols with a design ceiling of 1 bit/sample; adequacy() returns the workload-signal report, bare_adequacy() the bare-read report.

  - name: TimerError
    module: oxicrypt-entropy
    kind: enum
    description: "Typed timer-layer errors (non-exhaustive): Unsupported, Unavailable, Backwards, Inadequate { reason, report }, Module."
    variants:
      - name: Unsupported
        description: Reserved timer source, unselectable this phase.
      - name: Unavailable
        description: Timer source not compiled into this build.
      - name: Backwards
        description: Read went backwards; sample must be discarded.
      - name: Inadequate
        description: "Measured behavior refused; struct variant carrying reason: InadequacyReason and report: AdequacyReport (the measured evidence)."
      - name: Module
        description: The module refused the workload's hash computation (wraps oxicrypt_module::Error).

  - name: InadequacyReason
    module: oxicrypt-entropy
    kind: enum
    description: Why the adequacy check refused (TooCoarse / TooUniform / NonMonotonic).
    variants:
      - name: TooCoarse
        description: Zero-delta fraction above the configured bound.
      - name: TooUniform
        description: Too few distinct positive delta values.
      - name: NonMonotonic
        description: Backwards violations observed during measurement.

  - name: AdequacyConfig
    module: oxicrypt-entropy
    kind: struct
    description: "Adequacy thresholds: conservative engineering defaults (4096 bare-read samples, 256 workload_samples for the stage-2 workload measurement, max 900 permille zero deltas, min 4 distinct deltas), explicitly NOT SP 800-90B values; min_distinct_deltas is clamped below at MIN_DISTINCT_DELTAS_FLOOR by ensure_varied."


  - name: AdequacyReport
    module: oxicrypt-entropy
    kind: struct
    description: "Observed timer behavior: deltas, zero deltas, min positive delta, bounded distinct-delta count, backwards violations. ensure_sound(&AdequacyConfig) gates monotonicity+coarseness, ensure_varied(&AdequacyConfig) gates delta variety (bound clamped at MIN_DISTINCT_DELTAS_FLOOR), ensure_adequate(&AdequacyConfig) applies all gates to one measured signal; every refusal carries this report."

  - name: AdequacyAccumulator
    module: oxicrypt-entropy
    kind: struct
    description: "Bounded no-alloc delta-observation accumulator: new(), record(Result<u64, TimerError>), finish() -> AdequacyReport; backs measure_adequacy and the jitter source's workload-signal measurement."

  - name: TimerRead
    module: oxicrypt-entropy
    kind: trait
    description: Sealed counter-read abstraction (read() -> u64, width_bits()), implemented by PlatformTimer / RawCounterTimer / OsNanoClockTimer and synthetic test timers.

  - name: PlatformTimer
    module: oxicrypt-entropy
    kind: enum
    description: Platform timer for a configured TimerSource; new(source) returns typed Unsupported for InternalTimerThread and Unavailable for sources not compiled in.

  - name: Alpha
    module: oxicrypt-entropy
    kind: struct
    description: Health-test false-positive probability, restricted to alpha = 2^-a with a in 20..=40 (90B 4.3); default is 2^-30.

  - name: HealthTest
    module: oxicrypt-entropy
    kind: enum
    description: Which approved continuous test failed (non-exhaustive).
    variants:
      - name: Rct
        description: Repetition Count Test (90B 4.4.1).
      - name: Apt
        description: Adaptive Proportion Test (90B 4.4.2).

  - name: HealthError
    module: oxicrypt-entropy
    kind: enum
    description: "Typed health-layer errors (non-exhaustive): Failed(HealthTest) (permanent), Poisoned, UnsupportedAlpha."
    variants:
      - name: Failed
        description: A continuous test failed; the monitor is permanently poisoned.
      - name: Poisoned
        description: An earlier failure already poisoned this monitor.
      - name: UnsupportedAlpha
        description: No precomputed cutoff coverage for the requested point.

  - name: RepetitionCountTest
    module: oxicrypt-entropy
    kind: struct
    description: 90B 4.4.1 RCT with cutoff C = 1 + ceil(-log2(alpha)/H) in pure integer arithmetic over the fixed-point claim.

  - name: AdaptiveProportionTest
    module: oxicrypt-entropy
    kind: struct
    description: 90B 4.4.2 APT, window 1024 (binary) / 512 (non-binary); cutoff from the precomputed Table 2 grid, claimed H rounded down so the claim is never overstated.

  - name: HealthMonitor
    module: oxicrypt-entropy
    kind: struct
    description: RCT + APT over every sample with permanent poisoning on any failure; the failing sample is never released and only re-instantiation clears the condition.

  - name: NoiseSource
    module: oxicrypt-entropy
    kind: trait
    description: Stage one of the three-stage pipeline (NoiseSource -> health tests -> conditioner); SEALED and object-safe.

  - name: EntropyPipeline
    module: oxicrypt-entropy
    kind: struct
    description: Pipeline skeleton bound to one NoiseSource and one injected min-entropy claim; health-test and conditioning stages attach as they land.

  - name: OxiRsaPrivateKey2048
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque RSA-2048 private-key handle that passed an IG 10.3.A pairwise consistency test on the CRT path at construction; carries n (256 bytes), e, d (256 bytes), and CRT components p/q/dP/dQ/qInv (128 bytes each), zeroising d and the CRT halves on drop.

  - name: OxiRsaPrivateKey3072
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque RSA-3072 private-key handle; 384-byte modulus, 192-byte CRT halves, zeroising d and the five CRT halves on drop.

  - name: OxiRsaPrivateKey4096
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque RSA-4096 private-key handle; 512-byte modulus, 256-byte CRT halves, zeroising d and the five CRT halves on drop.

  - name: CollectionError
    module: oxicrypt-entropy
    kind: struct
    description: Operator-facing error from the off-boundary collection tool, folding typed EntropyError and filesystem IO errors into one message.

  - name: OxiEcdsaP256PrivateKey
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque ECDSA P-256 private-key handle that passed an IG 10.3.A pairwise consistency test at construction; carries the 32-byte scalar d and 65-byte SEC1 public key Q, and zeroises d on drop.

  - name: OxiEcdsaP384PrivateKey
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque ECDSA P-384 private-key handle that passed an IG 10.3.A pairwise consistency test at construction; carries the 48-byte scalar d and 97-byte SEC1 public key Q, and zeroises d on drop.

  - name: OxiHmacDrbgSha384
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque HMAC_DRBG-SHA-384 handle; same per-call-mutating thread-safety and Drop-zeroize contract as OxiHmacDrbgSha256.

  - name: OxiHmacDrbgSha512
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque HMAC_DRBG-SHA-512 handle; same per-call-mutating thread-safety and Drop-zeroize contract as OxiHmacDrbgSha256, with a wider 64-byte (K, V).

  - name: OxiHashDrbgSha256
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque Hash_DRBG-SHA-256 handle; same per-call-mutating thread-safety and Drop-zeroize contract as OxiHmacDrbgSha256.

  - name: OxiHashDrbgSha384
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque Hash_DRBG-SHA-384 handle; instantiated at security strength 256 bits (SP 800-57 Part 1, SP 800-90A Table 2).

  - name: OxiHashDrbgSha512
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque Hash_DRBG-SHA-512 handle; per SP 800-90A Table 2, security strength 256 bits.

  - name: OxiCtrDrbgAes128
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque CTR_DRBG-AES-128 handle; same per-call-mutating thread-safety and Drop-zeroize (Key, V, reseed_counter) contract as OxiHmacDrbgSha256.

  - name: OxiCtrDrbgAes192
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque CTR_DRBG-AES-192 handle; per SP 800-90A Table 3, security strength 192 bits, SEED_LEN = 40.

  - name: OxiCtrDrbgAes256
    kind: opaque
    module: oxicrypt-ffi
    description: Opaque CTR_DRBG-AES-256 handle; per SP 800-90A Table 3, security strength 256 bits, SEED_LEN = 48.

  - name: IntegritySlot
    module: oxicrypt-integrity
    kind: struct
    description: repr(C) 64 KiB reserved slot embedded in the module's runtime image, holding the format version 4 header, the typed entry table, the string table and the ML-DSA-87 signature between a header and a footer magic.
    size_bytes: 65536
    fields:
    - name: hdr
      type: '[u8; 16]'
      description: Header magic; equals SLOT_HEADER_MAGIC in a valid slot.
    - name: body
      type: '[u8; SLOT_BODY_SIZE]'
      description: Opaque body holding the header fields, entry table and string table; interior layout is defined by the field offsets in the slot module and parsed from bytes, never by Rust field access.
    - name: ftr
      type: '[u8; 16]'
      description: Footer magic; equals SLOT_FOOTER_MAGIC in a valid slot.
    security:
      contains_secret: false
      zeroize_on_drop: false
      constant_time: false

  - name: KeyRecord
    module: oxicrypt-integrity
    kind: struct
    description: repr(C) record holding the embedded ML-DSA-87 verifying key between two magics, so the signer can find it in the file; the key is all zero in a build without OXICRYPT_INTEGRITY_VERIFY_KEY.
    size_bytes: 2624
    fields:
    - name: hdr
      type: '[u8; 16]'
      description: Header magic; equals KEY_RECORD_HEADER_MAGIC.
    - name: key
      type: '[u8; VERIFY_KEY_LEN]'
      description: The encoded ML-DSA-87 public key (2,592 bytes); all zero when the build had none.
    - name: ftr
      type: '[u8; 16]'
      description: Footer magic; equals KEY_RECORD_FOOTER_MAGIC.
    security:
      contains_secret: false
      zeroize_on_drop: false
      constant_time: false

  - name: Entry
    module: oxicrypt-integrity
    kind: struct
    description: One contiguous run of the signed extent with its kind, addressed by rva for the verifier reading the loaded image and by file_off for the signer and the file route; a Plain run may carry the Hole words after it, and its rva_end, file_end and span include them.
    fields:
    - name: rva
      type: u32
      description: Offset of the run from the image base, as loaded.
    - name: file_off
      type: u32
      description: Offset of the same run in the signed file.
    - name: len
      type: u32
      description: Length of the run in bytes, never zero; for a Plain entry the hashed bytes before its hole.
    - name: kind
      type: EntryKind
      description: How the verifier treats the run.
    - name: meta
      type: u16
      description: Index of the BindRecord for a Bind entry; for a Plain entry, the number of 8-byte Hole words that follow its len bytes inside the entry; zero otherwise.

  - name: EntryKind
    module: oxicrypt-integrity
    kind: enum
    description: How the verifier treats the bytes an entry names, and what the entry contributes to the signature input.
    variants:
    - name: Plain
      description: "0: the loaded bytes equal the file bytes and are signed."
    - name: Hole
      description: "1: the loader overwrites the bytes without reading them; nothing is signed."
    - name: Relative
      description: "2: 8-byte words the loader rebases; each is signed as its unslid value, the loaded word minus the slide."
    - name: Bind
      description: "3: 8-byte words the loader binds to an import; each must equal the recorded import's resolution plus its addend, except that on Darwin x86_64 a word with no addend that is jmp *disp32(%rip) at exactly the stub address of the stub-and-resolver export the record's name leads to, resolved from the record's library through its re-exports as dyld resolves it, the stub the loader binds a resolver function to, is accepted."
    - name: FileOnly
      description: "4: initialised writable data, signed from the image file the loader reports."

  - name: BindRecord
    module: oxicrypt-integrity
    kind: struct
    description: The import a Bind entry's words are bound to, stored in the slot's string table.
    fields:
    - name: library
      type: String
      description: The library or DLL the import comes from, as the loader names it.
    - name: symbol
      type: String
      description: The symbol name with any platform prefix removed; empty for an import by ordinal.
    - name: ordinal
      type: u16
      description: The PE ordinal for an import by ordinal; zero otherwise.
    - name: addend
      type: i64
      description: The value added to the resolved address.
    - name: weak
      type: bool
      description: A weak import, which may legitimately fail to resolve, in which case its words must be zero.

  - name: SlotFields
    module: oxicrypt-integrity
    kind: struct
    description: Everything the signer writes into a slot except the signature, all of it covered by the signature.
    fields:
    - name: flags
      type: u32
      description: Loader flags; FLAG_LOADER_BIONIC marks an artifact loaded by bionic.
    - name: slot_rva
      type: u32
      description: Offset of the slot from the image base.
    - name: key_id
      type: '[u8; 32]'
      description: SHA-256 of the verifying key the signature was made for.
    - name: link_base
      type: u64
      description: The image base the file was linked at; the slide is the load base minus this.
    - name: slot_file_off
      type: u32
      description: File offset of the slot.
    - name: file_len
      type: u32
      description: Length of the signed file image.
    - name: entries
      type: Vec<Entry>
      description: The extent, ascending and in canonical (merged) form.
    - name: records
      type: Vec<BindRecord>
      description: The imports the Bind entries index.

  - name: Unreadable
    module: oxicrypt-integrity
    kind: enum
    description: Why the module's own bytes could not be obtained, so the integrity test was not performed.
    variants:
    - name: NoMechanism
      description: This target has no implemented byte-acquisition mechanism.
    - name: MemoryRoutesFailed
      description: "Struct variant carrying the io::Error from /proc/self/mem and the ReadError from process_vm_readv: both Linux memory routes failed."
    - name: MemoryRead
      description: "Tuple variant carrying an io::Error: a later read through the memory route chosen by the first read failed."
    - name: SelfReadFailed
      description: "Tuple variant carrying an oxicrypt_imageread::ReadError: the kernel refused to copy the module's own image."
    - name: MapsUnavailable
      description: "Tuple variant carrying an io::Error: /proc/self/maps could not be read, so the image file cannot be located and the file route is not performed."
    - name: MapsUnparseable
      description: The mapping holding the slot was found but a field of it did not parse, so its file offset cannot be trusted.
    - name: SlotUnmapped
      description: The slot's address falls in no reported mapping, or an address computed from it overflows.
    - name: NoBackingFile
      description: The mapping holding the slot names no image file.
    - name: ImagePath
      description: "Tuple variant carrying a ReadError: the operating system named no image file for the slot's address."
    - name: ImagePathWithoutMaps
      description: "Struct variant carrying the maps io::Error and a ReadError: on Linux and Android /proc/self/maps does not exist and the loader named no image file either, so the image cannot be measured."
    - name: ImagePathRelative
      description: "Tuple variant carrying a PathBuf: on Linux and Android without /proc/self/maps the loader names the image only by the relative path it was loaded by, which does not identify the file."
    - name: FileOpen
      description: "Tuple variant carrying an io::Error: the image file could not be opened or its length read."
    - name: FileRead
      description: "Tuple variant carrying an io::Error: a read of the image file failed."
    - name: FileLength
      description: "Struct variant carrying expected and actual lengths: a plain image file is not exactly file_len bytes, or an archive does not hold the image."
    - name: ArchiveBaseUnaligned
      description: "Tuple variant carrying u64: the image's offset inside the archive that maps it is not page-aligned."
    - name: ForeignArchiveMapping
      description: A mapping of the image file overlaps the image's file range and meets the address range the slot's entries describe, but runs outside it or maps archive bytes from before the image, which is classified as damage while a mapping wholly outside the range, such as a second load of the file, is not.
    - name: Resolver
      description: "Tuple variant carrying a ReadError: the operating system's resolver failed on a bound import's names."
    - name: MappingMisplaced
      description: A mapping of the image file inside the image's address range moves its bytes unlike the slot's entry for them; classified as damage.
    - name: ExportTrie
      description: Darwin x86_64; a library a bound import resolves through is not loaded, the chain of re-exports cycles or runs past eight hops, or an export trie cannot be found through its image's load commands as loaded or is malformed, so a resolver stub cannot be checked.
    - name: UniversalTable
      description: Darwin; the image file is universal and its architecture table runs past the limits dyld reads it within (the first 4 KiB and the file), or is followed by an arm64 entry dyld loads although the table does not count it.
    - name: SliceNotFound
      description: Darwin; the image file the loader names holds no image whose Mach header and integrity slot are the loaded image's, neither the file itself nor exactly one slice of a universal file.
    - name: OutOfMemory
      description: The signature input could not be allocated.

  - name: IntegrityError
    module: oxicrypt-integrity
    kind: enum
    description: Failure of the pre-operational software integrity test.
    implements:
    - Debug
    - Display
    - std::error::Error
    variants:
    - name: CastNotRun
      description: The integrity technique's own ML-DSA-87 signature-verification self-test has not passed in this process, so the integrity test may not use it.
    - name: NoVerifyKey
      description: The module carries no verifying key (built without one, or signed and then had its key record zeroed, which it cannot tell apart), so it has nothing to verify its image against.
    - name: SignatureInvalid
      description: The signature over the image does not verify under the embedded key, or a bound import does not hold its recorded value.
    - name: SlotInvalid
      description: "Tuple variant carrying a SlotDefect: the slot or the embedded key record is malformed, the slot is the unsigned template, it was signed for a different key, or it describes an impossible extent; IntegrityStatus tells these apart."
    - name: Unreadable
      description: "Tuple variant carrying an Unreadable: the module's own bytes could not be obtained, so the test was not performed."
    - name: Module
      description: "Tuple variant carrying an oxicrypt_module::Error: the module refused a primitive the test uses outside the SelfTest and Operational states."

  - name: Range
    module: oxicrypt-integrity
    kind: struct
    description: A run of bytes addressed both ways before a kind is assigned, the shape a format classifier produces; Entry::plain turns one into a Plain entry.
    fields:
    - name: rva
      type: u32
      description: Offset of the run from the image base, as loaded.
    - name: file_off
      type: u32
      description: Offset of the same run in the signed file.
    - name: len
      type: u32
      description: Length of the run in bytes.

  - name: SlotDefect
    module: oxicrypt-integrity
    kind: enum
    description: Why an integrity slot was refused; each variant names a distinct defect rather than collapsing to a single "bad slot" case.
    implements:
    - Debug
    - Display
    - std::error::Error
    variants:
    - name: WrongSize
      description: "Tuple variant carrying usize: the acquired bytes are not SLOT_SIZE long."
    - name: HeaderMagic
      description: The header magic is absent.
    - name: FooterMagic
      description: The footer magic is absent.
    - name: UnsupportedVersion
      description: "Tuple variant carrying u32: the version is not SLOT_VERSION; zero means the artifact was never signed."
    - name: UnknownFlags
      description: "Tuple variant carrying u32: the flags word sets a bit this verifier does not implement."
    - name: NoEntries
      description: The entry count is zero; an extent covering nothing would make the test vacuous.
    - name: TooManyEntries
      description: "Tuple variant carrying u32: the entry count exceeds MAX_ENTRIES, or the table overruns the string table."
    - name: EmptyEntry
      description: "Tuple variant carrying u32: the entry at this index has zero length."
    - name: EntryOverflow
      description: "Tuple variant carrying u32: the entry at this index overflows the RVA or file-offset space."
    - name: Unordered
      description: "Tuple variant carrying u32: the entry at this index starts before the previous entry ends."
    - name: OverlapsSlot
      description: "Tuple variant carrying u32: the entry at this index covers part of the slot, by RVA or by file offset."
    - name: EntryOutOfBounds
      description: "Tuple variant carrying u32: the entry at this index falls outside the image being hashed."
    - name: MalformedEntry
      description: "Tuple variant carrying u32: the entry has an unknown kind, a run byte on an entry that carries no words, a meta value its kind does not use, or a length its kind does not allow."
    - name: NonMaximal
      description: "Tuple variant carrying u32: the entry continues the previous one with the same kind and meta, or the stored table is not the one packing of its entries; the canonical table merges them."
    - name: BindRecordOutOfRange
      description: "Tuple variant carrying u32: the Bind entry names a record the string table does not hold."
    - name: StringTable
      description: The string table is misplaced or is not a sequence of well-formed records.
    - name: NonZeroPadding
      description: A byte outside every field, the table and the string table is not zero.
    - name: FileLenTooShort
      description: "Tuple variant carrying u32: the entry ends past file_len."
    - name: KeyMismatch
      description: The slot's key_id is not the fingerprint of the key the module embeds.
    - name: UnresolvedImport
      description: "Tuple variant carrying u32: the Bind entry names an import that did not resolve and is not weak."
    - name: Unsigned
      description: The slot is exactly the unsigned template the build emits, which a never-signed build and a signed one whose slot was overwritten both carry.
    - name: BindUnsupported
      description: "Tuple variant carrying u32: the Bind entry records an import this platform's loader never binds; the signer writes none, so this is damage."
    - name: FileLenMismatch
      description: The image file is not the length the slot records, checked before the slot's signature can be.
    - name: SlotRvaTooLarge
      description: The slot's recorded RVA exceeds the address the slot was found at, so no load base can be derived from the pair.
    - name: KeyRecord
      description: The embedded verifying-key record is absent or its magics are wrong.
    - name: ExtentTooLarge
      description: The entries' payload is larger than the file image the slot describes.
    - name: SlotOutsideImage
      description: The slot itself does not lie inside the image it describes, by file range or by address range.
    - name: RecordOrder
      description: "Tuple variant carrying u32: a Bind record is used before an earlier one was first used, or a record is left unused, so the string table is not in its canonical order."

  - name: SlotImage
    module: oxicrypt-integrity
    kind: struct
    description: A parsed, structurally validated integrity slot.
    fields:
    - name: version
      type: u32
      description: Format version, always SLOT_VERSION once parsed.
    - name: fields
      type: SlotFields
      description: Everything the signature covers in the slot, decoded.
    - name: signature
      type: '[u8; SIG_LEN]'
      description: The ML-DSA-87 signature (4,627 bytes), as FIPS 204 sigEncode writes it.

  - name: IntegrityStatus
    module: oxicrypt-integrity
    kind: enum
    description: The pre-operational integrity test's status indicator, whose discriminants the C ABI reports and whose failure values Security Policy 5.2 enumerates.
    variants:
    - name: NotRun
      description: "0: the test has not run in this process."
    - name: Passed
      description: "1: the test ran and the signature over the image verified."
    - name: SignatureInvalid
      description: "2: the signature over the image does not verify under the embedded key, or a bound import's word does not hold its recorded value; bind words are checked before the signature, so a slot naming an import that does not resolve reports 10 or 4 instead, and on Darwin x86_64 a mismatched bind word whose export-trie walk fails reports 4."
    - name: SlotInvalid
      description: "3: the slot is byte for byte the unsigned template the build emits, which a never-signed build and a signed one whose slot was overwritten both report, so it is a reason to sign only for a binary you built yourself and have not signed, and otherwise a reason to obtain a fresh copy from its publisher."
    - name: Unreadable
      description: "4: the module's own bytes could not be obtained, so the test was not performed and this says nothing about the image."
    - name: CastNotRun
      description: "5: the test was reached before the ML-DSA-87 and SHA-256 CASTs it depends on had both passed."
    - name: Unknown
      description: "6: the recorded indicator is not a value this module writes."
    - name: Refused
      description: "7: the module refused a primitive the test uses after the test had been admitted; the test was not performed."
    - name: NoVerifyKey
      description: "8: the module carries no verifying key, either built without one or with its key record zeroed after signing, which alone is never a reason to sign it."
    - name: KeyMismatch
      description: "9: the slot was signed for a different verifying key than the one the module embeds."
    - name: SlotDamaged
      description: "10: a signed slot or the key record is damaged, or a bound import record names an import that does not resolve or that this platform cannot bind; the module is corrupt and must be replaced, not signed again."

  - name: Symbol
    module: oxicrypt-imageread
    kind: enum
    description: One import a loader binds, by name or by ordinal, as resolve_symbol takes it.
    variants:
    - name: Name
      description: "Tuple variant carrying &str: an export named by its symbol name, without any platform prefix."
    - name: Ordinal
      description: "Tuple variant carrying u16: a PE export named by its ordinal."

  - name: Layout
    module: oxicrypt-integrity-sign
    kind: struct
    description: What the signer needs to know about an artifact after classifying it — the typed extent with the slot already subtracted, the slot flags, where the slot sits, the link base and file length the slot records, and how much of the mapped image the extent covers.
    fields:
    - name: ranges
      type: 'Vec<Range>'
      description: The Plain entries of the extent, slot already subtracted, ascending.
    - name: entries
      type: 'Vec<Entry>'
      description: The whole typed table the slot records, slot already subtracted, ascending and merged.
    - name: flags
      type: u32
      description: The slot's flags; for ELF, the loader the image is typed for.
    - name: slot_file_off
      type: usize
      description: File offset of the integrity slot.
    - name: slot_rva
      type: u32
      description: Offset of the integrity slot from the image base.
    - name: invariant_len
      type: u64
      description: File-backed bytes the extent types, of every kind, before the slot was subtracted.
    - name: mapped_len
      type: u64
      description: File-backed bytes across every load segment.
    - name: link_base
      type: u64
      description: The image base the file was linked at, which a Relative word's unslid value is relative to; zero where the classifier emits no Relative entry.
    - name: file_len
      type: u32
      description: Length of the file image the slot describes, stopping before a Mach-O code signature or a PE certificate table.
    - name: relative
      type: RelativeEncoding
      description: How the file holds a Relative word, which decides the unslid value the signature covers.
    - name: records
      type: Vec<BindRecord>
      description: The imports the Bind entries name, in order of first use; a Bind entry's meta indexes this list.

  - name: RelativeEncoding
    module: oxicrypt-integrity-sign
    kind: enum
    description: How a format stores a word the loader rebases; its unslid method gives the value the loader writes less the slide.
    variants:
    - name: FileWord
      description: The file word is the unslid address (ELF RELR, PE DIR64).
    - name: ChainedPtr64
      description: A Mach-O DYLD_CHAINED_PTR_64 rebase; target in bits 0..36 with high8 in bits 36..44.
    - name: ChainedPtr64Offset
      description: A Mach-O DYLD_CHAINED_PTR_64_OFFSET rebase; target is an offset from the link base.

  - name: SignOptions
    module: oxicrypt-integrity-sign
    kind: struct
    description: Choices a signing run may make that the artifact does not decide; the default types an ELF image for the loader its notes declare and reads its symbols from the image itself.
    fields:
    - name: loader
      type: 'Option<elf::Loader>'
      description: The loader to type an ELF image for, instead of the one its notes declare.
    - name: symbols
      type: "Option<&'a [u8]>"
      description: The separated debug file's bytes, read for module statics when the image has been stripped.
    - name: reserved_against
      type: "Option<&'a [u8]>"
      description: The reference the platform signer's writes are measured against (refused for ELF) — for a Mach-O image the same build after one codesign with the final identity and options, the image being signed the result of the next, each of the four envelope locator fields that differs typed as a hole; for a PE image the same build as linked, the image being signed the result of signtool with the final certificate and options, CheckSum and the Security directory entry typed as holes where they differ; any other difference refuses with ReservationDiff.

  - name: "elf::Loader"
    module: oxicrypt-integrity-sign
    kind: enum
    description: The dynamic loader an ELF image is typed for, recorded in the slot's flags; from_name parses glibc or bionic and slot_flags gives the flag bits.
    variants:
    - name: Glibc
      description: Adjusts the pointer-valued .dynamic entries in place and applies RELR; recorded as flag 0.
    - name: Bionic
      description: Adjusts no .dynamic entry; recorded as FLAG_LOADER_BIONIC.

  - name: "elf::StaticRow"
    module: oxicrypt-integrity-sign
    kind: struct
    description: A zero-initialised module static whose bytes the file holds, which an edit of the file could preset.
    fields:
    - name: name
      type: String
      description: The symbol's name as the symbol table spells it.
    - name: addr
      type: u64
      description: The symbol's address.
    - name: size
      type: u64
      description: The symbol's size in bytes.
    - name: file_backed
      type: u64
      description: How many of its bytes lie inside the segment's file extent.

  - name: "elf::Statics"
    module: oxicrypt-integrity-sign
    kind: struct
    description: The file-backed module statics report for an ELF image; the signer refuses while rows is non-empty or matched is zero.
    fields:
    - name: matched
      type: usize
      description: Module statics found in writable, non-RELRO memory.
    - name: initialised
      type: usize
      description: Of those, the file-backed ones holding initialised data, which are FileOnly.
    - name: rows
      type: 'Vec<StaticRow>'
      description: The file-backed zero-initialised ones.
    - name: missing
      type: "Vec<&'static str>"
      description: The required statics, of REQUIRED_STATICS, not found in writable non-RELRO memory; empty when each was found and checked.

  - name: "elf::REQUIRED_STATICS"
    module: oxicrypt-integrity-sign
    kind: const
    type: "[(&str, &str, bool); 4]"
    description: The module statics the file-backed statics check must find by name — oxicrypt_module::STATE, oxicrypt_integrity::LAST_STATUS, oxicrypt_integrity::ML_DSA_CAST_PASSED and oxicrypt_integrity::SHA256_CAST_PASSED — each with the length-prefixed path both Rust manglings spell and whether it is owned by the boot sequence's test, so it is required only where links_boot_test finds that test.

  - name: SlotBudget
    module: oxicrypt-integrity-sign
    kind: struct
    description: What an image's extent takes of its slot, computed as signing encodes it; fits() is true when signing would accept the slot, decided by the encode-and-parse signing itself runs (capacity, MAX_EXPANDED, every entry and the canonical form).
    fields:
    - name: stored
      type: usize
      description: Stored entries the merged table takes.
    - name: string_table
      type: usize
      description: Bytes the string table of bound-import records takes.
    - name: capacity
      type: usize
      description: Stored entries that fit beside that string table.
    - name: refused
      type: Option<String>
      description: Why signing would refuse the slot, or None when it would accept it.
    security:
      contains_secret: false
      zeroize_on_drop: false
      constant_time: false

  - name: SigningKey
    module: oxicrypt-integrity-sign
    kind: opaque
    description: An ML-DSA-87 signing key — the 32-byte key-generation seed, the private key it derives and its public half — read from a 32-byte seed file or derived from a seed an approved DRBG draws, checked by a pairwise consistency test, wiped on drop, and used to sign a slot's framed signature input deterministically.

  # ── oxicrypt (the Rust interface to liboxicrypt_ffi) ──────────────

  - name: Module
    module: oxicrypt
    kind: struct
    description: "Zero-sized Copy token proving that the library this program loaded was initialised and checked; every service is a method on it."
    security:
      contains_secret: false
      zeroize_on_drop: false
      constant_time: false

  - name: Profile
    module: oxicrypt
    kind: enum
    description: "An algorithm profile of the module, non-exhaustive."
    variants:
      - name: Unrestricted
        description: "Code 0: every approved algorithm."
      - name: Cnsa2
        description: "Code 1: the CNSA 2.0 suite."
      - name: Cnsa1
        description: "Code 2: the CNSA 1.0 suite."
      - name: Migration
        description: "Code 3: CNSA 1.0 and CNSA 2.0 together."
      - name: Unknown
        description: "Any other code; Unknown of a known code is that profile."

  - name: IntegrityStatus
    module: oxicrypt
    kind: enum
    description: "The pre-operational integrity test's latched indicator as oxi_integrity_status reports it, non-exhaustive."
    variants:
      - name: NotRun
        description: "0: not run in this process."
      - name: Passed
        description: "1: the signature over the image verified."
      - name: SignatureInvalid
        description: "2: the image does not match its signature."
      - name: SlotInvalid
        description: "3: the slot is the unsigned template."
      - name: Unreadable
        description: "4: not performed; the image could not be read."
      - name: CastNotRun
        description: "5: reached before its self-tests passed."
      - name: UnknownRecord
        description: "6: the record held a value the library never writes."
      - name: Refused
        description: "7: a primitive was refused, so not performed."
      - name: NoVerifyKey
        description: "8: the library carries no verifying key."
      - name: KeyMismatch
        description: "9: the slot was signed for another key."
      - name: SlotDamaged
        description: "10: the slot, key record or a bound import is damaged."
      - name: Unknown
        description: "Any other value."

  - name: Fingerprint
    module: oxicrypt
    kind: struct
    description: "SHA-256 fingerprint of the verifying key a library embeds; public data, displayed as sha256:<64 hex digits>."
    security:
      contains_secret: false
      zeroize_on_drop: false
      constant_time: false

  - name: Site
    module: oxicrypt
    kind: enum
    description: "Which kind of C function returned a status code; code 22 maps to TagMismatch for an AEAD decryption and SignatureInvalid for a signature verification."
    variants:
      - name: AeadDecrypt
        description: "An AEAD decryption."
      - name: SignatureVerify
        description: "A signature verification."
      - name: Other
        description: "Any other function."

  - name: Error
    module: oxicrypt
    kind: enum
    description: "An error from the library, in the order and with the meaning of the C ABI's OxiResult, or from a check the crate makes before calling it; non-exhaustive."
    variants:
      - name: NotOperational
        description: "Code 1."
      - name: SelfTestFailed
        description: "Code 2."
      - name: ConditionalTestFailed
        description: "Code 3."
      - name: AlreadyInitialized
        description: "Code 4."
      - name: InvalidInput
        description: "Code 5."
      - name: AlgorithmRestricted
        description: "Code 6."
      - name: NotImplemented
        description: "Code 7."
      - name: Uninstantiated
        description: "Code 8."
      - name: ReseedRequired
        description: "Code 9."
      - name: NullPointer
        description: "Code 10."
      - name: BufferTooSmall
        description: "Code 11."
      - name: OutputTooLong
        description: "Code 12, or a requested length over a bound the crate checks before allocating or calling."
      - name: NotBlockAligned
        description: "Code 20."
      - name: InvalidIvLength
        description: "Code 21."
      - name: TagMismatch
        description: "Code 22 from an AEAD decryption."
      - name: LengthMismatch
        description: "Code 23, or an output slice whose length is not the input's, refused before calling."
      - name: InvalidNonceLength
        description: "Code 24."
      - name: InvalidTagLength
        description: "Code 25."
      - name: InvalidPayloadLength
        description: "Code 26."
      - name: InvalidAadLength
        description: "Code 27."
      - name: IntegrityUnverified
        description: "Code 28."
      - name: EntropyInputTooShort
        description: "Code 29: a DRBG's entropy input is shorter than its security strength."
      - name: NonceTooShort
        description: "Code 30: a DRBG's nonce is shorter than half its security strength."
      - name: Internal
        description: "Code 255."
      - name: SignatureInvalid
        description: "Code 22 from a signature verification."
      - name: Unknown
        description: "Any other code."
      - name: LibraryAbi
        description: "The library's oxi_abi_version returns another ABI number than the crate's."
      - name: LibraryVersion
        description: "A library without oxi_abi_version states another release version than the crate's."
      - name: ProfileMismatch
        description: "The library is initialised with another profile than the one requested."
      - name: KeyFingerprint
        description: "The library embeds another verifying key than the pinned one."

  - name: InitError
    module: oxicrypt
    kind: struct
    description: "Why Module::init returned no token: the refusal, the integrity indicator when it was read (None when the library was refused before anything but oxi_abi_version and its manifest was called), and the library's detail text or why it could not be read."
    security:
      contains_secret: false
      zeroize_on_drop: false
      constant_time: false

  - name: DetailError
    module: oxicrypt
    kind: enum
    description: "Why the integrity-test detail text could not be read; non-exhaustive."
    variants:
      - name: Sizing
        description: "The sizing call failed."
      - name: TooLong
        description: "The text is longer than the crate reads."
      - name: Read
        description: "The reading call failed."
      - name: Overrun
        description: "The library reported writing more than the buffer it was given."

  - name: Aes256Key
    module: oxicrypt
    kind: opaque
    description: "An AES-256 key schedule held by the library, freed exactly once when dropped; Send and Sync."
    security:
      contains_secret: true
      zeroize_on_drop: true
      constant_time: false

  - name: HmacDrbgSha256
    module: oxicrypt
    kind: opaque
    description: "An HMAC_DRBG-SHA-256 instance held by the library and seeded by the caller, freed exactly once when dropped; Send, not Sync."
    security:
      contains_secret: true
      zeroize_on_drop: true
