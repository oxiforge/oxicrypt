  - name: keygen
    module: oxicrypt-xmss
    signature: "pub fn keygen(xi: &[u8; 32]) -> Result<(XmssPrivateKey, [u8; 68]), Error>"
    description: Generate an XMSS key pair (XMSS-SHA2_10_256); xi is a 32-byte secret DRBG seed, and the tree root takes ~15 s for 1024 leaves.
    parameters:
      - name: xi
        type: "&[u8; 32]"
        constraints:
          size: 32
        direction: in
        description: "32-byte secret seed (derives SK_SEED, SK_PRF, PUB_SEED)."
    returns:
      type: "Result<(XmssPrivateKey, [u8; 68]), Error>"
      description: "(private_key, public_key)."
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: XMSS blocked by active profile.
    preconditions:
      - description: Module must be Operational.
      - description: xi must be 32 bytes of fresh random data from an approved DRBG.
    postconditions:
      - description: Returns a fresh XMSS key pair starting at leaf_index 0; the key can sign at most 1024 messages.
    thread_safety: thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles:
      - Unrestricted
      - Cnsa2

  - name: sign
    module: oxicrypt-xmss
    signature: "pub fn sign(key: &mut XmssPrivateKey, message: &[u8]) -> Result<[u8; 2500], Error>"
    description: Sign a message with XMSS; STATEFUL, advances the leaf index by 1, the caller MUST persist key state afterwards.
    parameters:
      - name: key
        type: "&mut XmssPrivateKey"
        direction: in-out
        description: "Mutable private key handle. leaf_index is incremented."
      - name: message
        type: "&[u8]"
        direction: in
        description: "Message to sign (arbitrary length)."
    returns:
      type: "Result<[u8; 2500], Error>"
      description: "2500-byte XMSS signature: idx (4) || r (32) || WOTS+ sig (67 × 32 = 2144) || auth path (10 × 32 = 320)."
      error_variants:
        - name: NotOperational
          condition: Module not initialized.
        - name: AlgorithmRestricted
          condition: XMSS blocked by active profile.
        - name: InvalidInput
          condition: Key exhausted (leaf_index >= 1024).
    preconditions:
      - description: Module must be Operational.
      - description: key.leaf_index < 1024 (key not exhausted).
    postconditions:
      - description: key.leaf_index incremented by 1. Caller MUST persist key state.
    thread_safety: not-thread-safe
    security:
      constant_time: true
      handles_secrets: true
      fips_approved: true
      fips_gate: Operational
    profiles:
      - Unrestricted
      - Cnsa2
    pitfalls:
      - description: XMSS is STATEFUL; like LMS, the caller must persist private key state after every sign call.

  - name: verify
    module: oxicrypt-xmss
    signature: "pub fn verify(public_key: &[u8; 68], message: &[u8], signature: &[u8; 2500]) -> Result<(), Error>"
    description: Verify an XMSS signature; Ok(()) if valid, Err(InvalidInput) if not.
    parameters:
      - name: public_key
