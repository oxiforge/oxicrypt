# ─────────────────────────────────────────────────────────────────────
# Error types (consolidated)
# ─────────────────────────────────────────────────────────────────────

# Function-level error_variants carry a name and the exact condition that
# triggers it, and deliberately do NOT repeat user_action. The recovery advice
# for a variant does not vary by call site, so restating it on each of the 968
# occurrences below would be 968 places for it to drift.
#
# The rule a consumer relies on: every name appearing in a function's
# returns.error_variants also appears as a variant of an entry in this section,
# and that entry carries recoverable and user_action. Resolution is by name.
# This holds for all 968 occurrences as written, and it is the reason the four
# error types below were added rather than left implicit — 23 occurrences
# across IntegrityError, EntropyError, TimerError and CollectionError resolved
# to nothing until they were.
#
# Names are unique across error types here, so resolution needs no
# qualification by the function's return type.
  - name: read_self
    module: oxicrypt-imageread
    description: Copy out.len() bytes beginning at addr in this process's own loaded image into out, through a kernel-mediated copy that reports an unmapped address rather than faulting.
    signature: "pub fn read_self(addr: usize, out: &mut [u8]) -> Result<(), ReadError>"
    parameters:
      - name: addr
        type: usize
        description: Address in the loaded image, passed to the operating system as an opaque value and never dereferenced by this crate.
      - name: out
        type: "&mut [u8]"
        description: Destination buffer whose length is the number of bytes requested.
    returns:
      type: "Result<(), ReadError>"
      description: Ok when exactly out.len() bytes were copied.
    error_variants:
      - NoMechanism
      - Os
      - Short
    preconditions:
      - The integrity technique's own algorithm self-test has passed, since the caller is the integrity test.
    postconditions:
      - On Ok, out holds exactly out.len() bytes read from the loaded image.
      - On Err, out's contents are unspecified and must not be used.
      - An empty out returns Ok without invoking any mechanism.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: image_path
    module: oxicrypt-imageread
    description: The path of the image file the loader mapped the code at an address from — dladdr on Linux, Android and Darwin, GetModuleHandleExW and GetModuleFileNameW on Windows; the integrity test asks it on Linux and Android only when /proc/self/maps cannot be read, and for a main executable glibc reports the path the program was started with.
    signature: "pub fn image_path(addr: usize) -> Result<PathBuf, ReadError>"
    returns:
      type: Result<PathBuf, ReadError>
      description: The image file's path.
      error_variants:
        - name: NoMechanism
          condition: The target has no implementation.
        - name: NoImage
          condition: Linux, Android and Darwin; the loader names no image file for the address, or names it with an empty path.
        - name: Os
          condition: Windows; the operating system refused the request, including for an address in no loaded module.
    thread_safety: thread-safe
    security:
      constant_time: false
      handles_secrets: false
      fips_approved: false

  - name: resolve_symbol
    module: oxicrypt-imageread
    description: Resolve an import in an already-loaded library the way the loader bound it, without loading anything — dlopen(RTLD_NOLOAD | RTLD_LAZY | RTLD_FIRST) and dlsym on Darwin, GetModuleHandleExW and GetProcAddress on Windows; NoMechanism elsewhere.
    signature: "pub fn resolve_symbol(library: &str, symbol: Symbol<'_>) -> Result<Option<usize>, ReadError>"
    returns:
      type: Result<Option<usize>, ReadError>
      description: The resolved address, or None when the library is not loaded or exports no such symbol.
    thread_safety: thread-safe
    security:
      constant_time: false
