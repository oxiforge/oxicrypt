# cargo-nextest profiles for oxicrypt.
#
# The `default` profile is intentionally NOT declared here, so it keeps
# nextest's built-in behaviour: every test runs. `cargo nextest run`, the
# pre-push hook, and ci.yml all invoke the default profile, so the gate stays
# exhaustive — do not weaken it from this file.
#
# `quick` is an OPT-IN dev-loop profile:
#
#     cargo nextest run --profile quick            # whole workspace, fast
#     cargo nextest run --profile quick -p oxicrypt-maxwell
#
# It runs everything EXCEPT the long-running maxwell entropy tests, turning a
# ~3.7-minute maxwell run into seconds during iteration. Always run the full
# default profile before pushing (the pre-push hook does this for you).
#
# Excluded (observed wall-clock, unoptimized test build):
#   parity::tests::parity_table_within_tolerance         ~200s  EA parity oracle (OXICRYPT_EA_DATA)
#   iid_gate::tests::noniid_routed_value_is_suite_minimum  ~71s  100k-sample SP 800-90B §6.3 suite
#   iid_gate::tests::periodic_synthetic_routes_to_noniid   ~70s  100k-sample non-IID routing
#
# Measured 2026-08-04 and deliberately NOT excluded:
#   restart::tests::restart_iid_verdicts_evaluate_the_transposed_column_data  ~8.7s
# It is the longest test remaining in `quick` and the critical path of the
# oxicrypt-maxwell lib suite (2.2s without it, 8.8s with), but 8.7s is an order of
# magnitude below the three exclusions above. Recorded so the next person facing
# the standing instruction below has the measurement rather than the guess.
#
# Add any future long-running test to the filter below to keep `quick` quick.
# (The ~460s `#[ignore]`-d full-shuffle test is already excluded from every
# profile by default; run it explicitly with `--run-ignored all`.)

[profile.quick]
default-filter = "not (test(parity_table_within_tolerance) | test(noniid_routed_value_is_suite_minimum) | test(periodic_synthetic_routes_to_noniid))"
